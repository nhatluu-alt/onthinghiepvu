 doanh thu theo giá chưa có thuế GTGT nhân (X) với 2% (đối với hàng hóa chịu thuế suất thuế GTGT 10%) hoặc 1% (đối với hàng hóa chịu thuế suất thuế GTGT 5%).","B":"Số thuế GTGT phải nộp cho tỉnh nơi có cơ sở sản xuất bằng (=) doanh thu theo giá chưa có thuế GTGT nhân (X) với 3% (đối với hàng hóa chịu thuế suất thuế GTGT 10%) hoặc 2% (đối với hàng hóa chịu thuế suất thuế GTGT 5%) với điều kiện tổng số thuế GTGT phải nộp nơi có cơ sở sản xuất không được vượt quá số thuế GTGT phải nộp của người nộp thuế tại trụ sở chính.","C":"Số thuế GTGT phải nộp cho tỉnh nơi có cơ sở sản xuất bằng (=) doanh thu theo giá chưa có thuế GTGT nhân (X) với 2% (đối với hàng hóa chịu thuế suất thuế GTGT 10%) hoặc 1% (đối với hàng hóa chịu thuế suất thuế GTGT 5%) với điều kiện tổng số thuế GTGT phải nộp nơi có cơ sở sản xuất không được vượt quá số thuế GTGT phải nộp của người nộp thuế tại trụ sở chính.","D":"Không có phương án nào đúng"},"t":"Thuế GTGT"},{"n":1655,"q":"Phân bổ số thuế GTGT phải nộp đối với hoạt động xây dựng trong trường hợp công trình, hạng mục công trình xây dựng liên quan tới nhiều tỉnh mà không xác định được doanh thu của công trình tại từng tỉnh thì:","c":{"A":"Vẫn xác định tỷ lệ 1% trên doanh thu công trình, hạng mục công trình xây dựng.","B":"Vẫn xác định tỷ lệ 1% trên doanh thu công trình, hạng mục công trình xây dựng; đồng thời, người nộp thuế căn cứ vào tỷ lệ (1%) doanh thu của công trình tại từng tỉnh trên tổng doanh thu của toàn bộ công trình, hạng mục để xác định số thuế GTGT phải nộp cho từng tỉnh.","C":"Sau khi xác định tỷ lệ 1% trên doanh thu công trình, hạng mục công trình xây dựng, người nộp thuế căn cứ vào tỷ lệ (1%) giá trị đầu tư của công trình tại từng tỉnh trên tổng giá trị đầu tư để xác định số thuế GTGT phải nộp cho từng tỉnh.","D":"Không có phương án nào đúng"},"t":"Thuế GTGT"},{"n":1656,"q":"","c":{"A":"Có","B":"Không","C":"","D":""},"t":"Tổng hợp"},{"n":1657,"q":"","c":{"A":"Có","B":"Không","C":"","D":""},"t":"Tổng hợp"},{"n":1658,"q":"Khai thuế bảo vệ môi trường tại:","c":{"A":"Nơi có cơ sở sản xuất, kinh doanh than (bao gồm cả trường hợp tiêu dùng nội bộ)","B":"Cơ quan thuế quản lý trực tiếp nơi người nộp thuế có trụ sở chính","C":"Tùy người nộp thuế lựa chọn","D":"Không có phương án đúng"},"t":"Tổng hợp"},{"n":1659,"q":"Người nộp thuế trực tiếp nhập khẩu hàng hóa chịu thuế tiêu thụ đặc biệt sau đó bán trong nước thì người nộp thuế phải khai thuế tiêu thụ đặc biệt với:","c":{"A":"Cơ quan thuế quản lý trực tiếp nơi người nộp thuế bán hàng","B":"Cơ quan thuế quản lý trực tiếp nơi người nộp thuế có trụ sở chính","C":"Tùy người nộp thuế lựa chọn","D":""},"t":"Tổng hợp"},{"n":1660,"q":"Người nộp thuế trực tiếp nhập khẩu hàng hóa chịu thuế tiêu thụ đặc biệt sau đó bán trong nước thì người nộp thuế phải khai thuế tiêu thụ đặc biệt với:","c":{"A":"Cơ quan thuế quản lý trực tiếp nơi người nộp thuế có trụ sở chính","B":"Cơ quan thuế quản lý trực tiếp nơi người nộp thuế bán hàng","C":"Tùy người nộp thuế lựa chọn","D":"Không có phương án đúng"},"t":"Tổng hợp"},{"n":1661,"q":"Khai thuế tiêu thụ đặc biệt tại:","c":{"A":"Nơi sản xuất, gia công hàng hóa chịu thuế tiêu thụ đặc biệt.","B":"Nơi cung cấp hàng hóa, dịch vụ chịu thuế tiêu thụ đặc biệt","C":"Nơi cung ứng dịch vụ chịu thuế tiêu thụ đặc biệt (trừ hoạt động KD xổ số điện toán)","D":"Nơi cơ quan thuế quản lý trực tiếp nơi người nộp thuế có trụ sở chính E Cả A và C"},"t":"Tổng hợp"},{"n":1662,"q":"Khai thuế tiêu thụ đặc biệt tại:","c":{"A":"Nơi sản xuất, gia công hàng hóa chịu thuế tiêu thụ đặc biệt","B":"Nơi cung ứng dịch vụ chịu thuế tiêu thụ đặc biệt (trừ hoạt động KD xổ số điện toán)","C":"Nơi cơ quan thuế quản lý trực tiếp nơi người nộp thuế có trụ sở chính","D":"Cả A và B E Cả A và C"},"t":"Tổng hợp"},{"n":1663,"q":"Người nộp thuế đăng ký thuế GTGT theo phương pháp khấu trừ vừa có hoạt động sản xuất kinh doanh tại trụ sở chính, vừa có hoạt động chuyển nhượng bất động sản tại địa bàn khác tỉnh, thành phố nơi có trụ sở chính có được kê khai thuế GTGT theo mẫu 01/GTGT tại trụ sở chính không?","c":{"A":"Có","B":"Không","C":"","D":""},"t":"Thuế GTGT"},{"n":1664,"q":"Người nộp thuế đăng ký thuế GTGT theo phương pháp khấu trừ vừa có hoạt động sản xuất kinh doanh tại trụ sở chính, vừa có hoạt động chuyển nhượng bất động sản tại địa bàn khác tỉnh, thành phố nơi có trụ sở chính thì thực hiện kê khai hồ sơ khai thuế GTGT như thế nào?","c":{"A":"Người nộp thuế khai thuế GTGT mẫu 01/GTGT tại trụ sở chính và nộp hồ sơ khai thuế GTGT mẫu 05/GTGT với cơ quan thuế tại tỉnh nơi có bất động sản chuyển nhượng.","B":"Người nộp thuế khai thuế GTGT tập trung tại trụ sở chính mẫu 01/GTGT.","C":"Người nộp thuế khai thuế GTGT mẫu 01/GTGT tại trụ sở chính và nộp hồ sơ khai thuế GTGT mẫu 01/GTGT với cơ quan thuế tại tỉnh nơi có bất động sản chuyển nhượng.","D":""},"t":"Thuế GTGT"},{"n":1665,"q":"Người nộp thuế đăng ký thuế GTGT theo phương pháp khấu trừ vừa có hoạt động sản xuất kinh doanh tại trụ sở chính, vừa có hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng (bao gồm cả trường hợp có thu tiền ứng trước của khách hàng theo tiến độ) tại địa bàn khác tỉnh, thành phố nơi có trụ sở chính thì thực hiện kê khai hồ sơ khai thuế GTGT như thế nào?","c":{"A":"Kê khai Tờ khai mẫu 01/GTGT tại trụ sở chính và tờ khai mẫu 01/GTGT tại nơi có hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng.","B":"Kê khai tập trung Tờ khai mẫu 01/GTGT tại trụ sở chính","C":"Kê khai Tờ khai mẫu 01/GTGT tại trụ sở chính và Tờ khai mẫu 05/GTGT tại nơi có hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng.","D":""},"t":"Thuế GTGT"},{"n":1666,"q":"Người nộp thuế đăng ký thuế GTGT theo phương pháp khấu trừ vừa có hoạt động sản xuất kinh doanh tại trụ sở chính, vừa có hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng (bao gồm cả trường hợp có thu tiền ứng trước của khách hàng theo tiến độ) tại địa bàn khác tỉnh, thành phố nơi có trụ sở chính thì thực hiện kê khai hồ sơ khai thuế GTGT như thế nào?","c":{"A":"Kê khai Tờ khai mẫu 01/GTGT tại trụ sở chính và tờ khai mẫu 01/GTGT tại nơi có hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng.","B":"Kê khai Tờ khai mẫu 01/GTGT tại trụ sở chính và Tờ khai mẫu 05/GTGT tại nơi có hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng.","C":"Kê khai Tờ khai mẫu 01/GTGT tại trụ sở chính và Tờ khai 02/GTGT tại nơi có hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng.","D":"Kê khai tập trung Tờ khai mẫu 01/GTGT tại trụ sở chính"},"t":"Thuế GTGT"},{"n":1667,"q":"Khai thuế GTGT đối với hoạt động chuyển nhượng bất động sản của dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng (bao gồm cả trường hợp có thu tiền ứng trước của khách hàng theo tiến độ) tại đâu?","c":{"A":"Tại cơ quan thuế quản lý trụ sở chính","B":"Tại cơ quan thuế nơi có hoạt động chuyển nhượng bất động sản.","C":"Tùy người nộp thuế lựa chọn","D":"Không có phương án nào đúng"},"t":"Thuế TNCN"},{"n":1668,"q":"Người nộp thuế đáp ứng tiêu chí khai thuế theo quý:","c":{"A":"Bắt buộc phải khai thuế theo quý","B":"Được lựa chọn khai thuế theo tháng","C":"Không được lựa chọn khai thuế theo tháng","D":"Được lựa chọn khai thuế theo tháng hoặc quý ổn định trọn năm dương lịch."},"t":"Tổng hợp"},{"n":1669,"q":"Người nộp thuế đáp ứng tiêu chí khai thuế theo quý:","c":{"A":"Được lựa chọn khai thuế theo tháng","B":"Được lựa chọn khai thuế theo tháng hoặc quý ổn định trọn năm dương lịch.","C":"Không được lựa chọn khai thuế theo tháng","D":"Nếu lựa chọn khai thuế theo tháng phải có công văn chấp thuận của cơ quan thuế có thẩm quyền"},"t":"Tổng hợp"},{"n":1670,"q":"Người nộp thuế thuộc diện khai thuế TNCN theo tháng theo quy định nếu đủ điều kiện khai thuế GTGT theo quý thì được lựa chọn khai thuế TNCN theo quý?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế GTGT"},{"n":1671,"q":"Khai thuế GTGT theo quý áp dụng đối với:","c":{"A":"Người nộp thuế thuộc diện khai thuế GTGT theo tháng nếu có tổng doanh thu bán hàng hoá và cung cấp dịch vụ của năm trước liền kề từ 50 tỷ đồng trở xuống.","B":"Người nộp thuế có tổng doanh thu bán hàng hoá và cung cấp dịch vụ trong năm từ 50 tỷ đồng trở xuống.","C":"Người nộp thuế mới bắt đầu hoạt động, kinh doanh thì được lựa chọn khai thuế GTGT theo quý.","D":"Cả A và C"},"t":"Thuế GTGT"},{"n":1672,"q":"Khai thuế GTGT theo quý áp dụng đối với:","c":{"A":"Người nộp thuế thuộc diện khai thuế GTGT theo tháng nếu có tổng doanh thu bán hàng hoá và cung cấp dịch vụ của năm trước liền kề từ 50 tỷ đồng trở xuống.","B":"Người nộp thuế thuộc diện khai thuế GTGT theo tháng nếu có tổng doanh thu bán hàng hoá và cung cấp dịch vụ trong năm từ 50 tỷ đồng trở xuống.","C":"Người nộp thuế mới bắt đầu hoạt động, kinh doanh thì bắt buộc khai thuế GTGT theo quý.","D":"Người nộp thuế mới bắt đầu hoạt động, kinh doanh thì được lựa chọn khai thuế GTGT theo quý. E Cả A và D"},"t":"Thuế GTGT"},{"n":1673,"q":"Trường hợp tổ chức, cá nhân không phát sinh trả thu nhập thì có phải khai quyết toán thuế thu nhập cá nhân không?","c":{"A":"Có","B":"Không","C":"","D":""},"t":"Thuế TNCN"},{"n":1674,"q":"Người nộp thuế chỉ được khai bổ sung tăng số thuế GTGT đề nghị hoàn khi chưa nộp hồ sơ khai thuế của kỳ tính thuế tiếp theo và chưa nộp hồ sơ đề nghị hoàn thuế.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế GTGT"},{"n":1675,"q":"Trường hợp đã nộp hồ sơ khai quyết toán thuế năm đối với tờ khai quyết toán thuế thu nhập cá nhân của tổ chức, cá nhân trả thu nhập từ tiền lương, tiền công nếu người nộp thuế phát hiện hồ sơ quyết toán thuế năm có sai sót thì:","c":{"A":"Khai bổ sung tờ khai quyết toán thuế TNCN, đồng thời phải khai bổ sung tờ khai tháng, quý có sai, sót tương ứng.","B":"Chỉ khai bổ sung tờ khai quyết toán thuế TNCN","C":"Không khai bổ sung tờ khai quyết toán thuế TNCN, chỉ khai bổ sung tờ khai tháng, quý có sai, sót tương ứng.","D":"Không có trường hợp nào đúng"},"t":"Thuế TNCN"},{"n":1676,"q":"Trường hợp chưa nộp hồ sơ khai quyết toán thuế năm thì người nộp thuế có được khai bổ sung hồ sơ khai thuế của tháng, quý có sai, sót không?","c":{"A":"Có","B":"Không","C":"","D":""},"t":"Tổng hợp"},{"n":1677,"q":"Thời hạn nộp hồ sơ khai thuế đối với trường hợp chấm dứt hoạt động, chấm dứt hợp đồng hoặc tổ chức lại doanh nghiệp:","c":{"A":"Chậm nhất là 45 ngày kể từ ngày xảy ra sự kiện.","B":"Chậm nhất là 45 ngày làm việc kể từ ngày xảy ra sự kiện.","C":"Chậm nhất ngày thứ 45 kể từ ngày xảy ra sự việc.","D":"Chậm nhất ngày thứ 45 kể từ ngày xảy ra sự kiện."},"t":"Tổng hợp"},{"n":1678,"q":"Thời hạn nộp hồ sơ khai thuế đối với loại thuế khai và nộp theo từng lần phát sinh nghĩa vụ thuế là","c":{"A":"Chậm nhất là 10 ngày kể từ ngày phát sinh nghĩa vụ thuế.","B":"Chậm nhất là 10 ngày làm việc kể từ ngày phát sinh nghĩa vụ thuế.","C":"Chậm nhất là ngày thứ 10 kể từ ngày phát sinh nghĩa vụ thuế.","D":"Chậm nhất là ngày thứ 10 kể từ ngày hợp đồng có hiệu lực."},"t":"Tổng hợp"},{"n":1679,"q":"Thời hạn nộp hồ sơ khai quyết toán thuế thu nhập cá nhân của cá nhân trực tiếp quyết toán thuế là","c":{"A":"Chậm nhất là ngày cuối cùng của tháng đầu của quý tiếp theo quý phát sinh nghĩa vụ thuế","B":"Chậm nhất là ngày cuối cùng của tháng đầu tiên của quý tiếp theo quý phát sinh nghĩa vụ thuế","C":"Chậm nhất là ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm dương lịch.","D":"Chậm nhất là ngày cuối cùng của tháng thứ 4 kể từ ngày kết thúc năm dương lịch."},"t":"Thuế TNCN"},{"n":1680,"q":"Thời hạn nộp hồ sơ khai quyết toán thuế năm là","c":{"A":"Chậm nhất là ngày 31 tháng thứ 3 kể từ ngày kết thúc năm dương lịch","B":"Chậm nhất là ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm dương lịch hoặc năm tài chính","C":"Chậm nhất là ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm dương lịch","D":"Chậm nhất là ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm tài chính"},"t":"Tổng hợp"},{"n":1681,"q":"Thời hạn nộp hồ sơ khai quyết toán thuế năm là","c":{"A":"Chậm nhất là ngày 30 tháng thứ 3 kể từ ngày kết thúc năm dương lịch hoặc năm tài chính","B":"Chậm nhất là ngày 31 tháng thứ 3 kể từ ngày kết thúc năm dương lịch","C":"Chậm nhất là ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm dương lịch hoặc năm tài chính","D":"Chậm nhất là ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm dương lịch E Chậm nhất là ngày cuối cùng của tháng thứ 3 kể từ ngày kết thúc năm tài chính"},"t":"Tổng hợp"},{"n":1682,"q":"Thời hạn nộp hồ sơ khai thuế theo quý là","c":{"A":"Chậm nhất là ngày cuối cùng của quý tiếp theo quý phát sinh nghĩa vụ thuế","B":"Chậm nhất là ngày cuối cùng của quý phát sinh nghĩa vụ thuế","C":"Chậm nhất là ngày cuối cùng của tháng đầu quý phát sinh nghĩa vụ thuế","D":"Chậm nhất là ngày cuối cùng của tháng đầu của quý tiếp theo quý phát sinh nghĩa vụ thuế"},"t":"Tổng hợp"},{"n":1683,"q":"Thời hạn nộp hồ sơ khai thuế theo quý là","c":{"A":"Chậm nhất là ngày cuối cùng của tháng đầu của quý tiếp theo quý phát sinh nghĩa vụ thuế","B":"Chậm nhất là ngày cuối cùng của tháng đầu của quý phát sinh nghĩa vụ thuế","C":"Chậm nhất là ngày cuối cùng của tháng đầu quý phát sinh nghĩa vụ thuế","D":"Chậm nhất là ngày cuối cùng của tháng đầu tiên của quý phát sinh nghĩa vụ thuế"},"t":"Tổng hợp"},{"n":1684,"q":"Thời hạn nộp hồ sơ khai thuế theo tháng là","c":{"A":"Chậm nhất là ngày thứ 10 của tháng phát sinh nghĩa vụ thuế","B":"Chậm nhất là ngày thứ 10 của tháng tiếp theo","C":"Chậm nhất là ngày thứ 20 của tháng tiếp theo tháng phát sinh nghĩa vụ thuế","D":"Chậm nhất là ngày thứ 20 của tháng phát sinh nghĩa vụ thuế của tháng tiếp theo"},"t":"Tổng hợp"},{"n":1685,"q":"Thời hạn nộp hồ sơ khai thuế theo tháng là","c":{"A":"Chậm nhất là ngày thứ 20 của tháng phát sinh nghĩa vụ thuế","B":"Chậm nhất là ngày thứ 20 của tháng tiếp theo","C":"Chậm nhất là ngày thứ 20 của tháng tiếp theo tháng phát sinh nghĩa vụ thuế","D":"Chậm nhất là ngày thứ 20 của tháng phát sinh nghĩa vụ thuế của tháng tiếp theo"},"t":"Tổng hợp"},{"n":1686,"q":"Theo quy định, các trường hợp nào sau đây, tổ chức khai thuế thay và nộp thuế thay cho:","c":{"A":"Cá nhân nhận cổ tức bằng chứng khoán; cá nhân là cổ đông hiện hữu nhận thưởng bằng chứng khoán.","B":"Cá nhân được ghi nhận phần vốn tăng thêm do lợi ích ghi tăng vốn","C":"Cá nhân góp vốn bằng bất động sản, phần vốn góp, chứng khoán.","D":"Tất cả phương án trên"},"t":"Tổng hợp"},{"n":1687,"q":"Theo quy định về khai bổ sung hồ sơ khai thuế, người nộp thuế chỉ được khai bổ sung tăng số thuế GTGT đề nghị hoàn khi nào?","c":{"A":"Khi chưa nộp hồ sơ đề nghị hoàn thuế.","B":"Khi chưa nộp hồ sơ khai thuế của kỳ tính thuế tiếp theo","C":"Khi đã nộp hồ sơ khai thuế của kỳ tính thuế tiếp theo và chưa nộp hồ sơ đề nghị hoàn thuế.","D":"Khi chưa nộp hồ sơ khai thuế của kỳ tính thuế tiếp theo và chưa nộp hồ sơ đề nghị hoàn thuế."},"t":"Thuế GTGT"},{"n":1688,"q":"Theo quy định về khai bổ sung hồ sơ khai thuế, trường hợp khai bổ sung chỉ làm tăng hoặc giảm số thuế GTGT còn được khấu trừ chuyển kỳ sau thì ....","c":{"A":"Phải kê khai vào kỳ tính thuế phát sinh việc sai, sót","B":"Phải kê khai vào kỳ tính thuế hiện tại","C":"Người nộp thuế tùy chọn kỳ tính thuế nếu thấy thuận tiện","D":""},"t":"Thuế GTGT"},{"n":1689,"q":"Theo quy định, người nộp thuế nộp hồ sơ khai bổ sung cho từng hồ sơ khai thuế có sai, sót trong trường hợp:","c":{"A":"Chưa nộp hồ sơ khai quyết toán thuế năm thì người nộp thuế khai bổ sung hồ sơ khai thuế của tháng, quý có sai, sót, đồng thời tổng hợp số liệu khai bổ sung vào hồ sơ khai quyết toán thuế năm.","B":"Chưa nộp hồ sơ khai quyết toán thuế năm thì người nộp thuế khai tổng hợp số liệu khai bổ sung vào hồ sơ khai quyết toán thuế năm.","C":"Không có phương án đúng","D":""},"t":"Tổng hợp"},{"n":1690,"q":"Theo quy định, người nộp thuế nộp hồ sơ khai bổ sung cho từng hồ sơ khai thuế có sai, sót trong trường hợp:","c":{"A":"Khai bổ sung không làm thay đổi nghĩa vụ thuế thì chỉ phải nộp Bản giải trình khai bổ sung.","B":"Khai bổ sung không làm thay đổi nghĩa vụ thuế thì không phải nộp Tờ khai bổ sung.","C":"Trường hợp khai bổ sung không làm thay đổi nghĩa vụ thuế thì chỉ phải nộp Bản giải trình khai bổ sung và các tài liệu có liên quan, không phải nộp Tờ khai bổ sung.","D":"Không có phương án đúng"},"t":"Tổng hợp"},{"n":1691,"q":"Thời hạn người nộp thuế được khai bổ sung hồ sơ khai thuế khi phát hiện hồ sơ khai thuế đã nộp cho cơ quan thuế có sai, sót?","c":{"A":"Trong thời hạn 05 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót nhưng trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra.","B":"Trong thời hạn 07 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót nhưng trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra.","C":"Trong thời hạn 10 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót nhưng trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra.","D":"Bất kỳ thời điểm nào."},"t":"Tổng hợp"},{"n":1692,"q":"Người nộp thuế phát hiện hồ sơ khai thuế đã nộp cho cơ quan thuế có sai, sót thì được khai bổ sung hồ sơ khai thuế trong thời hạn 10 năm kể từ ngày hết thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót trong trường hợp:","c":{"A":"Trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra","B":"Trước khi cơ quan thuế, cơ quan có thẩm quyền công bố biên bản thanh tra, kiểm tra","C":"Sau khi cơ quan thuế, cơ quan có thẩm quyền ban hành kết luận, quyết định xử lý về thuế sau thanh tra, kiểm tra tại trụ sở của người nộp thuế.","D":""},"t":"Tổng hợp"},{"n":1693,"q":"Người nộp thuế không phải nộp hồ sơ khai thuế trong các trường hợp sau đây:","c":{"A":"Người nộp thuế chỉ có hoạt động, kinh doanh thuộc đối tượng không chịu thuế theo quy định của pháp luật về thuế đối với từng loại thuế.","B":"Cá nhân có thu nhập được miễn thuế theo quy định của pháp luật về thuế thu nhập cá nhân","C":"Doanh nghiệp chế xuất chỉ có hoạt động xuất khẩu thì không phải nộp hồ sơ khai thuế giá trị gia tăng.","D":"Tất cả các trường hợp trên"},"t":"Tổng hợp"},{"n":1694,"q":"Người nộp thuế không phải nộp hồ sơ khai thuế trong các trường hợp sau đây:","c":{"A":"Người nộp thuế chỉ có hoạt động, kinh doanh thuộc đối tượng không chịu thuế theo quy định của pháp luật về thuế đối với từng loại thuế.","B":"Doanh nghiệp chế xuất chỉ có hoạt động xuất khẩu thì không phải nộp hồ sơ khai thuế giá trị gia tăng.","C":"Người nộp thuế tạm ngừng hoạt động, kinh doanh theo quy định.","D":"Tất cả các trường hợp trên"},"t":"Tổng hợp"},{"n":1695,"q":"Theo quy định về hồ sơ khai thuế, người nộp thuế đang hoạt động có dự án đầu tư thuộc diện được hoàn thuế GTGT thì:","c":{"A":"Phải lập hồ sơ khai thuế GTGT chung cho tất cả dự án đầu tư.","B":"Phải lập hồ sơ khai thuế GTGT chung cho tất cả dự án đầu tư; đồng thời phải bù trừ số thuế GTGT của hàng hóa, dịch vụ mua vào sử dụng cho từng dự án đầu tư với số thuế GTGT phải nộp (nếu có) của hoạt động, kinh doanh đang thực hiện cùng kỳ tính thuế.","C":"Phải lập hồ sơ khai thuế GTGT riêng cho từng dự án đầu tư; đồng thời phải bù trừ số thuế GTGT của hàng hóa, dịch vụ mua vào sử dụng cho từng dự án đầu tư với số thuế GTGT phải nộp (nếu có) của hoạt động, kinh doanh đang thực hiện cùng kỳ tính thuế.","D":"Không có phương án đúng"},"t":"Thuế GTGT"},{"n":1696,"q":"Theo quy định, người nộp thuế có nhiều hoạt động kinh doanh trong đó có hoạt động mua bán, chế tác vàng, bạc, đá quý thì hồ sơ khai thuế giá trị gia tăng được lập như sau:","c":{"A":"Lập hồ sơ khai thuế GTGT chung cho các hoạt động kinh doanh","B":"Lập hồ sơ khai thuế GTGT riêng cho các hoạt động kinh doanh và hồ sơ khai thuế GTGT riêng cho hoạt động mua bán, chế tác vàng, bạc, đá quý.","C":"Người nộp thuế có thể lựa chọn cách lập hồ sơ khai thuế GTGT phù hợp với hoạt động kinh doanh của mình.","D":"Không có phương án đúng"},"t":"Thuế GTGT"},{"n":1697,"q":"Theo quy định, hồ sơ khai thuế đối với trường hợp chấm dứt hoạt động, chấm dứt hợp đồng hoặc chuyển đổi loại hình doanh nghiệp, tổ chức lại doanh nghiệp gồm:","c":{"A":"Tờ khai quyết toán đến thời diểm chấm dứt hoạt động hoặc chấm dứt hợp đồng hoặc chuyển đổi loại hình doanh nghiệp hoặc tổ chức lại doanh nghiệp.","B":"Tờ khai quyết toán và các tài liệu khác có liên quan đến thời diểm chấm dứt hoạt động hoặc chấm dứt hợp đồng hoặc chuyển đổi loại hình doanh nghiệp hoặc tổ chức lại doanh nghiệp.","C":"Tờ khai quyết toán; Báo cáo tài chính đến thời diểm chấm dứt hoạt động hoặc chấm dứt hợp đồng hoặc chuyển đổi loại hình doanh nghiệp hoặc tổ chức lại doanh nghiệp; các tài liệu khác có liên quan đến quyết toán thuế.","D":"Không có phương án đúng"},"t":"Tổng hợp"},{"n":1698,"q":"Theo quy định, hồ sơ khai thuế đối với loại thuế khai và nộp theo từng lần phát sinh nghĩa vụ thuế bao gồm:","c":{"A":"Tờ khai thuế; hóa đơn, hợp đồng và chứng từ khác có liên quan đến nghĩa vụ thuế theo quy định của pháp luật.","B":"Tờ khai thuế; và chứng từ khác có liên quan đến nghĩa vụ thuế theo quy định của pháp luật.","C":"Tờ khai thuế; hóa đơn và chứng từ khác có liên quan đến nghĩa vụ thuế theo quy định của pháp luật.","D":""},"t":"Tổng hợp"},{"n":1699,"q":"Theo quy định, hồ sơ khai thuế đối với loại thuế có kỳ tính thuế theo năm gồm:","c":{"A":"Hồ sơ khai thuế năm gồm tờ khai thuế năm và các tài liệu có quan đến xác định số tiền thuế phải nộp.","B":"Hồ sơ khai thuế năm gồm tờ khai thuế năm và các tài liệu có quan đến xác định số tiền thuế phải nộp; hồ sơ quyết toán thuế khi kết thúc năm gồm tờ khai quyết toán thuế năm, báo cáo tài chính năm.","C":"Hồ sơ khai thuế năm gồm tờ khai thuế năm và các tài liệu có quan đến xác định số tiền thuế phải nộp; hồ sơ quyết toán thuế khi kết thúc năm gồm tờ khai quyết toán thuế năm, báo cáo tài chính năm; các tài liệu có liên quan đến quyết toán thuế.","D":"Hồ sơ khai thuế năm gồm tờ khai thuế năm và các tài liệu có quan đến xác định số tiền thuế phải nộp; hồ sơ quyết toán thuế khi kết thúc năm gồm tờ khai quyết toán thuế năm, báo cáo tài chính năm, tờ khai giao dịch liên kết; các tài liệu có liên quan đến quyết toán thuế. 701"},"t":"Tổng hợp"},{"n":1700,"q":"Phân bổ thuế GTGT đối với hoạt động chuyển nhượng bất động sản: Số thuế GTGT phải nộp cho từng tỉnh của hoạt động chuyển nhượng bất động sản bằng (=) doanh thu chưa có thuế GTGT đối với hoạt động chuyển nhượng bất động sản tại từng tỉnh nhân (X) với bao nhiêu %?","c":{"A":"1%","B":"2%","C":"5%","D":"10%"},"t":"Thuế GTGT"},{"n":1701,"q":"Theo quy định, hồ sơ khai thuế đối với loại thuế khai và nộp theo quý là tờ khai thuế quý?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1702,"q":"Theo quy định, hồ sơ khai thuế đối với loại thuế khai và nộp theo tháng là tờ khai thuế tháng?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1703,"q":"Về nguyên tắc, người nộp thuế khai thuế, tính thuế như thế nào?","c":{"A":"Trường hợp người nộp thuế hạch toán tập trung tại trụ sở chính, có đơn vị phụ thuộc tại đơn vị hành chính cấp tỉnh khác nơi có trụ sở chính thì người nộp thuế khai thuế tại trụ sở chính và tính thuế, phân bổ nghĩa vụ thuế phải nộp theo từng địa phương nơi được hưởng nguồn thu ngân sách nhà nước.","B":"Trường hợp người nộp thuế hạch toán tập trung tại trụ sở chính, có đơn vị phụ thuộc tại đơn vị hành chính cấp tỉnh khác nơi có trụ sở chính thì người nộp thuế khai thuế tại trụ sở chính và kê khai thuế tại cơ quan thuế quản lý trực tiếp đơn vị phụ thuộc","C":"Người nộp thuế khai thuế, tính thuế tại cơ quan thuế địa phương có thẩm quyền nơi có trụ sở.","D":"Người nộp thuế khai thuế, tính thuế tại cơ quan thuế địa phương có thẩm quyền nơi có trụ sở. Trường hợp người nộp thuế hạch toán tập trung tại trụ sở chính, có đơn vị phụ thuộc tại đơn vị hành chính cấp tỉnh khác nơi có trụ sở chính thì người nộp thuế khai thuế tại trụ sở chính và tính thuế, phân bổ nghĩa vụ thuế phải nộp theo từng địa phương nơi được hưởng nguồn thu ngân sách nhà nước."},"t":"Tổng hợp"},{"n":1704,"q":"Về nguyên tắc, người nộp thuế khai thuế như thế nào?","c":{"A":"Khai chính xác, trung thực, đầy đủ","B":"Khai chính xác, trung thực, đầy đủ các nội dung trong tờ khai thuế theo mẫu do Bộ trưởng Bộ Tài chính quy định","C":"Khai chính xác, trung thực, đầy đủ các nội dung trong tờ khai thuế theo mẫu do Bộ trưởng Bộ Tài chính quy định và nộp đủ các chứng cứ, tài liệu quy định trong hồ sơ khai thuế với cơ quan thuế.","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":1705,"q":"Theo Luật Quản lý thuế, người nộp thuế phải thực hiện việc tính thuế như thế nào?","c":{"A":"Tự tính, tự nộp","B":"Cơ quan thuế xác định","C":"Người nộp thuế tự tính số tiền thuế phải nộp, trừ trường hợp việc tính thuế do cơ quan thuế thực hiện theo quy định của Chính phủ","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":1706,"q":"Xác định số tiền chậm nộp theo tình huống sau là đúng hay sai? “Ngày 30/6/2025, doanh nghiệp nộp vào NSNN số tiền thuế GTGT phát sinh của kỳ tháng 5/2025, số tiền 300.000.000 đồng, hạn nộp tiền thuế vào ngày 20/6/2025 (Thứ Sáu), số tiền chậm nộp tiền thuế GTGT trường hợp này là 810.000 đồng.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1707,"q":"Quy định sau đây là đúng hay sai về hồ sơ hoàn nộp thừa trường hợp sau: “Trường hợp cá nhân có thu nhập từ tiền lương, tiền công trực tiếp quyết toán thuế với cơ quan thuế, có số thuế nộp thừa và đề nghị hoàn trên tờ khai quyết toán thuế thu nhập cá nhân thì không phải nộp hồ sơ hoàn thuế. Cơ quan thuế giải quyết hoàn căn cứ vào hồ sơ quyết toán thuế thu nhập cá nhân để giải quyết hoàn nộp thừa cho người nộp thuế theo quy định.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNCN"},{"n":1708,"q":"Quy định sau đây là đúng hay sai về trường hợp hoàn thuế: “Hoàn thuế trường hợp cá nhân có thu nhập từ tiền lương, tiền công trực tiếp quyết toán thuế với cơ quan thuế có số tiền thuế nộp thừa thuộc trường hợp hoàn nộp thừa”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1709,"q":"Quy định sau đây là đúng hay sai về thời hạn giải quyết hồ sơ hoàn thuế: “Khoảng thời gian kể từ ngày cơ quan thuế ban hành Thông báo đề nghị giải trình, bổ sung đến ngày cơ quan thuế nhận được văn bản giải trình, bổ sung của người nộp thuế không tính trong thời hạn giải quyết hồ sơ hoàn thuế của cơ quan thuế.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1710,"q":"Quy định sau đây là đúng hay sai về thời hạn giải quyết hồ sơ hoàn thuế: “Khoảng thời gian kể từ ngày cơ quan thuế ban hành Thông báo đề nghị giải trình, bổ sung đến ngày cơ quan thuế nhận được văn bản giải trình, bổ sung của người nộp thuế được tính trong thời hạn giải quyết hồ sơ hoàn thuế của cơ quan thuế.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1711,"q":"Quy định sau đây là đúng hay sai về trường hợp hoàn thuế: “Hồ sơ hoàn thuế thu nhập cá nhân đối với thu nhập từ tiền lương, tiền công thuộc trường hợp hoàn thuế theo quy định của pháp luật thuế”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNCN"},{"n":1712,"q":"Xác định số tiền chậm nộp theo tình huống sau là đúng hay sai? “Ngày 30/6/2025, doanh nghiệp nộp vào NSNN số tiền thuế GTGT phát sinh của kỳ tháng 5/2025, số tiền 250.000.000 đồng, hạn nộp tiền thuế vào ngày 20/6/2025 (Thứ Sáu), số tiền chậm nộp tiền thuế GTGT trường hợp này là 750.000 đồng.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1713,"q":"Quy định sau đây là đúng hay sai về hoàn thành nghĩa vụ nộp thuế trong trường hợp tổ chức lại doanh nghiệp: “Việc tổ chức lại doanh nghiệp thì thời hạn nộp thuế thay đổi theo doanh nghiệp được tổ chức lại. Trường hợp doanh nghiệp được tổ chức lại hoặc các doanh nghiệp thành lập mới không nộp thuế đầy đủ theo thời hạn nộp thuế đã quy định thì bị xử phạt theo quy định của pháp luật.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":1714,"q":"Trường hợp đã nộp hồ sơ khai quyết toán thuế năm thì thì người nộp thuế có phải khai bổ sung hồ sơ khai thuế của tháng, quý có sai, sót không (loại trừ tờ khai QTT TNCN)","c":{"A":"Có","B":"Không","C":"","D":""},"t":"Thuế TNCN"},{"n":1715,"q":"Quy định sau đây là đúng hay sai về một trong các trường hợp xử lý không hoàn trả số tiền thuế, tiền chậm nộp, tiền phạt nộp thừa và cơ quan quản lý thuế thực hiện thanh khoản số tiền nộp thừa trên sổ kế toán, trên hệ thống dữ liệu điện tử? “Khoản nộp thừa quá thời hạn 08 năm từ ngày nộp tiền vào ngân sách nhà nước mà người nộp thuế không bù trừ nghĩa vụ thuế và không hoàn thuế”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1716,"q":"Quy định sau đây là đúng hay sai về thời hạn nộp thuế? “Trường hợp người nộp thuế tính thuế, thời hạn nộp thuế chậm nhất là ngày cuối cùng của thời hạn nộp hồ sơ khai thuế. Trường hợp khai bổ sung hồ sơ khai thuế, thời hạn nộp thuế là thời hạn nộp hồ sơ khai thuế của kỳ tính thuế có sai, sót.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1717,"q":"Chọn phương án đúng nhất về một trong các trường hợp xử lý không hoàn trả số tiền thuế, tiền chậm nộp, tiền phạt nộp thừa và cơ quan quản lý thuế thực hiện thanh khoản số tiền nộp thừa trên sổ kế toán, trên hệ thống dữ liệu điện tử? “Cơ quan quản lý thuế đã thông báo cho người nộp thuế về số tiền thuế, tiền chậm nộp, tiền phạt nộp thừa được hoàn trả nhưng người nộp thuế từ chối nhận lại số tiền nộp thừa bằng văn bản”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1718,"q":"Quy định sau đây về quyền hạn của cơ quan thuế? “Mua thông tin, tài liệu, dữ liệu của các đơn vị cung cấp trong nước và ngoài nước để phục vụ công tác quản lý thuế; chi trả chi phí ủy nhiệm thu thuế từ tiền thuế thu được hoặc từ nguồn kinh phí của cơ quan quản lý thuế theo quy định của Chính phủ.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1719,"q":"Quy định sau đây trách nhiệm của người nộp thuế? “Xây dựng, quản lý, vận hành hệ thống hạ tầng công nghệ thông tin kỹ thuật bảo đảm việc thực hiện giao dịch trực tiếp với cơ quan quản lý thuế, áp dụng kết nối thông tin liên quan đến việc thực hiện nghĩa vụ thuế với cơ quan quản lý thuế.”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1720,"q":"Quy định sau đây về quyền của người nộp thuế? “Người nộp thuế được bồi thường thiệt hại do cơ quan quản lý thuế, công chức quản lý thuế gây ra theo quy định của pháp luật về trách nhiệm bồi thường của Nhà nước”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1721,"q":"Chọn phương án đúng nhất: Các trường hợp nào sau đây là trường hợp hoàn nộp thừa theo quy định:","c":{"A":"Hoàn tiền thuê đất hằng năm theo đề nghị hoàn thuế của người nộp thuế.","B":"Hoàn thuế giá trị gia tăng theo quy định của pháp luật thuế giá trị gia tăng.","C":"Hoàn thuế theo Hiệp định tránh đánh thuế hai lần và Điều ước quốc tế khác mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.","D":""},"t":"Tổng hợp"},{"n":1722,"q":"Chọn phương án đúng nhất: Các trường hợp nào sau đây không phải là trường hợp hoàn nộp thừa theo quy định:","c":{"A":"Tổ chức, cá nhân trả thu nhập từ tiền lương, tiền công thực hiện quyết toán cho các cá nhân có uỷ quyền theo quy định có số tiền thuế nộp thừa.","B":"Hoàn thuế TNDN trường hợp doanh nghiệp có phát sinh số thuế thừa khi giải thể doanh nghiệp theo quy định.","C":"Hoàn thuế tiêu thụ đặc biệt theo quy định của pháp luật thuế tiêu thụ đặc biệt đối với xăng sinh học.","D":""},"t":"Tổng hợp"},{"n":1723,"q":"Chọn phương án đúng nhất: Các trường hợp hoàn thuế theo quy định của pháp luật thuế:","c":{"A":"Hoàn thuế giá trị gia tăng theo quy định của pháp luật thuế giá trị gia tăng; Hoàn thuế tiêu thụ đặc biệt theo quy định của pháp luật thuế tiêu thụ đặc biệt đối với xăng sinh học; Hoàn thuế theo Hiệp định tránh đánh thuế hai lần và Điều ước quốc tế khác mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.","B":"Hoàn thuế giá trị gia tăng theo quy định của pháp luật thuế giá trị gia tăng; Hoàn thuế thu nhập cá nhân theo quy định của pháp luật thuế TNCN; Hoàn thuế theo Hiệp định tránh đánh thuế hai lần và Điều ước quốc tế khác mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.","C":"Hoàn thuế giá trị gia tăng theo quy định của pháp luật thuế giá trị gia tăng; Hoàn thuế thu nhập doanh nghiệp theo quy định của pháp luật thuế TNDN; Hoàn thuế theo Hiệp định tránh đánh thuế hai lần và Điều ước quốc tế khác mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1724,"q":"Quy định sau đây là đúng hay sai: “Chi nhánh, đơn vị phụ thuộc chấm dứt hoạt động mà vẫn còn nợ thuế và các khoản thu khác thuộc ngân sách nhà nước thì chi nhánh, đơn vị phụ thuộc phải có trách nhiệm hoàn thành nghĩa vụ thuế, không được chuyển nghĩa vụ sang đơn vị chủ quản kế thừa các khoản nợ của chi nhánh, đơn vị phụ thuộc”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1725,"q":"Quy định sau đây là đúng hay sai về nộp thuế trong thời gian giải quyết khiếu nại, khởi kiện “Trường hợp số tiền thuế, tiền chậm nộp, tiền phạt đã nộp lớn hơn số tiền thuế, tiền chậm nộp, tiền phạt được xác định theo quyết định giải quyết khiếu nại của cơ quan có thẩm quyền hoặc bản án, quyết định của Tòa án thì người nộp thuế được hoàn trả số tiền thuế, tiền chậm nộp, tiền phạt nộp thừa”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1726,"q":"Chọn phương án đúng nhất: Đồng tiền khai thuế, nộp thuế là:","c":{"A":"Đồng tiền khai thuế, nộp thuế là Đồng Việt Nam, trừ các trường hợp được phép khai thuế, nộp thuế bằng ngoại tệ tự do chuyển đổi.","B":"Đồng tiền khai thuế là Đồng Việt Nam, nộp thuế là Đồng Việt Nam hoặc ngoại tệ chuyển đổi.","C":"Đồng tiền khai thuế, nộp thuế là Đồng Việt Nam hoặc ngoại tệ chuyển đổi.","D":""},"t":"Tổng hợp"},{"n":1727,"q":"Chọn phương án đúng nhất: Trong thời hạn bao nhiêu ngày làm việc kể từ ngày tiếp nhận hồ sơ hoàn thuế, cơ quan quản lý thuế thực hiện phân loại hồ sơ và thông báo cho người nộp thuế về việc chấp nhận hồ sơ và thời hạn giải quyết hồ sơ hoàn thuế hoặc thông báo bằng văn bản cho người nộp thuế trong trường hợp hồ sơ không đầy đủ:","c":{"A":"05 ngày làm việc","B":"04 ngày làm việc","C":"03 ngày làm việc","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1728,"q":"Chọn phương án đúng nhất: Hồ sơ đề nghị hoàn thuế đủ điều kiện tiếp nhận bao gồm:","c":{"A":"Hồ sơ đề nghị hoàn phải thuộc một trong các loại hồ sơ hoàn thuế tương ứng với từng trường hợp hoàn thuế theo quy định.","B":"Hồ sơ đề nghị hoàn phải lập đúng, đủ thành phần hồ sơ tương ứng với từng loại hồ sơ hoàn thuế theo quy định.","C":"Hồ sơ được NNT ký điện tử đúng quy định.","D":"Tất cả các phương án trên."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1729,"q":"Chọn phương án đúng nhất: Hành vi nào dưới đây bị nghiêm cấm đối với công chức quản lý thuế theo quy định của Luật Quản lý thuế:","c":{"A":"Cập nhập thông tin, thay đổi địa chỉ của doanh nghiệp vào hệ thống.","B":"Hướng dẫn NNT sửa dụng phần mềm kê khai thuế.","C":"Gây phiền hà, sách nhiễu đối với người nộp thuế.","D":""},"t":"Tổng hợp"},{"n":1730,"q":"Chọn phương án đúng nhất: Việc áp dụng quản lý rủi ro trong quản lý thuế (Điều 9) bao gồm nội dung nào sau đây?","c":{"A":"Đánh giá việc tuân thủ pháp luật và phân loại mức độ rủi ro của người nộp thuế.","B":"Công khai thông tin cá nhân của tất cả người nộp thuế trên mạng xã hội.","C":"Chỉ áp dụng với lĩnh vực hoàn thuế.","D":""},"t":"Tổng hợp"},{"n":1731,"q":"Chọn phương án đúng nhất: Người nộp thuế đã thực hiện giao dịch điện tử trong lĩnh vực thuế thì:","c":{"A":"Vẫn phải nộp thêm hồ sơ giấy để đối chiếu.","B":"Không phải thực hiện phương thức giao dịch khác.","C":"Phải được cơ quan thuế yêu cầu mới được dùng giao dịch giấy.","D":""},"t":"Tổng hợp"},{"n":1732,"q":"Chọn phương án đúng nhất: Các hành vi bị nghiêm cấm trong quản lý thuế không bao gồm:","c":{"A":"Thông đồng, móc nối, bao che giữa người nộp thuế và công chức quản lý thuế, cơ quan quản lý thuế để chuyển giá, trốn thuế","B":"Bán hàng hóa, cung cấp dịch vụ xuất hóa đơn theo quy định của pháp luật.","C":"Lợi dụng để chiếm đoạt hoặc sử dụng trái phép tiền thuế.","D":""},"t":"Tổng hợp"},{"n":1733,"q":"Chọn phương án đúng nhất: Phát biểu nào sau đây chưa đúng theo quy định của Luật quản lý thuế:","c":{"A":"Rủi ro về thuế là nguy cơ không tuân thủ pháp luật về thuế của người nộp thuế dẫn đến thất thu ngân sách nhà nước.","B":"Trụ sở của người nộp thuế là địa điểm người nộp thuế tiến hành toàn bộ hoạt động sản xuất kinh doanh, bao gồm trụ sở chính, chi nhánh, cửa hàng, nơi sản xuất, nơi để hàng hóa, nơi để tài sản dùng cho sản xuất, kinh doanh; nơi cư trú hoặc nơi phát sinh nghĩa vụ thuế.","C":"Tờ khai thuế là văn bản theo mẫu do Bộ trưởng Bộ Tài chính quy định được người nộp thuế sử dụng để kê khai các thông tin nhằm xác định số tiền thuế phải nộp.","D":""},"t":"Tổng hợp"},{"n":1734,"q":"Chọn phương án đúng nhất: Nguyên tắc quản lý thuế:","c":{"A":"Mọi tổ chức, hộ gia đình, hộ kinh doanh, cá nhân có nghĩa vụ nộp thuế theo quy định của luật.","B":"Cơ quan thuế áp dụng quản lý rủi ro trong đăng ký thuế, khai thuế, nộp thuế, nợ thuế, cưỡng chế thi hành quyết định hành chính về quản lý thuế, hoàn thuế, kiểm tra thuế, thanh tra thuế, quản lý và sử dụng hóa đơn, chứng từ và các nghiệp vụ khác trong quản lý thuế.","C":"Áp dụng biện pháp ưu tiên khi thực hiện các thủ tục về thuế đối với hàng hóa xuất khẩu, nhập khẩu theo quy định của pháp luật về hải quan và quy định của Chính phủ.","D":"A, C đúng."},"t":"Tổng hợp"},{"n":1735,"q":"Chọn phương án đúng nhất: Trường hợp người nộp thuế tự phát hiện số tiền đã được hoàn không đúng quy định thì phải thực hiện:","c":{"A":"Khai bổ sung, đồng thời nộp số tiền đã được hoàn thừa và nộp tiền chậm nộp tương ứng theo quy định trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra.","B":"Khai bổ sung số tiền đã được hoàn thừa theo quy định trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra.","C":"Tự xác định nộp số tiền đã hoàn thừa và nộp tiền chậm nộp tương ứng theo quy định trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra.","D":""},"t":"Tổng hợp"},{"n":1736,"q":"Chọn phương án đúng nhất: Trường hợp cơ quan thuế, cơ quan nhà nước có thẩm quyền qua thanh tra, kiểm tra phát hiện người nộp thuế đã được hoàn không đúng quy định thì người nộp thuế phải nộp số tiền đã được hoàn thừa và nộp tiền chậm nộp tương ứng theo quy định kể từ:","c":{"A":"Ngày được Kho bạc Nhà nước chi trả tiền hoàn.","B":"Ngày Kho bạc Nhà nước hạch toán bù trừ tiền hoàn thuế với khoản thu ngân sách nhà nước.","C":"Cả A và B đều đúng.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1737,"q":"Chọn phương án đúng nhất: Cơ quan quản lý thuế thực hiện thanh tra, kiểm tra đối với hồ sơ thuộc diện hoàn thuế trước theo nguyên tắc rủi ro trong quản lý thuế trong thời hạn:","c":{"A":"03 năm kể từ ngày ban hành quyết định hoàn thuế.","B":"05 năm kể từ ngày ban hành quyết định hoàn thuế.","C":"10 kể từ ngày ban hành quyết định hoàn thuế.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1738,"q":"Chọn phương án đúng nhất: Thời hạn giải quyết hồ sơ hoàn thuế đối với hồ sơ hoàn thuế thuộc diện kiểm tra trước hoàn thuế là bao nhiêu ngày kể từ ngày cơ quan quản lý thuế có thông báo về việc chấp nhận hồ sơ và thời hạn giải quyết hồ sơ hoàn thuế.","c":{"A":"40 ngày.","B":"40 ngày làm việc.","C":"30 ngày làm việc.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1739,"q":"Chọn phương án đúng nhất: Thời hạn giải quyết hồ sơ hoàn thuế đối với hồ sơ hoàn thuế thuộc diện hoàn thuế trước là bao nhiêu ngày kể từ ngày cơ quan quản lý thuế có thông báo về việc chấp nhận hồ sơ và thời hạn giải quyết hồ sơ hoàn thuế:","c":{"A":"Chậm nhất 05 ngày làm việc.","B":"Chậm nhất 06 ngày làm việc.","C":"Chậm nhất 07 ngày làm việc.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1740,"q":"Chọn phương án đúng nhất: Trường hợp hồ sơ thuộc diện kiểm tra trước hoàn thuế là:","c":{"A":"Hồ sơ của người nộp thuế đề nghị hoàn thuế lần đầu của từng trường hợp hoàn thuế theo quy định của pháp luật về thuế.","B":"Hồ sơ của người nộp thuế đề nghị hoàn thuế trong thời hạn 02 năm kể từ thời điểm bị xử lý về hành vi trốn thuế.","C":"Hồ sơ hoàn thuế thuộc loại rủi ro về thuế cao theo phân loại quản lý rủi ro trong quản lý thuế.","D":"Cả A, B, C đều đúng."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1741,"q":"Chọn phương án đúng nhất: Thời hạn nộp thuế đối với Cổ tức, lợi nhuận được chia cho phần vốn nhà nước đầu tư tại công ty cổ phần, công ty trách nhiệm hữu hạn hai thành viên trở lên do bộ, cơ quan ngang bộ, cơ quan trực thuộc Chính phủ, địa phương làm đại diện chủ sở hữu phần vốn của nhà nước:","c":{"A":"Chậm nhất ngày cuối cùng của tháng thứ 3 sau khi kết thúc năm dương lịch hoặc năm tài chính.","B":"Chậm nhất là ngày thứ 10 kể từ ngày được nhận cổ tức, lợi nhuận theo Nghị quyết của Đại hội đồng cổ đông công ty cổ phần hoặc Quyết định của Hội đồng thành viên công ty TNHH 2 TV trở lên.","C":"Chậm nhất là ngày thứ 45 kể từ ngày được nhận cổ tức, lợi nhuận theo Nghị quyết của Đại hội đồng cổ đông công ty cổ phần hoặc Quyết định của Hội đồng thành viên công ty TNHH 2 TV trở lên.","D":""},"t":"Tổng hợp"},{"n":1742,"q":"Chọn phương án đúng nhất: Các khoản thu khác thuộc NSNN do cơ quan quản lý thuế quản lý thu:","c":{"A":"Tiền nộp ngân sách nhà nước từ bán tài sản trên đất, chuyển nhượng quyền sử dụng đất theo quy định của Luật Quản lý, sử dụng tài sản công.","B":"Tiền bảo vệ, phát triển đất trồng lúa theo quy định của pháp luật về đất đai.","C":"Tiền thu từ xử phạt vi phạm hành chính theo quy định của pháp luật về xử phạt vi phạm hành chính trong lĩnh vực giao thông.","D":""},"t":"Tổng hợp"},{"n":1743,"q":"Chọn phương án đúng nhất: Đối với người nộp thuế là cá nhân đã chết, người bị Toà án tuyên bố đã chết thì nghĩa vụ nộp thuế còn lại được giải quyết như thế nào?","c":{"A":"Nghĩa vụ thuế được xoá bỏ hoàn toàn ngay khi cá nhân qua đời.","B":"Người được thừa kế dùng toàn bộ tài sản riêng của mình để trả nợ thuế cho người đã chết.","C":"Người được thừa kế thực hiện trong phần tài sản của người đã chết, người bị Tòa án tuyên bố là đã chết để lại hoặc phần tài sản người thừa kế được chia tại thời điểm nhận thừa kế.","D":""},"t":"Tổng hợp"},{"n":1744,"q":"Chọn phương án đúng nhất: Khi doanh nghiệp bị chia nhưng chưa hoàn thành nghĩa vụ nộp thuế thì trách nhiệm hoàn thành nghĩa vụ thuế thuộc về:","c":{"A":"Doanh nghiệp bị chia và doanh nghiệp được chia.","B":"Doanh nghiệp mới được thành lập từ doanh nghiệp bị chia.","C":"Doanh nghiệp bị chia.","D":""},"t":"Tổng hợp"},{"n":1745,"q":"Chọn phương án đúng nhất: Theo quy định, khi doanh nghiệp bị tách, bị hợp nhất, bị sáp nhập nhưng chưa hoàn thành nghĩa vụ nộp thuế thì trách nhiệm hoàn thành nghĩa vụ thuế thuộc về:","c":{"A":"Doanh nghiệp bị tách và doanh nghiệp được tách, doanh nghiệp hợp nhất, doanh nghiệp nhận sáp nhập.","B":"Doanh nghiệp được tách, doanh nghiệp hợp nhất, doanh nghiệp nhận sáp nhập.","C":"Doanh nghiệp bị tách, doanh nghiệp hợp nhất, doanh nghiệp nhận sáp nhập.","D":""},"t":"Tổng hợp"},{"n":1746,"q":"Chọn câu trả lời đúng nhất: Theo quy định, khi doanh nghiệp là Công ty cổ phần chấm dứt hoạt động, bỏ địa chỉ đăng ký kinh doanh nhưng chưa hoàn thành nghĩa vụ nộp thuế thì trách nhiệm hoàn thành nghĩa vụ thuế thuộc về:","c":{"A":"Chủ tịch Hội đồng quản trị Công ty Cổ phần.","B":"Giám đốc Công ty cổ phần.","C":"Cổ đông góp vốn vào Công ty cổ phần.","D":""},"t":"Tổng hợp"},{"n":1747,"q":"Chọn câu trả lời đúng nhất: Theo quy định, người nộp thuế bị áp dụng tạm hoãn xuất cảnh khi chưa hoàn thành nghĩa vụ thuế là đối tượng nào sau đây?","c":{"A":"Cá nhân là Người đại diện công ty có tranh chấp hợp đồng kinh tế với doanh nghiệp đang có nợ thuế.","B":"Tất cả nhân viên đang làm việc tại doanh nghiệp có nợ thuế.","C":"Cá nhân là Người đại diện theo pháp luật của doanh nghiệp đang bị cưỡng chế thi hành quyết định về quản lý thuế.","D":""},"t":"Tổng hợp"},{"n":1748,"q":"Chọn phương án đúng nhất: Hoàn thành nghĩa vụ nộp thuế là:","c":{"A":"Là việc nộp hết số tiền thuế phải nộp, số tiền chậm nộp, tiền phạt vi phạm pháp luật về thuế và các khoản thu khác thuộc ngân sách nhà nước.","B":"Là việc nộp đủ số tiền thuế phải nộp, số tiền chậm nộp, tiền phạt vi phạm pháp luật về thuế và các khoản thu khác cho cơ quan quản lý thuế.","C":"Là việc nộp đủ số tiền thuế phải nộp, số tiền chậm nộp, tiền phạt vi phạm pháp luật về thuế và các khoản thu khác thuộc ngân sách nhà nước.","D":""},"t":"Tổng hợp"},{"n":1749,"q":"Theo quy định của Luật Quản lý thuế và các văn bản hướng quy phạm pháp luật hiện hành. Người nộp thuế không bắt buộc phải hoàn thành nghĩa vụ với ngân sách khi nào:","c":{"A":"Xuất cảnh.","B":"Tổ chức lại doanh nghiệp.","C":"Thay đổi địa chỉ trụ sở dẫn đến thay đổi cơ quan thuế quản lý khác địa bàn cấp tỉnh.","D":"Giải thể doanh nghiệp."},"t":"Tổng hợp"},{"n":1750,"q":"Chọn phương án đúng nhất về xử lý hồ sơ gia hạn nộp thuế của cơ quan thuế trường hợp hồ sơ gia hạn hợp pháp, đầy đủ, đúng mẫu quy định","c":{"A":"Cơ quan thuế thông báo bằng văn bản về việc gia hạn nộp thuế cho người nộp thuế trong thời hạn 10 ngày làm việc kể từ ngày nhận đủ hồ sơ","B":"Cơ quan thuế thông báo bằng văn bản về việc gia hạn nộp thuế cho người nộp thuế trong thời hạn 5 ngày làm việc kể từ ngày nhận đủ hồ sơ","C":"Cơ quan thuế thông báo bằng văn bản về việc gia hạn nộp thuế cho người nộp thuế trong thời hạn 3 ngày làm việc kể từ ngày nhận đủ hồ sơ","D":""},"t":"Tổng hợp"},{"n":1751,"q":"Chọn phương án đúng nhất: Các khoản thu khác thuộc ngân sách nhà nước không do cơ quan quản lý thuế quản lý thu:","c":{"A":"Tiền nộp ngân sách nhà nước từ bán tài sản trên đất, chuyển nhượng quyền sử dụng đât theo quy định của Luật Quản lý, sử dụng tài sản công.","B":"Tiền bảo vệ, phát triển đất trồng lúa theo quy định của pháp luật về đất đai.","C":"Phí và lệ phí theo quy định của Luật phí và lệ phí.","D":""},"t":"Tổng hợp"},{"n":1752,"q":"Chọn phương án đúng nhất về tính thời gian gia hạn nộp thuế:","c":{"A":"Không quá 01 năm kể từ ngày hết thời hạn nộp thuế đối với trường hợp phải ngừng hoạt động do di dời cơ sở sản xuất, kinh doanh theo yêu cầu của cơ quan có thẩm quyền làm ảnh hưởng đến kết quả sản xuất, kinh doanh.","B":"Không quá 02 năm kể từ ngày hết thời hạn nộp thuế đối với trường hợp NNT bị thiệt hại vật chất, gây ảnh hưởng trực tiếp đến sản xuất, kinh doanh do kinh doanh không hiệu quả.","C":"A và B đều đúng.","D":""},"t":"Tổng hợp"},{"n":1753,"q":"Chọn phương án đúng nhất: Trong thời gian giải quyết khiếu nại, khởi kiện của người nộp thuế về số tiền thuế, tiền chậm nộp, tiền phạt do cơ quan quản lý thuế tính hoặc ấn định thì:","c":{"A":"Người nộp thuế chưa phải nộp đủ số tiền thuế, tiền chậm nộp, tiền phạt đó.","B":"Người nộp thuế vẫn phải nộp đủ số tiền thuế, tiền chậm nộp, tiền phạt đó, trừ trường hợp cơ quan nhà nước có thẩm quyền quyết định tạm đình chỉ thực hiện quyết định tính thuế, quyết định ấn định thuế của cơ quan quản lý thuế.","C":"Người nộp thuế vẫn phải nộp đủ số tiền thuế, tiền chậm nộp, tiền phạt đó, kể cả trường hợp cơ quan nhà nước có thẩm quyền quyết định tạm đình chỉ thực hiện quyết định tính thuế, quyết định ấn định thuế của cơ quan quản lý thuế.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1754,"q":"Chọn phương án đúng nhất: Theo quy định hiện hành, doanh nghiệp do nhà nước nắm giữ 100% vốn điều lệ KHÔNG phải nộp tiền chậm nộp đối với số lợi nhuận sau thuế còn lại phải nộp tăng thêm sau khi quyết toán năm trong trường hợp:","c":{"A":"Khi doanh nghiệp tự nguyện nộp bù trong vòng 30 ngày kể từ ngày quyết toán năm.","B":"Khi doanh nghiệp thực hiện khai bổ sung do điều chỉnh kết quả xếp loại doanh nghiệp theo công bố của chủ sở hữu từ thời điểm ngày tiếp sau ngày cuối cùng của hạn nộp lợi nhuận sau thuế còn lại theo quyết toán năm đến thời hạn công bố kết quả xếp loại doanh nghiệp của chủ sở hữu theo quy định của cơ quan có thẩm quyền.","C":"Khi doanh nghiệp gặp khó khăn về tài chính, có văn bản đề nghị không tính tiền chậm nộp gửi cơ quan thuế.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1755,"q":"Chọn phương án đúng nhất: Theo quy định hiện hành, tổng số lợi nhuận sau thuế còn lại sau khi trích lập các quỹ đã tạm nộp của 04 quý của doanh nghiệp do nhà nước nắm giữ 100% vốn điều lệ không được thấp hơn bao nhiêu phần trăm (%) số phải nộp theo quyết toán năm?","c":{"A":"70%","B":"75%","C":"80%","D":""},"t":"Tổng hợp"},{"n":1756,"q":"Chọn phương án đúng nhất: Trường hợp nào sau đây cơ quan quản lý thuế thực hiện thanh khoản số tiền nộp thừa trên sổ kế toán và không thực hiện hoàn trả cho người nộp thuế:","c":{"A":"Khoản nộp thừa quá thời hạn 10 năm kể từ ngày nộp tiền vào ngân sách nhà nước mà người nộp thuế không bù trừ nghĩa vụ thuế và không hoàn thuế.","B":"Người nộp thuế có số tiền thuế nộp thừa nhỏ dưới 5.000 đồng.","C":"Người nộp thuế đề nghị bù trừ tiền thuế nộp thừa với số tiền thuế phải nộp của lần tiếp theo.","D":""},"t":"Kế toán"},{"n":1757,"q":"Chọn phương án đúng nhất: Theo quy định, trong thời hạn bao nhiêu ngày làm việc kể từ ngày nhận được văn bản yêu cầu hoàn trả số tiền thuế nộp thừa, cơ quan quản lý thuế phải ra quyết định hoàn trả hoặc có văn bản trả lời nêu rõ lý do không hoàn trả?","c":{"A":"07 ngày làm việc kể từ ngày nhận được văn bản yêu cầu.","B":"05 ngày làm việc kể từ này nhận được văn bản yêu cầu.","C":"03 ngày làm việc kể từ ngày nhận được văn bản yêu cầu.","D":""},"t":"Tổng hợp"},{"n":1758,"q":"Chọn phương án đúng nhất: Người nộp thuế chưa nộp tiền thuế, tiền chậm nộp, tiền phạt thì sau bao nhiêu ngày cơ quan quản lý thuế thông báo cho người nộp thuế biết số tiền thuế, tiền phạt còn nợ và số ngày chậm nộp theo quy định:","c":{"A":"Sau 10 ngày kể từ ngày hết thời hạn nộp thuế.","B":"Sau 20 ngày kể từ ngày hết thời hạn nộp thuế.","C":"Sau 30 ngày kể từ ngày hết thời hạn nộp thuế.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1759,"q":"Chọn phương án đúng về xác định ngày đã nộp thuế:","c":{"A":"Trường hợp nộp tiền thuế không bằng tiền mặt, ngày đã nộp thuế là ngày Kho bạc Nhà nước, ngân hàng thương mại, tổ chức tín dụng khác, tổ chức dịch vụ trích tiền từ tài khoản của người nộp thuế hoặc người nộp thay và được ghi nhận trên chứng từ nộp tiền thuế.","B":"Trường hợp nộp tiền thuế trực tiếp bằng tiền mặt, ngày đã nộp thuế là ngày Kho bạc Nhà nước, cơ quan quản lý thuế hoặc tổ chức được ủy nhiệm thu thuế cấp chứng từ thu tiền thuế.","C":"Cả A và B đều sai.","D":"Cả A và B đúng"},"t":"Tổng hợp"},{"n":1760,"q":"Chọn phương án đúng nhất: Thứ tự thanh toán tiền thuế, tiền chậm nộp, tiền phạt:","c":{"A":"Tiền nợ thuế, tiền phạt, tiền chậm nộp quá hạn thuộc đối tượng áp dụng các biện pháp cưỡng chế; Tiền thuế, tiền phạt, tiền chậm nộp phát sinh; Tiền nợ thuế, tiền phạt, tiền chậm nộp quá hạn chưa thuộc đối tượng áp dụng các biện pháp cưỡng chế.","B":"Tiền nợ thuế, tiền phạt, tiền chậm nộp quá hạn thuộc đối tượng áp dụng các biện pháp cưỡng chế; Tiền nợ thuế, tiền phạt, tiền chậm nộp quá hạn chưa thuộc đối tượng áp dụng các biện pháp cưỡng chế; Tiền thuế, tiền phạt, tiền chậm nộp phát sinh.","C":"Tiền thuế, tiền phạt, tiền chậm nộp phát sinh; Tiền nợ thuế, tiền phạt, tiền chậm nộp quá hạn thuộc đối tượng áp dụng các biện pháp cưỡng chế; Tiền nợ thuế, tiền phạt, tiền chậm nộp quá hạn chưa thuộc đối tượng áp dụng các biện pháp cưỡng chế.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1761,"q":"Chọn phương án đúng nhất: Địa điểm người nộp thuế theo quy định gồm:","c":{"A":"Tại Kho bạc nhà nước; cơ quan quản lý thuế nơi tiếp nhận hồ sơ khai thuế; Tổ chức được cơ quan nhà nước uỷ nhiệm thu thuế; Ngân hàng thương mại, tổ chức tín dụng khác và tổ chức dịch vụ theo quy định của pháp luật.","B":"Tại Kho bạc nhà nước; Tổ chức được cơ quan nhà nước uỷ nhiệm thu thuế; Ngân hàng thương mại, tổ chức tín dụng khác và tổ chức dịch vụ theo quy định của pháp luật.","C":"Tại Kho bạc nhà nước; Tổ chức được cơ quan nhà nước uỷ nhiệm thu thuế; Ngân hàng thương mại, tổ chức tín dụng khác.","D":""},"t":"Tổng hợp"},{"n":1762,"q":"Chọn phương án đúng nhất về thời hạn nộp thuế trường hợp cơ quan thuế tính thuế:","c":{"A":"Là thời hạn nộp thuế theo quy định.","B":"Là thời hạn ghi trên thông báo của cơ quan thuế.","C":"Là 10 ngày kể từ ngày người nộp thuế nhận thông báo của cơ quan thuế.","D":""},"t":"Tổng hợp"},{"n":1763,"q":"Chọn phương án đúng nhất. Theo quy định hiện hành, đối với thuế TNDN tạm nộp quý thì:","c":{"A":"Tổng số thuế thu nhập doanh nghiệp đã tạm nộp của 04 quý không được thấp hơn 75% số thuế thu nhập doanh nghiệp phải nộp theo quyết toán năm. Trường hợp người nộp thuế nộp thiếu so với số thuế phải tạm nộp 04 quý thì phải nộp tiền chậm nộp tính trên số thuế nộp thiếu kể từ ngày tiếp sau ngày cuối cùng của thời hạn tạm nộp thuế thu nhập doanh nghiệp quý 04 đến ngày nộp số thuế còn thiếu vào ngân sách nhà nước.","B":"Tổng số thuế thu nhập doanh nghiệp đã tạm nộp của 04 quý không được thấp hơn 80% số thuế thu nhập doanh nghiệp phải nộp theo quyết toán năm. Trường hợp người nộp thuế nộp thiếu so với số thuế phải tạm nộp 04 quý thì phải nộp tiền chậm nộp tính trên số thuế nộp thiếu kể từ ngày tiếp sau ngày cuối cùng của thời hạn tạm nộp thuế thu nhập doanh nghiệp quý 04 đến ngày liền kề trước ngày nộp số thuế còn thiếu vào ngân sách nhà nước.","C":"Tổng số thuế thu nhập doanh nghiệp đã tạm nộp của 04 quý không được thấp hơn 75% số thuế thu nhập doanh nghiệp phải nộp theo quyết toán năm. Trường hợp người nộp thuế nộp thiếu so với số thuế phải tạm nộp 04 quý thì phải nộp tiền chậm nộp tính trên số thuế nộp thiếu kể từ ngày tiếp sau ngày cuối cùng của thời hạn tạm nộp thuế thu nhập doanh nghiệp quý 04 đến ngày liền kề trước ngày nộp số thuế còn thiếu vào ngân sách nhà nước.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1764,"q":"Chọn phương án đúng nhất: Thời hạn nộp thuế đối với thuế TNDN tạm nộp theo quý:","c":{"A":"Chậm nhất là ngày 30 của tháng đầu quý sau.","B":"Chậm nhất là ngày cuối cùng của thời hạn nộp tờ khai quý.","C":"Chậm nhất là ngày cuối cùng của tháng đầu quý sau.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1765,"q":"Anh/ Chị hãy chọn câu trả lời đúng nhất về điều chỉnh tiền chậm nộp khi khai bổ sung hồ sơ khai thuế của người nộp thuế:","c":{"A":"Người nộp thuế khai bổ sung hồ sơ khai thuế làm tăng số tiền thuế phải nộp hoặc cơ quan quản lý thuế, cơ quan nhà nước có thẩm quyền kiểm tra, thanh tra phát hiện số tiền thuế phải nộp tăng thì được điều chỉnh số tiền chậm nộp đã tính tương ứng với số tiền chênh lệch giảm.","B":"Người nộp thuế khai bổ sung hồ sơ khai thuế làm giảm số tiền thuế phải nộp hoặc cơ quan quản lý thuế, cơ quan nhà nước có thẩm quyền kiểm tra, thanh tra phát hiện số tiền thuế phải nộp giảm thì không được điều chỉnh số tiền chậm nộp đã tính tương ứng với số tiền chênh lệch giảm.","C":"Người nộp thuế khai bổ sung hồ sơ khai thuế làm giảm số tiền thuế phải nộp hoặc cơ quan quản lý thuế, cơ quan nhà nước có thẩm quyền kiểm tra, thanh tra phát hiện số tiền thuế phải nộp giảm thì được điều chỉnh số tiền chậm nộp đã tính tương ứng với số tiền chênh lệch giảm.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1766,"q":"Chọn phương án đúng nhất: Doanh nghiệp kê khai thuế GTGT kỳ kê khai tháng 01/2025, hạn nộp 20/2/2025 (Thứ Năm) có phát sinh số tiền thuế phải nộp; doanh nghiệp đã nộp số thuế GTGT phải nộp của kỳ tháng 01/2025 vào ngày 25/02/2025. Anh, chị hãy xác định khoảng thời gian tính tiền chậm nộp.","c":{"A":"Từ ngày 21/02/2025 đến ngày 25/02/2025 (5 ngày)","B":"Từ ngày 21/02/2025 đến ngày 24/02/2025 (4 ngày)","C":"Từ ngày 22/02/2025 đến ngày 25/02/2025 (4 ngày)","D":"Từ ngày 22/02/2025 đến ngày 24/02/2025 (3 ngày)"},"t":"Thuế GTGT"},{"n":1767,"q":"Ngày 19/02/2024, Doanh nghiệp nộp số thuế GTGT phải nộp của quý IV/2023 vào NSNN. Anh, chị xác định số ngày tính tiền chậm nộp của DN:","c":{"A":"18 ngày.","B":"17 ngày.","C":"16 ngày.","D":""},"t":"Thuế GTGT"},{"n":1768,"q":"Chọn phương án đúng nhất: Ngày 27/02/2024, Doanh nghiệp nộp số thuế GTGT phải nộp tháng 01/2024 vào NSNN. Anh, chị hãy xác định số ngày tính tiền chậm nộp của DN:","c":{"A":"07 ngày.","B":"06 ngày.","C":"05 ngày.","D":""},"t":"Thuế GTGT"},{"n":1769,"q":"Chọn phương án đúng nhất: Trường hợp nào sau đây NNT được miễn tiền tiền chậm nộp đối với số tiền thuế nợ theo quy định:","c":{"A":"Người nộp thuế cung ứng hàng hóa, dịch vụ được thanh toán bằng nguồn vốn ngân sách nhà nước, bao gồm cả nhà thầu phụ được quy định trong hợp đồng ký với chủ đầu tư và được chủ đầu tư trực tiếp thanh toán nhưng chưa được thanh toán.","B":"Người nộp thuế bị thiệt hại về vật chất do nguyên nhân bất khả kháng: chiến tranh, bạo loạn, đình công phải ngừng, nghỉ sản xuất, kinh doanh hoặc rủi ro không thuộc nguyên nhân, trách nhiệm chủ quan của người nộp thuế mà người nộp thuế không có khả năng nguồn tài chính nộp ngân sách nhà nước.","C":"Người nộp thuế bị thiệt hại vật chất do gặp thiên tai, thảm họa, dịch bệnh, hỏa hoạn, tai nạn bất ngờ.","D":"Cả B và C đều đúng."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1770,"q":"Chọn phương án đúng nhất: Trường hợp nào sau đây thì cơ quan thuế không tính tiền chậm nộp khi NNT phát sinh nghĩa vụ thuế:","c":{"A":"Người nộp thuế đã nộp đơn yêu cầu mở thủ tục phá sản hoặc bị người có quyền, nghĩa vụ liên quan nộp đơn yêu cầu mở thủ tục phá sản theo quy định của pháp luật về phá sản.","B":"Người nộp thuế cung ứng hàng hóa, dịch vụ được thanh toán bằng nguồn vốn ngân sách nhà nước, bao gồm cả nhà thầu phụ được quy định trong hợp đồng ký với chủ đầu tư và được chủ đầu tư trực tiếp thanh toán nhưng chưa được thanh toán.","C":"Người nộp thuế là người đã chết, người bị Tòa án tuyên bố là đã chết, mất tích hoặc mất năng lực hành vi dân sự.","D":"Cả A và B đều đúng."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1771,"q":"Theo quy định, trường hợp người nộp thuế thực hiện nộp tiền thuế không bằng tiền mặt, ngày đã nộp thuế được xác định là ngày nào?","c":{"A":"Ngày Ngân hàng thương mại hoàn tất việc quyết toán cuối ngày với Kho bạc nhà nước.","B":"Ngày cơ quan thuế nhận được chứng từ trên hệ thống quản lý thuế tập trung.","C":"Ngày Kho bạc Nhà nước, ngân hàng thương mại, tổ chức tín dụng khác, tổ chức dịch vụ trích tiền từ tài khoản của người nộp thuế hoặc người nộp thay và được ghi nhận trên chứng từ nộp tiền thuế.","D":""},"t":"Tổng hợp"},{"n":1772,"q":"Chọn phương án đúng nhất: Trường hợp người nộp thuế tự tính thuế, thời hạn nộp thuế là ngày:","c":{"A":"10 ngày kể từ ngày phát sinh nghĩa vụ thuế.","B":"Ngày 20 hàng tháng.","C":"Ngày 30 của tháng đầu quý sau.","D":"Chậm nhất là ngày cuối cùng của thời hạn nộp hồ sơ khai thuế."},"t":"Tổng hợp"},{"n":1773,"q":"Chọn phương án đúng nhất: Nhiệm vụ, quyền hạn của các tổ chức, cá nhân khác trong quản lý thuế:","c":{"A":"Yêu cầu người bán hàng, người cung cấp dịch vụ phải giao hóa đơn, chứng từ bán hàng hóa, dịch vụ đúng số lượng, chủng loại, giá trị thực thanh toán khi mua hàng hóa, dịch vụ.","B":"Phối hợp với cơ quan quản lý thuế trong việc thực hiện các quyết định xử phạt vi phạm hành chính về quản lý thuế.","C":"Cung cấp thông tin liên quan đến việc xác định nghĩa vụ thuế theo đề nghị của tổ chức, cá nhân khác.","D":"A và B đều đúng."},"t":"Tổng hợp"},{"n":1774,"q":"Chọn phương án đúng nhất: Trách nhiệm của ngân hàng thương mại trong quản lý thuế:","c":{"A":"Phối hợp với cơ quan quản lý thuế, Kho bạc Nhà nước trong việc thực hiện nộp thuế điện tử, hoàn thuế điện tử cho người nộp thuế; xử lý, đối soát dữ liệu về nộp thuế điện tử, hoàn thuế điện tử;","B":"Truyền, nhận thông tin chứng từ nộp thuế điện tử, chuyển tiền thanh toán các khoản thu ngân sách nhà nước cho Kho bạc Nhà nước đầy đủ, chính xác, kịp thời theo đúnDg quy định của pháp luật;","C":"Bảo mật thông tin của người nộp thuế, người khai hải quan theo quy định của pháp luật.","D":"Cả A, B, C đều đúng."},"t":"Tổng hợp"},{"n":1775,"q":"Chọn phương án đúng nhất: Trường hợp Kiểm toán nhà nước trực tiếp kiểm toán người nộp thuế theo quy định của Luật Kiểm toán nhà nước có nội dung kiến nghị về nghĩa vụ nộp ngân sách nhà nước thì:","c":{"A":"Kiểm toán nhà nước phải có trách nhiệm thực hiện kiến nghị theo báo cáo kiểm toán của Kiểm toán nhà nước.","B":"Kiểm toán nhà nước phải gửi biên bản hoặc báo cáo kiểm toán cho cơ quan thuế, đồng thời người nộp thuế có trách nhiệm thực hiện kiến nghị theo báo cáo kiểm toán của Kiểm toán nhà nước.","C":"Kiểm toán nhà nước phải gửi biên bản hoặc báo cáo kiểm toán cho người nộp thuế và người nộp thuế có trách nhiệm thực hiện kiến nghị theo báo cáo kiểm toán của Kiểm toán nhà nước.","D":""},"t":"Tổng hợp"},{"n":1776,"q":"Chọn phương án đúng nhất: Trách nhiệm của Thanh tra nhà nước và cơ quan thuế trong trường hợp Thanh tra nhà nước không trực tiếp thanh tra đối với người nộp thuế mà thực hiện thanh tra tại cơ quan quản lý thuế có nội dung kiến nghị nêu trong kết luận thanh tra liên quan đến nghĩa vụ thuế của người nộp thuế thì:","c":{"A":"Thanh tra nhà nước trực tiếp tổ chức thực hiện kết luận của Thanh tra nhà nước với người nộp thuế. Cơ quan thuế thực hiện thu ngân sách nhà nước đối với người nộp thuế theo quy định.","B":"Thanh tra nhà nước gửi bản trích sao có kết luận liên quan đến nghĩa vụ thuế cho người nộp thuế để thực hiện. Cơ quan quản lý thuế có trách nhiệm tổ chức thực hiện kết luận của Thanh tra nhà nước.","C":"Thanh tra nhà nước gửi bản trích sao có kết luận liên quan đến nghĩa vụ thuế cho người nộp thuế để thực hiện. Cơ quan quản lý thuế có trách nhiệm thu ngân sách nhà nước theo kết luận của Thanh tra nhà nước.","D":""},"t":"Tổng hợp"},{"n":1777,"q":"Chọn phương án đúng nhất: Kinh phí hoạt động của Hội đồng tư vấn thuế xã, phường theo quy định do:","c":{"A":"Cơ quan thuế chi từ nguồn ngân sách nhà nước cấp cho ngành thuế.","B":"UBND xã, phường chi từ nguồn ngân sách nhà nước cấp cho xã, phường.","C":"Cả A, B đều sai","D":""},"t":"Tổng hợp"},{"n":1778,"q":"Chọn phương án không đúng: Quyền hạn của cơ quan thuế theo quy định:","c":{"A":"Yêu cầu người nộp thuế cung cấp thông tin, tài liệu liên quan đến việc xác định nghĩa vụ thuế, bao gồm cả thông tin về giá trị đầu tư; số hiệu, nội dung giao dịch của các tài khoản được mở tại ngân hàng thương mại, tổ chức tín dụng khác và giải thích việc tính thuế, khai thuế, nộp thuế.","B":"Yêu cầu tổ chức, cá nhân có liên quan cung cấp thông tin, tài liệu không liên quan đến việc xác định nghĩa vụ thuế.","C":"Áp dụng biện pháp ngăn chặn và bảo đảm việc xử phạt vi phạm hành chính về quản lý thuế theo quy định của pháp luật.","D":"A, C đúng."},"t":"Tổng hợp"},{"n":1779,"q":"Nhiệm vụ nào sau đây không phải là nhiệm vụ của cơ quan quản lý thuế:","c":{"A":"Tổ chức thực hiện quản lý thu thuế và các khoản thu khác thuộc ngân sách nhà nước theo quy định của pháp luật về thuế và quy định khác của pháp luật có liên quan.","B":"Tuyên truyền, phổ biến, hướng dẫn pháp luật về thuế; công khai các thủ tục về thuế tại trụ sở, trang thông tin điện tử của cơ quan quản lý thuế và trên các phương tiện thông tin đại chúng.","C":"Giải quyết khiếu nại, tố cáo liên quan đến việc thực hiện pháp luật về thuế theo thẩm quyền.","D":"Đề xuất giải pháp với cơ quan đại diện chủ sở hữu về hoạt động đầu tư, quản lý, sử dụng vốn nhà nước tại doanh nghiệp."},"t":"Tổng hợp"},{"n":1780,"q":"Chọn phương án đúng nhất về Nhiệm vụ nào sau đây không phải của cơ quan quản lý thuế:","c":{"A":"Tổ chức thực hiện quản lý thu thuế và các khoản thu khác thuộc ngân sách nhà nước theo quy định của pháp luật về thuế và quy định khác của pháp luật có liên quan.","B":"Tuyên truyền, phổ biến, hướng dẫn pháp luật về thuế; công khai các thủ tục về thuế tại trụ sở, trang thông tin điện tử của cơ quan quản lý thuế và trên các phương tiện thông tin đại chúng.","C":"Bồi thường thiệt hại cho người nộp thuế theo quy định của pháp luật về trách nhiệm bồi thường của Nhà nước.","D":"Tất cả đều sai."},"t":"Tổng hợp"},{"n":1781,"q":"Chọn phương án đúng nhất về Nhiệm vụ của cơ quan thuế theo quy định:","c":{"A":"Cung cấp thông tin của người nộp thuế cho các tổ chức, cá nhân theo yêu cầu.","B":"Bảo mật thông tin của người nộp thuế, trừ các thông tin cung cấp cho cơ quan có thẩm quyền hoặc thông tin được công bố công khai theo quy định của pháp luật.","C":"Bảo mật thông tin của người nộp thuế, bao gồm các thông tin cung cấp cho cơ quan có thẩm quyền hoặc thông tin được công bố công khai theo quy định của pháp luật.","D":""},"t":"Tổng hợp"},{"n":1782,"q":"Chọn phương án đúng nhất về Trách nhiệm của người nộp thuế theo quy định:","c":{"A":"Cung cấp chính xác, đầy đủ, kịp thời thông tin, tài liệu liên quan đến việc xác định nghĩa vụ thuế, bao gồm cả thông tin về giá trị đầu tư; số hiệu và nội dung giao dịch của tài khoản được mở tại ngân hàng thương mại, tổ chức tín dụng khác; giải thích việc tính thuế, khai thuế, nộp thuế theo yêu cầu của cơ quan quản lý thuế","B":"Người nộp thuế có phát sinh giao dịch liên kết có nghĩa vụ lập, lưu trữ, kê khai, cung cấp hồ sơ thông tin về người nộp thuế và các bên liên kết của người nộp thuế bao gồm cả thông tin về các bên liên kết cư trú tại các quốc gia, vùng lãnh thổ ngoài Việt Nam theo quy định của Chính phủ.","C":"A và B đều đúng.","D":"A và B đều sai."},"t":"Tổng hợp"},{"n":1783,"q":"Chọn phương án đúng nhất về quyền của người nộp thuế theo quy định:","c":{"A":"Được hỗ trợ, hướng dẫn thực hiện việc nộp thuế; cung cấp thông tin, tài liệu để thực hiện nghĩa vụ, quyền lợi về thuế.","B":"Được nhận văn bản liên quan đến nghĩa vụ thuế của các cơ quan chức năng khi tiến hành thanh tra, kiểm tra, kiểm toán.","C":"Được tra cứu, xem, in toàn bộ chứng từ điện tử mà mình đã gửi đến cổng thông tin điện tử của cơ quan quản lý thuế theo quy định của Luật này và pháp luật về giao dịch điện tử.","D":"Cả A, B, C đều đúng."},"t":"Tổng hợp"},{"n":1784,"q":"Chọn phương án đúng nhất về trách nhiệm của Bộ Tài chính trong quản lý thuế","c":{"A":"Tổ chức tiếp nhận, xử lý, giải quyết tin báo, tố giác tội phạm và kiến nghị khởi tố, tiếp nhận các hồ sơ phát hiện hành vi vi phạm có dấu hiệu tội phạm trong lĩnh vực thuế, tiến hành điều tra, xử lý tội phạm trong lĩnh vực thuế theo quy định của pháp luật.","B":"Chỉ đạo, hướng dẫn các cơ quan chức năng phối hợp với cơ quan quản lý thuế trong việc thực hiện quy định của pháp luật về ưu đãi đầu tư phù hợp với quy định của pháp luật về thuế.","C":"Xử lý vi phạm pháp luật và giải quyết khiếu nại, tố cáo liên quan đến việc thực hiện pháp luật về thuế theo thẩm quyền.","D":""},"t":"Tổng hợp"},{"n":1785,"q":"Theo quy định của pháp luật về quản lý thuế, nội dung nào sau đây đúng về việc nộp dần tiền thuế nợ:","c":{"A":"Người nộp thuế được nộp dần tiền thuế nợ trong thời hạn tối đa 24 tháng, trong thời gian thư bảo lãnh có hiệu lực.","B":"Số tiền thuế nợ được nộp dần có thể vượt quá số tiền thuế nợ có bảo lãnh của tổ chức tín dụng nếu người nộp thuế có cam kết bằng văn bản.","C":"Người nộp thuế được nộp dần tiền thuế nợ không quá 12 tháng và trong thời gian thư bảo lãnh có hiệu lực.","D":"Người nộp thuế được nộp dần theo từng quý và không phải nộp tiền chậm nộp phát sinh trong thời gian được nộp dần."},"t":"Tổng hợp"},{"n":1786,"q":"Theo quy định của pháp luật về quản lý thuế, khi nơi cư trú hoặc trụ sở kinh doanh của người nộp thuế bị cưỡng chế và bên thứ ba ở khác địa bàn cấp tỉnh, nếu bên thứ ba không thực hiện nộp thay cho người nộp thuế thì cơ quan nào có trách nhiệm thực hiện các biện pháp cưỡng chế:","c":{"A":"Cơ quan quản lý thuế quản lý người nộp thuế trực tiếp thực hiện cưỡng chế đối với bên thứ ba.","B":"Ủy ban nhân dân cấp tỉnh nơi bên thứ ba cư trú thực hiện cưỡng chế.","C":"Cơ quan quản lý thuế quản lý bên thứ ba thực hiện các biện pháp cưỡng chế theo đề nghị của cơ quan quản lý thuế quản lý người nộp thuế bị cưỡng chế.","D":"Cơ quan thi hành án dân sự nơi bên thứ ba cư trú thực hiện cưỡng chế."},"t":"Tổng hợp"},{"n":1787,"q":"Theo quy định của pháp luật về quản lý thuế, sau khi nhận được văn bản của cơ quan nhà nước có thẩm quyền về việc không thu hồi giấy chứng nhận đăng ký kinh doanh, cơ quan quản lý thuế tiếp tục theo dõi, đôn đốc thu hồi khoản nợ thuế nhưng không tiếp tục áp dụng các biện pháp cưỡng chế đã thực hiện trước đó đối với khoản tiền thuế nợ này:","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Tổng hợp"},{"n":1788,"q":"Theo quy định của pháp luật về quản lý thuế, tổ chức bảo lãnh nộp tiền thuế cho người nộp thuế bị cưỡng chế trong trường hợp nào sau đây:","c":{"A":"Quá thời hạn quy định 30 ngày, kể từ ngày hết hạn nộp tiền thuế nợ theo văn bản chấp thuận của cơ quan quản lý thuế mà người nộp thuế chưa nộp đủ vào ngân sách nhà nước.","B":"Quá thời hạn quy định 60 ngày, kể từ ngày hết hạn nộp tiền thuế nợ theo văn bản chấp thuận của cơ quan quản lý thuế mà người nộp thuế chưa nộp đủ vào ngân sách nhà nước.","C":"Quá thời hạn quy định 90 ngày, kể từ ngày hết hạn nộp tiền thuế nợ theo văn bản chấp thuận của cơ quan quản lý thuế mà người nộp thuế chưa nộp đủ vào ngân sách nhà nước.","D":""},"t":"Tổng hợp"},{"n":1789,"q":"Theo quy định về cưỡng chế thi hành quyết định hành chính về quản lý thuế, trường hợp nào dưới đây không bị cưỡng chế:","c":{"A":"Người nộp thuế nợ tiền thuế quá 90 ngày kể từ ngày hết thời hạn nộp theo quy định.","B":"Người nộp thuế không chấp hành quyết định xử phạt vi phạm hành chính về quản lý thuế theo thời hạn ghi trên quyết định.","C":"Người nộp thuế không chấp hành quyết định xử phạt vi phạm hành chính về quản lý thuế theo thời hạn ghi trên quyết định xử phạt vi phạm hành chính về quản lý thuế, trong trường hợp được hoãn hoặc tạm đình chỉ thi hành quyết định xử phạt.","D":"Người nộp thuế có tiền thuế nợ khi hết thời hạn gia hạn nộp tiền thuế."},"t":"Tổng hợp"},{"n":1790,"q":"Theo quy định của pháp luật về quản lý thuế, Thông báo tiền thuế nợ không được xem là quyết định hành chính về quản lý thuế:","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Tổng hợp"},{"n":1791,"q":"Ông B bị cưỡng chế khấu trừ lương, đang hưởng lương 20 triệu đồng/ tháng. Mức khấu trừ tối đa hằng tháng là:","c":{"A":"4 triệu đồng.","B":"5 triệu đồng.","C":"6 triệu đồng.","D":"10 triệu đồng."},"t":"Tổng hợp"},{"n":1792,"q":"Theo quy định của Luật Quản lý thuế, giá trị tài sản bị kê biên của đối tượng bị cưỡng chế thi hành quyết định hành chính về quản lý thuế được xác định như thế nào?","c":{"A":"Tương đương với số tiền thuế nợ và tiền phạt vi phạm hành chính.","B":"Tương đương với số tiền thuế đã ghi trong quyết định cưỡng chế.","C":"Tương đương với số tiền thuế đã ghi trong quyết định cưỡng chế và chi phí cho việc tổ chức thi hành cưỡng chế.","D":"Bằng toàn bộ giá trị tài sản thuộc quyền sở hữu của đối tượng bị cưỡng chế."},"t":"Tổng hợp"},{"n":1793,"q":"Theo quy định của Luật Quản lý thuế, trường hợp cơ quan, tổ chức, cá nhân đang có khoản nợ hoặc nắm giữ tiền, tài sản khác của đối tượng bị cưỡng chế thi hành quyết định hành chính về quản lý thuế không thực hiện nộp thay số tiền thuế bị cưỡng chế trong thời hạn 15 ngày kể từ ngày nhận được yêu cầu của cơ quan quản lý thuế thì bị xử lý như thế nào?","c":{"A":"Bị xử phạt vi phạm hành chính về thuế và buộc thực hiện nộp thay.","B":"Bị tính tiền chậm nộp đối với số tiền chưa nộp thay.","C":"Bị coi là nợ tiền thuế của Nhà nước và bị áp dụng các biện pháp cưỡng chế theo quy định.","D":"Bị truy cứu trách nhiệm hình sự nếu không thực hiện nộp thay trong thời hạn quy định."},"t":"Tổng hợp"},{"n":1794,"q":"Theo quy định của pháp luật về quản lý thuế, cơ quan quản lý thuế được quyền bán đấu giá tài sản đã kê biên trong trường hợp nào sau đây?","c":{"A":"Trong thời hạn 15 ngày kể từ ngày kê biên tài sản, đối tượng bị cưỡng chế thi hành quyết định hành chính về quản lý thuế không nộp đủ tiền thuế nợ.","B":"Trong thời hạn 30 ngày kể từ ngày kê biên tài sản, đối tượng bị cưỡng chế thi hành quyết định hành chính về quản lý thuế không nộp đủ tiền thuế nợ.","C":"Trong thời hạn 45 ngày kể từ ngày kê biên tài sản, đối tượng bị cưỡng chế thi hành quyết định hành chính về quản lý thuế không nộp đủ tiền thuế nợ.","D":""},"t":"Tổng hợp"},{"n":1795,"q":"Theo quy định về cưỡng chế bằng biện pháp thu hồi giấy chứng nhận đăng ký kinh doanh, trong thời hạn bao nhiêu ngày kể từ ngày nhận được văn bản đề nghị thu hồi của cơ quan quản lý thuế, cơ quan nhà nước có thẩm quyền phải thực hiện thu hồi hoặc thông báo lý do không thu hồi:","c":{"A":"05 ngày làm việc kể từ ngày nhận được văn bản đề nghị thu hồi của cơ quan quản lý thuế.","B":"07 ngày kể từ ngày nhận được văn bản đề nghị thu hồi của cơ quan quản lý thuế.","C":"10 ngày kể từ ngày nhận được văn bản đề nghị thu hồi của cơ quan quản lý thuế.","D":"15 ngày kể từ ngày nhận được văn bản đề nghị thu hồi của cơ quan quản lý thuế."},"t":"Tổng hợp"},{"n":1796,"q":"Khi thực hiện biện pháp cưỡng chế kê biên tài sản, bán đấu giá tài sản kê biên, tài sản nào không được kê biên?","c":{"A":"Ô tô cá nhân.","B":"Nhà ở duy nhất.","C":"Máy móc sản xuất.","D":"Hàng tồn kho."},"t":"Tổng hợp"},{"n":1797,"q":"Khi thực hiện biện pháp cưỡng chế ngừng sử dụng hóa đơn, cơ quan quản lý thuế phải công khai trên cổng thông tin điện tử của cơ quan mình và trên phương tiện thông tin đại chúng trong bao lâu?","c":{"A":"12 giờ.","B":"24 giờ.","C":"48 giờ.","D":"72 giờ."},"t":"Hóa đơn"},{"n":1798,"q":"Theo quy định của pháp luật về quản lý thuế, Thủ trưởng cơ quan hải quan nơi người nộp thuế có tiền thuế nợ quá hạn phải thông báo về việc áp dụng biện pháp cưỡng chế dừng làm thủ tục hải quan đối với hàng hóa xuất khẩu, nhập khẩu chậm nhất là?","c":{"A":"05 ngày làm việc trước ngày ban hành quyết định cưỡng chế.","B":"05 ngày làm việc trước ngày áp dụng biện pháp cưỡng chế.","C":"05 ngày làm việc kể từ ngày ký quyết định cưỡng chế.","D":"05 ngày kể từ ngày áp dụng biện pháp cưỡng chế."},"t":"Thuế nhà thầu / XNK"},{"n":1799,"q":"Theo Luật Quản lý thuế, hàng hóa nào không áp dụng biện pháp cưỡng chế dừng làm thủ tục hải quan?","c":{"A":"Hàng hóa xuất khẩu thuộc diện áp dụng thuế suất 0% theo quy định của pháp luật về thuế GTGT.","B":"Hàng hóa nhập khẩu phục vụ hoạt động sản xuất, kinh doanh thông thường.","C":"Hàng hóa xuất khẩu, nhập khẩu thuộc diện chịu thuế tiêu thụ đặc biệt.","D":"Hàng hóa nhập khẩu đang trong thời hạn được gia hạn nộp thuế. 801"},"t":"Thuế nhà thầu / XNK"},{"n":1800,"q":"Theo Luật Quản lý thuế, đối với biện pháp cưỡng chế khấu trừ tiền lương hoặc thu nhập, tỷ lệ khấu trừ tối đa đối với các khoản thu nhập khác là bao nhiêu % tổng số thu nhập của cá nhân đó:","c":{"A":"30%.","B":"40%.","C":"50%.","D":"60%."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1801,"q":"Theo Luật Quản lý thuế, đối với biện pháp cưỡng chế khấu trừ tiền lương hoặc thu nhập, tỷ lệ khấu trừ tiền lương tối thiểu đối với cá nhân bị cưỡng chế là bao nhiêu % tổng số tiền lương hằng tháng của cá nhân đó:","c":{"A":"5%.","B":"10%.","C":"20%.","D":"30%."},"t":"Tổng hợp"},{"n":1802,"q":"Theo Luật Quản lý thuế, không thực hiện cưỡng chế đối với trường hợp nào sau đây?","c":{"A":"Nợ thuế GTGT.","B":"Nợ thuế TNDN.","C":"Nợ phí hải quan và lệ phí hàng hóa quá cảnh.","D":"Nợ tiền phạt vi phạm thuế."},"t":"Tổng hợp"},{"n":1803,"q":"Quyết định cưỡng chế bằng biện pháp thu tiền, tài sản khác của người nộp thuế bị cưỡng chế do cơ quan, tổ chức, cá nhân khác đang giữ có hiệu lực thi hành trong thời hạn bao lâu kể từ ngày ban hành?","c":{"A":"30 ngày.","B":"01 năm.","C":"Không thời hạn.","D":"01 tháng."},"t":"Tổng hợp"},{"n":1804,"q":"Trường hợp người nộp thuế đã được cơ quan quản lý thuế ban hành quyết định khoanh tiền thuế nợ mà Tòa án hủy quyết định tuyên bố một người là đã chết, mất tích, mất năng lực hành vi dân sự hoặc người nộp thuế tiếp tục hoạt động kinh doanh thì cơ quan quản lý thuế ban hành quyết định chấm dứt hiệu lực của quyết định khoanh tiền thuế nợ và thực hiện tính tiền chậm nộp từ thời điểm nào?","c":{"A":"Từ ngày người nộp thuế được khoanh tiền thuế nợ.","B":"Từ ngày ban hành quyết định chấm dứt hiệu lực của quyết định khoanh tiền thuế nợ.","C":"Từ ngày người nộp thuế bắt đầu tiếp tục hoạt động kinh doanh.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1805,"q":"Trường hợp người nộp thuế là cá nhân, cá nhân kinh doanh, chủ hộ gia đình, chủ hộ kinh doanh, chủ doanh nghiệp tư nhân và công ty trách nhiệm hữu hạn một thành viên đã được khoanh nợ mà cơ quan quản lý thuế phát hiện người nộp thuế đó thành lập cơ sở kinh doanh, doanh nghiệp khác thì cơ quan quản lý thuế ban hành quyết định chấm dứt hiệu lực của quyết định khoanh tiền thuế nợ và thực hiện tính tiền chậm nộp từ thời điểm nào?","c":{"A":"Từ ngày người nộp thuế được khoanh tiền thuế nợ.","B":"Từ ngày ban hành quyết định chấm dứt hiệu lực của quyết định khoanh tiền thuế nợ.","C":"Từ ngày người nộp thuế bắt đầu tiếp tục hoạt động kinh doanh.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1806,"q":"Người nộp thuế đang làm thủ tục giải thể nhưng chưa hoàn thành thủ tục giải thể, thời gian khoanh nợ được tính từ:","c":{"A":"Ngày nộp hồ sơ giải thể cho cơ quan thuế.","B":"Ngày có quyết định giải thể.","C":"Ngày cơ quan đăng ký kinh doanh thông báo về việc NNT đang làm thủ tục giải thể trên hệ thống thông tin quốc gia về đăng ký kinh doanh.","D":"Ngày cơ quan thuế kiểm tra thực tế."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1807,"q":"Trường hợp người nộp thuế tự xác định số tiền thuế được miễn, giảm thì việc nộp và tiếp nhận hồ sơ miễn thuế, giảm thuế được thực hiện đồng thời với việc khai, nộp và tiếp nhận hồ sơ khai thuế quy định:","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Tổng hợp"},{"n":1808,"q":"Thời hạn giải quyết hồ sơ miễn thuế, giảm thuế khi không cần kiểm tra thực tế là:","c":{"A":"20 ngày.","B":"25 ngày.","C":"30 ngày.","D":"40 ngày."},"t":"Tổng hợp"},{"n":1809,"q":"Thời hạn giải quyết hồ sơ miễn thuế, giảm thuế khi cần kiểm tra thực tế là:","c":{"A":"30 ngày.","B":"35 ngày.","C":"40 ngày.","D":"60 ngày."},"t":"Tổng hợp"},{"n":1810,"q":"Cơ quan quản lý thuế phải thông báo hồ sơ miễn thuế, giảm thuế không hợp lệ trong thời hạn:","c":{"A":"01 ngày làm việc kể từ ngày tiếp nhận hồ sơ.","B":"03 ngày làm việc kể từ ngày tiếp nhận hồ sơ.","C":"05 ngày làm việc kể từ ngày tiếp nhận hồ sơ.","D":"10 ngày làm việc kể từ ngày tiếp nhận hồ sơ."},"t":"Tổng hợp"},{"n":1811,"q":"Theo quy định, hồ sơ miễn thuế, giảm thuế khi người nộp thuế tự xác định số tiền được miễn, giảm bao gồm:","c":{"A":"Văn bản đề nghị miễn, giảm thuế.","B":"Quyết định của cơ quan thuế.","C":"Tờ khai thuế và tài liệu liên quan.","D":"Biên bản xác minh thiệt hại."},"t":"Tổng hợp"},{"n":1812,"q":"Người có thẩm quyền phải ra quyết định xóa nợ tiền thuế, tiền chậm nộp, tiền phạt, hoặc thông báo không thuộc diện được xóa nợ tiền thuế, tiền chậm nộp, tiền phạt cho cơ quan đã gửi hồ sơ trong thời gian bao lâu kể từ ngày nhận đủ hồ sơ?","c":{"A":"30 ngày.","B":"60 ngày.","C":"90 ngày.","D":"120 ngày."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1813,"q":"Theo Luật Quản lý thuế, trường hợp nào sau đây cần có sự phối hợp giữa cơ quan quản lý thuế và cơ quan đăng ký kinh doanh, chính quyền địa phương để đảm bảo các khoản tiền thuế đã được xóa phải được hoàn trả vào ngân sách nhà nước?","c":{"A":"Doanh nghiệp bị tuyên bố phá sản quay lại sản xuất kinh doanh.","B":"Cá nhân đã được xóa nợ quay lại sản xuất kinh doanh.","C":"Doanh nghiệp hoặc cá nhân đã được xóa nợ thành lập cơ sở sản xuất kinh doanh mới.","D":"Tất cả các trường hợp trên."},"t":"Tổng hợp"},{"n":1814,"q":"Theo Luật Quản lý thuế, khoản nợ tiền thuế, tiền chậm nộp, tiền phạt của doanh nghiệp, hợp tác xã không thuộc trường hợp phá sản hoặc không thuộc trường hợp cá nhân đã chết có thể được xóa nợ nếu đáp ứng điều kiện nào sau đây?","c":{"A":"Cơ quan quản lý thuế đã áp dụng biện pháp cưỡng chế và khoản nợ đã quá 5 năm kể từ ngày hết thời hạn nộp thuế.","B":"Cơ quan quản lý thuế đã áp dụng biện pháp cưỡng chế và khoản nợ đã quá 5 năm kể từ ngày hết thời hạn nộp thuế nhưng không có khả năng thu hồi.","C":"Cơ quan quản lý thuế đã áp dụng biện pháp cưỡng chế và khoản nợ đã quá 10 năm kể từ ngày hết thời hạn nộp thuế.","D":"Cơ quan quản lý thuế đã áp dụng biện pháp cưỡng chế và khoản nợ đã quá 10 năm kể từ ngày hết thời hạn nộp thuế nhưng không có khả năng thu hồi."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1815,"q":"Theo Luật Quản lý thuế, điều kiện nào sau đây là bắt buộc để xóa nợ tiền thuế, tiền chậm nộp, tiền phạt cho do
