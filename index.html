
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ôn thi nghiệp vụ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
button:active{transform:scale(.97)}
.screen{display:none;min-height:100vh;padding:14px 14px 36px}
.screen.active{display:block}
.wrap{max-width:620px;margin:0 auto}

/* ──HOME── */
.hero{text-align:center;padding:20px 0 16px}
.hero-icon{font-size:42px}
.hero-title{font-size:21px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:8px}
.hero-sub{font-size:12px;color:#64748b;margin-top:5px}
.author{display:inline-block;margin-top:10px;padding:7px 16px;border-radius:20px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);font-size:11.5px;color:#a5b4fc;line-height:1.6}
.card{background:#1e293b;border-radius:14px;padding:15px 16px;margin-bottom:11px}
.card-label{font-size:10.5px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:11px}
.tgrid{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{padding:6px 10px;border-radius:18px;font-size:11.5px;font-weight:600;border:2px solid #334155;color:#94a3b8;background:transparent;transition:all .15s}
.tbtn.on{border-color:var(--ac,#3b82f6);background:color-mix(in srgb,var(--ac,#3b82f6) 14%,transparent);color:var(--ac,#3b82f6)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sbtn{padding:12px 0;border-radius:10px;border:2px solid #334155;color:#94a3b8;background:transparent;font-size:16px;font-weight:700;transition:all .15s}
.sbtn.on{border-color:#60a5fa;background:rgba(96,165,250,.1);color:#60a5fa}
.go-btn{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:16px;font-weight:800;transition:opacity .15s}
.go-btn:disabled{opacity:.35;cursor:not-allowed}
.pool-info{text-align:center;font-size:11px;color:#475569;margin-top:8px}

/* ──QUIZ── */
.qhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.back-btn{background:none;color:#64748b;font-size:24px;padding:2px 8px}
.qpos{font-size:13px;color:#64748b}
.qpos strong{color:#e2e8f0}
.abort-btn{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:18px;padding:6px 13px;font-size:12px;font-weight:700}
.pbar{background:#334155;border-radius:3px;height:4px;margin-bottom:13px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .3s}
.sboard{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}
.sbox{background:#1e293b;border-radius:10px;padding:8px 4px;text-align:center}
.sval{font-size:18px;font-weight:800;color:#60a5fa}
.slbl{font-size:9.5px;color:#475569;margin-top:1px}
.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.qnum-lbl{font-size:11px;color:#64748b}
.ttag{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600}
.qbox{background:#1e293b;border-radius:13px;padding:16px;margin-bottom:12px;font-size:13.5px;line-height:1.75;color:#e2e8f0}
.qlbl{font-size:9.5px;color:#64748b;margin-bottom:7px}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cbtn{width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid #334155;background:#1e293b;color:#e2e8f0;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
.cletter{width:27px;height:27px;border-radius:7px;background:#334155;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;transition:all .15s}
.cbtn.sel .cletter{background:#6366f1;color:#fff}
.cbtn.sel{border-color:#6366f1;background:rgba(99,102,241,.09)}
.cbtn.ok .cletter{background:#10b981;color:#fff}
.cbtn.ok{border-color:#10b981;background:rgba(16,185,129,.09)}
.cbtn.bad .cletter{background:#ef4444;color:#fff}
.cbtn.bad{border-color:#ef4444;background:rgba(239,68,68,.07)}
.abox{background:#1e293b;border-radius:13px;padding:14px 16px;margin-bottom:12px}
.astatus{font-size:14px;font-weight:800;margin-bottom:7px}
.astatus.ok{color:#10b981}
.astatus.bad{color:#ef4444}
.astatus.na{color:#f59e0b}
.adetail{font-size:12.5px;color:#94a3b8;line-height:1.6}
.arow{display:flex;gap:8px}
.retry-btn{padding:12px 16px;border-radius:10px;background:#1e293b;color:#94a3b8;border:1px solid #334155;font-size:13px;font-weight:600;white-space:nowrap}
.next-btn{flex:1;padding:12px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:14px;font-weight:700}

/* ──RESULT── */
.rhero{text-align:center;padding:24px 0 18px}
.ricon{font-size:50px}
.rtitle{font-size:22px;font-weight:800;margin-top:8px}
.rscore{font-size:46px;font-weight:900;margin:8px 0 3px}
.rsub{font-size:12px;color:#64748b}
.sgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.sbox3{background:#1e293b;border-radius:10px;padding:12px 6px;text-align:center}
.sv3{font-size:21px;font-weight:800}
.sl3{font-size:10px;color:#475569;margin-top:2px}
.rlist{background:#1e293b;border-radius:13px;padding:13px 15px;margin-bottom:13px;max-height:270px;overflow-y:auto}
.ri{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid #334155;font-size:11.5px}
.ri:last-child{border-bottom:none}
.ric{flex:1;color:#94a3b8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.rians{flex-shrink:0;color:#64748b;font-size:12px}
.ok-c{color:#10b981;font-weight:700}
.bad-c{color:#ef4444;font-weight:700}
.arr-c{color:#10b981;font-weight:700}
.rbtn{width:100%;padding:14px;border-radius:10px;font-size:14px;font-weight:700;margin-bottom:8px}
.rb1{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.rb2{background:#1e293b;color:#94a3b8;border:1px solid #334155}
</style>
</head>
<body>

<script type="application/json" id="qdata">[{"n":1,"q":"Trong năm 2024, Công ty Cổ phần Cơ khí ABC thực hiện thanh lý một dây chuyền sản xuất cũ để đầu tư công nghệ mới. Số liệu liên quan đến việc thanh lý như sau: Nguyên giá tài sản trên sổ sách: 1.200.000.000 đồng. Khấu hao lũy kế (tính đến thời điểm thanh lý): 950.000.000 đồng. Giá bán thanh lý (chưa bao gồm thuế GTGT 10%): 300.000.000 đồng. Chi phí phục vụ thanh lý (tháo dỡ, vận chuyển, môi giới...): 20.000.000 đồng (có hóa đơn hợp lệ). Câu hỏi: Khi quyết toán thuế TNDN năm 2024, khoản Thu nhập khác từ hoạt động thanh lý tài sản này mà công ty phải kê khai là bao nhiêu?","c":{"A":"50 triệu đồng.","B":"70 triệu đồng.","C":"30 triệu đồng.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":2,"q":"Trong kỳ tính thuế năm 2024, Công ty Vận tải Thành Công phát sinh các khoản chi liên quan đến vi phạm và bồi thường như sau (đều có chứng từ nộp tiền vào Ngân sách Nhà nước hoặc phiếu chi): - Phạt vi phạm luật giao thông: Xe tải của công ty bị phạt do chở quá tải trọng và đi vào đường cấm: 15.000.000 đồng. - Phạt chậm nộp hồ sơ khai thuế: Do kế toán nộp chậm tờ khai thuế GTGT quý 3/2024: 5.000.000 đồng. - Vi phạm hợp đồng kinh tế: Công ty giao hàng chậm cho đối tác nên phải trả tiền phạt vi phạm hợp đồng theo thỏa thuận: 20.000.000 đồng. Hỏi: Tổng chi phí không được trừ (phải loại ra khi quyết toán thuế TNDN) từ các khoản trên là bao nhiêu?","c":{"A":"5 triệu đồng.","B":"20 triệu đồng.","C":"40 triệu đồng.","D":""},"t":"Xử phạt VPHC thuế","a":"B"},{"n":3,"q":"Trong năm 2024, Công ty Cổ phần XNK Toàn Cầu phát sinh khoản chi phí liên quan đến việc đối ngoại và phúc lợi cho ban điều hành như sau (có hóa đơn GTGT hợp lệ và đã thanh toán qua ngân hàng): Chi phí mua 02 thẻ hội viên sân Golf tại sân Golf Legend Hill cho Giám đốc và Phó Giám đốc: 300.000.000 đồng (Thời hạn thẻ 1 năm). Câu hỏi: Công ty được tính vào chi phí được trừ khi xác định thuế thu nhập doanh nghiệp năm 2024 là bao nhiêu?","c":{"A":"300 triệu đồng.","B":"150 triệu đồng.","C":"Không được tính vào chi phí được trừ.","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"C"},{"n":4,"q":"Tháng 01/2024, Công ty Cổ phần ABC (đã góp đủ vốn điều lệ) vay của ông Nguyễn Văn A (cá nhân) số tiền 2.000.000.000 VNĐ để phục vụ hoạt động sản xuất kinh doanh. Thời hạn vay: 12 tháng (từ 01/01/2024 đến 31/12/2024). Lãi suất vay: 15%/ năm. Lãi suất cơ bản do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm vay là: 9%/năm. Trong năm 2024, Công ty đã thực trả toàn bộ lãi vay cho ông A và hạch toán vào chi phí tài chính (TK 635) số tiền là 300.000.000 VNĐ. Câu hỏi: Khi quyết toán thuế TNDN năm 2024, phần chi phí lãi vay không được trừ do vượt mức 150% lãi suất cơ bản là bao nhiêu?","c":{"A":"30 triệu đồng.","B":"270 triệu đồng.","C":"135 triệu đồng.","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"A"},{"n":5,"q":"Trong năm 2024, để thực hiện chính sách phúc lợi và giữ chân các nhân sự cấp cao, Công ty đã thực hiện chi 360 triệu đồng để mua bảo hiểm nhân thọ cho 05 người lao động, cụ thể: số tiền 6.000.000 đồng/người/tháng. Hỏi chi phí được trừ khi tính thuế TNDN năm 2024 là bao nhiêu?","c":{"A":"360 triệu đồng.","B":"180 triệu đồng.","C":"60 triệu đồng.","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":6,"q":"Vào ngày 01/01/2023, Công ty ABC có ngành nghề kinh doanh vận tải mua một xe ô tô 5 chỗ với nguyên giá (chưa thuế GTGT): 3.000.000.000 VNĐ. Thời gian trích khấu hao: Doanh nghiệp đăng ký và thực hiện trích khấu hao trong 6 năm. Phương pháp khấu hao: Đường thẳng. Chi phí khấu hao được trừ khi tính thuế TNDN năm 2023 là?","c":{"A":"500 triệu đồng.","B":"266,67 triệu đồng.","C":"250 triệu đồng.","D":"Cả 3 đáp án đều sai."},"t":"Thuế TNDN - Chi phí được trừ","a":"A"},{"n":7,"q":"Vào ngày 01/01/2023, Công ty ABC mua một xe ô tô 5 chỗ phục vụ công tác quản lý (không dùng cho kinh doanh vận tải, du lịch, khách sạn). Nguyên giá (chưa thuế GTGT): 2.500.000.000 VNĐ. Thời gian trích khấu hao: Doanh nghiệp đăng ký và thực hiện trích khấu hao trong 8 năm. Phương pháp khấu hao: Đường thẳng. Chi phí khấu hao được trừ khi tính thuế TNDN năm 2023 là?","c":{"A":"312,5 triệu đồng.","B":"200 triệu đồng.","C":"250 triệu đồng.","D":"Cả 3 đáp án đều sai."},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":8,"q":"Công ty X chuyên về sản xuất phần mềm. Năm 2023, Công ty chi mua bảo hiểm sức khỏe cho người lao động với tổng số tiền là 500 triệu đồng. Công ty X được tính vào chi phí được trừ đối với khoản chi mua bảo hiểm sức khỏe cho người lao động khi xác định thuế thu nhập doanh nghiệp là bao nhiêu? Biết rằng: - Một tháng lương bình quân thực tế thực hiện trong năm 2023 của Công ty X: 3 tỷ đồng. - Tổng số chi có tính chất phúc lợi của Công ty (đã bao gồm khoản chi mua bảo hiểm sức khỏe nêu trên) là: 2,8 tỷ đồng","c":{"A":"500 triệu đồng.","B":"400 triệu đồng.","C":"300 triệu đồng","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"A"},{"n":9,"q":"Công ty Cổ phần Sản xuất ABC có một kho hàng chứa thành phẩm gỗ xuất khẩu. Vào tháng 08/2023, một vụ hỏa hoạn bất ngờ xảy ra (có biên bản xác nhận của cảnh sát phòng cháy chữa cháy) làm hư hỏng lô hàng thành phẩm. Giá trị lô hàng bị thiệt hại: 1.000.000.000 VNĐ. Mức bồi thường từ công ty bảo hiểm: 600.000.000 VNĐ. Trách nhiệm bồi thường của nhân viên trực kho (do lơ là): 50.000.000 VNĐ. Doanh nghiệp được tính vào chi phí được trừ khi xác định thuế thu nhập doanh nghiệp (TNDN) là bao nhiêu?","c":{"A":"350 triệu đồng.","B":"300 triệu đồng.","C":"400 triệu đồng.","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"A"},{"n":10,"q":"Kỳ tính thuế năm 2024, Công ty X có phát sinh mua hàng của công ty có quan hệ liên kết ở Mỹ, bán hàng cho công ty có quan hệ liên kết ở Trung Quốc. Theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết, Công ty X có trách nhiệm kê khai xác định giá giao dịch liên kết nhưng được miễn lập Hồ sơ xác định giá giao dịch liên kết trong trường hợp nào:","c":{"A":"Tổng doanh thu phát sinh của kỳ tính thuế là 55 tỷ đồng và tổng giá trị tất cả các giao dịch liên kết phát sinh trong kỳ tính thuế là 25 tỷ đồng.","B":"Tổng doanh thu phát sinh của kỳ tính thuế là 45 tỷ đồng, giá trị các giao dịch mua hàng của bên liên kết phát sinh trong kỳ tính thuế là 10 tỷ đồng, và giá trị các giao dịch bán hàng cho bên liên kết phát sinh trong kỳ tính thuế là 15 tỷ đồng.","C":"Tổng doanh thu phát sinh của kỳ tính thuế là 45 tỷ đồng, giá trị các giao dịch mua hàng của bên liên kết phát sinh trong kỳ tính thuế là 20 tỷ đồng, và giá trị các giao dịch bán hàng cho bên liên kết phát sinh trong kỳ tính thuế là 15 tỷ đồng.","D":"Không có trường hợp nào"},"t":"Giao dịch liên kết","a":"B"},{"n":11,"q":"Kỳ tính thuế năm 2024, Công ty X có phát sinh giao dịch liên kết với công ty có quan hệ liên kết ở Mỹ, có tổng doanh thu phát sinh của kỳ tính thuế là 40 tỷ đồng và tổng giá trị tất cả các giao dịch liên kết phát sinh trong kỳ tính thuế là 25 tỷ đồng, thì theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết Công ty X có trách nhiệm thực hiện:","c":{"A":"Miễn kê khai xác định giá giao dịch liên kết và không phải lập Hồ sơ xác định giá giao dịch liên kết","B":"Kê khai xác định giá giao dịch liên kết, lập Hồ sơ xác định giá giao dịch liên kết.","C":"Miễn kê khai xác định giá giao dịch liên kết nhưng phải lập Hồ sơ xác định giá giao dịch liên kết.","D":"Kê khai xác định giá giao dịch liên kết nhưng được miễn lập Hồ sơ xác định giá giao dịch liên kết."},"t":"Giao dịch liên kết","a":"D"},{"n":12,"q":"Kỳ tính thuế năm 2024, Công ty A có giao dịch liên kết thuộc trường hợp cơ quan thuế B điều chỉnh tỷ suất lợi nhuận thuần trên doanh thu. Theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết, cơ quan Thuế B thực hiện điều chỉnh với giá trị điều chỉnh là:","c":{"A":"Tứ phân vị thứ nhất của khoảng giá trị giao dịch độc lập chuẩn","B":"Bách phân vị thứ 35 của khoảng giá trị giao dịch độc lập chuẩn","C":"Trung vị của khoảng giá trị giao dịch độc lập chuẩn","D":"Bách phân vị thứ 75 của khoảng giá trị giao dịch độc lập chuẩn"},"t":"Giao dịch liên kết","a":"C"},{"n":13,"q":"Theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết, khoảng giá trị giao dịch độc lập chuẩn là tập hợp các giá trị từ:","c":{"A":"Từ tứ phân vị thứ nhất đến tứ phân vị thứ ba","B":"Từ tứ phân vị thứ hai đến tứ phân vị thứ tư","C":"Từ bách phân vị thứ 35 đến bách phân vị thứ 75","D":"Từ bách phân vị thứ 50 đến bách phân vị thứ 100"},"t":"Giao dịch liên kết","a":"C"},{"n":14,"q":"Kỳ tính thuế năm 2024, Công ty F có giao dịch liên kết, có tổng lợi nhuận thuần từ hoạt động kinh doanh cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay trong kỳ cộng chi phí khấu hao trong kỳ là 400.000.000 đồng, tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ là 150.000.000 đồng. Theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết, phần chi phí lãi vay không được trừ theo quy định tại điểm a khoản 3 Điều 16 Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của kỳ tính thuế năm 2024 được chuyển sang kỳ tính thuế tiếp theo để xử lý của Công ty F là bao nhiêu:","c":{"A":"20.000.000 đồng","B":"30.000.000 đồng","C":"40.000.000 đồng","D":"50.000.000 đồng"},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":15,"q":"Kỳ tính thuế năm 2023, Công ty E có giao dịch liên kết, có tổng lợi nhuận thuần từ hoạt động kinh doanh cộng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay trong kỳ cộng chi phí khấu hao trong kỳ là 500.000.000 đồng, tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ là 180.000.000 đồng. Theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết, tổng chi phí lãi vay sau khi trừ lãi tiền gửi và lãi cho vay phát sinh trong kỳ của Công ty E được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp của kỳ tính thuế năm 2023 không vượt quá bao nhiêu:","c":{"A":"100.000.000 đồng","B":"120.000.000 đồng","C":"150.000.000 đồng","D":"180.000.000 đồng"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":16,"q":"Công ty B là cổ đông lớn nhất về vốn góp của chủ sở hữu và nắm giữ trực tiếp ít nhất bao nhiêu % tổng số cổ phần của Công ty C để Công ty B và Công ty C có quan hệ liên kết với nhau theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết:","c":{"A":"10%","B":"15%","C":"20%","D":"25%"},"t":"Giao dịch liên kết","a":"A"},{"n":17,"q":"Công ty A nắm giữ 100% vốn góp của chủ sở hữu của Công ty B. Theo quy định tại Nghị định số 132/2020/NĐ-CP ngày 05/11/2020 của Chính phủ quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết, Công ty B nắm giữ ít nhất bao nhiêu % vốn góp của chủ sở hữu của Công ty C để Công ty A và Công ty C có quan hệ liên kết với nhau:","c":{"A":"10%","B":"15%","C":"20%","D":"25%"},"t":"Giao dịch liên kết","a":"D"},{"n":18,"q":"Công ty C kê khai thiếu số thuế GTGT kỳ tính thuế quý 2/2024 với số tiền là 60.000.000 đồng, kỳ tính thuế quý 3/2024 với số tiền là 40.000.000 đồng (có phản ánh đầy đủ trên sổ kế toán, hóa đơn, chứng từ hợp pháp). Tháng 10/2025, Đoàn kiểm tra lập biên bản kiểm tra thuế xác định hành vi kê khai sai dẫn đến thiếu số thuế GTGT phải nộp. Công ty C có hai tình tiết tăng nặng là tái phạm và vi phạm nhiều lần. Như vậy Công ty C bị xử phạt như thế nào:","c":{"A":"Phạt tiền 10%, có áp dụng 02 tình tiết tăng nặng, số tiền phạt là 12.000.000 đồng.","B":"Phạt tiền 10%, số tiền phạt là 10.000.000 đồng.","C":"Phạt tiền 20%, có áp dụng 02 tình tiết tăng nặng, số tiền phạt là 24.000.000 đồng.","D":"Phạt tiền 20%, số tiền phạt là 20.000.000 đồng."},"t":"Xử phạt VPHC thuế","a":"D"},{"n":19,"q":"Chọn phương án đúng nhất: Người nộp thuế thuộc trường hợp không tính tiền chậm nộp tiền thuế khi cung ứng hàng hóa, dịch vụ được thanh toán bằng nguồn vốn NSNN, số tiền đơn vị sử dụng NSNN xác nhận phải thanh toán cho NNT theo hợp đồng là vào ngày 19/12/2025; NNT gửi Văn bản đề nghị không tính tiền chậm nộp đến cơ quan thuế vào ngày 24/12/2025 đề nghị không tính tiền chậm nộp đối với khoản tiền thuế GTGT còn nợ của tháng 10/2025 (giả sử số tiền nợ thuế của NNT không vượt quá số tiền NSNN chưa thanh toán), vậy thời gian không tính tiền chậm nộp của NNT được tính từ ngày nào?","c":{"A":"Ngày 19/12/2025","B":"Ngày 24/12/2025","C":"Ngày 20/11/2025","D":""},"t":"Quản lý thuế / Hoàn thuế","a":"A"},{"n":20,"q":"Nhận định nào sau đây là đúng?","c":{"A":"Công ty TNHH Một thành viên do cá nhân là chủ sở hữu, Chủ tịch công ty đồng thời là Giám đốc công ty, trực tiếp điều hành hoạt động sản xuất kinh doanh của công ty. Trong năm 2025 có phát sinh chi trả tiền lương, tiền công cho Chủ tịch kiêm Giám đốc là 240 triệu. Vậy tiền lương của Chủ tịch kiêm Giám đốc công ty sẽ được tính vào chi phí kinh doanh.","B":"Công ty TNHH Một thành viên do cá nhân là chủ sở hữu, Chủ tịch công ty đồng thời là Giám đốc công ty, trực tiếp điều hành hoạt động sản xuất kinh doanh của công ty. Trong năm 2025 có phát sinh chi trả tiền lương, tiền công cho Chủ tịch kiêm Giám đốc là 240 triệu. Vậy tiền lương của Chủ tịch kiêm Giám đốc công ty sẽ không được tính vào chi phí kinh doanh.","C":"Công ty TNHH Một thành viên do cá nhân là chủ sở hữu, Chủ tịch công ty đồng thời là Giám đốc công ty, trực tiếp điều hành hoạt động sản xuất kinh doanh của công ty. Trong năm 2025 có phát sinh chi trả tiền lương, tiền công cho Chủ tịch kiêm Giám đốc là 240 triệu. Vậy tiền lương của Chủ tịch kiêm Giám đốc công ty sẽ được tính vào chi phí kinh doanh nếu quy chế chi tiêu công ty có quy định.","D":""},"t":"Tổng hợp","a":"B"},{"n":21,"q":"Nhận định nào sau đây là đúng?","c":{"A":"Doanh thu bán hàng chỉ được ghi nhận khi doanh nghiệp đã chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu sản phẩm hoặc hàng hóa cho người mua; đã nhận được tiền cho số hàng đã bán từ người mua.","B":"Doanh thu bán hàng chi được ghi nhận khi đồng thời thỏa mãn tất cả (a) Doanh nghiệp đã chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu sản phẩm hoặc hàng hóa cho người mua; (b) Doanh nghiệp không còn nắm giữ quyền quản lý hàng hóa như người sở hữu hàng hóa hoặc quyền kiểm soát hàng hóa; (c) Doanh thu được xác định tương đối chắc chắn; (d) Doanh nghiệp đã thu được hoặc sẽ thu được lợi ích kinh tế từ giao dịch bán hàng;(e) Xác định được chi phí liên quan đến giao dịch bán hàng.","C":"Doanh thu bán hàng chi được ghi nhận khi thỏa mãn điều kiện (a) Doanh nghiệp đã chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu sản phẩm hoặc hàng hóa cho người mua; (b) Doanh nghiệp không còn nắm giữ quyền quản lý hàng hóa như người sở hữu hàng hóa hoặc quyền kiểm soát hàng hóa; (c) Doanh thu được xác định tương đối chắc chắn.","D":""},"t":"Tổng hợp","a":"B"},{"n":22,"q":"Năm tài chính 2026, doanh nghiệp có quỹ lương phải trả cho nhân viên là 1 tỷ đồng. Tính đến ngày 31/12/2026, doanh nghiệp đã chi trả 800 triệu, còn 200 triệu đồng tiền lương tháng 12 dự kiến trả vào năm sau. Đến hết thời hạn nộp hồ sơ quyết toán thuế TNDN năm 2026 (ngày 31/03/2027), doanh nghiệp mới chỉ chi trả thêm được 50 triệu, còn 150 triệu đồng vẫn chưa thanh toán cho nhân viên do khó khăn tài chính và doanh nghiệp không trích lập dự phòng quỹ tiền lương. Kế toán phải ghi nhận chi phí tiền lương cho năm 2026 trên Báo cáo tài chính là bao nhiêu?","c":{"A":"800 triệu đồng.","B":"850 triệu đồng.","C":"1 tỷ đồng.","D":"200 triệu đồng."},"t":"Kế toán","a":"C"},{"n":23,"q":"Phát biểu sau đây là đúng hay sai: Trong năm 2026, doanh nghiệp xuất một số sản phẩm (giá vốn 100 triệu, giá bán chưa thuế 150 triệu) để tặng cho khách hàng nhân dịp khai trương chi nhánh. Về mặt Kế toán, vì đây là quà tặng không thu tiền, kế toán chỉ cần ghi giảm hàng tồn kho và ghi tăng chi phí quản lý (Nợ TK 642 / Có TK 156: 100 triệu), không được ghi nhận doanh thu (TK 511) và không phải kê khai thuế GTGT đầu ra cho số hàng này.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Kế toán","a":"B"},{"n":24,"q":"Theo Thông tư 99/2025/TT-BTC, doanh thu chỉ được ghi nhận khi chắc chắn thu được lợi ích kinh tế, được xác định theo giá trị hợp lý của các khoản được quyền nhận, không phân biệt đã thu tiền hay sẽ thu được tiền, đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Kế toán","a":"A"},{"n":25,"q":"Công ty A chuyên cung cấp suất ăn công nghiệp, trong tháng 10/2024 có thuế GTGT đầu ra 10 triệu đồng, thuế GTGT đầu vào là 60 triệu đồng (trong đó có 2 hóa đơn đầu vào mua cùng ngày của cùng một nhà cung cấp, thanh toán tiền mặt, có số thuế GTGT là 2 triệu đồng). Thuế GTGT phải nộp của Công ty A trong tháng 10/2018 là:","c":{"A":"Còn được khấu trừ chuyển sang kỳ sau 50 triệu đồng","B":"Còn được khấu trừ chuyển sang kỳ sau 48 triệu đồng","C":"Phải nộp thuế GTGT 50 triệu đồng","D":"Phải nộp thuế GTGT 48 triệu đồng"},"t":"Thuế GTGT","a":"B"},{"n":26,"q":"Công ty A bán hàng hóa vào ngày 10/01/2026 nhưng đến ngày 20/01/2026 mới lập hóa đơn điện tử, dù hàng đã giao xong vào ngày 10/01/2026, số lượng hóa đơn xuất là 15 hóa đơn. Theo Nghị định 310/2025/NĐ-CP, hành vi này bị xử phạt như thế nào?","c":{"A":"Phạt cảnh cáo.","B":"Phạt tiền 1.000.000 đồng.","C":"Phạt tiền từ 3.500.000 đồng","D":"Phạt tiền 10.000.000 đồng."},"t":"Hóa đơn","a":"D"},{"n":27,"q":"Ngày 06/12/2024, Công ty X nộp tờ khai QTT TNDN năm 2023 và Tờ khai QTT TNCN năm 2023. Các tờ khai quyết toán TNDN và TNCN nêu trên không phát sinh số thuế phải nộp. Công ty X bị xử phạt VPHC với số tiền phạt là bao nhiêu?","c":{"A":"Cảnh cáo","B":"11.500.000 đồng","C":"23.000.000 đồng","D":"25.300.000 đồng"},"t":"Xử phạt VPHC thuế","a":"C"},{"n":28,"q":"Cá nhân nộp tờ khai QTT TNCN năm 2024 vào ngày 15/6/2025 thì bị xử phạt VPHC với số tiền phạt là bao nhiêu?","c":{"A":"Cảnh cáo","B":"1.750.000 đồng","C":"3.250.000 đồng","D":"5.750.000 đồng"},"t":"Xử phạt VPHC thuế","a":"C"},{"n":29,"q":"Cá nhân nộp tờ khai QTT TNCN năm 2024 vào ngày 22/10/2025 với số tiền phát sinh trên tờ khai là 1.000.000 đồng thì bị xử phạt VPHC với số tiền phạt là bao nhiêu?","c":{"A":"1.000.000 đồng","B":"1.500.000 đồng","C":"2.000.000 đồng","D":"750.000 đồng"},"t":"Xử phạt VPHC thuế","a":"B"},{"n":30,"q":"Công ty A nộp tờ khai QTT TNCN năm 2024 vào ngày 30/11/2025 với số tiền phát sinh trên tờ khai là 25.000.000 đồng. Công ty đã tự giác nộp đủ tiền thuế và tiền chậm nộp trước khi cơ quan thuế lập biên bản thì bị xử phạt VPHC với số tiền phạt là bao nhiêu?","c":{"A":"11.500.000 đồng","B":"6.000.000 đồng","C":"15.000.000 đồng","D":"20.000.000 đồng"},"t":"Xử phạt VPHC thuế","a":"A"},{"n":31,"q":"Công ty A nộp tờ khai QTT TNCN năm 2024 vào ngày 30/11/2025 với số tiền phát sinh trên tờ khai là 6.000.000 đồng. Công ty đã tự giác nộp đủ tiền thuế và tiền chậm nộp trước khi cơ quan thuế lập biên bản thì bị xử phạt VPHC với số tiền phạt là bao nhiêu?","c":{"A":"11.500.000 đồng","B":"6.000.000 đồng","C":"15.000.000 đồng","D":"20.000.000 đồng"},"t":"Xử phạt VPHC thuế"},{"n":32,"q":"Năm 2023, ông A có phát sinh thu nhập từ tiền lương tiền công như sau: -Tổng TNCT tại Công ty X: 300 triệu đồng (có HĐLD trên 3 tháng) - Tổng TNCT tại Công ty Y: 85 triệu đồng (có HĐLD trên 3 tháng) - Tổng TNCT tại Công ty Z: 25 triệu đồng thu nhập vãng lai đã được khấu trừ tại nguồn 10%. Quyết toán thuế năm 2023 Ông A thực hiện QTT như thế nào?","c":{"A":"Được ủy quyền QTT cho Công ty X, tổng thu nhập chịu thuế ủy quyền quyết toán là 300 triệu đồng","B":"Ông A phải tự QTT vối tổng thu nhập chịu thuế là 410 triệu đồng","C":"Ông A phải tự QTT vối tổng thu nhập chịu thuế là 385 triệu đồng","D":"Không phương án nào đúng"},"t":"Thuế TNCN","a":"B"},{"n":33,"q":"Qua kiểm tra phát hiện, Ngày 29/12/2025, Công ty cổ phần HSC 15 khoản chi mua hàng hóa dịch vụ Công ty cổ phần TMS với tổng giá trị hàng hóa chưa bao gồm thuế GTGT là 40 triệu đồng, thuế GTGT là 4 triệu đồng nhưng không có chứng từ thanh toán không dùng tiền mặt. Công ty giải trình do mỗi lần mua hàng hóa có giá trị dưới dưới 5 triệu đồng nêu Công ty được thanh toán bằng tiền mặt. Theo quy định của pháp luật hiện hành, khoản chi này khi tính thuế TNDN:","c":{"A":"Được trừ","B":"Không được trừ","C":"Được trừ 50%","D":"Được trừ tất cả"},"t":"Thuế GTGT","a":"B"},{"n":34,"q":"Qua kiểm tra kỳ tính thuế TNDN năm 2025, Công ty cổ phần HSB có nghiệp vụ kinh tế như sau: Công ty thực hiện đánh giá lại giá trị quyền sử dụng đất có thời hạn với giá trị còn lại trên sổ sách là 2 tỷ, giá trị đánh giá lại là 3,5 tỷ để góp vốn thành lập Công ty cổ phần AHT. Công ty cổ phần AHT được phân bổ dần giá trị đất vào chi phí được trừ. Theo pháp luật về thuế TNDN hiện hành, nội dung nào sau đây phù hợp với nghiệp vụ kinh tế đã phát sinh.","c":{"A":"Công ty HSB phải hạch toán, kê khai khoản thu nhập khác với giá trị 1,5 tỷ.","B":"Công ty HSB phải hạch toán, kê khai khoản chi phí khác với giá trị 2 tỷ.","C":"Công ty HSB phải hạch toán, kê khai doanh thu chuyển nhượng BĐS với giá trị 3,5 tỷ.","D":"Không đáp án nào đúng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":35,"q":"Ngày 03/01/2026, Thuế thành phố ĐN ban hành quyết định kiểm tra tại Công ty TNHH ABC. Sau khi thực hiện công bố quyết định kiểm tra ngày 09/01/2026, Đoàn kiểm tra phát hiện trong thời kỳ được kiểm tra năm 2022, Công ty TNHH ABC có sử dụng, kê khai thuế GTGT đầu vào được khấu trừ và tính vào chi phí được trừ đối với 15 hóa đơn GTGT của Công ty TNHH XYZ có giá trị chưa thuế là 10 tỷ đồng, thuế GTGT là 1 tỷ đồng. 15 hóa đơn GTGT này đã được Công ty TNHH XYZ thông báo phát hành đúng theo quy định. Tuy nhiên tại Biên bản kiểm tra lập 20/01/2026, Đoàn kiểm tra xác định Công ty TNHH XYZ đã bị cơ quan thuế ban thành thông báo không hoạt động tại địa chỉ đăng ký kinh doanh kể từ ngày 01/03/2022 và 15 hóa đơn Công ty TNHH ABC nhận từ Công ty TNHH XYZ có ngày lập từ ngày 01/4/2022 đến 30/7/2022. Đến 20/01/2026 (còn trong thời hạn kiểm tra), Đoàn kiểm tra nhận được kết luận của cơ quan chức năng có thẩm quyền kết luận Công ty TNHH ABC chứng minh được có giao dịch mua bán thực tế, có hợp đồng, chứng từ thanh toán không dùng tiền mặt, hàng hóa đã sử dụng cho hoạt động kinh doanh, lỗi thuộc về bên bán hàng là Công ty TNHH XYZ. Trong trường hợp này, Công ty TNHH ABC sẽ bị xử lý vi phạm hành chính như thế nào?","c":{"A":"Hành vi khai sai","B":"Hành vi trốn thuế","C":"Không bị xử lý vi phạm hành chính vì đã hết thời hiệu","D":"Chuyển hồ sơ sang cơ quan công an theo quy định."},"t":"Thuế GTGT","a":"A"},{"n":36,"q":"Ngày 03/01/2026, Thuế thành phố ĐN ban hành quyết định kiểm tra tại Công ty TNHH ABC. Sau khi thực hiện công bố quyết định kiểm tra ngày 09/01/2026, Đoàn kiểm tra phát hiện trong thời kỳ được kiểm tra năm 2022, Công ty TNHH ABC có sử dụng, kê khai thuế GTGT đầu vào được khấu trừ và tính vào chi phí được trừ đối với 15 hóa đơn GTGT của Công ty TNHH XYZ có giá trị chưa thuế là 10 tỷ đồng, thuế GTGT là 1 tỷ đồng. 15 hóa đơn GTGT này đã được Công ty TNHH XYZ thông báo phát hành đúng theo quy định. Tuy nhiên tại Biên bản kiểm tra lập 20/01/2026, Đoàn kiểm tra xác định Công ty TNHH XYZ đã bị cơ quan thuế ban thành thông báo không hoạt động tại địa chỉ đăng ký kinh doanh kể từ ngày 01/03/2022 và 15 hóa đơn Công ty TNHH ABC nhận từ Công ty TNHH XYZ có ngày lập từ ngày 01/4/2022 đến 30/7/2022. Việc Công ty TNHH ABC sử dụng 15 hóa đơn của Công ty TNHH XYZ dẫn đến thiếu tiền thuế GTGT phải nộp là 30 triệu đồng và thuế TNDN là 50 triệu đồng. Theo quy định hiện hành, Công ty TNHH ABC đã có hành vi vi phạm hành chính nào sau đây?","c":{"A":"Hành vi khai sai","B":"Hành vi trốn thuế","C":"Hành vi vi phạm thủ tục về thuế","D":"Có dấu hiệu tội phạm trốn thuế"},"t":"Thuế GTGT","a":"B"},{"n":37,"q":"Ngày 03/01/2026, Thuế thành phố ĐN ban hành quyết định kiểm tra tại Công ty TNHH ABC. Sau khi thực hiện công bố quyết định kiểm tra ngày 09/01/2026, Đoàn kiểm tra phát hiện trong thời kỳ được kiểm tra năm 2022, Công ty TNHH ABC có sử dụng, kê khai thuế GTGT đầu vào được khấu trừ và tính vào chi phí được trừ đối với 15 hóa đơn GTGT của Công ty TNHH XYZ có giá trị chưa thuế là 10 tỷ đồng, thuế GTGT là 1 tỷ đồng. 15 hóa đơn GTGT này đã được Công ty TNHH XYZ thông báo phát hành đúng theo quy định. Tuy nhiên tại Biên bản kiểm tra lập 20/01/2026, Đoàn kiểm tra xác định Công ty TNHH XYZ đã bị cơ quan thuế ban thành thông báo không hoạt động tại địa chỉ đăng ký kinh doanh kể từ ngày 01/03/2022 và 15 hóa đơn Công ty TNHH ABC nhận từ Công ty TNHH XYZ có ngày lập từ ngày 01/4/2022 đến 30/7/2022. Theo quy định hiện hành, việc Công ty TNHH ABC sử dụng 15 hóa đơn của Công ty TNHH XYZ là hành vi:","c":{"A":"Sử dụng hóa đơn bất hợp pháp","B":"Sử dụng bất hợp pháp hóa đơn","C":"Sử dụng hóa đơn không hợp pháp","D":"Sử dụng không hợp pháp hóa đơn"},"t":"Thuế GTGT","a":"C"},{"n":38,"q":"Công ty A có doanh thu năm 2021 là 180 tỷ đồng, doanh thu năm 2019 là 175 tỷ đồng. Qua kiểm tra kỳ tính thuế năm 2021, Đoàn kiểm tra phát hiện Công ty A kê khai sai dẫn đến thiếu số thuế TNDN năm 2021 phải nộp tăng thêm là 100 triệu đồng. Theo quy định tại Nghị định 92/2021/NĐ-CP, số thuế TNDN tăng thêm này được xử lý như thế nào?","c":{"A":"Truy thu thuế TNDN số tiền 100 triệu đồng.","B":"Công ty A được giảm 30% trên số thuế TNDN tăng thêm, truy thu thuế TNDN số tiền là 70 triệu đồng.","C":"Công ty A được giảm 20% trên số thuế TNDN tăng thêm, truy thu thuế TNDN số tiền là 80 triệu đồng.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":39,"q":"Năm 2026, Công ty ABC đang trong giai đoạn đầu tư dự án xây dựng nhà máy sản xuất linh kiện (ngành, nghề đầu tư kinh doanh có điều kiện). Công ty lập hồ sơ đề nghị hoàn thuế dự án đầu tư với số tiền là 3 tỷ đồng. Tuy nhiên, tại thời điểm nộp hồ sơ hoàn thuế, Dự án đầu tư của Công ty ABC chưa đủ các điều kiện kinh doanh theo quy định của pháp luật (dự án đầu tư này phải được cơ quan nhà nước có thẩm quyền cấp giấy kinh doanh ngành, nghề đầu tư kinh doanh có điều kiện). Cơ quan thuế giải quyết hồ sơ đề nghị hoàn thuế như thế nào?","c":{"A":"Được giải quyết hoàn thuế 3 tỷ đồng, cho bổ sung hồ sơ sau","B":"Được giải quyết hoàn thuế 3 tỷ đồng.","C":"Không được hoàn, không được khấu trừ.","D":"Không được hoàn thuế giá trị gia tăng mà được kết chuyển số thuế chưa được khấu trừ của dự án đầu tư sang kỳ tiếp theo"},"t":"Quản lý thuế / Hoàn thuế","a":"D"},{"n":40,"q":"Năm 2026, Công ty ABC triển khai dự án xây dựng nhà máy sản xuất linh kiện. Công ty lập hồ sơ đề nghị hoàn thuế với số tiền là 2 tỷ đồng. Tuy nhiên, tại thời điểm nộp hồ sơ hoàn thuế, Dự án đầu tư của Công ty ABC chưa góp đủ số vốn điều lệ như đã đăng ký. Cơ quan thuế giải quyết hồ sơ đề nghị hoàn thuế như thế nào?","c":{"A":"Được giải quyết hoàn thuế 2 tỷ đồng, cho bổ sung vốn điều lệ sau","B":"Được giải quyết hoàn thuế 2 tỷ đồng.","C":"Không được hoàn, không được khấu trừ.","D":"Không được hoàn mà được kết chuyển số thuế chưa được khấu trừ của dự án đầu tư sang kỳ tiếp theo"},"t":"Quản lý thuế / Hoàn thuế","a":"D"},{"n":41,"q":"Trong tháng 03/2024, cá nhân B nhận được các khoản thu nhập sau từ công ty: Tiền lương chính: 15.000.000đ. Tiền ăn giữa ca (Phụ cấp ăn trưa): Công ty chi trả bằng tiền mặt là 2.000.000đ/tháng. Xác định số Thu nhập chịu thuế TNCN từ tiền lương, tiền công của cá nhân B trong tháng 03/2024?","c":{"A":"17 triệu đồng.","B":"15 triệu đồng.","C":"16,27 triệu đồng.","D":"15,73 triệu đồng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":42,"q":"Năm 2024, Công ty X nhập khẩu một lô hàng máy móc. Sau khi kiểm tra sau thông quan, cơ quan Hải quan ra quyết định ấn định thuế với số thuế GTGT tăng thêm phải nộp là 200 triệu đồng do trốn thuế; Công ty X đã nộp đủ 200 triệu đồng vào Ngân sách Nhà nước. Số thuế GTGT Công ty đã nộp thêm theo Quyết định ấn định thuế của cơ quan hải quan được khấu trừ là bao nhiêu?","c":{"A":"Không được khấu trừ.","B":"300 triệu đồng.","C":"200 triệu đồng.","D":""},"t":"Thuế nhà thầu / XNK","a":"A"},{"n":43,"q":"Năm 2024, Doanh nghiệp A có các số liệu sau: Lợi nhuận từ hoạt động kinh doanh: 1.000 triệu đồng. Khoản nợ khó đòi thu hồi được: Doanh nghiệp thu lại được 200 triệu đồng từ một khách hàng. Doanh nghiệp đã làm thủ tục xử lý xóa khoản nợ khó đòi này và tính vào chi phí từ các năm trước. Biết thuế suất thuế TNDN là 20%, số thuế TNDN doanh nghiệp A phải nộp trong năm 2024 là bao nhiêu?","c":{"A":"160 triệu đồng.","B":"200 triệu đồng.","C":"240 triệu đồng.","D":"180 triệu đồng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":44,"q":"Công ty A có vốn điều lệ đăng ký 5 tỷ đồng, thực góp 4 tỷ đồng. Công ty vay ngân hàng số tiền 800 triệu với lãi suất 10%/năm, chi phí lãi vay phát sinh năm 2024 là 80 triệu đồng. Hỏi chi phí lãi vay không được trừ năm 2024 tương ứng với phần vốn điều lệ đã đăng ký còn thiếu là bao nhiêu:","c":{"A":"150 triệu đồng.","B":"80 triệu đồng.","C":"50 triệu đồng.","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":45,"q":"Năm 2026, Nhân viên đi công tác, tổng hóa đơn tiền phòng và vé máy bay là 25 triệu đồng. Nhân viên dùng thẻ tín dụng cá nhân để thanh toán, sau đó về công ty thanh toán chuyển khoản cho cá nhân. Quy chế công ty có quy định hình thức này. Hỏi: Khoản chi phí này xử lý như thế nào?","c":{"A":"Được trừ toàn bộ vì có hóa đơn và có quy định tại quy chế.","B":"Bị loại toàn bộ vì không thanh toán từ tài khoản công ty sang tài khoản người bán.","C":"Chỉ được trừ phần thuế GTGT.","D":""},"t":"Tổng hợp","a":"A"},{"n":46,"q":"Năm 2023, Công ty X trích trước chi phí sửa chữa lớn tài sản cố định (máy nén khí) vào chi phí quản lý doanh nghiệp với số tiền là 100.000.000đ. Đến hết ngày 31/12/2023, việc sửa chữa chưa thực hiện. Đến tháng 05/2024, việc sửa chữa mới hoàn thành với hóa đơn thực tế là 90.000.000đ. Khi quyết toán thuế TNDN năm 2023, số tiền 100.000.000đ này được xử lý như thế nào?","c":{"A":"Được tính vào chi phí được trừ năm 2023 vì đã ghi nhận đúng chuẩn mực kế toán.","B":"Không được tính vào chi phí được trừ năm 2023; phải đợi đến năm 2024 khi có hóa đơn thực tế mới được trừ 90.000.000đ.","C":"Chỉ được tính vào chi phí được trừ năm 2023 số tiền 90.000.000đ.","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":47,"q":"Năm 2024, Công ty X nhập khẩu một lô hàng máy móc. Sau khi kiểm tra sau thông quan, cơ quan Hải quan ra quyết định ấn định thuế với số thuế GTGT tăng thêm phải nộp là 300 triệu đồng do áp sai mã hàng hoá, không thuộc trường hợp trốn thuế; Công ty X đã nộp đủ 300 triệu đồng vào Ngân sách Nhà nước. Số thuế GTGT Công ty đã nộp thêm theo Quyết định ấn định thuế của cơ quan hải quan được khấu trừ là bao nhiêu?","c":{"A":"Không được khấu trừ.","B":"300 triệu đồng.","C":"200 triệu đồng.","D":""},"t":"Thuế nhà thầu / XNK","a":"B"},{"n":48,"q":"Công ty X ký hợp đồng lao động với một chuyên gia nước ngoài giữ chức vụ Giám đốc điều hành. Trong hợp đồng quy định Công ty X chịu trách nhiệm chi trả tiền thuê nhà cho chuyên gia này. Tháng 05/2024, công ty có số liệu sau: Tiền thuê nhà trả cho chuyên gia (có hóa đơn GTGT): 20.000.000 đồng. Thuế GTGT đầu vào ghi trên hóa đơn thuê nhà: 2.000.000 đồng. Chuyên gia này hưởng lương và các chế độ tại Việt Nam theo hợp đồng đã ký. Số thuế GTGT đầu vào (2.000.000 đồng) của khoản tiền thuê nhà này được xử lý như thế nào?","c":{"A":"Được khấu trừ toàn bộ vì đây là chi phí phục vụ hoạt động sản xuất kinh doanh.","B":"Được khấu trừ nếu công ty thực hiện thanh toán bằng hình thức chuyển khoản.","C":"Không được khấu trừ thuế GTGT đầu vào.","D":""},"t":"Thuế GTGT","a":"C"},{"n":49,"q":"Doanh nghiệp thuê nhà của cá nhân để làm văn phòng kinh doanh với mức 150 triệu đồng/năm. Để khoản chi phí thuê nhà này được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN, doanh nghiệp cần tối thiểu bộ chứng từ nào sau đây?","c":{"A":"Chỉ cần hợp đồng thuê nhà và chứng từ thanh toán.","B":"Hợp đồng thuê nhà, chứng từ thanh toán và hồ sơ nộp thuế thay cho cá nhân (nếu mức thuê trên 100 triệu đồng/năm và có thỏa thuận nộp thuế thay).","C":"Phải có hóa đơn GTGT do cá nhân tự xuất thì mới được tính vào chi phí.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":50,"q":"Doanh nghiệp thu mua nông sản (gạo, ngô) trực tiếp của nông dân tự trồng bán ra, không có hóa đơn nhưng có lập Bảng kê thu mua hàng hóa, dịch vụ (Mẫu số 01/TNDN). Khoản chi phí mua hàng này được xử lý như thế nào khi xác định thu nhập chịu thuế TNDN?","c":{"A":"Không được tính vào chi phí được trừ vì không có hóa đơn GTGT.","B":"Được tính vào chi phí được trừ nếu có Bảng kê 01/TNDN kèm theo chứng từ thanh toán cho người bán theo đúng quy định.","C":"Chỉ được tính vào chi phí được trừ tối đa 50% giá trị hàng hóa.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":51,"q":"Doanh nghiệp X có phát sinh chi phí khấu hao đối với một số tài sản cố định đang sử dụng cho sản xuất kinh doanh. Tuy nhiên, các tài sản này không được theo dõi, quản lý và hạch toán trong sổ sách kế toán theo quy định tại Thông tư số 96/2015/ TT-BTC. Khoản chi phí khấu hao này được xử lý như thế nào khi xác định thu nhập chịu thuế TNDN?","c":{"A":"Được tính vào chi phí được trừ nếu tài sản đó thực tế có tham gia vào hoạt động kinh doanh.","B":"Được tính vào chi phí được trừ nếu doanh nghiệp có hóa đơn mua tài sản hợp lệ.","C":"Không được tính vào chi phí được trừ.","D":"Được tính vào chi phí được trừ nhưng bị khống chế mức trừ tối đa 50%."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":52,"q":"Doanh nghiệp B có lô hàng thực phẩm bị hư hỏng do thay đổi quá trình sinh hóa tự nhiên và một số sản phẩm đã hết hạn sử dụng. Doanh nghiệp không được bảo hiểm hay tổ chức nào bồi thường. Theo quy định hiện hành, khoản tổn thất này được xử lý như thế nào khi xác định thu nhập chịu thuế TNDN?","c":{"A":"Không được tính vào chi phí được trừ vì đây là tổn thất chủ quan của doanh nghiệp.","B":"Được tính vào chi phí được trừ toàn bộ giá trị tổn thất nếu có đầy đủ hồ sơ theo quy định.","C":"Chỉ được tính vào chi phí được trừ tối đa 50% giá trị lô hàng bị hư hỏng.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":53,"q":"Năm 2023, Công ty A (kê khai theo phương pháp khấu trừ) trong tháng có các số liệu sau: Thuế GTGT đầu vào dùng chung cho các hoạt động: 100 triệu đồng. Doanh thu hàng hóa chịu thuế GTGT: 800 triệu đồng. Doanh thu hàng hóa không chịu thuế GTGT: 200 triệu đồng. Số thuế GTGT đầu vào không được khấu trừ trong tháng là bao nhiêu?","c":{"A":"100 triệu đồng.","B":"80 triệu đồng.","C":"20 triệu đồng.","D":""},"t":"Thuế GTGT","a":"C"},{"n":54,"q":"Trong năm 2024, xưởng may của Công ty A có gom được một đống vải vụn, chỉ thừa (phế liệu) sau khi cắt may. Kế toán đem bán cho đơn vị thu mua đồng nát: Tiền thu về: 5.500.000 đồng (đã bao gồm 10% thuế GTGT). Chi phí thuê xe chở đống phế liệu đi bán: 500.000 đồng (có phiếu chi). Câu hỏi: Khoản Thu nhập khác từ bán phế liệu để tính thuế TNDN là bao nhiêu?","c":{"A":"5 triệu đồng.","B":"4,5 triệu đồng.","C":"4 triệu đồng.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":55,"q":"Công ty cơ khí Y quyết định tạm dừng hoạt động một dây chuyền sản xuất linh kiện trong vòng 10 tháng (từ tháng 1 đến tháng 10 năm 2023) để bảo trì, sữa chửa. Trong thời gian này, kế toán vẫn trích khấu hao đều đặn cho dây chuyền đó. Chi phí khấu hao trong 10 tháng tạm dừng này có được cơ quan thuế chấp nhận là chi phí hợp lý không?","c":{"A":"Được trừ khi tính thuế TNDN.","B":"Không được trừ khi tính thuế TNDN.","C":"","D":""},"t":"Kế toán","a":"A"},{"n":56,"q":"Công ty Dệt may A có hệ thống máy dệt công nghiệp. Theo khuyến nghị của nhà sản xuất, máy cần được thay dầu và kiểm tra định kỳ 6 tháng/lần. Tuy nhiên, bộ phận kỹ thuật đã bỏ qua việc này để tập trung chạy kịp đơn hàng, dẫn đến trục máy bị kẹt, làm rách toàn bộ 5.000 mét vải đang trên dây chuyền. Giá trị lô hàng bị hỏng là 200 triệu đồng. Khoản tổn thất 200 triệu này có được tính vào chi phí được trừ khi quyết toán thuế TNDN không?","c":{"A":"Được trừ khi tính thuế TNDN.","B":"Không được trừ khi tính thuế TNDN.","C":"","D":""},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":57,"q":"Năm 2023, Công ty A chi trang phục cho người lao động bằng tiền: 4 triệu đồng/người, chi bằng hiện vật giá trị 2 triệu đồng/người (có đầy đủ hóa đơn chứng từ). Chi phí được trừ trong chi phí tính thuế TNDN đối với khoản chi trang phục cho người lao động trong năm là bao nhiêu?","c":{"A":"6 triệu đồng/người/năm.","B":"5 triệu đồng/người/năm.","C":"2 triệu đồng/người/năm.","D":"4 triệu đồng/người/năm."},"t":"Thuế TNDN - Chi phí được trừ","a":"A"},{"n":58,"q":"Doanh nghiệp X trong năm tính thuế có tài liệu sau: Doanh thu tiêu thụ sản phẩm: 8.000 triệu đồng. Tổng hợp chi phí phát sinh trong kỳ: 6.000 triệu đồng, trong đó: Chi trả lãi tiền vay vốn tương ứng với phần vốn điều lệ còn thiếu: 300 triệu đồng. Chi đào tạo tay nghề cho công nhân: 200 triệu đồng, các chi phí còn lại được coi là hợp lý. Thuế suất thuế TNDN là 20%. Thuế TNDN doanh nghiệp X phải nộp trong năm:","c":{"A":"400 triệu đồng.","B":"500 triệu đồng.","C":"460 triệu đồng.","D":"440 triệu đồng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":59,"q":"Công ty X có hoạt động xuất khẩu hàng hoá. Ngoài các hồ sơ liên quan đến việc đủ điều kiện áp dụng thuế suất thuế GTGT 0% như: Hợp đồng xuất khẩu, tờ khai hải quan, chứng từ thanh toán không dùng tiền mặt, hoá đơn thương mại, thì theo quy định tại Nghị định 123/2020/NĐ-CP, từ thời điểm nào bắt buộc phải xuất hóa đơn điện tử?","c":{"A":"Từ ngày 01/01/2022.","B":"Từ ngày 01/04/2022.","C":"Từ ngày 01/07/2022.","D":"Từ ngày 01/08/2022"},"t":"Hóa đơn","a":"C"},{"n":60,"q":"Năm 2023, Công ty A mua sản phẩm thủy sản, hải sản chưa qua chế biến thành sản phẩm khác của Công ty B, sau đó bán cho Công ty C thì áp dụng mức thuế suất thuế GTGT như thế nào theo quy định tại Thông tư số 219/2013/TT-BTC ngày 31/12/2013 của Bộ Tài chính?","c":{"A":"5%.","B":"10%.","C":"Không phải kê khai tính thuế GTGT.","D":"Không chịu thuế GTGT."},"t":"Thuế GTGT","a":"C"},{"n":61,"q":"Năm 2023, Công ty A mua sản phẩm thủy sản, hải sản chưa qua chế biến thành sản phẩm khác của Công ty B, sau đó bán cho Cá nhân C thì áp dụng mức thuế suất thuế GTGT như thế nào theo quy định tại Thông tư số 219/2013/TT-BTC ngày 31/12/2013 của Bộ Tài chính?","c":{"A":"Không chịu thuế GTGT.","B":"Không phải kê khai tính thuế GTGT.","C":"5%.","D":"10%."},"t":"Thuế GTGT","a":"C"},{"n":62,"q":"Theo quy định của Luật thuế Giá trị gia tăng số 48/2024/QH15 ngày 26/11/2024, dịch vụ tiêm chủng vắc xin thuộc đối tượng chịu thuế suất thuế GTGT như thế nào?","c":{"A":"5%.","B":"10%.","C":"Không chịu thuế GTGT.","D":"Không phải kê khai tính thuế GTGT."},"t":"Thuế GTGT","a":"C"},{"n":63,"q":"Năm 2023, Cơ sở giáo dục A có khoản thu từ lãi tiền gửi ngân hàng, vậy khoản thu từ lãi tiền gửi ngân hàng được xác định theo quy định tại Thông tư số 78/2014/TT-BTC ngày 18/6/2014 của Bộ Tài chính như thế nào; biết rằng cơ sở giáo dục A kê khai thuế TNDN theo phương pháp trực tiếp trên doanh thu.","c":{"A":"Tỷ lệ thuế TNDN phải nộp 2% trên doanh thu.","B":"Tỷ lệ thuế TNDN phải nộp 5% trên doanh thu.","C":"Không đáp án nào đúng.","D":""},"t":"Thuế GTGT","a":"B"},{"n":64,"q":"Năm 2024, Trường mầm non A có thu tiền ăn, tiền vận chuyển đưa đón học sinh và các khoản thu khác dưới hình thức thu hộ, chi hộ thì khoản thu này được điều chỉnh bởi Thông tư số 219/2013/TT-BTC ngày 31/12/2013 của Bộ Tài chính như thế nào?","c":{"A":"Thuộc đối tượng không chịu thuế GTGT.","B":"Thuộc đối tượng không phải kê khai thuế GTGT.","C":"Thuộc đối tượng chịu thuế GTGT với mức Thuế suất thuế GTGT là 10%.","D":"Thuộc đối tượng chịu thuế GTGT với mức Thuế suất thuế GTGT là 5%."},"t":"Tổng hợp","a":"A"},{"n":65,"q":"Năm 2022, cá nhân X có các nguồn thu nhập sau: Tại Trường ĐH A (nơi cá nhân X có hợp đồng lao động), thu nhập là 500 triệu đồng. Tại Trường ĐH B cá nhân X có thu nhập từ hoạt động dạy thêm là: 100 triệu đồng, đã khấu trừ thuế TNCN: 10 triệu đồng. Tại trường ĐH C cá nhân X có thu nhập từ hoạt động chấm thi là 1 triệu đồng, trường ĐH C không khấu trừ thuế TNCN do khoản thu nhập này dưới 2 triệu đồng. Vậy trong trường hợp này cá nhân X có ủy quyền quyết toán cho trường ĐH A được không và vì sao?","c":{"A":"Thuộc đối tượng ủy quyền quyết toán do có thu nhập vãng lai dưới 120 triệu đồng.","B":"Thuộc đối tượng ủy quyền quyết toán do có thu nhập vãng lai dưới 120 triệu đồng và đã được khấu trừ đủ 10% đối với khoản thu nhập từ 2 triệu đồng trở lên.","C":"Không thuộc đối tượng ủy quyền quyết toán do có thu nhập vãng lai dưới 120 triệu đồng và chưa được khấu trừ đủ 10%.","D":""},"t":"Thuế TNCN","a":"C"},{"n":66,"q":"Theo quy định tại Nghị định số 126/2020/NĐ-CP ngày 19/10/2020 của Chính phủ quy định chi tiết một số điều của luật quản lý thuế, khai thuế GTGT theo quý được áp dụng đối với người nộp thuế giá trị gia tăng có tổng doanh thu bán hàng hóa và cung cấp dịch vụ của năm trước liền kề kể từ bao nhiêu tỷ đồng:","c":{"A":"1 tỷ trở xuống","B":"20 tỷ trở xuống","C":"40 tỷ trở xuống","D":"50 tỷ trở xuống"},"t":"Thuế GTGT","a":"D"},{"n":67,"q":"Công ty B không nộp các phụ lục theo quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết kèm theo hồ sơ quyết toán thuế thu nhập doanh nghiệp kỳ tính thuế năm 2024, Công ty B sẽ bị xử lý:","c":{"A":"Xử phạt hành vi vi phạm về thời hạn nộp hồ sơ khai thuế.","B":"Xử phạt hành vi vi phạm quy định về cung cấp thông tin liên quan đến xác định nghĩa vụ thuế.","C":"Xử phạt hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được miễn, giảm, hoàn","D":"Không bị xử phạt."},"t":"Giao dịch liên kết","a":"A"},{"n":68,"q":"Trường hợp Công ty E cung cấp hồ sơ, tài liệu, hóa đơn, chứng từ, sổ kế toán liên quan đến nghĩa vụ thuế quá thời hạn bao lâu kể từ khi nhận được yêu cầu của Đoàn kiểm tra trong thời gian kiểm tra tại trụ sở Công ty E thì bị xử phạt hành vi vi phạm quy định về chấp hành quyết định kiểm tra, cưỡng chế thi hành quyết định hành chính thuế:","c":{"A":"02 giờ làm việc","B":"06 giờ làm việc","C":"12 giờ làm việc","D":"24 giờ làm việc"},"t":"Kế toán","a":"B"},{"n":69,"q":"Đoàn kiểm tra thuế A lập biên bản kiểm tra có xác định hành vi kê khai sai không dẫn đến thiếu số thuế TNDN phải nộp, chỉ giảm lỗ phát sinh kỳ tính thuế năm dương lịch 2022 với số tiền là 100.000.000 đồng đối với Công ty D vào ngày 01/10/2025. Theo quy định tại Nghị định số 125/2020/NĐ-CP ngày 19/10/2020 của Chính phủ quy định xử phạt vi phạm hành chính về thuế, hóa đơn, Công ty D bị xử phạt:","c":{"A":"Không ra quyết định xử phạt.","B":"Phạt tiền 10%, số tiền phạt là 10.000.000 đồng.","C":"Phạt tiền 20%, số tiền phạt là 20.000.000 đồng.","D":"Phạt tiền 6.500.000 đồng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":70,"q":"Công ty E kê khai thiếu doanh thu năm 2024, dẫn đến thiếu số thuế TNDN phải nộp là 500 triệu đồng (nhưng có phản ánh đầy đủ sổ sách kế toán, hóa đơn chứng từ); tháng 10/2025, Cơ quan thuế phát hiện khi kiểm tra tại trụ sở Công ty E; theo quy định tại Nghị định số 125/2020/NĐ-CP ngày 19/10/2020 của Chính phủ quy định xử phạt vi phạm hành chính về thuế, hóa đơn, Công ty E bị xử phạt:","c":{"A":"Phạt cảnh cáo","B":"Phạt 10% số thuế thiếu","C":"Phạt 20% số thuế thiếu","D":"Phạt 1 lần số thuế thiếu"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":71,"q":"Theo quy định tại Nghị định số 125/2020/NĐ-CP ngày 19/10/2020 của Chính phủ quy định xử phạt vi phạm hành chính về thuế, hóa đơn, quy định “Quá thời hiệu xử phạt vi phạm hành chính về thuế thì người nộp thuế không bị xử phạt nhưng vẫn phải nộp đủ tiền thuế truy thu (số tiền thuế thiếu, số tiền thuế trốn, số tiền thuế được miễn, giảm, hoàn cao hơn quy định, tiền chậm nộp tiền thuế) vào ngân sách nhà nước trong thời hạn mười năm trở về trước, kể từ ngày phát hiện hành vi vi phạm. Trường hợp người nộp thuế không đăng ký thuế thì phải nộp đủ số tiền thuế thiếu, số tiền thuế trốn, tiền chậm nộp tiền thuế cho toàn bộ thời gian trở về trước, kể từ ngày phát hiện hành vi vi phạm” chỉ áp dụng đối với trường hợp:","c":{"A":"Các khoản thuế theo pháp luật về thuế do tổ chức, cá nhân tự khai, tự nộp vào ngân sách nhà nước.","B":"Các khoản thu khác do tổ chức, cá nhân tự khai, tự nộp vào ngân sách nhà nước.","C":"Các khoản thuế theo pháp luật về thuế và khoản thu khác do tổ chức, cá nhân tự khai, tự nộp vào ngân sách nhà nước.","D":"Các khoản thu từ đất đai hoặc khoản thu khác do cơ quan có thẩm quyền xác định nghĩa vụ tài chính của tổ chức, cá nhân."},"t":"Quản lý thuế / Hoàn thuế","a":"C"},{"n":72,"q":"Theo quy định tại Nghị định số 125/2020/NĐ-CP ngày 19/10/2020 của Chính phủ quy định xử phạt vi phạm hành chính về thuế, hóa đơn, quá thời hiệu xử phạt vi phạm hành chính về thuế thì người nộp thuế không bị xử phạt nhưng vẫn phải nộp đủ tiền thuế truy thu (số tiền thuế thiếu, số tiền thuế trốn, số tiền thuế được miễn, giảm, hoàn cao hơn quy định, tiền chậm nộp tiền thuế) vào ngân sách nhà nước trong thời hạn mười năm trở về trước, kể từ ngày phát hiện hành vi vi phạm nhưng không bao gồm trường hợp nào:","c":{"A":"Người nộp thuế đã giải thể đang chờ làm thủ tục chấm dứt hiệu lực mã số thuế.","B":"Người nộp thuế có số thuế nộp thừa.","C":"Người nộp thuế không đăng ký thuế.","D":"Người nộp thuế là cá nhân."},"t":"Quản lý thuế / Hoàn thuế","a":"C"},{"n":73,"q":"Tháng 01/2025, Công ty A bị xử phạt vi phạm hành chính về thuế theo Quyết định số 999/QĐ-DAN của cơ quan Thuế B, thời hạn chấp hành quyết định xử phạt là 10 ngày kể từ ngày nhận được Quyết định. Theo quy định tại Nghị định số 125/2020/ NĐ-CP ngày 19/10/2020 của Chính phủ quy định xử phạt vi phạm hành chính về thuế, hóa đơn, quá thời hạn này, nếu Công ty A không tự nguyện chấp hành sẽ bị cưỡng chế thi hành và cứ mỗi ngày chậm nộp tiền phạt thì Công ty A phải nộp tiền chậm nộp tiền phạt vi phạm hành chính về thuế bao nhiêu % tính trên tổng số tiền phạt chưa nộp:","c":{"A":"0,03%","B":"0,05%","C":"0,07%","D":"0,09%"},"t":"Quản lý thuế / Hoàn thuế","a":"B"},{"n":74,"q":"Tháng 5/2025, Công ty X bị lập biên bản kiểm tra thuế xác định hành vi sử dụng hóa đơn không hợp pháp để khai thuế làm giảm số thuế TNDN phải nộp kỳ tính thuế năm 2024 nhưng Công ty X chứng minh được lỗi vi phạm sử dụng hóa đơn, chứng từ không hợp pháp thuộc về bên bán hàng và Công ty X đã hạch toán kế toán đầy đủ theo quy định. Theo quy định tại Nghị định số 125/2020/NĐ-CP ngày 19/10/2020 của Chính phủ quy định xử phạt vi phạm hành chính về thuế, hóa đơn, Công ty sẽ bị xử phạt:","c":{"A":"Xử phạt hành vi trốn thuế, xử phạt đối với hành vi sử dụng hóa đơn không hợp pháp.","B":"Xử phạt hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp, không xử phạt đối với hành vi sử dụng hóa đơn không hợp pháp.","C":"Không xử phạt hành vi trốn thuế, xử phạt đối với hành vi sử dụng hóa đơn không hợp pháp.","D":"Không xử phạt hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp, xử phạt đối với hành vi sử dụng hóa đơn không hợp pháp."},"t":"Quản lý thuế / Hoàn thuế","a":"B"},{"n":75,"q":"Tháng 10/2025, Đoàn kiểm tra thuộc cơ quan Thuế B phát hiện Công ty E có hành vi kê khai sai dẫn đến thiếu số thuế TNDN phải nộp kỳ tính thuế năm 2023. Tuy nhiên, theo giải trình và tài liệu chứng minh của Công ty E, Đoàn kiểm tra xác định Công ty E thực hiện kê khai theo công văn hướng dẫn của cơ quan Thuế B trả lời cho Công ty E. Theo quy định tại Nghị định số 125/2020/NĐ-CP ngày 19/10/2020 của Chính phủ, Công ty E sẽ bị xử lý (biết rằng, cơ quan Thuế B có thẩm quyền xử phạt vi phạm hành chính đối với Công ty E.:","c":{"A":"Truy thu thuế, xử phạt vi phạm hành chính về thuế, tính tiền chậm nộp tiền thuế.","B":"Truy thu thuế, không xử phạt vi phạm hành chính về thuế, tính tiền chậm nộp tiền thuế.","C":"Truy thu thuế, xử phạt vi phạm hành chính về thuế, không tính tiền chậm nộp tiền thuế.","D":"Truy thu thuế, không xử phạt vi phạm hành chính về thuế, không tính tiền chậm nộp tiền thuế."},"t":"Xử phạt VPHC thuế","a":"D"},{"n":76,"q":"Năm 2023, Công ty A tại Việt nam cho thuê phòng qua Agoda với số tiền: 5 triệu đồng/phòng/đêm với 3 đêm, tiền hoa hồng trả cho trang web Agoda là 2%, Vậy doanh nghiệp A hạch toán doanh thu với số tiền là?","c":{"A":"12 triệu đồng.","B":"15 triệu đồng.","C":"18 triệu đồng.","D":"20 triệu đồng"},"t":"Kế toán","a":"B"},{"n":77,"q":"NNT đăng ký NPT là cháu ruột đang ở nhờ nhà mình (có đăng ký tạm trú) để giảm trừ gia cảnh khi xác định nghĩa vụ thuế TNCN. Vậy trong trường hợp nào việc đăng ký NPT này là đúng?","c":{"A":"Nếu người cháu này dưới độ tuổi lao động, không còn cha, mẹ, anh, chị ruột nuôi dưỡng","B":"Nếu người cháu này trong độ tuổi lao động nhưng bị khuyết tật và có thu nhập bình quân tháng dưới 1 triệu đồng/tháng, không còn cha, mẹ, anh, chị ruột nuôi dưỡng","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"t":"Thuế TNCN","a":"C"},{"n":78,"q":"Công ty TNHH A thuộc Danh sách người nộp thuế được lựa chọn lập kế hoạch kiểm tra tại trụ sở của người nộp thuế năm 2025. Nhưng do năm 2025, Công ty TNHH A bị ảnh hưởng nặng nề do bão số 10 (thuộc trường hợp bất khả kháng do thiên tai, dịch bệnh,...) nên không thực hiện được kế hoạch kiểm tra tại trụ sở người nộp thuế. Sau khi phân tích, đánh giá lại rủi ro. Kết quả đánh giá, nếu rủi ro trung bình và thấp thì báo cáo Lãnh đạo bộ phận kiểm tra thuế trình Thủ trưởng cơ quan thuế điều chỉnh giảm kế hoạch kiểm tra tại trụ sở người nộp thuế?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế","a":"A"},{"n":79,"q":"Công ty A trích trước tiền lương cho năm 2024, đến ngày 31/3/2025 Công ty mới chi hết 70%. Phần còn lại Công ty phải điều chỉnh thế nào?","c":{"A":"Điều chỉnh tăng chi phí được trừ của năm 2024.","B":"Điều chỉnh giảm chi phí được trừ của năm 2024.","C":"Không phải điều chỉnh do đã chi được từ 70% trở lên.","D":"Không có đáp án nào đúng."},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":80,"q":"Từ kỳ tính thuế năm 2025, Doanh nghiệp được thành lập hoạt động theo quy định của pháp luật Việt Nam được trích tối đa bao nhiêu % thu nhập tính thuế hàng năm trước khi tính thuế TNDN để lập quỹ phát triển khoa học và công nghệ của doanh nghiệp:","c":{"A":"5%.","B":"10%.","C":"15%.","D":"20%."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"D"},{"n":81,"q":"Trường hợp doanh nghiệp tư nhân do người vợ đứng tên sử dụng xe ô tô do người chồng đứng tên để kinh doanh, điều kiện để được trích khấu hao vào chi phí được trừ khi tính thuế TNDN là:","c":{"A":"Phải chuyển quyền sở hữu xe ô tô sang tên chủ doanh nghiệp.","B":"Đảm bảo các điều kiện: tài sản phục vụ hoạt động kinh doanh; tài sản được hạch toán trong sổ sách kế toán.","C":"Kết hợp cả A và B.","D":"A và B đều sai"},"t":"Thuế TNDN - Chi phí được trừ","a":"C"},{"n":82,"q":"Trong quá trình kiểm tra tại trụ sở người nộp thuế, nếu nội dung phát hiện qua kiểm tra mà các nội dung này khi ban hành Quyết định xử lý hoặc Kết luận kiểm tra có thể dẫn đến khiếu nại của người nộp thuế về kết quả xử lý thì trưởng đoàn kiểm tra phải làm gì? Chọn câu trả lời đúng nhất.","c":{"A":"Thực hiện như các cuộc kiểm tra thông thường. Khi người nộp thuế có khiếu nại thì báo cáo lãnh đạo bộ phận kiểm tra để xử lý","B":"Trưởng đoàn kiểm tra phải tập hợp hồ sơ, tài liệu có liên quan đến nội dung vướng mắc để báo cáo Lãnh đạo bộ phận kiểm tra.","C":"Trưởng đoàn kiểm tra phải tập hợp hồ sơ, tài liệu có liên quan đến nội dung vướng mắc để làm căn cứ giải quết khi người nộp thuế có khiếu nại","D":"Không có đáp án nào đúng."},"t":"Tổng hợp","a":"B"},{"n":83,"q":"Đối với các hóa đơn đã lập khi bán hàng hóa, dịch vụ trước ngày 01/02/2022 với thuế suất thuế GTGT 10%, sau ngày 01/02/2022 phát sinh các nội dung sai sót cần điều chỉnh về tiền hàng, thuế GTGT hoặc trả lại hàng thì hóa đơn điều chỉnh, hóa đơn trả lại hàng được lập với thuế suất thuế GTGT như thế nào?","c":{"A":"Trường hợp hàng hóa, dịch vụ thuộc đối tượng giảm thuế GTGT theo quy định tại Nghị định 15/2022/NĐ-CP thì khi lập hóa đơn điều chỉnh, hóa đơn trả lại hàng, DN lập với mức thuế suất thuế GTGT 8%.","B":"Doanh nghiệp lập hóa đơn lập hóa đơn điều chỉnh, hóa đơn trả lại hàng, DN lập với mức thuế suất thuế GTGT 10% không phân biệt HHDV có thuộc đối tượng giảm thuế GTGT theo quy định tại Nghị định 15/2022/NĐ-CP hay không.","C":"","D":""},"t":"Thuế GTGT","a":"B"},{"n":84,"q":"Năm 2024, Doanh nghiệp Việt Nam ký hợp đồng với tổ chức ở Singapore để tổ chức ở Singaporethực hiện dịch vụ quảng cáo sản phẩm tại thị trường Singapore và Việt Nam thì có thuộc đối tượng chịu thuế nhà thầu không?","c":{"A":"Doanh nghiệp Việt Nam ký hợp đồng với tổ chức ở Singapore để thực hiện dịch vụ quảng cáo sản phẩm tại thị trường Singapore thì dịch vụ quảng cáo này của tổ chức Singapore không thuộc đối tượng áp dụng của Thông tư số 103/2014/TT-BTC.","B":"Tổ chức ở Singapore thực hiện quảng cáo sản phẩm để tiêu thụ tại thị trường Việt Nam trên internet thì thu nhập từ dịch vụ quảng cáo này thuộc đối tượng áp dụng của Thông tư số 103/2014/TT-BTCC.","C":"Không thuộc đối tượng áp dụng của Thông tư số 103/2014/TT-BTC","D":"Doanh nghiệp Việt Nam ký hợp đồng với tổ chức ở Singapore để thực hiện dịch vụ quảng cáo sản phẩm tại thị trường Singapore thì dịch vụ quảng cáo này của tổ chức Singapore không thuộc đối tượng áp dụng của Thông tư số 103/2014/TT-BTC. Trường hợp tổ chức ở Singapore thực hiện quảng cáo sản phẩm để tiêu thụ tại thị trường Việt Nam trên internet thì thu nhập từ dịch vụ quảng cáo này thuộc đối tượng áp dụng của Thông tư số 103/2014/TT-BTC"},"t":"Thuế nhà thầu / XNK","a":"D"},{"n":85,"q":"Qua kiểm tra phát hiện, Công ty cổ phần HSC có khoản chi tiền phạt vi phạm hợp đồng, Công ty đã tính vào chi phí được trừ khi xác định thu nhập tính thuế. Theo quy định của pháp luật hiện hành, khoản chi này khi tính thuế TNDN:","c":{"A":"Được trừ","B":"Không được trừ","C":"Được trừ 50%","D":"Được trừ nếu Công ty giải trình được lý do hợp"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":86,"q":"Qua kiểm tra phát hiện, Công ty cổ phần HSC có khoản chi tiền phạt vi phạm hành chính đăng ký kinh doanh, Công ty đã tính vào chi phí được trừ khi xác định thu nhập tính thuế. Theo quy định của pháp luật hiện hành, khoản chi này khi tính thuế TNDN:","c":{"A":"Được trừ","B":"Không được trừ","C":"Được trừ 50%","D":"Được trừ nếu Công ty giải trình được lý do hợp lý"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":87,"q":"Qua kiểm tra phát hiện, Công ty cổ phần HSC có khoản chi tiền phạt vi phạm hành chính về thuế và đã tính vào chi phí được trừ khi xác định thu nhập tính thuế. Theo quy định của pháp luật hiện hành, khoản chi này khi tính thuế TNDN:","c":{"A":"Được trừ","B":"Không được trừ","C":"Được trừ 50%","D":"Được trừ nếu Công ty giải trình được lý do hợp lý"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":88,"q":"Qua kiểm tra phát hiện, Công ty cổ phần HSC có khoản chi tiền chậm nộp tiền thuế TNDN và đã tính vào chi phí được trừ khi xác định thu nhập tính thuế. Theo quy định của pháp luật hiện hành, khoản chi này khi tính thuế TNDN:","c":{"A":"Được trừ","B":"Không được trừ","C":"Được trừ 50%","D":"Được trừ nếu Công ty giải trình được lý do hợp lý"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":89,"q":"Qua kiểm tra phát hiện, Công ty cổ phần HSC có khoản chi tiền phạt chậm trả tiền lãi vay theo hợp đồng vay vốn với ngân hàng và đã tính vào chi phí được trừ khi xác định thu nhập tính thuế. Theo quy định của pháp luật hiện hành, khoản chi này khi tính thuế TNDN:","c":{"A":"Được trừ","B":"Không được trừ","C":"Được trừ 50%","D":"Tùy quy định tại hợp đồng"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":90,"q":"Công ty TNHH X là doanh nghiệp tại Việt Nam, được thành lập và hoạt động theo quy định của pháp luật về doanh nghiệp, có dự án đầu tư ra nước ngoài. Trong năm 2025, Công ty TNHH X có khoản lỗ phát sinh từ dự án đầu tư tại nước ngoài. Theo quy định của pháp luật hiện hành, Công ty TNHH X có được bù trừ vào số lỗ và số số lãi phát sinh trong nước của doanh nghiệp khi tính thuế TNDN hay không?","c":{"A":"Có được bù trừ.","B":"Không được bù trừ.","C":"Nếu lãi thì được bù trừ, lỗ thì không được bù trừ.","D":"Nếu lỗ thì được bù trừ, lãi thì không được bù trừ."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":91,"q":"Năm 2021, công ty X có dự án đầu tư mới sản xuất sản phẩm Y và được hưởng ưu đãi về thuế suất 10% trong thời hạn 15 năm. Theo pháp luật thuế TNDN hiện hành, nếu dự án đầu tư này phát sinh doanh thu từ năm 2023 nhưng đến năm 2025 mới phát sinh thu nhập thì thời gian áp dụng thuế suất ưu đãi 10% được tính liên tục từ năm:","c":{"A":"Năm 2021.","B":"Năm 2023.","C":"Năm 2025.","D":"Năm 2026."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":92,"q":"Qua kiểm tra thể hiện trong năm 2025, Công ty khoản thu nhập từ kinh doanh của những năm trước bị bỏ sót phát hiện ra. Đoàn kiểm tra kiến nghị đưa vào thu nhập khác đối với khoản thu nhập này. Theo bạn, Đoàn kiểm tra xác định như vậy là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":93,"q":"Qua kiểm tra thể hiện trong năm 2025, Công ty khoản nợ phải thu khó đòi đã xóa 1 tỷ nhưng nay đã đòi được. Đoàn kiểm tra kiến nghị tính vào thu nhập khác đối với khoản công nợ này. Theo bạn, Đoàn kiểm tra xác định như vậy là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":94,"q":"Công ty TNHH ABC có vốn điều lệ đăng ký là 10 tỷ đồng, Công ty đã góp đủ vốn điều lệ. Trong năm 2025, Công ty có đi vay 2 tỷ đồng của giám đốc là cá nhân điều hành, kiểm soát doanh nghiệp để thực hiện kinh doanh. Đoàn kiểm tra xác định Công ty phải kê khai thông tin về quan hệ liên kết và giao dịch liên kết theo Phụ lục I, Phụ lục II, Phụ lục III ban hành kèm theo Nghị định 132/NĐ-CP ngày 05/11/2020 của Chính phủ và nộp cùng Tờ khai quyết toán thuế thu nhập doanh nghiệp năm 2025. Đoàn kiểm tra xác định như vậy là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Giao dịch liên kết","a":"A"},{"n":95,"q":"Công ty TNHH ABC có vốn điều lệ đăng ký là 10 tỷ đồng, Công ty đã góp đủ vốn điều lệ. Trong năm 2025, Công ty có đi vay 500 triệu đồng của giám đốc là cá nhân điều hành, kiểm soát doanh nghiệp để thực hiện kinh doanh. Đoàn kiểm tra xác định Công ty phải kê khai thông tin về quan hệ liên kết và giao dịch liên kết theo Phụ lục I, Phụ lục II, Phụ lục III ban hành kèm theo Nghị định 132/NĐ-CP ngày 05/11/2020 của Chính phủ và nộp cùng Tờ khai quyết toán thuế thu nhập doanh nghiệp năm 2025. Đoàn kiểm tra xác định như vậy là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Giao dịch liên kết","a":"B"},{"n":96,"q":"Công ty nộp thuế giá trị gia tăng theo phương pháp khấu trừ, qua kiểm tra Đoàn kiểm tra phát hiện vào kỳ thuế GTGT được kiểm tra tháng 01/2023, Công ty có kê khai các hóa đơn mua vào của sản phẩm hàng hóa chịu thuế suất thuế giá trị gia tăng 5% phát sinh trong tháng 12/2022 bị bỏ sót chưa kê khai. Kỳ thuế GTGT tháng 12/2022 đã được Cơ quan Thuế kiểm tra. Do đó, Đoàn kiểm tra đã kiến nghị không chấp nhận khấu trừ thuế GTGT đầu vào của các hóa đơn bị bỏ sót. Như vậy, Đoàn kiểm tra đề xuất xử lý đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế GTGT","a":"A"},{"n":97,"q":"Anh C làm việc tại công ty, ký hợp đồng lao động trên 3 tháng, thu nhập tháng 1/2026 là 18 triệu đồng (chưa trừ bảo hiểm). Công ty tạm tính thuế TNCN theo biểu thuế nào?","c":{"A":"Biểu thuế cũ 7 bậc","B":"Biểu thuế mới 5 bậc (áp dụng từ kỳ tính thuế 2026)","C":"Thuế suất toàn phần 10%","D":"Không tạm tính vì dưới ngưỡng"},"t":"Thuế TNCN","a":"A"},{"n":98,"q":"Một cá nhân có thu nhập từ tiền lương 120 triệu đồng/tháng (sau khi trừ bảo hiểm) trong năm 2026, không người phụ thuộc. Phần thu nhập vượt trên 100 triệu đồng/tháng sẽ chịu thuế suất bao nhiêu theo biểu thuế mới?","c":{"A":"30%","B":"35%","C":"25%","D":"20%"},"t":"Thuế TNCN","a":"B"},{"n":99,"q":"Năm 2026, Chị B có thu nhập từ tiền lương là 22 triệu đồng/tháng (sau khi trừ bảo hiểm), có 1 người phụ thuộc (con nhỏ). Sau khi trừ giảm trừ gia cảnh, chị B thuộc bậc thuế nào theo biểu thuế lũy tiến mới?","c":{"A":"Bậc 5%","B":"Bậc 10%","C":"Bậc 20%","D":"Không thuộc bậc nào vì được miễn"},"t":"Thuế TNCN","a":"A"},{"n":100,"q":"Anh An là cá nhân cư trú, có thu nhập từ tiền lương duy nhất từ Công ty A, không có người phụ thuộc. Mức lương bình quân tháng của năm 2026 là 15 triệu đồng (sau khi trừ các khoản bảo hiểm bắt buộc). Anh An có phải nộp thuế TNCN không?","c":{"A":"Được trừ toàn bộ","B":"Không được trừ vì phải thanh toán không dùng tiền mặt","C":"Chỉ trừ 80%","D":"Phụ thuộc vào ngành nghề"},"t":"Thuế TNCN","a":"B"},{"n":101,"q":"Công ty khai thác tài nguyên quý hiếm (bao gồm: bạch kim, vàng, bạc, thiếc, wonfram, antimoan, đá quý, đất hiếm và tài nguyên quý hiếm khác theo quy định của pháp luật) có thu nhập từ hoạt động khai thác. Theo Luật Thuế TNDN 2025, mức thuế suất áp dụng cho thu nhập này là?","c":{"A":"15%","B":"20%","C":"50%","D":"Miễn thuế"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":102,"q":"Năm 2025, công ty sản xuất phần mềm A chi 800 triệu đồng quảng cáo trên Google và Facebook (có hóa đơn, chứng từ hợp lệ). Chi phí này có được tính vào chi phí được trừ khi tính thuế TNDN không?","c":{"A":"Không được trừ","B":"Được trừ 800 triệu đồng","C":"Chỉ được trừ 50%","D":"Chỉ được trừ nếu quảng cáo trong nước"},"t":"Thuế TNDN - Chi phí được trừ","a":"B"},{"n":103,"q":"Công ty TNHH ABC là doanh nghiệp sản xuất thông thường, không thuộc trường hợp ưu đãi thuế, không thuộc lĩnh vực khai thác tài nguyên, có doanh thu năm 2024 là 45 tỷ đồng, năm 2025 là 55 tỷ đồng. Theo Luật Thuế TNDN 2025, mức thuế suất áp dụng cho công ty này là bao nhiêu? Biết rằng: Công ty đáp ứng đủ điều kiện áp dụng ưu đãi thuế theo Điều 18 Luật thuế TNDN năm 2025.","c":{"A":"15%","B":"17%","C":"20%","D":"32%"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":104,"q":"Công ty TNHH ABC là doanh nghiệp sản xuất thông thường, không thuộc trường hợp ưu đãi thuế, không thuộc lĩnh vực khai thác tài nguyên, có doanh thu năm 2024 là 3 tỷ đồng, năm 2025 là 5 tỷ đồng. Theo Luật Thuế TNDN 2025, mức thuế suất áp dụng cho công ty này là bao nhiêu? Biết rằng: Công ty đáp ứng đủ điều kiện theo Điều 18 Luật thuế TNDN năm 2025.","c":{"A":"15%","B":"17%","C":"20%","D":"32%"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":105,"q":"Công ty TNHH ABC là doanh nghiệp sản xuất thông thường, không thuộc trường hợp ưu đãi thuế, không thuộc lĩnh vực khai thác tài nguyên, có doanh thu năm 2025 là 180 tỷ đồng. Theo Luật Thuế TNDN 2025, mức thuế suất áp dụng cho công ty này là bao nhiêu?","c":{"A":"15%","B":"17%","C":"20%","D":"32%"},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":106,"q":"Doanh nghiệp A chỉ sản xuất hàng hóa chịu thuế suất thuế giá trị gia tăng 5% có số thuế giá trị gia tăng đầu vào chưa được khấu trừ hết liên tục từ quý 1/2026 đến quý 4/2026 với số tiền luỹ kế là 250 triệu đồng. Theo quy định tại Nghị định 181/2025/ NĐ-CP, doanh nghiệp A được giải quyết hoàn?","c":{"A":"Được hoàn 250 triệu đồng","B":"Không được hoàn vì dưới 300 triệu đồng","C":"Được hoàn nếu chứng minh được xuất khẩu","D":"Được hoàn 200 triệu đồng"},"t":"Thuế GTGT","a":"B"},{"n":107,"q":"Doanh nghiệp có hoá đơn đầu vào từ nhà cung cấp nước ngoài, chứng từ nộp thuế thay cho bên nước ngoài; Theo Thông tư số 69/2025/TT-BTC cần đáp ứng điều kiện nào để được khấu trừ?","c":{"A":"Không cần chứng từ, chỉ cần hợp đồng","B":"Phải có chứng từ nộp thuế giá trị gia tăng thay cho phía nước ngoài","C":"Chỉ cấn hoá đơn","D":"Không được khấu trừ"},"t":"Thuế GTGT","a":"B"},{"n":108,"q":"Công ty A vừa có hàng hóa, dịch vụ xuất khẩu, vừa có hàng hoá, dịch vụ bán trong nước nếu không hạch toán riêng được thuế GTGT đầu vào phục vụ cho xuất khẩu và nội địa, theo Thông tư số 69/2025/TT-BTC cách xác định số thuế GTGT đầu vào được khấu trừ được hoàn là:","c":{"A":"Không được khấu trừ/ hoàn","B":"Phân bổ theo tỷ lệ doanh thu xuất khẩu","C":"Áp dụng hoàn toàn bộ","D":"Chuyển hết sang thuế suất 5%"},"t":"Thuế GTGT","a":"B"},{"n":109,"q":"Công ty F kinh doanh thương mại, mua bán mặt hàng chịu thuế suất thuế GTGT 5%, có số thuế giá trị gia tăng đầu vào chưa được khấu trừ hết liên tục từ kỳ quý 1/2026 đến quý 4/2026 với số tiền luỹ kế là 350 triệu đồng. Công ty có được hoàn thuế GTGT theo Nghị định 181/2025/NĐ-CP?","c":{"A":"Không được hoàn thuế GTGT","B":"Được hoàn thuế GTGT số tiền 350 triệu đồng","C":"Được hoàn thuế GTGT số tiền 300 triệu đồng","D":""},"t":"Thuế GTGT","a":"A"},{"n":110,"q":"Công ty F chỉ sản xuất mặt hàng chịu thuế suất thuế GTGT 5%, có số thuế giá trị gia tăng đầu vào chưa được khấu trừ hết liên tục từ kỳ quý 1/2026 đến quý 4/2026 với số tiền luỹ kế là 350 triệu đồng. Công ty có được hoàn thuế theo Nghị định 181/2025/NĐ-CP?","c":{"A":"Không được hoàn","B":"Được hoàn 350 triệu đồng","C":"Được hoàn 300 triệu đồng","D":""},"t":"Thuế GTGT","a":"B"},{"n":111,"q":"Doanh nghiệp E sản xuất và bán phân bón cho nông dân với số tiền 48 triệu đồng (đã bao gồm thuế). Theo Nghị định 181/2025/NĐ-CP, mức thuế suất GTGT áp dụng là?","c":{"A":"0%","B":"5%","C":"10%","D":"Không chịu thuế"},"t":"Thuế GTGT","a":"B"},{"n":112,"q":"Công ty D cung cấp dịch vụ sửa chữa tàu bay cho hãng hàng không nước ngoài, thực hiện tại khu vực cảng hàng không quốc tế Đà Nẵng. Theo Nghị định 181/2025/NĐ-CP thì thuế suất thuế GTGT áp dụng cho dịch vụ này là?","c":{"A":"10%","B":"5%","C":"0%","D":"Không chịu thuế"},"t":"Thuế GTGT","a":"C"},{"n":113,"q":"Doanh nghiệp A có doanh thu năm 2020 là 180 tỷ đồng. Xác định Doanh nghiệp A có được giảm thuế TNDN năm 2020 theo quy định tại Nghị định 114/2020/NĐ-CP không ?","c":{"A":"Được giảm 30% số thuế TNDN phải nộp năm 2020.","B":"Không được giảm số thuế TNDN phải nộp năm 2020.","C":"Được giảm 20% số thuế TNDN phải nộp năm 2020.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":114,"q":"Công ty C là doanh nghiệp trực tiếp đánh bắt thủy sản, bán tôm nguyên con (chưa qua chế biến) cho hợp tác xã với giá 12 triệu đồng. Theo Nghị định 181/2025/NĐ-CP (đã được sửa đổi bổ sung tại Nghị định 359/2025/NĐ-CP). Sản phẩm do Công ty C bán ra thuộc đối tượng?","c":{"A":"Chịu thuế GTGT 5%","B":"Chịu thuế GTGT 8%","C":"Chịu thuế GTGT 10%","D":"Không chịu thuế GTGT"},"t":"Tổng hợp","a":"D"},{"n":115,"q":"Tháng 9/2025, Công ty B xuất khẩu lô hàng cà phê rang xay sang Nhật Bản, Công ty B thuê Công ty C cung cấp dịch vụ vận tải hàng hoá xuất khẩu, theo đó hợp đồng vận tải quốc tế bao gồm cả chặng nội địa. Theo Nghị định 181, thuế suất GTGT áp dụng cho dịch vụ vận tải này là bao nhiêu?","c":{"A":"10%","B":"5%","C":"0%","D":"Không chịu thuế"},"t":"Thuế GTGT","a":"C"},{"n":116,"q":"Công ty A mua nguyên vật liệu trị giá 8 triệu đồng (đã bao gồm thuế GTGT) từ nhà cung cấp bằng tiền mặt vào tháng 8/2025. Theo Nghị định 181/2025/NĐ-CP, công ty A có được khấu trừ thuế GTGT đầu vào của hóa đơn này không?","c":{"A":"Được khấu trừ.","B":"Không được khấu trừ.","C":"Được khấu trừ nếu có giấy xác nhận của nhà cung cấp.","D":""},"t":"Thuế GTGT","a":"B"},{"n":117,"q":"Công ty ký hợp đồng lao động 12 tháng với người lao động, nhưng người lao động làm việc dưới 3 tháng thì nghỉ. Vậy trường hợp này khấu trừ thuế TNCN như thế nào?","c":{"A":"Khấu trừ 10%.","B":"Khấu trừ theo biểu lũy tiến từng phần.","C":"Không khấu trừ thuế TNCN.","D":""},"t":"Thuế TNCN","a":"B"},{"n":118,"q":"Trong năm 2023 công ty có hoạt động cho thuê tài sản, bên thuê trả tiền trước cho nhiều năm thì doanh thu để tính thu nhập chịu thuế TNDN được xác định như thế nào?","c":{"A":"Là số tiền cho thuê tài sản của từng năm được xác định bằng (=) số tiền trả trước chia (:) số năm trả tiền trước.","B":"Là toàn bộ số tiền cho thuê tài sản của số năm trả tiền trước.","C":"Lựa chọn 1 trong 2 phương án trên.","D":"Cả 02 phương án trên đều sai."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"C"},{"n":119,"q":"Thời điểm xác định doanh thu tính thuế TNDN đối với hoạt động bán hàng hóa là:","c":{"A":"Thời điểm xuất kho hàng hóa.","B":"Thời điểm doanh nghiệp thu đủ tiền từ các hoạt động kinh doanh.","C":"Thời điểm giao đủ hàng hóa theo hợp đồng thương mại.","D":"Thời điểm chuyển giao quyền sử dụng hoặc chuyển giao quyền sở hữu hàng hóa."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"D"},{"n":120,"q":"Khoản chi nào sau đây không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN:","c":{"A":"Tiền lương, tiền công của chủ doanh nghiệp tư nhân; Tiền lương, tiền công của chủ công ty TNHH 1 thành viên (do 1 cá nhân làm chủ).","B":"Tiền lương trả cho các thành viên của hội đồng quản trị trực tiếp tham gia điều hành sản xuất, kinh doanh hàng hóa, dịch vụ.","C":"Cả hai khoản chi (a) và (b) nêu trên","D":"Không có đáp án đúng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":121,"q":"Kết quả kiểm tra trên biên bản kiểm tra có thể không thống nhất với số liệu và tình hình của biên bản xác nhận số liệu của thành viên đoàn kiểm tra không?","c":{"A":"Không. Số liệu trên biên bản kiểm tra phải thống nhất với biên bản xác nhận số liệu của các thành viên đoàn kiểm tra.","B":"Có. Nếu kết quả tại biên bản kiểm tra không thống nhất với số liệu và tình hình của biên bản xác nhận số liệu của thành viên đoàn kiểm tra thì Trưởng đoàn kiểm tra có quyền quyết định và chịu trách nhiệm về nội dung biên bản kiểm tra. Trong trường hợp này, thành viên trong đoàn kiểm tra có quyền bảo lưu số liệu theo biên bản từng phần việc được giao.","C":"","D":""},"t":"Tổng hợp","a":"B"},{"n":122,"q":"Doanh nghiệp A có doanh thu năm 2019 là 180 tỷ đồng, năm 2021 là 175 tỷ đồng. Doanh nghiệp B có doanh thu năm 2019 là 150 tỷ đồng, năm 2021 là 165 tỷ đồng. Xác định DN được giảm thuế TNDN năm 2021 theo quy định tại Nghị định 92/2021/NĐ-CP","c":{"A":"Doanh nghiệp A","B":"Doanh nghiệp","C":"Cả hai doanh nghiệp.","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"A"},{"n":123,"q":"Trường hợp phía nước ngoài (bên nhập khẩu) ủy quyền cho bên thứ ba là tổ chức, cá nhân ở nước ngoài thực hiện thanh toán; bên thứ ba yêu cầu tổ chức ở Việt Nam (bên thứ tư) thanh toán bù trừ công nợ với bên thứ ba bằng việc thực hiện thanh toán qua ngân hàng số tiền bên nhập khẩu phải thanh toán cho cơ sở kinh doanh Việt Nam xuất khẩu thì cơ sở kinh doanh xuất khẩu phải có đủ các điều kiện, hồ sơ như thế nào theo quy định tại Thông tư số 219/2013/TT-BTC ngày 31/12/2013 của Bộ Tài chính:","c":{"A":"Hợp đồng xuất khẩu (phụ lục hợp đồng hoặc văn bản điều chỉnh hợp đồng - nếu có) quy định việc ủy quyền thanh toán, bù trừ công nợ giữa các bên.","B":"Chứng từ thanh toán là giấy báo có của ngân hàng về số tiền cơ sở kinh doanh Việt Nam xuất khẩu nhận được từ tài khoản của bên thứ tư.","C":"Bản đối chiếu công nợ có xác nhận của các bên liên quan (giữa cơ sở kinh doanh xuất khẩu với bên nhập khẩu, giữa bên thứ ba ở nước ngoài với bên thứ tư là tổ chức ở Việt Nam).","D":"Cả 3 phương án trên."},"t":"Tổng hợp","a":"D"},{"n":124,"q":"Trong quá trình kiểm tra hồ sơ hoàn thuế thuộc diện kiểm tra trước hoàn, nếu cơ quan thuế xác định vừa có số thuế đủ điều kiện được hoàn vừa có số thuế cần kiểm tra xác minh thì:","c":{"A":"Giải quyết hoàn trả số thuế đã đủ điều kiện hoàn cho người nộp thuế, không chờ kết quả kiểm tra xác minh toàn bộ hồ sơ hoàn thuế;","B":"Chờ kết quả kiểm tra xác minh toàn bộ hồ sơ hoàn thuế để giải quyết hoàn trả số thuế đề nghị hoàn.","C":"Cả 2 phương án trên.","D":""},"t":"Quản lý thuế / Hoàn thuế","a":"A"},{"n":125,"q":"Doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN đối với khoản chi phí nào dưới đây.","c":{"A":"Lỗ chênh lệch tỷ giá hối đoái do đánh giá lại các khoản nợ phải thu có gốc ngoại tệ cuối kỳ tính thuế.","B":"Lỗ chênh lệch tỷ giá hối đoái do đánh giá lại các khoản nợ phải trả có gốc ngoại tệ cuối kỳ tính thuế.","C":"Lỗ chênh lệch tỷ giá hối đoái do đánh giá lại các khoản tiền mặt, tiền gửi, tiền đang chuyển có gốc ngoại tệ cuối kỳ tính thuế.","D":"Cả ba (03) khoản chi phí nêu trên."},"t":"Thuế TNDN - Thu nhập / Ưu đãi","a":"B"},{"n":126,"q":"Theo Nghị định số 123/2020/NĐ-CP ngày 19/10/2020 của Chính phủ, thời điểm lập hóa đơn đối với các cửa hàng bán lẻ xăng dầu cho khách hàng","c":{"A":"Thời điểm gửi hóa đơn cấp mã.","B":"Thời điểm ký số.","C":"Thời điểm kết thúc việc bán
