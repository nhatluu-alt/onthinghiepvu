iệp sẽ được giảm trừ tiếp vào thu nhập chịu thuế tndn của các năm tiếp sau.","B":"Doanh nghiệp sẽ không được giảm trừ tiếp vào thu nhập chịu thuế tndn của các năm tiếp sau.","C":"Số lỗ chưa được bù trừ hết sẽ được cộng vào số lỗ của các năm sau để được chuyển lỗ tiếp tục.","D":"Số lỗ chưa được bù trừ hết sẽ được tính vào chi phí năm sau."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":980,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp, tổ chức, đơn vị sự nghiệp không được hạch toán các khoản chi từ Quỹ phát triển khoa học và công nghệ vào chi phí được trừ khi xác định thu nhập chịu thuế trong kỳ tính thuế. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":981,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp sau khi quyết toán thuế mà bị lỗ thì được chuyển lỗ:","c":{"A":"Trong thời hạn 5 năm, kể từ năm tiếp sau năm phát sinh lỗ.","B":"Trong thời hạn 6 năm, kể từ năm tiếp sau năm phát sinh lỗ.","C":"Trong thời hạn 7 năm, kể từ năm tiếp sau năm phát sinh lỗ.","D":"Không giới hạn thời gian chuyển lỗ."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":982,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế đối với khoản chi nào dưới đây:","c":{"A":"Khoản tài trợ cho giáo dục, y tế, văn hóa, phòng, chống, khắc phục hậu quả thiên tai, dịch bệnh, làm nhà đại đoàn kết, nhà tình nghĩa, nhà cho các đối tượng chính sách theo quy định của pháp luật.","B":"Chi ủng hộ địa phương; chi ủng hộ các đoàn thể, tổ chức xã hội ngoài doanh nghiệp.","C":"Chi phí mua thẻ hội viên sân golf, chi phí chơi golf.","D":"Chi phí xem bóng đá tại nước ngoài."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":983,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế đối với khoản chi nào dưới đây:","c":{"A":"Thuế tiêu thụ đặc biệt.","B":"Thuế xuất nhập khẩu.","C":"Thuế thu nhập doanh nghiệp.","D":"Thuế Tài nguyên và phí BVMT."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":984,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế đối với khoản chi nào dưới đây:","c":{"A":"Thuế GTGT đầu vào đã được khấu trừ hoặc hoàn.","B":"Thuế thu nhập doanh nghiệp.","C":"Thuế GTGT đầu vào không được khấu trừ hoặc hoàn.","D":"Thuế GTGT đầu ra."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":985,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp được tính vào chi phí khoản chi nào dưới đây khi có đầy đủ hoá đơn chứng từ.","c":{"A":"Phần trả lãi tiền vay vốn sản xuất kinh doanh của đối tượng không phải là tổ chức tín dụng hoặc tổ chức kinh tế vượt quá 150% mức lãi suất cơ bản do ngân hàng nhà nước việt nam công bố tại thời điểm vay.","B":"Chi trả lãi tiền vay để góp vốn điều lệ hoặc chi trả lãi tiền vay tương ứng với phần vốn điều lệ đã đăng ký còn thiếu.","C":"Chi trả lãi tiền vay vốn sxkd của tổ chức tín dụng khi đã góp đủ vốn điều lệ.","D":"Chi trả lãi tiền vay vốn mua bất động sản của cá nhân khác."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":986,"q":"Theo Luật thuế TNDN hiện hành, Khoản chi nào sau đây không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế:","c":{"A":"Tiền lương, tiền công của chủ doanh nghiệp tư nhân; tiền lương, tiền công của chủ công ty tnhh 1 thành viên (do một cá nhân làm chủ).","B":"Tiền lương trả cho các thành viên của hội đồng quản trị trực tiếp tham gia điều hành sản xuất, kinh doanh hàng hoá, dịch vụ.","C":"Tiền lương, tiền công của chủ công ty tnhh 2 thành viên trở lên.","D":"Tiền lương, tiền công của giám đốc được thuê điều hành sản xuất, kinh doanh hàng hoá, dịch vụ."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":987,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp được tính vào chi phí được trừ các khoản tiền thưởng cho người lao động được ghi cụ thể điều kiện được hưởng và mức được hưởng tại:","c":{"A":"Hợp đồng lao động; thoả ước lao động tập thể:","B":"Quy chế tài chính của công ty, tổng công ty, tập đoàn;","C":"Quy chế thưởng do chủ tịch hội đồng quản trị, tổng giám đốc, giám đốc quy định theo quy chế tài chính của công ty, tổng công ty:","D":"Hợp đồng lao động; Thỏa ước lao động tập thể; Quy chế tài chính của Công ty, Tổng công ty, Tập đoàn; Quy chế thưởng do Chủ tịch Hội đồng quản trị, Tổng giám đốc, Giám đốc quy định theo quy chế tài chính của Công ty, Tổng công ty."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":988,"q":"Theo Luật thuế TNDN hiện hành, Giá trị quyền sử dụng đất có thời hạn nếu có đầy đủ hoá đơn chứng từ và thực hiện đúng các thủ tục theo quy định của pháp luật, có tham gia vào hoạt động sản xuất kinh doanh thì được:","c":{"A":"Tính vào chi phí được trừ","B":"Không tính vào chi phí được trừ","C":"Phân bổ dần vào chi phí được trừ theo thời hạn được phép sử dụng đất theo quy định","D":"Trích khấu hao TSCĐ theo quy định."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":989,"q":"Theo Luật thuế TNDN hiện hành, trong giai đoạn đầu tư, doanh nghiệp phát sinh cả khoản chi trả lãi tiền vay và thu từ lãi tiền gửi việc hạch toán các khoản thu từ lãi tiền gửi và các khoản chi trả lãi tiền vay theo quy định được thực hiện theo phương án nào dưới đây:","c":{"A":"Được bù trừ giữa khoản chi trả lãi tiền vay và thu từ lãi tiền gửi, sau khi bù trừ phần chênh lệch còn lại ghi giảm giá trị đầu tư.","B":"Được bù trừ giữa khoản chi trả lãi tiền vay và thu từ lãi tiền gửi, nếu thu lớn hơn chi thì phần chênh lệch được tính vào thu nhập khác, nếu chi lớn hơn thu thì phần chênh lệch tính giảm trừ vào thu nhập khác.","C":"Khoản thu từ lãi tiền gửi hạch toán vào doanh thu hoạt động sản xuất kinh doanh trong kỳ tính thuế; khoản chi trả lãi tiền vay hạch toán vào chi phí được trừ khi xác định thu nhập chịu thuế.","D":"Được bù trừ giữa khoản chi trả lãi tiền vay và thu từ lãi tiền gửi, nếu thu lớn hơn chi thì phần chênh lệch được tính vào thu nhập khác, nếu chi lớn hơn thu thì phần chênh lệch tính tính vào chi phí khác."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":990,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế Thu nhập doanh nghiệp đối với khoản chi nào dưới đây:","c":{"A":"Các khoản đã được chi từ quỹ phát triển khoa học và công nghệ của dn.","B":"Các khoản chi không tương ứng với doanh thu tính thuế.","C":"Các khoản tiền phạt về vi phạm hành chính theo quy định của pháp luật.","D":"Khoản thuế Thu nhập cá nhân của người lao động DN nộp thay trong trường hợp DN ký hợp đồng lao động quy định tiền lương, tiền công trả cho người lao động không bao gồm thuế TNCN."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":991,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế Thu nhập doanh nghiệp đối với khoản chi nào dưới đây:","c":{"A":"Khoản trích nộp quỹ bảo hiểm xã hội, bảo hiểm y tế theo mức quy định.","B":"Khoản chi tài trợ cho giáo dục theo quy định.","C":"Các khoản chi về đầu tư xây dựng cơ bản trong giai đoạn đầu tư để hình thành tài sản cố định.","D":"Chi tài trợ cho việc khắc phục hậu quả thiên tai đúng đối tượng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":992,"q":"Theo Luật thuế TNDN hiện hành, phần chi trang phục bằng bằng tiền cho người lao động của doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN:","c":{"A":"Không vượt quá 5.000.000 đồng/người/ năm","B":"Không vượt quá 6.000.000 đồng/người/ năm","C":"Không vượt quá 8.000.000 đồng/người/ năm","D":"Không vượt quá 10.000.000 đồng/người/ năm"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":993,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp có chi phí liên quan đến phần giá trị tổn thất do thiên tai, dịch bệnh, hỏa hoạn và trường hợp bất khả kháng khác thì khoản chi này được tính vào chi phí được trừ khi xác định thu nhập chịu thuế khi:","c":{"A":"Đã được doanh nghiệp bảo hiểm hoặc tổ chức, cá nhân khác phải bồi thường theo quy định của pháp luật.","B":"Đã được doanh nghiệp bảo hiểm bồi thường.","C":"Đã được cá nhân chịu trách nhiệm bồi thường.","D":"Không được bồi thường."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":994,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp có chuyển nhượng, thanh lý xe ô tô chở người từ 9 chỗ ngồi trở xuống có nguyên giá trên 1,6 tỷ đồng thì giá trị còn lại của xe được xác định bằng:","c":{"A":"Nguyên giá thực mua tài sản cố định trừ (-) số khấu hao lũy kế của tài sản cố định đã tính vào chi phí hợp lý theo chuẩn mực kế toán, chế độ kế toán tính đến thời điểm chuyển nhượng, thanh lý xe.","B":"nguyên giá thực mua tài sản cố định trừ (-) số khấu hao lũy kế của tài sản cố định đã tính vào chi phí hợp lý theo theo chính sách thuế tính đến thời điểm chuyển nhượng, thanh lý xe.","C":"nguyên giá xác định 1,6 tỷ trừ (-) số khấu hao lũy kế của tài sản cố định đã tính vào chi phí hợp lý theo chuẩn mực kế toán, chế độ kế toán tính đến thời điểm chuyển nhượng, thanh lý xe..","D":"nguyên giá xác định 1,6 tỷ trừ (-) số khấu hao lũy kế của tài sản cố định đã tính vào chi phí hợp lý theo theo chính sách thuế tính đến thời điểm chuyển nhượng, thanh lý xe."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":995,"q":"Theo Luật thuế TNDN hiện hành, Khoản chi nào dưới đây không được trừ khi xác định thu nhập chịu thuế TNDN:","c":{"A":"Chi mua bảo hiểm y tế, bhxh theo quy định của pháp luật cho người lao động.","B":"Phần chi phí quản lý kinh doanh do doanh nghiệp nước ngoài phân bổ cho cơ sở thường trú tại việt nam theo quy định của pháp luật việt nam.","C":"Chi lãi tiền vay vốn tương ứng với vốn điều lệ còn thiếu.","D":"Chi tài trợ cho giáo dục, y tế, khắc phục hậu quả thiên tai và làm nhà tình nghĩa cho người nghèo theo quy định của pháp luật."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":996,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp được tính vào chi phí được trừ hàng hoá bị hư hỏng:","c":{"A":"Hàng hóa bị hư hỏng do hết hạn sử dụng.","B":"Không được bồi thường.","C":"Hàng hóa bị hư hỏng do thay đổi quá trình sinh hoá tự nhiên.","D":"Hàng hóa bị hư hỏng do hết hạn sử dụng, không được bồi thường, hàng hóa bị hư hỏng do thay đổi quá trình sinh hoá tự nhiên."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":997,"q":"Theo Luật thuế TNDN hiện hành, trường hợp tài sản cố định thuộc quyền sở hữu của doanh nghiệp đang dùng cho sản xuất kinh doanh nhưng phải tạm thời dừng để sửa chữa, để di dời di chuyển địa điểm, để bảo trì, bảo dưỡng theo định kỳ thì:","c":{"A":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng (với thời gian tạm dừng dưới 24 tháng) được tính vào chi phí được trừ khi xác định thu nhập chịu thuế","B":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế","C":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng (với thời gian tạm dừng dưới 15 tháng) được tính vào chi phí được trừ khi xác định thu nhập chịu thuế","D":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng (với thời gian tạm dừng dưới 12 tháng) được tính vào chi phí được trừ khi xác định thu nhập chịu thuế."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":998,"q":"Theo Luật thuế TNDN hiện hành, trường hợp tài sản cố định thuộc quyền sở hữu của doanh nghiệp đang dùng cho sản xuất kinh doanh nhưng phải tạm thời dừng do sản xuất theo mùa vụ thì:","c":{"A":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng (với thời gian tạm dừng dưới 09 tháng) được tính vào chi phí được trừ khi xác định thu nhập chịu thuế","B":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế","C":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng (với thời gian tạm dừng dưới 03 tháng) được tính vào chi phí được trừ khi xác định thu nhập chịu thuế","D":"Khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng (với thời gian tạm dừng dưới 12 tháng) được tính vào chi phí được trừ khi xác định thu nhập chịu thuế."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":999,"q":"Theo Luật thuế TNDN hiện hành, phần trích khấu hao TSCĐ nào dưới đây được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN:","c":{"A":"Chi khấu hao đối với tài sản cố định không sử dụng cho hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ.","B":"Chi khấu hao đối với tài sản cố định không có giấy tờ chứng minh được thuộc quyền sở hữu của doanh nghiệp (trừ tài sản cố định thuê mua tài chính).","C":"Chi khấu hao đối với tài sản cố định được quản lý, theo dõi, hạch toán trong sổ sách kế toán của doanh nghiệp theo chế độ quản lý tài sản cố định và hạch toán kế toán hiện hành.","D":"Phần trích khấu hao vượt mức quy định hiện hành của Bộ Tài chính về chế độ quản lý, sử dụng và trích khấu hao tài sản cố định. 1001"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1000,"q":"Theo Luật thuế TNDN hiện hành, phần trích khấu hao TSCĐ nào dưới đây không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN:","c":{"A":"Khấu hao đối với TSCĐ đã khấu hao hết giá trị nhưng vẫn đang được sử dụng.","B":"Khấu hao đối với TSCĐ có giấy tờ chứng minh được thuộc quyền sở hữu của doanh nghiệp (trừ TSCĐ thuê mua tài chính).","C":"Khấu hao đối với TSCĐ được quản lý, theo dõi, hạch toán trong sổ sách kế toán của doanh nghiệp theo chế độ quản lý TSCĐ và hạch toán kế toán hiện hành.","D":"Khấu hao đối với TSCĐ mới mua đã đưa vào sử dụng phục vụ hoạt động SXKD."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1001,"q":"Theo Luật thuế TNDN hiện hành, Dự án đầu tư mới tại địa bàn khó khăn được hưởng ưu đãi miễn, giảm thuế như thế nào?","c":{"A":"Miễn 4 năm, giảm 50% trong 9 năm.","B":"Miễn 2 năm, giảm 50% trong 4 năm tiếp theo.","C":"Miễn 2 năm, giảm 50% trong 5 năm.","D":"Chỉ được giảm 50% trong 2 năm."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1002,"q":"Theo Luật thuế TNDN hiện hành, Các khoản chi được trừ khi xác định TNCT đáp ứng điều kiện sau:","c":{"A":"Khoản chi thực tế phát sinh liên quan đến hoạt động sản xuất, kinh doanh của dn và có đủ hoá đơn, chứng từ hợp pháp theo quy định của pháp luật, khoản chi có chứng từ thanh toán không dùng tiền mặt đối với trường hợp mua hàng hóa, dịch vụ và các khoản thanh toán khác từng lần có giá trị từ 05 triệu đồng trở lên. Chứng từ thanh toán không dùng tiền mặt thực hiện theo quy định của các văn bản pháp luật về thuế giá trị gia tăng.","B":"Khoản chi có đủ hoá đơn, chứng từ hợp pháp theo quy định của pháp luật.","C":"Khoản chi thực tế phát sinh liên quan đến hoạt động sản xuất, kinh doanh của dn.","D":"Khoản chi thực tế phát sinh liên quan đến toàn bộ hoạt động của dn và có đủ hoá đơn, chứng từ hợp pháp theo quy định của pháp luật"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1003,"q":"Theo Luật thuế TNDN hiện hành, Doanh thu để tính thu nhập chịu thuế tndn đối với hoạt động cho thuê tài sản mà bên thuê trả tiền trước cho nhiều năm thì:","c":{"A":"Phải phân bổ cho số năm trả tiền trước","B":"Phải xác định theo doanh thu trả tiền một lần.","C":"Doanh nghiệp căn cứ điều kiện thực hiện chế độ kế toán, hóa đơn chứng từ thực tế và việc xác định chi phí, có thể lựa chọn một trong hai phương pháp trên.","D":"Trường hợp khác theo quy định của pháp luật."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1004,"q":"Theo Luật thuế TNDN hiện hành, Doanh thu để tính thu nhập chịu thuế TNDN đối với hàng hoá của các đơn vị giao đại lý và nhận đại lý theo hợp đồng đại lý bán đúng giá hưởng hoa hồng là:","c":{"A":"Tổng số tiền bán hàng hoá.","B":"Tiền hoa hồng được hưởng theo hợp đồng đại lý.","C":"Cả tiền hàng và tiền hoa hồng","D":"Trường hợp khác theo quy định của pháp luật."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1005,"q":"Theo Luật thuế TNDN hiện hành, Doanh thu để tính thu nhập chịu thuế TNDN đối với hàng hoá của các đơn vị giao đại lý là:","c":{"A":"Tiền hoa hồng được hưởng theo hợp đồng đại lý, ký gửi hàng hoá.","B":"Tổng số tiền bán hàng hoá.","C":"Cả tiền hàng và tiền hoa hồng.","D":"Trường hợp khác theo quy định của pháp luật."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1006,"q":"Theo Luật thuế TNDN hiện hành, Doanh thu để tính thu nhập chịu thuế TNDN Đối với hàng hóa, dịch vụ dùng để trao đổi (không bao gồm hàng hóa, dịch vụ sử dụng để tiếp tục quá trình sản xuất, kinh doanh của doanh nghiệp) được xác định:","c":{"A":"Theo giá mua vào của sản phẩm, hàng hóa, dịch vụ cùng loại hoặc tương đương trên thị trường tại thời điểm trao đổi.","B":"Theo giá thành toàn bộ để tạo ra sản phẩm, hàng hóa, dịch vụ đó.","C":"Theo giá bán của sản phẩm, hàng hóa, dịch vụ cùng loại hoặc tương đương trên thị trường tại thời điểm trao đổi.","D":"Theo giá thành sản xuất ra sản phẩm, hàng hóa, dịch vụ đó."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1007,"q":"Theo Luật thuế TNDN hiện hành, Doanh thu để tính thu nhập chịu thuế TNDN đối với hàng hoá, dịch vụ bán theo phương thức trả góp, trả chậm là:","c":{"A":"Tiền bán hàng hoá, dịch vụ trả tiền một lần, không bao gồm tiền lãi trả góp, trả chậm.","B":"Tổng số tiền khách hàng phải trả, bao gồm cả tiền lãi trả góp, trả chậm.","C":"Tổng số tiền phải thu tính theo phương thức trả chậm, trả góp (bao gồm cả tiền lãi trả chậm, trả góp).","D":"Tổng số tiền bán hàng hoá, dịch vụ trả nhiều lần, không bao gồm tiền lãi trả góp, trả chậm."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1008,"q":"Theo Luật thuế TNDN hiện hành, Thời điểm xác định doanh thu để tính TNCT đối với hoạt động cung ứng dịch vụ là thời điểm:","c":{"A":"Thời điểm chuyển giao quyền sở hữu, quyền sử dụng hàng hóa cho người mua.","B":"Thời điểm hoàn thành việc cung ứng dịch vụ hoặc hoàn thành từng phần việc cung ứng dịch vụ cho người mua trừ trường hợp nêu tại Khoản 3 Điều 8 Nghị định số 320/2025/NĐ-CP ngày 15/12/2025 của Chính phủ.","C":"Thời điểm hoàn thành việc cung ứng dịch vụ vận chuyển cho người mua.","D":"Trường hợp khác theo quy định của pháp luật."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1009,"q":"Theo Luật thuế TNDN hiện hành, việc hạch toán các khoản thu từ lãi tiền gửi, lãi cho vay vốn và các khoản chi trả lãi tiền vay theo quy định được thực hiện theo phương án nào dưới đây:","c":{"A":"Được bù trừ các khoản thu từ lãi tiền gửi, lãi cho vay vốn với các khoản chi trả lãi tiền vay, nếu thu lớn hơn chi thì phần chênh lệch được tính vào thu nhập khác, nếu chi lớn hơn thu thì phần chênh lệch được tính vào chi phí được trừ khi xác định thu nhập chịu thuế.","B":"Được bù trừ các khoản thu từ lãi tiền gửi, lãi cho vay vốn với các khoản chi trả lãi tiền vay, nếu thu lớn hơn chi thì phần chênh lệch được tính vào thu nhập khác, nếu chi lớn hơn thu thì phần chênh lệch tính giảm trừ vào thu nhập khác.","C":"Khoản thu từ lãi tiền gửi, lãi cho vay vốn hạch toán vào doanh thu hoạt động sản xuất kinh doanh trong kỳ tính thuế; khoản chi trả lãi tiền vay hạch toán vào chi phí được trừ khi xác định thu nhập chịu thuế.","D":"Được bù trừ các khoản thu từ lãi tiền gửi, lãi cho vay vốn với các khoản chi trả lãi tiền vay, nếu thu lớn hơn chi thì phần chênh lệch được tính vào thu nhập khác, nếu chi lớn hơn thu thì phần chênh lệch tính vào chi phí khác."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1010,"q":"Theo Luật thuế TNDN hiện hành, Thời điểm xác định doanh thu để tính TNCT đối với hoạt động bán hàng hoá là:","c":{"A":"Thời điểm chuyển giao quyền sở hữu, quyền sử dụng hàng hóa cho người mua.","B":"Thời điểm hoàn thành việc cung ứng dịch vụ hoặc hoàn thành từng phần việc cung ứng dịch vụ cho người mua.","C":"Thời điểm hoàn thành việc cung ứng dịch vụ vận chuyển cho người mua.","D":"Trường hợp khác theo quy định của pháp luật."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1011,"q":"Theo Luật thuế TNDN hiện hành, Doanh thu để tính thu nhập chịu thuế đối với doanh nghiệp nộp thuế theo phương pháp khấu trừ được xác định:","c":{"A":"Là toàn bộ tiền bán hàng chưa bao gồm thuế gtgt;","B":"Là tổng giá trị thanh toán;","C":"Là toàn bộ tiền bán hàng, tiền gia công, tiền cung ứng dịch vụ, trợ giá, phụ thu, phụ trội mà doanh nghiệp được hưởng;","D":"Là toàn bộ tiền bán hàng, tiền gia công, tiền cung ứng dịch vụ, trợ giá, phụ thu, phụ trội mà doanh nghiệp được hưởng không phân biệt đã thu được tiền hay chưa thu được tiền chưa bao gồm thuế GTGT."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1012,"q":"Theo Luật thuế TNDN hiện hành, phát biểu nào sau đây là đúng:","c":{"A":"Thu nhập chịu thuế bằng doanh thu trừ các khoản chi được trừ của hoạt động sản xuất, kinh doanh trừ các khoản lỗ được chuyển cộng thu nhập khác, kể cả thu nhập nhận được ở ngoài việt nam","B":"Thu nhập chịu thuế bằng doanh thu trừ các khoản chi được trừ của hoạt động sản xuất, kinh doanh cộng thu nhập khác","C":"Thu nhập chịu thuế bằng doanh thu trừ các khoản chi được trừ của hoạt động sản xuất, kinh doanh","D":"Thu nhập chịu thuế bằng doanh thu trừ các khoản chi được trừ của hoạt động sản xuất, kinh doanh cộng thu nhập khác, kể cả thu nhập nhận được ở ngoài Việt Nam"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1013,"q":"Theo Luật thuế TNDN hiện hành, Số thuế TNDN phải nộp trong kỳ được xác định theo công thức:","c":{"A":"Thu nhập tính thuế nhân với thuế suất thuế tndn","B":"Doanh thu trừ chi phí của hoạt động sản xuất, kinh doanh nhân thuế suất thuế TNDN","C":"Thu nhập chịu thuế nhân thuế suất thuế TNDN","D":"Doanh thu trừ chi phí của hoạt động sản xuất, kinh doanh cộng thu nhập khác nhân thuế suất thuế TNDN."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1014,"q":"Theo Luật thuế TNDN hiện hành, Thu nhập nào sau đây được miễn thuế:","c":{"A":"Thu nhập từ việc thực hiện hợp đồng nghiên cứu khoa học, phát triển công nghệ và đổi mới sáng tạo, chuyển đổi số; thu nhập từ bán sản phẩm làm ra từ công nghệ mới lần đầu tiên áp dụng ở Việt Nam; thu nhập từ bán sản phẩm sản xuất thử nghiệm trong thời gian sản xuất thử nghiệm bao gồm cả sản xuất thử nghiệm có kiểm soát theo quy định của pháp luật. Thu nhập tại khoản này được miễn thuế tối đa không quá 03 năm.","B":"Thu nhập từ hoạt động chuyển nhượng bất động sản","C":"Thu nhập từ chuyển nhượng dự án đầu tư.","D":"Thu nhập từ hoạt động chuyển nhượng vốn."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1015,"q":"Đối tượng nộp thuế thu nhập doanh nghiệp","c":{"A":"Theo “Điều 2. Người nộp thuế” Luật số 67/2025/QH15 ngày 14/6/2025 của Quốc hội;","B":"Tổ chức có hoạt động sản xuất, kinh doanh có thu nhập;","C":"Doanh nghiệp được thành lập theo pháp luật Việt Nam;","D":"Đơn vị sự nghiệp được thành lập theo quy định của pháp luật Việt Nam."},"t":"Tổng hợp"},{"n":1016,"q":"Luật thuế thu nhập doanh nghiệp năm 2025 có xu hướng điều chỉnh như thế nào đối với chính sách chống chuyển giá giữa các bên liên kết?","c":{"A":"Giữ nguyên toàn bộ quy định cũ","B":"Nới lỏng các quy định, cho phép các bên liên kết tự thỏa thuận giá chuyển giao","C":"Bỏ nghĩa vụ kê khai giao dịch liên kết của doanh nghiệp","D":"Tăng cường yêu cầu về hồ sơ xác định giá giao dịch liên kết, áp dụng giới hạn khấu trừ chi phí lãi vay và các chỉ tiêu so sánh độc lập."},"t":"Giao dịch liên kết"},{"n":1017,"q":"Theo Luật thuế TNDN hiện hành, chọn câu trả lời đúng nhất: Các khoản chi phí được trừ khi xác định thu nhập chịu thuế","c":{"A":"Chi tài trợ cuộc thi công chức thuế toàn năng cho cơ quan thuế","B":"Chi phạt vi phạm hành chính do doanh nghiệp xả thải vượt mức quy định","C":"Chi lãi vay phục vụ hoạt động sản xuất kinh doanh đúng quy định, có hợp đồng, chứng từ hợp pháp","D":"Chi hoa hồng môi giới hồ sơ mua bán tài sản của doanh nghiệp không có hóa đơn"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1018,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp nào sau đây có thu nhập chịu thuế phải nộp thuế thu nhập doanh nghiệp","c":{"A":"Doanh nghiệp được thành lập theo quy định của pháp luật Việt Nam nộp thuế đối với thu nhập chịu thuế phát sinh tại Việt Nam và thu nhập chịu thuế phát sinh ngoài Việt Nam","B":"Doanh nghiệp nước ngoài có cơ sở thường trú tại Việt Nam nộp thuế đối với thu nhập chịu thuế phát sinh tại Việt Nam mà khoản thu nhập này không liên quan đến hoạt động của cơ sở thường trú","C":"Doanh nghiệp nước ngoài không có cơ sở thường trú tại Việt Nam, bao gồm cả các doanh nghiệp kinh doanh thương mại điện tử, kinh doanh dựa trên nền tảng số, nộp thuế đối với thu nhập chịu thuế phát sinh tại Việt Nam","D":"Tất cả  hiện hành, Doanh nghiệp có thu nhập từ nước ngoài đã nộp thuế thu nhập tại nước ngoài thì khi về Việt Nam xử lý như thế nào?","c":{"A":"Được miễn hoàn toàn thuế TNDN tại Việt Nam.","B":"Được trừ số thuế đã nộp tại nước ngoài nhưng không vượt quá số thuế TNDN phải nộp theo quy định của Luật thuế TNDN Việt Nam.","C":"Phải nộp đủ thuế tại Việt Nam, không được trừ số đã nộp ở nước ngoài.","D":"Được tính số thuế đã nộp ở nước ngoài vào chi phí được trừ."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1039,"q":"Doanh nghiệp có phát sinh giao dịch liên kết nhưng có tổng doanh thu dưới bao nhiêu thì được miễn lập hồ sơ xác định giá giao dịch liên kết?","c":{"A":"20 tỷ đồng.","B":"50 tỷ đồng.","C":"100 tỷ đồng.","D":"200 tỷ đồng."},"t":"Giao dịch liên kết"},{"n":1040,"q":"Theo Luật thuế TNDN hiện hành, hai doanh nghiệp được coi là có quan hệ liên kết nếu một doanh nghiệp nắm giữ trực tiếp hoặc gián tiếp ít nhất bao nhiêu % vốn góp chủ sở hữu của doanh nghiệp kia?","c":{"A":"10%","B":"20%","C":"25%","D":"50%"},"t":"Giao dịch liên kết"},{"n":1041,"q":"Theo Luật thuế TNDN hiện hành, doanh nghiệp thực hiện chuyển đổi loại hình doanh nghiệp, sáp nhập, hợp nhất thì thời hạn nộp hồ sơ quyết toán thuế TNDN chậm nhất là:","c":{"A":"Ngày thứ 45 kể từ ngày có quyết định về việc thay đổi.","B":"Ngày thứ 30 kể từ ngày có quyết định.","C":"Ngày cuối cùng của tháng thứ 3 năm sau.","D":"Ngày thứ 90 kể từ ngày thực hiện."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1042,"q":"Doanh nghiệp có đơn vị phụ thuộc hạch toán phụ thuộc địa điểm kinh doanh là cơ sở sản xuất nằm khác tỉnh với trụ sở chính thì thực hiện khai thuế TNDN như thế nào?","c":{"A":"Khai tập trung tại trụ sở chính, không cần phân bổ.","B":"Khai và nộp thuế tại từng tỉnh nơi có đơn vị phụ thuộc.","C":"Khai tập trung tại trụ sở chính và phân bổ số thuế phải nộp cho từng tỉnh theo tỷ lệ % chi phí.","D":"Tùy doanh nghiệp lựa chọn."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1043,"q":"Thời hạn nộp hồ sơ quyết toán thuế TNDN năm chậm nhấ  TNDN - Thu nhập / Ưu đãi"},{"n":1049,"q":"Theo Luật thuế TNDN hiện hành, tiền lương, tiền công của chủ doanh nghiệp tư nhân có được tính vào chi phí được trừ không?","c":{"A":"Có, nếu có bảng lương đầy đủ.","B":"Không được tính vào chi phí được trừ.","C":"Được trừ tối đa 50%.","D":"Chỉ được trừ nếu doanh nghiệp có lãi."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1050,"q":"Theo Luật thuế TNDN hiện hành, tài sản cố định là xe ô tô chở người từ 9 chỗ ngồi trở xuống (trừ xe kinh doanh vận tải) có nguyên giá 2 tỷ đồng. Mức trích khấu hao được trừ tối đa tương ứng với nguyên giá là:","c":{"A":"2 tỷ đồng.","B":"1,6 tỷ đồng.","C":"1 tỷ đồng.","D":"Theo thỏa thuận với cơ quan thuế."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1051,"q":"Chi phí lãi vay đối với doanh nghiệp có giao dịch liên kết được trừ tối đa bao nhiêu % EBITDA?","c":{"A":"15%","B":"20%","C":"30%","D":"50%"},"t":"Giao dịch liên kết"},{"n":1052,"q":"Khoản chi trả tiền điện, nước của doanh nghiệp thuê địa điểm kinh doanh đứng tên chủ nhà thì cần điều kiện gì để được trừ?","c":{"A":"Phải có hóa đơn mang tên doanh nghiệp.","B":"Có hợp đồng thuê địa điểm và chứng từ thanh toán thực tế cho người cung cấp điện nước.","C":"Chỉ cần hợp đồng thuê nhà.","D":"Không được trừ trong mọi trường hợp."},"t":"Tổng hợp"},{"n":1053,"q":"Theo Luật thuế TNDN hiện hành, khoản chi phúc lợi trực tiếp cho người lao động (hiếu, hỷ, nghỉ mát...) được trừ tối đa bao nhiêu?","c":{"A":"Không quá 01 tháng lương bình quân thực tế thực hiện trong năm tài chính.","B":"Không quá 02 tháng lương.","C":"15% tổng quỹ lương.","D":"Không bị khống chế."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1054,"q":"Doanh nghiệp trích trước chi phí sửa chữa tài sản cố định (TSCĐ) định kỳ nhưng hết kỳ tính thuế chưa chi hết thì xử lý như thế nào?","c":{"A":"Được chuyển sang năm sau trừ tiếp.","B":"Phải hạch toán giảm chi phí phần chênh lệch chưa chi hết.","C":"Được tính vào chi phí trả trước.","D":"Không cần xử lý gì."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1055 "},{"n":1061,"q":"Theo Luật thuế TNDN hiện hành, khoản chi nào sau đây được trừ khi xác định thu nhập chịu thuế TNDN?","c":{"A":"Chi trang phục bằng tiền quá 5 triệu đồng/người/năm.","B":"Chi phí lãi vay tương ứng với phần vốn điều lệ còn thiếu.","C":"Khoản chi có hóa đơn giá trị gia tăng từ 20 triệu đồng trở lên thanh toán bằng tiền mặt.","D":"Khoản chi thực tế phát sinh liên quan đến hoạt động sản xuất, kinh doanh có đủ hóa đơn, chứng từ hợp pháp, có chứng từ thanh toán không dùng tiền mặt đối với trường hợp mua hàng hóa, dịch vụ có giá trị từ 05 triệu đồng trở lên."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1062,"q":"Theo Luật thuế TNDN hiện hành, Doanh nghiệp mua xe ô tô dưới 9 chỗ (nguyên giá 3 tỷ đồng) dùng làm mẫu thử nghiệm cho hoạt động sản xuất xe ô tô. Mức trích khấu hao được tính vào chi phí được trừ là:","c":{"A":"Tương ứng với nguyên giá 1,6 tỷ đồng.","B":"Toàn bộ mức trích khấu hao tương ứng với nguyên giá 3 tỷ đồng.","C":"Không được tính vào chi phí được trừ do không trực tiếp kinh doanh vận tải.","D":"Chỉ được trừ 50% giá trị khấu hao hàng năm."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1063,"q":"Theo Luật thuế TNDN hiện hành, công thức xác định số thuế TNDN phải nộp trong kỳ là:","c":{"A":"Thu nhập tính thuế x Thuế suất.","B":"(Thu nhập tính thuế - Phần trích lập quỹ KH&CN (nếu có)) x Thuế suất.","C":"Doanh thu x Thuế suất.","D":"Lợi nhuận kế toán x Thuế suất."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1064,"q":"Theo Luật thuế TNDN hiện hành, Doanh thu để tính thu nhập chịu thuế TNDN đối với hàng hóa bán theo phương thức trả góp là:","c":{"A":"Tổng số tiền bán hàng theo giá trả một lần bao gồm cả lãi trả góp.","B":"Giá bán hàng hoá trả tiền một lần, không bao gồm lãi trả chậm, lãi trả góp.","C":"Số tiền thực tế thu được trong kỳ tính thuế.","D":"Giá bán do doanh nghiệp tự xác định tại thời điểm kết thúc hợp đồng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1065,"q":"Theo Luật thuế TNDN hiện hành, Thu nhập chịu thuế TNDN bao gồm những loại thu nhậ ết và phần lãi phát sinh từ số thuế thu nhập doanh nghiệp đó.","c":{"A":"40%","B":"50%","C":"70%","D":"60%"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1099,"q":"Theo Luật thuế TNDN hiện hành, phần thu nhập không chia của cơ sở thực hiện xã hội hóa trong lĩnh vực giáo dục - đào tạo, y tế và lĩnh vực xã hội hóa khác để lại để đầu tư phát triển cơ sở đó đáp ứng tỷ lệ tối thiểu do cơ quan nào quy định?","c":{"A":"Chính phủ","B":"Bộ Tài chính","C":"Quốc hội","D":"UBND cấp tỉnh, thành phố 101"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1100,"q":"Theo Luật thuế TNDN hiện hành, đâu là khoản thu nhập được miễn thuế TNDN:","c":{"A":"Thu nhập từ hoạt động đánh bắt hải sản","B":"Thu nhập từ việc thực hiện dịch vụ kỹ thuật trực tiếp phục vụ nông nghiệp","C":"Thu nhập từ hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ của doanh nghiệp có từ 30% số lao động bình quân trong năm trở lên là người khuyết tật","D":"Cả 3 đáp án trên"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1101,"q":"Theo Luật thuế TNDN hiện hành, trong các khoản thu nhập dưới đây, khoản thu nhập nào không phải là khoản thu nhập khác:","c":{"A":"Thu nhập từ chuyển nhượng vốn","B":"Thu nhập từ chuyển nhượng bất động sản","C":"Thu nhập từ lãi tiền gửi","D":"Thu nhập từ hoạt động kinh doanh mặt hàng máy tính"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1102,"q":"Hành vi nào sau đây của doanh nghiệp bị coi là trốn thuế TNDN?","c":{"A":"Nộp hồ sơ khai thuế chậm dưới 90 ngày.","B":"Để ngoài sổ sách kế toán các khoản thu nhập từ hoạt động kinh doanh nhằm giảm số thuế phải nộp.","C":"Lựa chọn phương pháp khấu hao nhanh tài sản cố định theo quy định.","D":"Chuyển lỗ từ năm trước sang năm nay đúng thời hạn 5 năm."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1103,"q":"Theo Luật thuế TNDN hiện hành, giá vốn của bất động sản chuyển nhượng bao gồm:","c":{"A":"Giá đất tại thời điểm bán.","B":"Giá vốn đất, chi phí đền bù giải phóng mặt bằng, chi phí đầu tư hạ tầng và các chi phí khác liên quan.","C":"Chỉ gồm giá mua vào ban đầu.","D":"Giá do doanh nghiệp tự ấn định."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1104,"q":"Theo Luật thuế TNDN hiện hành, doanh thu để tính thu nhập chịu thuế đối với hàng hóa, dịch vụ dùng để trao đổi (không bao gồm hàng hóa, dịch vụ dùng để tiếp tục quá trình sản xuất) được xác định như thế nào?","c":{"A":"Xác định theo giá thành sản xuất của hàng hóa, dịch vụ đó.","B":"Xác định theo giá bán của sản phẩm, hàng hóa, dịch vụ cùng loại hoặc tương đương trên thị trường tại thời điểm trao đổi.","C":"Không tính vào doanh thu vì không phát sinh dòng tiền.","D":"Xác định theo giá trị ghi trên sổ sách kế toán của doanh nghiệp."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1105,"q":"Phương pháp \"Giá giao dịch độc lập\" trong quản lý thuế đối với giao dịch liên kết nhằm mục đích gì?","c":{"A":"Để tăng giá bán hàng hóa ra nước ngoài.","B":"Để ngăn chặn việc chuyển lợi nhuận ra nước ngoài thông qua việc định giá không theo giá thị trường.","C":"Để giảm chi phí đầu vào cho doanh nghiệp.","D":"Để khuyến khích các doanh nghiệp cùng tập đoàn mua bán với nhau nhiều hơn."},"t":"Giao dịch liên kết"},{"n":1106,"q":"Thu nhập từ hoạt động trồng trọt, chăn nuôi, nuôi trồng thủy sản của tổ chức được thành lập theo Luật Hợp tác xã ở địa bàn khó khăn được hưởng mức thuế suất nào?","c":{"A":"Miễn thuế.","B":"Thuế suất 10%.","C":"Thuế suất 15%.","D":"Thuế suất 20%."},"t":"Tổng hợp"},{"n":1107,"q":"Khoản nợ khó đòi đã xóa sổ nay đòi được thì hạch toán vào đâu khi tính thuế TNDN?","c":{"A":"Ghi giảm chi phí quản lý doanh nghiệp.","B":"Ghi tăng doanh thu bán hàng.","C":"Thu nhập khác.","D":"Ghi tăng vốn chủ sở hữu"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1108,"q":"Khoản thu nhập nào sau đây được tính vào \"Thu nhập chịu thuế\" nhưng không nằm trong \"Doanh thu bán hàng, cung cấp dịch vụ\"?","c":{"A":"Doanh thu từ bán phế liệu, phế phẩm.","B":"Thu nhập từ quà biếu, quà tặng bằng tiền hoặc bằng hiện vật của các tổ chức, cá nhân tặng cho doanh nghiệp.","C":"Doanh thu từ hoạt động cho thuê kho bãi.","D":"Doanh thu từ cung cấp dịch vụ tư vấn pháp lý."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1109,"q":"Đối với hoạt động cho thuê tài sản mà bên thuê trả tiền trước cho nhiều năm, doanh nghiệp có quyền lựa chọn xác định doanh thu tính thu nhập chịu thuế theo cách nào?","c":{"A":"Chỉ được phân bổ theo số năm trả tiền trước.","B":"Chỉ được xác định một lần theo toàn bộ số tiền thu trước.","C":"Phân bổ theo số năm trả tiền trước hoặc xác định theo doanh thu trả tiền một lần.","D":"Tùy thuộc vào sự phê duyệt của cơ quan Thuế quản lý trực tiếp."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1110,"q":"Doanh nghiệp có thu nhập tính thuế từ bao nhiêu thì bắt buộc phải thực hiện kê khai thuế TNDN theo quý?","c":{"A":"100 triệu đồng.","B":"1 tỷ đồng.","C":"Mọi doanh nghiệp đều phải khai quyết toán năm, còn hàng quý chỉ thực hiện tạm nộp không cần nộp tờ khai quý.","D":"Hiện nay doanh nghiệp chỉ tạm nộp thuế TNDN quý theo quy định của Luật Quản lý thuế và không phải nộp tờ khai thuế TNDN tạm tính quý."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1111,"q":"Theo Luật thuế TNDN hiện hành, việc bù trừ lỗ giữa hoạt động chuyển nhượng bất động sản và hoạt động sản xuất kinh doanh được thực hiện như thế nào?","c":{"A":"Số lãi từ hoạt động chuyển nhượng BĐS được bù trừ với số lỗ của hoạt động sản xuất kinh doanh.","B":"Số lỗ từ hoạt động chuyển nhượng BĐS được bù trừ với số lãi của hoạt động sản xuất kinh doanh.","C":"Không được bù trừ dưới bất kỳ hình thức nào.","D":"Chỉ được bù trừ nếu doanh nghiệp có thời gian hoạt động trên 10 năm."},"t":"Thuế TNCN"},{"n":1112,"q":"Đối với các khoản nợ phải trả không xác định được chủ nợ, doanh nghiệp phải hạch toán vào:","c":{"A":"Giảm chi phí sản xuất kinh doanh trong kỳ.","B":"Doanh thu bán hàng và cung cấp dịch vụ.","C":"Thu nhập khác khi xác định thu nhập chịu thuế.","D":"Quỹ dự phòng tài chính của doanh nghiệp."},"t":"Kế toán"},{"n":1113,"q":"Theo Luật thuế TNDN hiện hành, mức trích lập quỹ dự phòng tiền lương tối đa là bao nhiêu % quỹ tiền lương thực hiện?","c":{"A":"10%","B":"17%","C":"20%","D":"5%"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1114,"q":"Theo Luật thuế TNDN hiện hành, thu nhập từ chuyển nhượng chứng khoán của doanh nghiệp được xác định là:","c":{"A":"Giá bán chứng khoán chưa trừ giá mua.","B":"Giá bán trừ giá mua của chứng khoán chuyển nhượng, trừ chi phí liên quan đến việc chuyển nhượng.","C":"Chênh lệch giữa giá trị sổ sách và giá trị thị trường.","D":"1% trên tổng giá trị chuyển nhượng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1115,"q":"Theo Luật thuế TNDN hiện hành, khoản chi nào sau đây KHÔNG được tính vào chi phí được trừ đối với phần chi vượt mức quy định?","c":{"A":"Chi phụ cấp điện thoại cho người lao động.","B":"Chi thưởng sáng kiến, cải tiến kỹ thuật.","C":"Chi lãi vay vốn tương ứng với phần vốn điều lệ còn thiếu theo tiến độ góp vốn ghi trong điều lệ doanh nghiệp.","D":"Chi phí đào tạo nghề cho lao động nữ."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1116,"q":"Khi thực hiện quyết toán thuế TNDN, nếu doanh nghiệp có tổng số thuế tạm nộp 4 quý thấp hơn số thuế TNDN phải nộp theo quyết toán từ bao nhiêu % trở lên thì doanh nghiệp phải nộp tiền chậm nộp ?","c":{"A":"10%","B":"20%","C":"30%","D":"5%"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1117,"q":"Theo Luật thuế TNDN hiện hành, thu nhập từ hoạt động nào sau đây của doanh nghiệp KHÔNG thuộc nhóm được ưu đãi thuế TNDN?","c":{"A":"Giáo dục - đào tạo, y tế.","B":"Sản xuất phần mềm.","C":"Kinh doanh dịch vụ trò chơi điện tử có thưởng (Casino), kinh doanh đặt cược.","D":"Bảo vệ môi trường, năng lượng tái tạo."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1118,"q":"Doanh nghiệp có thu nhập tính thuế từ hoạt động sản xuất kinh doanh phổ thông là 1 tỷ đồng, lỗ từ hoạt động chuyển nhượng bất động sản là 200 triệu đồng. Thu nhập tính thuế cuối cùng là:","c":{"A":"1 tỷ đồng","B":"800 triệu đồng","C":"1,2 tỷ đồng.","D":"Doanh nghiệp được chọn cách tính có lợi nhất."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1119,"q":"Đối với doanh nghiệp có giao dịch liên kết, tổng chi phí lãi vay được trừ khi xác định thu nhập chịu thuế không vượt quá bao nhiêu % tổng lợi nhuận thuần từ hoạt động kinh doanh cộng lãi vay và khấu hao (EBITDA)?","c":{"A":"25%","B":"30%","C":"40%","D":"50%"},"t":"Giao dịch liên kết"},{"n":1120,"q":"Hồ sơ khai quyết toán thuế TNDN năm bao gồm mẫu biểu nào quan trọng nhất?","c":{"A":"Tờ khai quyết toán thuế TNDN mẫu số 03/TNDN.","B":"Báo cáo tình hình sử dụng hóa đơn.","C":"Tờ khai thuế GTGT tháng 12 hoặc Quý 4.","D":"Thông báo phát hành hóa đơn điện tử"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1121,"q":"Theo Luật thuế TNDN hiện hành, doanh nghiệp nộp thuế TNDN theo phương pháp tỷ lệ % trên doanh thu bán hàng hóa, dịch vụ thì tỷ lệ đối với lĩnh vực dịch vụ là bao nhiêu?","c":{"A":"1%","B":"2%","C":"5%","D":"10%"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1122,"q":"Theo Luật thuế TNDN hiện hành, thu nhập từ dịch vụ thực hiện ngoài lãnh thổ Việt Nam của doanh nghiệp nước ngoài không có cơ sở thường trú tại Việt Nam có chịu thuế TNDN không?","c":{"A":"Có, chịu thuế theo phương pháp kê khai.","B":"Có, chịu thuế nhà thầu.","C":"Không thuộc đối tượng chịu thuế TNDN tại Việt Nam.","D":"Chịu thuế suất 10% trên doanh thu."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1123,"q":"Theo Luật thuế TNDN hiện hành, khoản chi tiền lương, tiền công đã hạch toán vào chi phí nhưng thực tế chưa chi trả đến thời hạn nộp hồ sơ quyết toán thuế năm thì:","c":{"A":"Được tính vào chi phí bình thường.","B":"Không được tính vào chi phí được trừ (trừ trường hợp có trích lập quỹ dự phòng tiền lương).","C":"Được tính nếu doanh nghiệp cam kết trả trong quý 1 năm sau.","D":"Được tính 50%."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1124,"q":"Theo Luật thuế TNDN hiện hành, khoản chi tài trợ cho giáo dục đúng đối tượng được trừ khi:","c":{"A":"Chi bằng tiền mặt cho học sinh, sinh viên.","B":"Tài trợ cho các cơ sở giáo dục công lập, dân lập có hồ sơ xác nhận theo quy định.","C":"Tài trợ cho con em cán bộ công nhân viên trong công ty đi học.","D":"Tài trợ cho các trung tâm đào tạo kỹ năng mềm không có giấy phép."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1125,"q":"Theo Luật thuế TNDN hiện hành, giá tính thuế TNDN đối với hoạt động chuyển nhượng bất động sản là:","c":{"A":"Giá trị hợp đồng chuyển nhượng trừ giá vốn bất động sản.","B":"Doanh thu từ hoạt động chuyển nhượng trừ giá vốn bất động sản và các khoản chi phí liên quan đến chuyển nhượng.","C":"Tổng giá trị thanh toán ghi trên hóa đơn.","D":"Giá đất do Ủy ban nhân dân cấp tỉnh quy định tại thời điểm chuyển nhượng."},"t":"Thuế TNCN"},{"n":1126,"q":"Theo Luật thuế TNDN hiện hành, doanh nghiệp có vốn điều lệ 10 tỷ đồng, thực góp 8 tỷ đồng. Trong kỳ phát sinh chi phí lãi vay là 500 triệu đồng. Khoản chi lãi vay nào không được trừ?","c":{"A":"Toàn bộ 500 triệu đồng.","B":"Phần lãi vay tương ứng với số vốn điều lệ còn thiếu.","C":"Phần lãi vay vượt quá 150% lãi suất cơ bản.","D":"Không có khoản nào bị loại."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1127,"q":"Theo Luật thuế TNDN hiện hành, tài sản cố định là ô tô chở người từ 9 chỗ ngồi trở xuống (trừ kinh doanh vận tải) có nguyên giá 2,5 tỷ đồng thì phần khấu hao tương ứng với nguyên giá vượt bao nhiêu sẽ bị loại?","c":{"A":"Vượt trên 1 tỷ đồng.","B":"Vượt trên 1,6 tỷ đồng.","C":"Vượt trên 2 tỷ đồng.","D":"Được tính toàn bộ nếu xe phục vụ giám đốc."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1128,"q":"Theo Luật thuế TNDN hiện hành, thu nhập từ chuyển nhượng vốn phát sinh trong kỳ được hạch toán vào:","c":{"A":"Doanh thu bán hàng và cung cấp dịch vụ","B":"Thu nhập khác","C":"Giảm trừ chi phí","D":"Doanh thu nội bộ"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1129,"q":"Theo Luật thuế TNDN hiện hành, chi phí tiền trang phục cho người lao động bằng tiền mặt được tính vào chi phí được trừ tối đa là bao nhiêu?","c":{"A":"Không giới hạn","B":"3 triệu đồng/người/năm","C":"5 triệu đồng/người/năm","D":"10 triệu đồng/người/năm"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1130,"q":"Theo Luật thuế TNDN hiện hành, doanh nghiệp được trích khấu hao nhanh đối với tài sản cố định trong trường hợp nào để được tính vào chi phí được trừ?","c":{"A":"Mọi tài sản cố định đều được khấu hao nhanh.","B":"Tài sản cố định dùng vào hoạt động sản xuất kinh doanh có hiệu quả kinh tế cao và không vượt quá 2 lần mức khấu hao theo đường thẳng.","C":"Tài sản là nhà cửa, vật kiến trúc.","D":"Chỉ áp dụng đối với doanh nghiệp có vốn đầu tư nước ngoài."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1131,"q":"Theo Luật thuế TNDN hiện hành, trường hợp dự án đầu tư mới của doanh nghiệp không có thu nhập chịu thuế trong 3 năm đầu kể từ năm đầu tiên có doanh thu thì thời gian miễn thuế, giảm thuế tính từ:","c":{"A":"Năm thứ 3 kể từ năm có doanh thu.","B":"Năm thứ 4 kể từ năm có doanh thu.","C":"Năm thứ 5 kể từ năm có doanh thu.","D":"Vẫn tính từ năm đầu tiên có doanh thu."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1132,"q":"Theo Luật thuế TNDN hiện hành, ưu đãi về thời gian miễn thuế, giảm thuế TNDN được tính liên tục từ:","c":{"A":"Năm đầu tiên doanh nghiệp có thu nhập chịu thuế từ dự án đầu tư được hưởng ưu đãi thuế.","B":"Năm đầu tiên doanh nghiệp có doanh thu từ dự án đầu tư.","C":"Năm doanh nghiệp được cấp Giấy chứng nhận đầu tư.","D":"Năm doanh nghiệp bắt đầu đi vào hoạt động chính thức."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1133,"q":"Theo Luật thuế TNDN hiện hành, thu nhập từ hoạt động nào sau đây phải kê khai, nộp thuế riêng và không được bù trừ với lỗ của hoạt động kinh doanh thông thường?","c":{"A":"Thu nhập từ hoạt động sản xuất phần mềm.","B":"Thu nhập từ dự án đầu tư thăm dò, khai thác, chế biến khoáng sản.","C":"Thu nhập từ lãi tiền gửi ngân hàng.","D":"Thu nhập từ cung cấp dịch vụ tư vấn."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1134,"q":"Theo Luật thuế TNDN hiện hành, thu nhập từ thanh lý tài sản cố định được hạch toán vào:","c":{"A":"Doanh thu thuần.","B":"Thu nhập khác (sau khi trừ giá trị còn lại và chi phí thanh lý).","C":"Giảm chi phí quản lý doanh nghiệp.","D":"Không tính
