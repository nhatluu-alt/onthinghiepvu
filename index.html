ấu thương mại dành cho khách hàng đã có thuế GTGT.","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Thuế GTGT"},{"n":1195,"q":"Theo quy định của Nghị định số 181/2025/NĐ-CP, CSKD có áp dụng hình thức chiết khấu thương mại dành cho khách hàng thì giá tính thuế GTGT là giá bán đã chiết khấu thương mại dành cho khách hàng chưa có thuế GTGT.","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Thuế GTGT"},{"n":1196,"q":"Công ty A nộp hồ sơ hoàn thuế GTGT (xuất khẩu) vào ngày 06/02/2026, kỳ hoàn thuế tháng 10/2025. Ngày 09/02/2026 công ty khai bổ sung lần 1 cho kỳ thuế tháng 10/2025 (kỳ dừng hoàn), làm tăng số thuế đề nghị hoàn. Trường hợp khai bổ sung này đúng hay sai?.","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Thuế GTGT"},{"n":1197,"q":"Doanh nghiệp chế xuất chỉ có hoạt động xuất khẩu thì không phải nộp hồ sơ khai thuế giá trị gia tăng. Đúng hay sai?.","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Thuế GTGT"},{"n":1198,"q":"Theo quy định của Nghị định số 181/2025/NĐ-CP, thời điểm xác định thuế GTGT do người bán tự xác định nhưng chậm nhất không quá một ngày kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan.","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Thuế nhà thầu / XNK"},{"n":1199,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, dịch vụ được các nhà cung cấp nước ngoài không có cơ sở thường trú tại Việt Nam cung cấp cho tổ chức, cá nhân tại Việt Nam qua kênh thương mại điện tử và các nền tảng số chịu thuế suất thuế GTGT:","c":{"A":"5%.","B":"10%.","C":"Không chịu thuế.","D":"Không phải tính thuế GTGT. 201"},"t":"Thuế GTGT"},{"n":1200,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, nước đóng chai chịu thuế suất bao nhiêu?.","c":{"A":"5%.","B":"10%.","C":"Không chịu thuế.","D":"Không phải tính thuế GTGT."},"t":"Thuế GTGT"},{"n":1201,"q":"CSKD (bao gồm cả hộ kinh doanh, cá nhân kinh doanh) tính thuế GTGT theo phương pháp tỷ lệ % trên doanh thu được giảm bao nhiêu% mức tỷ lệ % để tính thuế GTGT khi thực hiện xuất hóa đơn đối với hàng hóa, dịch vụ được giảm thuế GTGT bao nhiêu theo Nghị định số 174/2025/NĐ-CP:","c":{"A":"10%.","B":"20%.","C":"Không được giảm.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1202,"q":"Chính sách giảm thuế GTGT theo Nghị định số 174/2025/NĐ-CP áp dụng đối với nhóm hàng hóa chịu thuế suất 10% trừ nhóm hàng hóa:","c":{"A":"Viễn thông.","B":"Kinh doanh bất động sản.","C":"Sản phẩm hàng hóa và dịch vụ chịu thuế TTĐB.","D":"Cả 3 phương án trên."},"t":"Thuế GTGT"},{"n":1203,"q":"Chính sách giảm thuế GTGT theo Nghị định số 174/2025/NĐ-CP áp dụng đối với nhóm hàng hóa chịu thuế suất:","c":{"A":"5%","B":"","C":"Cả A và","D":"Tất cả đáp án đều sai."},"t":"Thuế GTGT"},{"n":1204,"q":"Theo quy định hiện hành, hãy chọn câu trả lời đúng:","c":{"A":"Trường hợp người nộp thuế mới bắt đầu hoạt động, kinh doanh thì bắt buộc phải khai GTGT theo quý.","B":"Trường hợp người nộp thuế đang thực hiện khai thuế GTGT theo quý nếu đủ điều kiện khai thuế GTGT theo tháng và lựa chọn chuyển sang khai thuế GTGT theo tháng thì gửi văn bản đề nghị thay đổi kỳ tính thuế đến cơ quan thuế quản lý trực tiếp.","C":"Người nộp thuế có doanh thu trên 50 tỷ đồng thì được khai thuế GTGT theo quý","D":"Người nộp thuế đáp ứng tiêu chí khai thuế GTGT theo quý được lựa chọn khai thuế theo tháng hoặc quý ổn định trọn năm dương lịch."},"t":"Tổng hợp"},{"n":1205,"q":"Theo quy định hiện hành, doanh nghiệp chế xuất chỉ có hoạt động xuất khẩu thì:","c":{"A":"Không phải nộp hồ sơ khai thuế GTGT.","B":"Phải nộp hồ sơ khai thuế GTGT theo tháng.","C":"Phải nộp hồ sơ khai thuế GTGT theo quý.","D":"Phải nộp hồ sơ khai thuế GTGT theo tháng, quý do DN lựa chọn."},"t":"Tổng hợp"},{"n":1206,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, đối tượng được hoàn thuế GTGT đối với trường hợp ủy thác xuất khẩu là:","c":{"A":"CSKD có hàng hóa ủy thác xuất khẩu.","B":"CSKD nhận ủy thác xuất khẩu.","C":"Cả hai.","D":"Không bên nào."},"t":"Thuế GTGT"},{"n":1207,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, trường hợp DAĐT đã hoàn thành nhưng CSKD chưa thực hiện hoàn thuế GTGT phát sinh trong giai đoạn đầu tư thì CSKD thực hiện nộp hồ sơ hoàn thuế GTGT theo quy định trong thời hạn bao lâu kể từ ngày DAĐT hoặc ngày giai đoạn đầu tư, hạng mục đầu tư hoàn thành.","c":{"A":"6 tháng.","B":"1 năm.","C":"2 năm.","D":"Bao lâu cũng được miễn là đã dừng hoàn tại chỉ tiêu 30 của Tờ khai thuế 02/GTGT."},"t":"Thuế GTGT"},{"n":1208,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, hàng hóa nhập khẩu từ nước ngoài của Công ty cho thuê tài chính được vận chuyển thẳng vào khu phi thuế quan để cho doanh nghiệp trong khu phi thuế quan thuê tài chính thì áp dụng thuế suất GTGT:","c":{"A":"0%.","B":"5%.","C":"10%.","D":"Không chịu thuế."},"t":"Thuế GTGT"},{"n":1209,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, hàng hóa, dịch vụ sau đây không do Chính phủ quy định thời điểm xác định thuế GTGT:","c":{"A":"Dịch vụ viễn thông.","B":"","C":"Phát sóng truyền thanh, truyền hình không bằng nguồn vốn ngân sách nhà nước.","D":""},"t":"Thuế GTGT"},{"n":1210,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, đối với hàng hóa dùng để biếu tặng, giá tính thuế GTGT:","c":{"A":"Giá tính thuế GTGT của hàng hóa cùng loại hoặc tương đương tại thời điểm biếu tặng.","B":"Giá vốn.","C":"Giá thị trường tại thời điểm biếu tặng.","D":"Không phải tính thuế."},"t":"Thuế GTGT"},{"n":1211,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, đối tượng nào sau đây không thuộc trường hợp được hoàn thuế GTGT:","c":{"A":"Hoàn thuế khi sáp nhập, hợp nhất.","B":"Hoàn xuất khẩu.","C":"Hoàn dự án đầu tư.","D":"Hoàn ODA."},"t":"Thuế GTGT"},{"n":1212,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, chứng từ thanh toán không dùng tiền mặt để đáp ứng điều kiện khấu trừ thuế GTGT đầu vào:","c":{"A":"Ủy nhiệm chi.","B":"Séc.","C":"Chuyển khoản.","D":"Các hình thức thanh toán theo quy định pháp luật về thanh toán."},"t":"Thuế GTGT"},{"n":1213,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, dịch vụ xuất khẩu được áp dụng thuế suất thuế GTGT 0% khi:","c":{"A":"Cung ứng trực tiếp cho tổ chức, cá nhân ở nước ngoài và tiêu dùng ngoài Việt Nam.","B":"Có hợp đồng cung ứng dịch vụ.","C":"Có chứng từ thanh toán không dùng tiền mặt.","D":"Đáp ứng đủ điều kiện trên theo quy định."},"t":"Thuế GTGT"},{"n":1214,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế suất 0% áp dụng đối với hàng hóa xuất khẩu khi đáp ứng điều kiện nào?","c":{"A":"Có hợp đồng bán, gia công hàng hóa xuất khẩu.","B":"Có chứng từ thanh toán không dùng tiền mặt theo quy định của pháp luật.","C":"Có tờ khai hải quan theo quy định của pháp luật về hải quan.","D":"Đáp ứng đủ các điều kiện trên theo quy định."},"t":"Thuế GTGT"},{"n":1215,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế GTGT đầu vào hình thành TSCĐ của Doanh nghiệp trong các trường hợp nào sau đây không được khấu trừ:","c":{"A":"TSCĐ là ô tô chở người từ 9 chỗ ngồi trở xuống sử dụng vào kinh doanh vận chuyển hàng hoá, hành khách, kinh doanh du lịch, khách sạn có trị giá vượt trên 1,6 tỷ đồng.","B":"Nhà ở, trạm y tế cho người lao động làm việc trong các khu công nghiệp.","C":"TSCĐ, máy móc, thiết bị của các tổ chức tín dụng, doanh nghiệp kinh doanh tái bảo hiểm, bảo hiểm nhân thọ.","D":"Cả 3 đáp án đều đúng."},"t":"Thuế GTGT"},{"n":1216,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, phương pháp tính trực tiếp trên GTGT không áp dụng đối với đối tượng và trường hợp nào:","c":{"A":"Cá nhân, hộ kinh doanh không thực hiện hoặc thực hiện không đầy đủ chế độ kế toán, hoá đơn, chứng từ theo quy định của pháp luật.","B":"","C":"CSKD thực hiện đầy đủ chế độ kế toán, hoá đơn, chứng từ theo quy định của pháp luật về kế toán, hoá đơn, chứng từ có doanh thu hàng năm từ bán hàng hóa cung ứng dịch vụ từ một tỷ đồng trở lên trừ hộ, cá nhân sản xuất, kinh doanh.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1217,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, phương pháp khấu trừ thuế áp dụng đối với đối tượng nào sau đây:","c":{"A":"Cá nhân, hộ kinh doanh không thực hiện hoặc thực hiện không đầy đủ chế độ kế toán, hoá đơn, chứng từ theo quy định của pháp luật.","B":"","C":"CSKD thực hiện đầy đủ chế độ kế toán, hoá đơn, chứng từ theo quy định của pháp luật về kế toán, hoá đơn, chứng từ và đăng ký nộp thuế theo phương pháp khấu trừ thuế.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1218,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, trường hợp hàng hóa dịch vụ mua vào đồng thời cho SXKD hàng hóa dịch vụ chịu thuế và không chịu thuế GTGT mà doanh nghiệp kê khai theo phương pháp khấu trừ không hạch toán riêng được phần dùng cho từng phần hoạt động, khi đó số thuế GTGT đầu vào được khấu trừ xác định như sau:","c":{"A":"Được khấu trừ toàn bộ số thuế GTGT đầu vào dùng cho cả hoạt động chịu thuế và không chịu thuế GTGT.","B":"Được phân bổ theo tỷ lệ % giữa doanh thu hàng hóa, dịch vụ chịu thuế GTGT, doanh thu không phải kê khai, tính nộp thuế GTGT so với tổng doanh thu của hàng hóa dịch vụ bán ra trong kỳ tính thuế.","C":"Được phân bổ theo tỷ lệ % giữa doanh thu của hàng hóa, dịch vụ chịu thuế GTGT so với tổng doanh thu hàng hóa, dịch vụ bán ra trong kỳ tính thuế.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1219,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, hãy chọn câu đúng:","c":{"A":"Tổ chức ở Việt Nam sử dụng tiền viện trợ không hoàn lại, tiền viện trợ nhân đạo của tổ chức, cá nhân nước ngoài để mua hàng hóa, dịch vụ phục vụ cho chương trình, dự án viện trợ không hoàn lại, viện trợ nhân đạo tại Việt Nam thì được hoàn số thuế GTGT đã trả cho hàng hóa, dịch vụ đó.","B":"","C":"Cả A và","D":"Không có phương án đúng."},"t":"Tổng hợp"},{"n":1220,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, điều kiện hoàn thuế GTGT đối với hàng hóa xuất khẩu gồm:","c":{"A":"Có hợp đồng xuất khẩu.","B":"Có tờ khai hải quan.","C":"Có chứng từ thanh toán không dùng tiền mặt.","D":"Đáp ứng đủ các điều kiện trên theo quy định."},"t":"Thuế GTGT"},{"n":1221,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, DAĐT của CSKD không góp đủ số vốn điều lệ như đã đăng ký tại thời điểm nộp hồ sơ hoàn thuế, thì:","c":{"A":"CSKD không được hoàn thuế GTGT mà được kết chuyển số thuế chưa được khấu trừ của dự án đầu tư theo quy định của pháp luật về đầu tư sang kỳ tiếp theo.","B":"CSKD được hoàn thuế GTGT, được kết chuyển số thuế chưa được khấu trừ của dự án đầu tư theo quy định của pháp luật về đầu tư sang kỳ tiếp theo.","C":"CSKD không được hoàn thuế GTGT, không được kết chuyển số thuế chưa được khấu trừ của dự án đầu tư theo quy định của pháp luật về đầu tư sang kỳ tiếp theo.","D":"Không có phương án đúng."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1222,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, trường hợp DAĐT đang trong giai đoạn đầu tư chưa đi vào hoạt động sản xuất, kinh doanh nhưng phải chấm dứt hoạt động của DAĐT, chưa phát sinh thuế GTGT đầu ra của hoạt động sản xuất, kinh doanh chính theo DAĐT thì:","c":{"A":"CSKD phải nộp lại số thuế GTGT đã được hoàn của DAĐT vào NSNN theo quy định của pháp luật về quản lý thuế.","B":"","C":"Cả A và","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1223,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, đối với trường hợp hàng hóa gia công chuyển tiếp, nếu không có đủ các thủ tục, hồ sơ về điều kiện khấu trừ thuế GTGT đầu vào theo quy định thì:","c":{"A":"Không phải tính và nộp thuế GTGT.","B":"","C":"Cả A và","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1224,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, điều kiện khấu trừ đối với hoạt động xây dựng, lắp đặt công trình ở nước ngoài hoặc ở trong khu phi thuế quan:","c":{"A":"Có hợp đồng xây dựng, lắp đặt công trình ở nước ngoài hoặc ở trong khu phi thuế quan.","B":"","C":"Cả A và","D":"Không có phương án đúng."},"t":"Tổng hợp"},{"n":1225,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế GTGT đầu vào của TSCĐ sử dụng cho cả hoạt động chịu và không chịu thuế được khấu trừ như thế nào?","c":{"A":"Khấu trừ theo tỷ lệ khấu hao cho hoạt động chịu thuế.","B":"","C":"Khấu trừ toàn bộ.","D":"Cả A và"},"t":"Thuế GTGT"},{"n":1226,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, CSKD không được khấu trừ đối với thuế GTGT đầu vào của TSCĐ, máy móc, thiết bị trong trường hợp nào:","c":{"A":"TSCĐ, máy móc, thiết bị chuyên dùng phục vụ sản xuất sản phẩm quốc phòng, an ninh.","B":"TSCĐ, máy móc, thiết bị của các tổ chức tín dụng, doanh nghiệp kinh doanh tái bảo hiểm, bảo hiểm nhân thọ, kinh doanh chứng khoán, cơ sở khám, chữa bệnh, cơ sở đào tạo.","C":"Máy bay, trực thăng, tàu lượn dân dụng, du thuyền không sử dụng cho mục đích kinh doanh vận chuyển hàng hóa, hành khách, kinh doanh du lịch, khách sạn.","D":"Tất cả các phương án trên."},"t":"Thuế GTGT"},{"n":1227,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, đối với hoạt động chế tác vàng bạc, số thuế GTGT phải nộp được xác định bằng:","c":{"A":"Giá trị gia tăng nhân với thuế suất thuế GTGT áp dụng đối với hoạt động chế tác vàng, bạc.","B":"Thuế GTGT đầu ra - Thuế GTGT đầu vào được khấu trừ","C":"Giá thanh toán của hàng hóa, dịch vụ bán ra - Giá thanh toán của hàng hóa, dịch vụ mua vào.","D":"Doanh số bán ra x tỷ lệ tương ứng áp dụng đối với hoạt động chế tác vàng bạc."},"t":"Thuế GTGT"},{"n":1228,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế suất thuế GTGT 0% không áp dụng đối với:","c":{"A":"Hàng hóa xuất khẩu, dịch vụ xuất khẩu.","B":"Vận tải quốc tế.","C":"Xe ô tô bán cho tổ chức, cá nhân trong khu phi thuế quan.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1229,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, giá đất được trừ để tính thuế GTGT đối với trường hợp được Nhà nước giao đất để đầu tư cơ sở hạ tầng xây dựng nhà để bán được quy định:","c":{"A":"Là tiền sử dụng đất phải nộp NSNN theo quy định pháp luật về thu tiền sử dụng đất.","B":"Là giá đất trúng đấu giá.","C":"Là tiền thuê đất phải nộp NSNN theo quy định pháp luật về thu tiền thuê đất, thuê mặt nước và tiền bồi thường, giải phóng mặt bằng (nếu có).","D":"Là tiền sử dụng đất phải nộp NSNN theo quy định pháp luật về thu tiền sử dụng đất và tiền bồi thường, giải phóng mặt bằng (nếu có)."},"t":"Thuế GTGT"},{"n":1230,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, giá tính thuế GTGT đối với hoạt động kinh doanh bất động sản:","c":{"A":"Giá bán bất động sản.","B":"Giá bán nhà và quyền sử dụng đất.","C":"Giá bán bất động sản chưa có thuế GTGT, trừ tiền sử dụng đất hoặc tiền thuê đất nộp ngân sách nhà nước (giá đất được trừ).","D":"Tất cả các câu trả lời trên đều sai."},"t":"Thuế GTGT"},{"n":1231,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, hoạt động nghệ thuật biểu diễn truyền thống, dân gian là các hoạt động nghệ thuật biểu diễn, nghệ thuật trình diễn dân gian theo quy định pháp luật về nghệ thuật biểu diễn và di sản văn hóa áp dụng thuế suất nào?","c":{"A":"Không chịu thuế.","B":"5%.","C":"10%.","D":"8%."},"t":"Tổng hợp"},{"n":1232,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, trường hợp nào sau đây không được áp dụng thuế suất 0%?","c":{"A":"Chuyển giao công nghệ, chuyển nhượng quyền sở hữu trí tuệ ra nước ngoài.","B":"Dịch vụ tái bảo hiểm ra nước ngoài.","C":"Dịch vụ cấp tín dụng.","D":"Tất cả các đáp án trên."},"t":"Thuế GTGT"},{"n":1233,"q":"Đối với TSCĐ là ô tô chở người từ 09 chỗ ngồi trở xuống (trừ ô tô sử dụng vào kinh doanh vận chuyển hàng hóa, hành khách, kinh doanh du lịch, khách sạn; ô tô dùng để làm mẫu và lái thử cho kinh doanh ô tô) có trị giá vượt trên 1,6 tỷ đồng (giá chưa có thuế GTGT) thì số thuế GTGT đầu vào được khấu trừ tương ứng với:","c":{"A":"Toàn bộ giá trị tài sản cố định.","B":"Phần giá trị trên 1,6 tỷ đồng.","C":"Phần trị giá đến 1,6 tỷ đồng.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1234,"q":"Thời gian áp dụng ổn định phương pháp khấu trừ thuế GTGT theo Nghị định số 181/2025/NĐ-CP:","c":{"A":"được áp dụng ổn định trong cả năm dương lịch.","B":"02 năm liên tục.","C":"03 năm liên tục.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1235,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, cách xác định Doanh thu hằng năm để áp dụng phương pháp khấu trừ thuế:","c":{"A":"Doanh thu hằng năm do CSKD tự xác định căn cứ vào tổng cộng chỉ tiêu “Tổng doanh thu của hàng hóa, dịch vụ bán ra chịu thuế GTGT” trên Tờ khai thuế GTGT tháng của kỳ tính thuế từ tháng 12 năm trước đến hết kỳ tính thuế tháng 11 năm hiện tại, trước năm xác định phương pháp tính thuế GTGT hoặc trên Tờ khai thuế GTGT quý của kỳ tính thuế từ quý 4 năm trước đến hết kỳ tính thuế quý 3 năm hiện tại, trước năm xác định phương pháp tính thuế GTGT.","B":"Doanh thu hằng năm do CSKD tự xác định căn cứ vào tổng cộng chỉ tiêu “Tổng doanh thu của hàng hóa, dịch vụ bán ra chịu thuế GTGT” trên Tờ khai thuế GTGT tháng của kỳ tính thuế từ tháng 11 năm trước đến hết kỳ tính thuế tháng 10 năm hiện tại, trước năm xác định phương pháp tính thuế GTGT hoặc trên Tờ khai thuế GTGT quý của kỳ tính thuế từ quý 4 năm trước đến hết kỳ tính thuế quý 3 năm hiện tại, trước năm xác định phương pháp tính thuế GTGT.","C":"Doanh thu hằng năm do CSKD tự xác định căn cứ vào tổng cộng chỉ tiêu “Tổng doanh thu của hàng hóa, dịch vụ bán ra chịu thuế GTGT” trên Tờ khai thuế GTGT tháng của kỳ tính thuế từ tháng 1 đến hết kỳ tính thuế tháng 12 năm hiện tại, trước năm xác định phương pháp tính thuế GTGT hoặc trên Tờ khai thuế GTGT quý của kỳ tính thuế từ quý 1 đến hết kỳ tính thuế quý 4 năm hiện tại, trước năm xác định phương pháp tính thuế GTGT.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1236,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thời điểm xác định thuế GTGT đối với hàng hóa xuất khẩu:","c":{"A":"Đối với hàng hóa xuất khẩu, thời điểm xác định thuế GTGT do người bán tự xác định nhưng chậm nhất không quá 02 ngày làm việc tiếp theo kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan.","B":"Đối với hàng hóa xuất khẩu, thời điểm xác định thuế GTGT do người bán tự xác định nhưng chậm nhất không quá 03 ngày làm việc tiếp theo kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan.","C":"Đối với hàng hóa xuất khẩu, thời điểm xác định thuế GTGT do người bán tự xác định nhưng chậm nhất không quá ngày làm việc tiếp theo kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1237,"q":"Nhận định nào sau đây là sai về đối tượng không chịu thuế GTGT theo Luật số 149/2025/QH15 sửa đổi, bổ sung một số Điều của Luật thuế GTGT:","c":{"A":"Sản phẩm giống vật nuôi, vật liệu nhân giống cây trồng không chịu thuế GTGT.","B":"Doanh nghiệp bán phế liệu, phế phẩm thu hồi được áp dụng mức thuế suất 0%.","C":"Vận chuyển hành khách công cộng bằng xe buýt không chịu thuế GTGT.","D":"Sản phẩm xuất khẩu là khoáng sản chưa chế biến thuộc danh mục hạn chế xuất khẩu không chịu thuế GTGT."},"t":"Thuế GTGT"},{"n":1238,"q":"Doanh nghiệp X nhập khẩu lô hàng điện tử từ Trung Quốc về Việt Nam. Sau đó, doanh nghiệp xuất khẩu nguyên trạng lô hàng này sang Hoa Kỳ mà không qua bất kỳ công đoạn gia công, chế biến nào. Theo quy định, trường hợp này có được hoàn thuế GTGT đầu vào đối với hàng xuất khẩu không?.","c":{"A":"Có, vì hàng hóa đã thực hiện xuất khẩu ra nước ngoài.","B":"Có, nếu việc xuất khẩu được thực hiện tại địa bàn hoạt động hải quan.","C":"Không, vì đây là hàng nhập khẩu sau đó xuất khẩu sang nước khác.","D":"Không, vì hàng hóa không thuộc đối tượng áp dụng thuế suất 0%."},"t":"Thuế GTGT"},{"n":1239,"q":"Theo Luật số 149/2025/QH15 sửa đổi Luật thuế GTGT 2024, điểm khác biệt quan trọng nhất về điều kiện hoàn thuế đối với CSKD có hiệu lực từ ngày 01/01/2026 là gì?","c":{"A":"Cơ sở kinh doanh phải nộp thuế theo phương pháp khấu trừ.","B":"Cơ sở kinh doanh phải có tài khoản ngân hàng theo mã số thuế.","C":"Bãi bỏ điều kiện người bán đã kê khai, nộp thuế GTGT theo quy định đối với hóa đơn đã xuất cho CSKD đề nghị hoàn thuế.","D":"Cơ sở kinh doanh phải lập và lưu giữ sổ kế toán theo quy định."},"t":"Thuế GTGT"},{"n":1240,"q":"Trường hợp nào sau đây thuộc đối tượng không chịu thuế GTGT theo Nghị định số 181/2025/NĐ-CP:","c":{"A":"Chuyển quyền sử dụng đất theo quy định của pháp luật về đất đai.","B":"Vận tải quốc tế.","C":"Phân bón, quặng để sản xuất phân bón, thuốc bảo vệ thực vật và chất kích thích tăng trưởng vật nuôi theo quy định của pháp luật, trong đó: quặng để sản xuất phân bón là các quặng làm nguyên liệu để sản xuất phân bón như quặng Apatít dùng để sản xuất các loại phân bón chứa lân, đất bùn làm phân vi sinh; thuốc bảo vệ thực vật thực hiện theo quy định của pháp luật về bảo vệ và kiểm dịch thực vật.","D":"Thiết bị y tế theo quy định của pháp luật về quản lý thiết bị y tế; thuốc phòng bệnh, chữa bệnh; dược chất, dược liệu là nguyên liệu sản xuất thuốc chữa bệnh, thuốc phòng bệnh."},"t":"Thuế GTGT"},{"n":1241,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, máy móc thiết bị nhập khẩu để sử dụng trực tiếp vào hoạt động nghiên cứu khoa học thuộc đối tượng:","c":{"A":"Không chịu thuế GTGT","B":"Chịu thuế GTGT","C":"Không chịu thuế GTGT nếu thuộc loại trong nước đã sản xuất được","D":"Không chịu thuế GTGT nếu thuộc loại trong nước chưa sản xuất được."},"t":"Tổng hợp"},{"n":1242,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, hàng hóa, dịch vụ nào sau đây thuộc đối tượng không chịu thuế GTGT:","c":{"A":"Vận chuyển hành khách công cộng bằng xe buýt, tàu điện, phương tiện thủy nội địa thực hiện nội tỉnh, trong đô thị và các tuyến lân cận ngoại tỉnh có các điểm dừng đón, trả khách.","B":"Hàng hóa xuất khẩu ra nước ngoài, kể cả ủy thác xuất khấu.","C":"Hàng hóa gia công chuyển tiếp.","D":"Hàng hóa xuất khẩu tại chỗ."},"t":"Thuế GTGT"},{"n":1243,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế suất thuế GTGT 0% được áp dụng trong các trường hợp nào sau đây:","c":{"A":"Vận tải quốc tế.","B":"Dạy học.","C":"Dạy nghề.","D":"Sản phẩm trồng trọt."},"t":"Thuế GTGT"},{"n":1244,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, hãy chọn câu trả lời đúng:","c":{"A":"Trường hợp mua hàng hóa, dịch vụ của một người nộp thuế có giá trị dưới 05 triệu đồng nhưng mua nhiều lần trong cùng một ngày có tổng giá trị từ 05 triệu đồng trở lên thì chỉ được khấu trừ thuế đối với trường hợp có chứng từ thanh toán không dùng tiền mặt.","B":"","C":"Cả A và","D":"Không có phương án đúng."},"t":"Tổng hợp"},{"n":1245,"q":"Đối với hàng hóa, dịch vụ chuyển từ đối tượng không chịu thuế GTGT sang đối tượng chịu thuế GTGT theo quy định tại Luật thuế GTGT số 48/2024/QH15, CSKD chỉ được kê khai, khấu trừ thuế GTGT đầu vào của hàng hóa, dịch vụ sử dụng cho SXKD hàng hóa, dịch vụ chịu thuế GTGT:","c":{"A":"Phát sinh từ ngày 01/7/2025.","B":"Phát sinh trước ngày 01/7/2025.","C":"Phát sinh từ ngày 01/01/2025.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1246,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, hãy chọn câu trả lời đúng:","c":{"A":"Thuế GTGT đầu vào phát sinh trong tháng, quý nào được kê khai, khấu trừ khi xác định số thuế phải nộp của tháng, quý đó.","B":"Thuế GTGT đầu vào phát sinh trong tháng, quý nào được kê khai, khấu trừ khi xác định số thuế phải nộp của tháng, quý đó và phải phân biệt đã xuất dùng hay còn để trong kho.","C":"Thuế GTGT đầu vào phát sinh trong tháng, quý nào được kê khai, khấu trừ khi xác định số thuế phải nộp của tháng, quý đó, không phân biệt đã xuất dùng hay còn để trong kho.","D":"Không có phương án đúng."},"t":"Tổng hợp"},{"n":1247,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, hãy chọn câu trả lời đúng:","c":{"A":"Trường hợp CSKD có hoạt động mua, bán, chế tác vàng, bạc, đá quý thì CSKD phải hạch toán riêng hoạt động này để nộp thuế theo phương pháp tính trực tiếp trên GTGT.","B":"Trường hợp CSKD có hoạt động mua, bán, chế tác vàng, bạc, đá quý thì CSKD phải hạch toán riêng hoạt động này để nộp thuế theo phương pháp khấu trừ.","C":"Trường hợp CSKD có hoạt động mua, bán, chế tác vàng, bạc, đá quý thì CSKD không phải hạch toán riêng hoạt động này và nộp thuế chung với các hoạt động khác.","D":"Không có phương án đúng."},"t":"Tổng hợp"},{"n":1248,"q":"Chi nhánh mới thành lập của doanh nghiệp đang nộp thuế GTGT theo phương pháp khấu trừ thuế (bao gồm cả chi nhánh được thành lập từ DAĐT của doanh nghiệp) thuộc trường hợp khai thuế GTGT riêng theo quy định của pháp luật về quản lý thuế thì xác định phương pháp tính thuế của chi nhánh như thế nào:","c":{"A":"Theo phương pháp tính thuế của doanh nghiệp đang hoạt động.","B":"Tùy điều kiện.","C":"Phương pháp trực tiếp.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1249,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, số thuế GTGT phải nộp theo phương pháp khấu trừ được xác định:","c":{"A":"Số thuế GTGT đầu ra (-) Số thuế GTGT đầu vào được khấu trừ.","B":"Tổng số thuế GTGT đầu ra.","C":"Số thuế GTGT đầu ra (-) Số thuế GTGT đầu vào.","D":"Giá trị gia tăng của hàng hóa dịch vụ chịu thuế bán ra (x) với thuế suất thuế GTGT của loại hàng hóa - dịch vụ đó."},"t":"Thuế GTGT"},{"n":1250,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế GTGT đầu vào của hàng hóa (kể cả hàng hóa mua ngoài hoặc hàng hóa do cơ sở kinh doanh tự sản xuất) mà CSKD sử dụng để cho, biếu, tặng, khuyến mại, quảng cáo thì:","c":{"A":"Khấu trừ 50%.","B":"Không được khấu trừ.","C":"Khấu trừ toàn bộ.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1251,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế GTGT đầu vào của hàng hóa, dịch vụ sử dụng cho sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế GTGT được khấu trừ như thế nào?","c":{"A":"Khấu trừ toàn bộ.","B":"Khấu trừ 50%.","C":"Không được khấu trừ.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1252,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, mặt hàng đồ chơi cho trẻ em thuế suất thuế GTGT bao nhiêu?","c":{"A":"Không chịu thuế.","B":"Thuế suất thuế GTGT 0%.","C":"Thuế suất thuế GTGT 5%.","D":"Thuế suất thuế GTGT 10%."},"t":"Thuế GTGT"},{"n":1253,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, mức thuế suất thuế GTGT 5% áp dụng đối với trường hợp nào dưới đây:","c":{"A":"Sản phẩm trồng trọt chưa qua chế biến do tổ chức, cá nhân tự trồng bán ra.","B":"Cây giống, con giống nhập khẩu theo quy định.","C":"Sản phẩm trồng trọt chưa qua chế biến ở khâu kinh doanh thương mại.","D":"Muối."},"t":"Thuế GTGT"},{"n":1254,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, mức thuế suất 5% áp dụng đối với hàng hóa, dịch vụ nào?","c":{"A":"Mủ cao su dạng mủ cờ rếp, mủ tờ, mủ bún, mủ cốm; lưới, dây giềng và sợi để đan lưới đánh cá.","B":"Dịch vụ đào đắp, nạo vét kênh, mương, ao hồ phục vụ sản xuất nông nghiệp; nuôi trồng, chăm sóc, phòng trừ sâu bệnh cho cây trồng; sơ chế, bảo quản sản phẩm nông nghiệp.","C":"Sản phẩm bằng đay, cói, tre, nứa, lá, rơm, vỏ dừa, sọ dừa, bèo tây và các sản phẩm thủ công khác sản xuất bằng nguyên liệu tận dụng từ nông nghiệp; xơ bông đã qua chải thô, chải kỹ; giấy in báo.","D":"Cả 03 phương án trên."},"t":"Thuế GTGT"},{"n":1255,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thời điểm xác định thuế GTGT đối với hoạt động xây dựng nhà để bán trong trường hợp đã chuyển giao quyền sở hữu, quyền sử dụng:","c":{"A":"Là thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho người mua, đã thu tiền.","B":"Là thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho người mua, chưa thu tiền.","C":"Là thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho người mua, không phân biệt đã thu được tiền hay chưa thu được tiền.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1256,"q":"Đối tượng nào dưới đây thuộc đối tượng không chịu thuế GTGT theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Chuyển nhượng dự án đầu tư.","B":"Dịch vụ bưu chính, viễn thông công ích.","C":"Dịch vụ chiếu sáng công cộng.","D":"Chuyển nhượng vốn."},"t":"Thuế GTGT"},{"n":1257,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, nhà ở thuộc tài sản công do Nhà nước bán cho người đang thuê thuộc đối tượng chịu thuế GTGT với thuế suất nào?.","c":{"A":"Thuế suất thuế GTGT 0%.","B":"Thuế suất thuế GTGT 5%.","C":"Thuế suất thuế GTGT 10%.","D":"Không chịu thuế GTGT"},"t":"Thuế GTGT"},{"n":1258,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, hoạt động nghệ thuật biểu diễn truyền thống, dân gian theo quy định pháp luật về nghệ thuật biểu diễn và di sản văn hóa, áp dụng thuế suất thuế GTGT:","c":{"A":"Thuế suất thuế GTGT 5%.","B":"Thuế suất thuế GTGT 10%.","C":"Không chịu thuế GTGT.","D":"Không có phương án nào đúng."},"t":"Thuế GTGT"},{"n":1259,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thuế suất thuế GTGT đối với máy móc, thiết bị chuyên dùng phục vụ cho sản xuất nông nghiệp:","c":{"A":"Không chịu thuế GTGT.","B":"Thuế suất thuế GTGT 5%.","C":"Thuế suất thuế GTGT 10%.","D":"Không có phương án nào đúng."},"t":"Thuế GTGT"},{"n":1260,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, điều kiện áp dụng thuế suất thuế GTGT 0% đối với dịch vụ xuất khẩu:","c":{"A":"Hợp đồng cung cấp dịch vụ với tổ chức, cá nhân ở nước ngoài hoặc ở trong khu phi thuế quan.","B":"","C":"Cả A và","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1261,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, điều kiện áp dụng thuế suất thuế GTGT 0% đối với hàng hóa xuất khẩu:","c":{"A":"Hợp đồng bán, gia công hàng hóa xuất khẩu (đối với trường hợp bán, gia công); hợp đồng ủy thác xuất khẩu (đối với trường hợp ủy thác xuất khẩu).","B":"Chứng từ thanh toán không dùng tiền mặt đối với hàng hóa xuất khẩu.","C":"Tờ khai hải quan theo quy định.","D":"Cả 3 phương án trên."},"t":"Thuế GTGT"},{"n":1262,"q":"Hàng hóa, dịch vụ nào sau đây không thuộc đối tượng không chịu thuế GTGT theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Vận chuyển hành khách công cộng bằng xe buýt, tàu điện.","B":"Máy móc, thiết bị, phụ tùng, vật tư thuộc loại trong nước chưa sản xuất được.","C":"Thiết bị y tế theo quy định của pháp luật về quản lý thiết bị y tế.","D":"Chuyển giao công nghệ theo quy định của Luật Chuyển giao công nghệ."},"t":"Thuế GTGT"},{"n":1263,"q":"Thuế suất thuế GTGT 5% không áp dụng đối với mặt hàng nào theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Vận chuyển hành khách công cộng bằng xe buýt, tàu điện.","B":"Thiết bị y tế theo quy định của pháp luật về quản lý thiết bị y tế.","C":"Đồ chơi cho trẻ em.","D":"Cả 3 phương án trên."},"t":"Thuế GTGT"},{"n":1264,"q":"Hàng hóa xuất khẩu để được áp dụng thuế suất thuế GTGT 0% theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Hàng hóa từ Việt Nam bán cho tổ chức, cá nhân ở nước ngoài và được tiêu dùng ở ngoài Việt Nam.","B":"Hàng hóa từ nội địa Việt Nam bán cho tổ chức trong khu phi thuế quan và được tiêu dùng trong khu phi thuế quan phục vụ trực tiếp cho hoạt động sản xuất xuất khẩu.","C":"Hàng hóa đã bán tại khu vực cách ly cho cá nhân (người nước ngoài hoặc người Việt Nam) đã làm thủ tục xuất cảnh; hàng hóa đã bán tại cửa hàng miễn thuế.","D":"Cả 3 phương án trên."},"t":"Thuế GTGT"},{"n":1265,"q":"Hàng hóa dịch vụ nào áp dụng thuế suất 10% theo quy định của Nghị định số 181/2025/NĐ-CP:","c":{"A":"Xây dựng, lắp đặt.","B":"Kinh doanh ngoại tệ.","C":"Đồ chơi cho trẻ em.","D":"Tất cả các phương án trên."},"t":"Tổng hợp"},{"n":1266,"q":"Các trường hợp thuộc đối tượng không chịu thuế GTGT theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Kinh doanh ngoại tệ.","B":"Dịch vụ du lịch.","C":"Dịch vụ quảng cáo.","D":"Tất cả các phương án trên."},"t":"Thuế GTGT"},{"n":1267,"q":"Hàng hóa dịch vụ nào áp dụng thuế suất 10% theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Dịch vụ đào đắp, nạo vét kênh, mương, ao hồ phục vụ sản xuất nông nghiệp.","B":"Dịch vụ sửa chữa, bảo trì.","C":"Đồ chơi cho trẻ em.","D":"Tất cả các phương án trên."},"t":"Tổng hợp"},{"n":1268,"q":"Các trường hợp áp dụng thuế suất 5% theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Dịch vụ đào đắp, nạo vét kênh, mương, ao hồ phục vụ sản xuất nông nghiệp.","B":"Dịch vụ du lịch.","C":"Dịch vụ quảng cáo.","D":"Tất cả các phương án trên."},"t":"Thuế GTGT"},{"n":1269,"q":"Các trường hợp không áp dụng thuế suất 0% theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Thuốc lá, rượu, bia nhập khẩu sau đó xuất khẩu.","B":"Xăng, dầu mua tại nội địa bán cho CSKD trong khu phi thuế quan.","C":"Xe ô tô bán cho tổ chức, cá nhân trong khu phi thuế quan.","D":"Tất cả các phương án trên."},"t":"Thuế GTGT"},{"n":1270,"q":"Các trường hợp không áp dụng thuế suất 0% theo quy định tại Nghị định số 181/2025/NĐ-CP:","c":{"A":"Chuyển giao công nghệ, chuyển nhượng quyền sở hữu trí tuệ ra nước ngoài.","B":"Dịch vụ tái bảo hiểm ra nước ngoài.","C":"Dịch vụ cấp tín dụng.","D":"Tất cả các phương án trên."},"t":"Thuế GTGT"},{"n":1271,"q":"Theo quy định của Nghị định số 181/2025/NĐ-CP, mức thuế suất thuế GTGT 0% áp dụng đối với hàng hóa, dịch vụ nào?","c":{"A":"Hàng hóa từ Việt Nam bán cho tổ chức, cá nhân ở nước ngoài và được tiêu dùng ở ngoài Việt Nam.","B":"Hàng hóa từ nội địa Việt Nam bán cho tổ chức trong khu phi thuế quan và được tiêu dùng trong khu phi thuế quan phục vụ trực tiếp cho hoạt động sản xuất xuất khẩu.","C":"Dịch vụ tái bảo hiểm ra nước ngoài.","D":"Phương án A, B"},"t":"Thuế GTGT"},{"n":1272,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thời điểm xác định thuế GTGT đối với hoạt động xây dựng, lắp đặt:","c":{"A":"Thời điểm nghiệm thu, bàn giao công trình, hạng mục công trình, khối lượng xây dựng, lắp đặt hoàn thành và đã thu được tiền.","B":"Thời điểm thu được tiền theo hợp đồng.","C":"Thời điểm nghiệm thu, bàn giao công trình, hạng mục công trình, khối lượng xây dựng, lắp đặt hoàn thành hay phần công việc thực hiện bàn giao.","D":"Thời điểm nghiệm thu, bàn giao công trình, hạng mục công trình, khối lượng xây dựng, lắp đặt hoàn thành hay phần công việc thực hiện bàn giao, không phân biệt đã thu được tiền hay chưa thu được tiền."},"t":"Thuế GTGT"},{"n":1273,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, thời điểm xác định thuế GTGT đối với hoạt động cung cấp nước sạch:","c":{"A":"Thời điểm hoàn thành việc đối soát dữ liệu giữa các bên nhưng chậm nhất không quá ngày 03 của tháng sau tháng phát sinh việc cung cấp nước.","B":"Thời điểm hoàn thành việc đối soát dữ liệu giữa các bên nhưng chậm nhất không quá ngày 05 của tháng sau tháng phát sinh việc cung cấp nước.","C":"Thời điểm hoàn thành việc đối soát dữ liệu giữa các bên nhưng chậm nhất không quá ngày 07 của tháng sau tháng phát sinh việc cung cấp nước.","D":"Thời điểm hoàn thành việc đối soát dữ liệu giữa các bên nhưng chậm nhất không quá ngày 10 của tháng sau tháng phát sinh."},"t":"Thuế GTGT"},{"n":1274,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, trường hợp xây dựng, lắp đặt không bao thầu nguyên vật liệu, giá tính thuế GTGT:","c":{"A":"Giá trị xây dựng lắp đặt thực tế.","B":"Giá xây dựng lắp đặt không bao gồm giá trị nguyên vật liệu, chưa có thuế GTGT.","C":"Giá xây dựng, lắp đặt bao gồm cả giá trị nguyên vật liệu, chưa có thuế GTGT.","D":"Giá tính thuế hạng mục công trình hoặc giá trị khối lượng công việc hoàn thành bàn giao chưa có thuế GTGT."},"t":"Thuế GTGT"},{"n":1275,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, trường hợp xây dựng, lắp đặt có bao thầu nguyên vật liệu, giá tính thuế GTGT:","c":{"A":"Giá trị xây dựng lắp đặt thực tế","B":"Giá xây dựng, lắp đặt không bao gồm giá trị nguyên vật liệu, chưa có thuế GTGT.","C":"Giá xây dựng, lắp đặt bao gồm cả giá trị nguyên vật liệu, chưa có thuế GTGT.","D":"Giá tính thuế hạng mục công trình hoặc giá trị khối lượng công việc hoàn thành bàn giao chưa có thuế GTGT."},"t":"Thuế GTGT"},{"n":1276,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, giá tính thuế GTGT đối với dịch vụ du lịch theo hình thức lữ hành, hợp đồng ký với khách hàng theo giá trọn gói (ăn, ở, đi lại):","c":{"A":"Giá trọn gói.","B":"Giá trọn gói/(1 + thuế suất).","C":"Giá trọn gói x thuế suất.","D":"Tất cả đều sai."},"t":"Thuế GTGT"},{"n":1277,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, giá tính thuế GTGT đối với hoạt động vận tải, bốc xếp:","c":{"A":"Giá cước vận tải, bốc xếp đã có thuế GTGT, không phân biệt cơ sở trực tiếp vận tải, bốc xếp hay thuê lại.","B":"Giá cước vận tải, bốc xếp chưa bao gồm thuế GTGT, không phân biệt cơ sở trực tiếp vận tải, bốc xếp hay thuê lại.","C":"Giá cước vận tải, bốc xếp trừ (-) các chi phí liên quan đến hoạt động vận tải, bốc xếp, chưa có thuế GTGT.","D":"Giá cước vận tải, bốc xếp đã có thuế GTGT đối với trường hợp thuê lại."},"t":"Thuế GTGT"},{"n":1278,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, nguyên tắc xác định giá tính thuế GTGT đối với cơ sở kinh doanh áp dụng hình thức chiết khấu thương mại dành cho khách hàng:","c":{"A":"Giá bán chưa chiết khấu thương mại dành cho khách hàng.","B":"Giá bán đã chiết khấu thương mại dành cho khách hàng.","C":"Giá bán chưa chiết khấu thương mại dành cho khách hàng chưa có thuế GTGT.","D":"Giá bán đã chiết khấu thương mại dành cho khách hàng chưa có thuế GTGT."},"t":"Thuế GTGT"},{"n":1279,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, giá tính thuế GTGT đối với hoạt động kinh doanh bất động sản:","c":{"A":"Giá bán bất động sản.","B":"Giá bán bất động sản chưa có thuế GTGT.","C":"Giá bán bất động sản chưa có thuế GTGT, chưa trừ tiền sử dụng đất hoặc tiền thuê đất nộp ngân sách nhà nước.","D":"Giá bán bất động sản chưa có thuế GTGT, trừ tiền sử dụng đất hoặc tiền thuê đất nộp ngân sách nhà nước (giá đất được trừ)."},"t":"Thuế GTGT"},{"n":1280,"q":"Theo quy định tại Nghị định số 181/2025/NĐ-CP, vàng chưa chế tác thành đồ trang sức khi nhập khẩu thuộc đối tượng","c":{"A":"Không chịu thuế GTGT.","B":"Chịu thuế GTGT với thuế suất 0%.","C":"Chịu thuế GTGT với thuế suất 5%.","D":"Chịu thuế GTGT với thuế suất 10%."},"t":"Tổng hợp"},{"n":1281,"q":"Đối tượng áp dụng theo quy định của Nghị định số 181/2025/NĐ-CP ngày 01/7/2025 quy định chi tiết thi hành một số Điều của Luật thuế GTGT:","c":{"A":"Người nộp thuế theo quy định của Điều 3 Nghị định 181/2025/NĐ-CP.","B":"Cơ quan quản lý thuế theo quy định của pháp luật về quản lý thuế.","C":"Các tổ chức, cá nhân khác có liên quan.","D":"Tất cả 3 phương án trên."},"t":"Thuế GTGT"},{"n":1282,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, các trường hợp không được áp dụng thuế suất thuế GTGT 0%:","c":{"A":"Dịch vụ tái bảo hiểm ra nước ngoài.","B":"Thuốc lá, rượu, bia nhập khẩu sau đó xuất khẩu.","C":"Xăng, dầu mua tại nội địa bán cho cơ sở kinh doanh trong khu phi thuế quan; xe ô tô bán cho tổ chức, cá nhân trong khu phi thuế quan.","D":"Tất cả các phương án trên."},"t":"Thuế GTGT"},{"n":1283,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, thời điểm xác định thuế GTGT đối với hàng hóa xuất khẩu?","c":{"A":"Người bán tự xác định nhưng chậm nhất không quá ngày làm việc tiếp theo kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan.","B":"Từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan.","C":"Ngày tiếp theo kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan.","D":"Chậm nhất không quá ngày kế tiếp ngày làm việc tiếp theo kể từ ngày hàng hóa được thông quan theo quy định của pháp luật về hải quan."},"t":"Thuế GTGT"},{"n":1284,"q":"Doanh nghiệp A (nộp thuế GTGT theo phương pháp khấu trừ) mua lúa gạo của hợp tác xã B (đã qua sơ chế thông thường). Sau đó, Doanh nghiệp A bán lô hàng này cho Doanh nghiệp C (cũng nộp thuế GTGT theo phương pháp khấu trừ). Theo Luật sửa đổi 2025, Doanh nghiệp A phải xử lý thuế GTGT như thế nào?","c":{"A":"Không phải kê khai, tính nộp thuế GTGT đầu ra, nhưng được khấu trừ thuế GTGT đầu vào.","B":"Phải kê khai và nộp thuế GTGT với thuế suất 5%.","C":"Phải kê khai và nộp thuế GTGT với thuế suất 0%.","D":"Không phải kê khai, không được khấu trừ thuế đầu vào."},"t":"Thuế GTGT"},{"n":1285,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, phế phẩm, phụ phẩm, phế liệu được thu hồi trong quá trình sản xuất thì áp dụng mức thuế suất:","c":{"A":"Áp dụng thuế suất thuế GTGT 5%.","B":"Không phải kê khai, tính nộp thuế GTGT.","C":"Thuộc đối tượng không chịu thuế GTGT.","D":"Thuế suất của mặt hàng phế phẩm, phụ phẩm, phế liệu đó."},"t":"Thuế GTGT"},{"n":1286,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15, sản phẩm cây trồng, rừng trồng, chăn nuôi, thủy sản nuôi trồng, đánh bắt chưa chế biến thành các sản phẩm khác hoặc chỉ qua sơ chế thông thường của tổ chức, cá nhân tự sản xuất, đánh bắt bán ra và ở khâu nhập khẩu:","c":{"A":"Thuộc đối tượng không chịu thuế GTGT.","B":"Áp dụng thuế suất thuế GTGT 5%.","C":"Không phải kê khai, tính nộp thuế GTGT.","D":"Tất cả các đáp án trên đều sai."},"t":"Thuế GTGT"},{"n":1287,"q":"Theo quy định của Luật thuế GTGT số 48/2024/QH15 thì doanh nghiệp, hợp tác xã, liên hiệp hợp tác xã mua sản phẩm cây trồng, rừng trồng, chăn nuôi, thủy sản nuôi trồng, đánh bắt chưa chế biến thành các sản phẩm khác hoặc chỉ qua sơ chế thông thường bán cho doanh nghiệp, hợp tác xã, liên hiệp hợp tác xã khác thì:","c":{"A":"Không phải kê khai, tính nộp thuế GTGT.","B":"Áp dụng thuế suất thuế GTGT 5%.","C":"Thuộc đối tượng không chịu thuế GTGT.","D":"Tất cả các đáp án trên đều sai."},"t":"Thuế GTGT"},{"n":1288,"q":"Theo quy định tại Luật thuế GTGT số 48/2024/QH15, hàng hóa, dịch vụ nào sau đây thuộc đối tượng không chịu thuế GTGT:","c":{"A":"Hàng hóa xuất khẩu ra nước ngoài, kể cả uỷ thác xuất khẩu.","B":"Hàng hoá gia công chuyển tiếp.","C":"Hàng hoá xuất khẩu tại chỗ.","D":"Vũ khí, khí tài chuyên dùng phục vụ quốc phòng, an ninh."},"t":"Thuế GTGT"},{"n":1289,"q":"Theo quy định tại Luật thuế GTGT số 48/2024/QH15, các trường hợp sau đây, trường hợp nào không được áp dụng thuế suất thuế GTGT 0%:","c":{"A":"","B":"Dịch vụ cung cấp suất ăn hàng không cung cấp cho hãng hàng không nước ngoài.","C":"Dịch vụ chuyển nhượng quyền sở hữu trí tuệ ra nước ngoài.","D":"Dịch vụ sửa chữa tàu bay, tàu biển cung cấp cho tổ chức, cá nhân nước ngoài."},"t":"Thuế GTGT"},{"n":1290,"q":"Theo quy định tại Luật thuế GTGT số 48/2024/QH15, hàng hóa xuất khẩu tại chỗ có được áp dụng 0% không?","c":{"A":"Không.","B":"Có nếu đáp ứng đủ điều kiện theo quy định.","C":"Chỉ áp dụng 5%.","D":"Chỉ áp dụng 10%."},"t":"Thuế GTGT"},{"n":1291,"q":"Công ty B cung cấp dịch vụ tư vấn cho  số 48/2024/QH15, hàng hóa, dịch vụ nào sau đây thuộc đối tượng không chịu thuế GTGT:","c":{"A":"Hàng hóa xuất khẩu ra nước ngoài, kể cả uỷ thác xuất khẩu.","B":"Nước sạch phục vụ sản xuất và sinh hoạt.","C":"Sản phẩm xuất khẩu là tài nguyên, khoáng sản khai thác chưa chế biến thành các sản phẩm khác.","D":"Cả 3 đáp án đều đúng."},"t":"Thuế GTGT"},{"n":1298,"q":"Theo Luật thuế GTGT số 48/2024/QH15, hàng hóa, dịch vụ nào sau đây không thuộc đối tượng không chịu thuế GTGT:","c":{"A":"Kinh doanh ngoại tệ","B":"","C":"Nước sạch phục vụ sản xuất và sinh hoạt.","D":"Không có phương án đúng."},"t":"Thuế GTGT"},{"n":1299,"q":"Theo Luật thuế GTGT số 48/2024/QH15, CSKD nộp thuế theo phương pháp trực tiếp trên GTGT sử dụng loại hóa đơn nào?","c":{"A":"Hóa đơn GTGT.","B":"","C":"Cả A và","D":"Không có phương án đúng. 1301"},"t":"Thuế GTGT"},{"n":1300,"q":"Theo Luật thuế GTGT số 48/2024/QH15, theo phương pháp tính trực tiếp theo doanh thu, tỷ lệ % để tính thuế GTGT được quy định đối với sản xuất, vận tải, dịch vụ có gắn với hàng hóa, xây dựng có bao thầu nguyên vật liệu:","c":{"A":"1%","B":"5%","C":"3%","D":"2%"},"t":"Thuế GTGT"},{"n":1301,"q":"Theo Luật thuế GTGT số 48/2024/QH15, hàng hóa, dịch vụ nào sau đây không thuộc đối tượng được giải quyết hoàn thuế GTGT?","c":{"A":"Dịch vụ vận tải quốc tế.","B":"Sản phẩm nội dung thông tin số cung cấp cho bên nước ngoài và tiêu dùng ngoài Việt Nam.","C":"Thuốc lá nhập khẩu sau đó xuất khẩu.","D":"Hàng hóa bán tại cửa hàng miễn thuế cho người xuất cảnh."},"t":"Thuế GTGT"},{"n":1302,"q":"Cơ sở kinh doanh Z nộp thuế theo phương pháp khấu trừ, hoạt động trong lĩnh vực sản xuất hàng hóa chịu thuế GTGT 5%. Sau 12 tháng, cơ sở này có số thuế GTGT đầu vào của hàng hóa dịch vụ dùng cho sản xuất hàng hóa chịu thuế suất 5% chưa được khấu trừ hết là 400 triệu đồng. Cơ sở Z có được hoàn thuế GTGT không?.","c":{"A":"Không, vì hàng hóa chịu thuế suất 5% không được hoàn thuế.","B":"Có, nhưng phải đáp ứng điều kiện số thuế chưa khấu trừ hết từ 500 triệu trở lên.","C":"Có, vì đáp ứng đủ điều kiện về ngưỡng hoàn thuế và thuế suất đặc thù.","D":"Không, vì chỉ hàng xuất khẩu mới được hoàn thuế."},"t":"Thuế GTGT"},{"n":1303,"q":"Theo Luật thuế GTGT số 48/2024/QH15, đối tượng không chịu thuế GTGT bao gồm:","c":{"A":"Hàng hóa, dịch vụ của hộ, cá nhân sản xuất, kinh doanh có mức doanh thu năm từ 500 triệu đồng trở xuống.","B":"Hàng hóa, dịch vụ của hộ, cá nhân sản xuất, kinh doanh có mức doanh thu năm nhỏ hơn 500 triệu đồng.","C":"Hàng hóa, dịch vụ của hộ, cá nhân sản xuất, kinh doanh có mức doanh thu hằng năm từ 200 triệu đồng trở xuống.","D":"Hàng hóa, dịch vụ của hộ, cá nhân sản xuất, kinh doanh có mức doanh thu hằng năm từ 100 triệu đồng trở xuống."},"t":"Thuế GTGT"},{"n":1304,"q":"Theo Luật thuế GTGT số 48/2024/QH15, theo phương pháp tính trực tiếp theo doanh thu, tỷ lệ % để tính thuế GTGT được quy định đối với dịch vụ, xây dựng không bao thầu nguyên vật liệu:","c":{"A":"1%","B":"5%","C":"3%","D":"2%"},"t":"Thuế GTGT"},{"n":1305,"q":"Theo Luật thuế GTGT số 48/2024/QH15, hàng hóa, dịch vụ nào thuộc đối tượng không chịu thuế GTGT:","c":{"A":"Vận chuyển hành khách công cộng bằng xe buýt, tàu điện, phương tiện thủy nội địa.","B":"Gia công may mặc.","C":"Thiết bị dùng để giảng dạy và học tập bao gồm: các loại mô hình, hình vẽ, bảng, phấn, thước, com-pa.","D":"Dịch vụ lưu trú."},"t":"Thuế GTGT"},{"n":1306,"q":"Theo Luật thuế GTGT số 48/2024/QH15, mức thuế suất thuế GTGT 5% được áp dụng đối với:","c":{"A":"Nước sạch phục vụ sản xuất và sinh hoạt.","B":"Nước giải khát.","C":"","D":"Cả A và"},"t":"Thuế GTGT"},{"n":1307,"q":"Theo Luật thuế GTGT số 48/2024/QH15, dịch vụ cho vay của người nộp thuế không phải là tổ chức tín dụng thuộc đối tượng:","c":{"A":"Không chịu thuế GTGT.","B":"Chịu thuế GTGT với thuế suất 0%","C":"Chịu thuế GTGT với thuế suất 5%","D":"Chịu thuế GTGT với thuế suất 10%"},"t":"Thuế GTGT"},{"n":1308,"q":"Theo Luật thuế GTGT số 48/2024/QH15, kinh doanh ngoại tệ thuộc đối tượng:","c":{"A":"Không chịu thuế GTGT.","B":"Chịu thuế GTGT với thuế suất 0%","C":"Chịu thuế GTGT với thuế suất 5%","D":"Chịu thuế GTGT với thuế suất 10%"},"t":"Thuế GTGT"},{"n":1309,"q":"Theo Luật thuế GTGT số 48/2024/QH15, hàng hoá, dịch vụ nào sau đây thuộc đối tượng không chịu thuế GTGT","c":{"A":"Hàng hóa xuất khẩu ra nước ngoài, kể cả uỷ thác xuất khẩu.","B":"Nước sạch phục vụ sản xuất và sinh hoạt","C":"Sản phẩm xuất khẩu là tài nguyên, khoáng sản khai thác chưa chế biến thành các sản phẩm khác.","D":"Cả 3 đáp án đều đúng."},"t":"Thuế GTGT"},{"n":1310,"q":"Theo Luật thuế GTGT số 48/2024/QH15, hàng hoá, dịch vụ nào sau đây thuộc đối tượng không chịu thuế GTGT:","c":{"A":"Dịch vụ đào đắp, nạo vét kênh, mương, ao hồ phục vụ sản xuất nông nghiệp.","B":"Thực phẩm tươi sống ở khâu kinh doanh thương mại.","C":"Kinh doanh ngoại tệ.","D":"Lâm sản chưa qua chế biến."},"t":"Thuế GTGT"},{"n":1311,"q":"Theo Luật thuế GTGT số 48/2024/QH15, dịch vụ nào dưới đây thuộc đối tượng không chịu thuế GTGT?","c":{"A":"Dịch vụ kế toán, kiểm toán.","B":"Dịch vụ tư vấn luật.","C":"Dịch vụ tang lễ do cơ sở có chức năng cung cấp.","D":"Dịch vụ quảng cáo thương mại."},"t":"Thuế GTGT"},{"n":1312,"q":"Công ty TNHH Thăng Long nhập khẩu 01 dây chuyền sản xuất xi măng lò quay công suất lớn từ Nhật Bản. Loại máy móc này hiện nay trong nước chưa sản xuất được. Hàng hóa này có thuộc đối tượng không chịu thuế GTGT không?","c":{"A":"Có, vì là máy móc nhập khẩu.","B":"Không, vì chỉ áp dụng cho lĩnh vực dầu khí và nghiên cứu khoa học.","C":"Không, vì dây chuyền sản xuất xi măng không nằm trong danh mục chuyên dùng trong nước chưa sản xuất được phục vụ sản xuất.","D":"Có, vì trong nước chưa sản xuất được."},"t":"Thuế GTGT"},{"n":1313,"q":"Theo Luật thuế GTGT số 48/2024/QH15, đối với sản phẩm muối, trường hợp nào sau đây không thuộc đối tượng không chịu thuế GTGT?","c":{"A":"Muối i-ốt sản xuất từ nước biển.","B":"Muối dùng để sản xuất hóa chất (Na-tri-clo-rua không phải thành phần chính).","C":"Muối tinh thành phần chính là NaCl.","D":"Muối 2024/QH15, thuế GTGT đầu vào của hàng hóa, dịch vụ sử dụng cho hoạt động tìm kiếm thăm dò, phát triển mỏ dầu khí thì:","c":{"A":"Được khấu trừ toàn bộ.","B":"Không được khấu trừ.","C":"Được khấu trừ một phần.","D":"Tất cả đều sai."},"t":"Thuế GTGT"},{"n":1326,"q":"Theo Luật thuế GTGT số 48/2024/QH15, thuế GTGT đầu vào của hàng hóa, dịch vụ bán cho tổ chức, cá nhân sử dụng vốn viện trợ nhân đạo, viện trợ không hoàn thì:","c":{"A":"Không được khấu trừ.","B":"Được khấu trừ một phần.","C":"Được khấu trừ toàn bộ.","D":"Tất cả đều sai."},"t":"Thuế GTGT"},{"n":1327,"q":"Theo Luật thuế GTGT số 48/2024/QH15, đối với số thuế GTGT đầu vào không được khấu trừ, cơ sở kinh doanh thực hiện:","c":{"A":"Được tính vào chi phí để tính thuế TNDN.","B":"Được tính vào nguyên giá của TSCĐ.","C":"Không được tính vào chi phí.","D":"Được tính vào chi phí để tính thuế TNDN hoặc tính vào nguyên giá của TSCĐ theo quy định của pháp luật về thuế TNDN, trừ số thuế GTGT của hàng hóa, dịch vụ mua vào không có chứng từ thanh toán không dùng tiền mặt theo quy định của Chính phủ."},"t":"Thuế GTGT"},{"n":1328,"q":"Theo Luật thuế GTGT số 48/2024/QH15, mức thuế suất thuế GTGT 10% được áp dụng đối với:","c":{"A":"Thiết bị dùng để giảng dạy và học tập bao gồm: các loại mô hình, hình vẽ, bảng, phấn, thước, com-pa.","B":"Nước giải khát.","C":"Dịch vụ khoa học, công nghệ theo quy định của Luật Khoa học và công nghệ.","D":"Bán, cho thuê, cho thuê mua nhà ở xã hội theo quy định của Luật Nhà ở."},"t":"Thuế GTGT"},{"n":1329,"q":"Theo Luật thuế GTGT số 48/2024/QH15, thuế GTGT đầu vào của hàng hóa, dịch vụ sử dụng đồng thời cho sản xuất kinh doanh hàng hóa, dịch vụ chịu thuế và không chịu thuế thì:","c":{"A":"Không được khấu trừ toàn bộ số thuế GTGT đầu vào.","B":"Chỉ được khấu trừ số thuế GTGT đầu vào của hàng hóa, dịch vụ sử dụng cho sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế GTGT.","C":"Được khấu trừ toàn bộ số thuế GTGT đầu vào.","D":"Chỉ được khấu trừ số thuế GTGT đầu vào của hàng hóa, dịch vụ mua vào dùn :"Kế toán"},{"n":1406,"q":"Nhận khoản vay dài hạn 500 triệu từ ngân hàng chuyển vào tài khoản, kế toán hạch toán vào tài khoản nào:","c":{"A":"Nợ 112: 500 triệu đồng/ Có 311: 500 triệu đồng.","B":"Nợ 311: 500 triệu đồng / Có 112: 500 triệu đồng.","C":"Nợ 112: 500 triệu đồng / Có 341: 500 triệu đồng","D":"Nợ 111: 500 triệu đồng / Có 311: 500 triệu đồng"},"t":"Kế toán"},{"n":1407,"q":"Chi phí lãi vay phát sinh trong quá trình đầu tư, xây dựng TSCĐ được hạch toán vào tài khoản nào:","c":{"A":"TK 211","B":"TK 241","C":"TK 635","D":"TK 112"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1408,"q":"Kế toán trưởng có trách nhiệm sau đây:","c":{"A":"Thực hiện các quy định của pháp luật về kế toán, tài chính trong đơn vị kế toán;","B":"Ký hoá đơn điện tử;","C":"Ký hợp đồng kinh tê với các tổ chức liên quan.","D":"Tất cả các phương án trên."},"t":"Kế toán"},{"n":1409,"q":"Người làm kế toán có quyền độc lập về chuyên môn nghiệp vụ không?","c":{"A":"Không, phải nghe theo lệnh của Giám đốc trong mọi trường hợp.","B":"Có, được độc lập về chuyên môn nghiệp vụ kế toán.","C":"Chỉ độc lập khi làm việc tại các công ty kiểm toán.","D":"Chỉ độc lập khi được Bộ Tài chính cấp phép."},"t":"Kế toán"},{"n":1410,"q":"Khi khách hàng thanh toán công nợ bằng tiền mặt, kế toán ghi:","c":{"A":"Nợ 111 / Có 131","B":"Nợ 131 / Có 111","C":"Nợ 112 / Có 511","D":"Nợ 111 / Có 511"},"t":"Kế toán"},{"n":1411,"q":"Bộ Tài chính chịu trách nhiệm trước Chính phủ thực hiện quản lý nhà nước về kế toán, có nhiệm vụ, quyền hạn sau đây:","c":{"A":"Xây dựng, trình Chính phủ quyết định chiến lược, chính sách phát triển kế toán;","B":"Xây dựng, trình Chính phủ ban hành hoặc ban hành theo thẩm quyền văn bản quy phạm pháp luật về kế toán;","C":"Cấp, cấp lại, thu hồi Giấy chứng nhận đăng ký hành nghề dịch vụ kế toán và Giấy chứng nhận đủ điều kiện kinh doanh dịch vụ kế toán; đình chỉ hành nghề dịch vụ kế toán và đình chỉ kinh doanh dịch vụ kế toán.","D":"Tất cả các phương án trên."},"t":"Kế toán"},{"n":1412,"q":"Hệ thống tài khoản kế toán áp dụng cho doanh nghiệp do cơ quan nào quy định?","c":{"A":"Cục Thuế.","B":"Bộ Tài chính.","C":"Ngân hàng Nhà nước.","D":"Chính phủ."},"t":"Kế toán"},{"n":1413,"q":"Tài khoản kế toán dùng để làm gì trong công tác kế toán?","c":{"A":"Để giao dịch với hệ thống ngân hàng thương mại.","B":"Để phân loại và hệ thống hóa các nghiệp vụ kinh tế theo nội dung kinh tế.","C":"Để tính toán thuế thu nhập cá nhân cho nhân viên.","D":"Để lưu trữ thông tin nhà cung cấp."},"t":"Kế toán"},{"n":1414,"q":"Việc sao chép tài liệu kế toán để cung cấp cho cơ quan chức năng phải được sự đồng ý của:","c":{"A":"Người đại diện theo pháp luật của đơn vị kế toán.","B":"Trưởng phòng nhân sự.","C":"Nhân viên lưu trữ tài liệu.","D":"Khách hàng của doanh nghiệp."},"t":"Kế toán"},{"n":1415,"q":"Tài liệu kế toán nào sau đây phải lưu trữ tối thiểu 5 năm:","c":{"A":"Chứng từ kế toán không sử dụng trực tiếp để ghi sổ kế toán và lập báo cáo tài chính như phiếu thu, phiếu chi, phiếu nhập kho, phiếu xuất kho không lưu trong tập tài liệu kế toán của bộ phận kế toán.","B":"Báo cáo tài chính năm.","C":"Tài liệu liên quan đến an ninh, quốc phòng.","D":"Tài liệu kế toán liên quan đến thanh lý, nhượng bán tài sản cố định; báo cáo kết quả kiểm kê và đánh giá tài sản."},"t":"Kế toán"},{"n":1416,"q":"Hành vi giả mạo, khai khống chứng từ kế toán bị xử lý như thế nào?","c":{"A":"Chỉ nhắc nhở nội bộ.","B":"Xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự tùy mức độ.","C":"Phạt cảnh cáo bằng văn bản.","D":"Không bị xử lý nếu không làm thất thoát tiền."},"t":"Kế toán"},{"n":1417,"q":"Báo cáo tài chính hàng năm của đối tượng nào phải được kiểm toán:","c":{"A":"Doanh nghiệp có vốn đầu tư nước ngoài","B":"Tổ chức tín dụng, tổ chức tài chính, doanh nghiệp kinh doanh bảo hiểm, doanh nghiệp môi giới bảo hiểm.","C":"Công ty đại chúng, tổ chức phát hành, tổ chức kinh doanh chứng khoán.","D":"Tất cả đáp án trên đều đúng."},"t":"Kế toán"},{"n":1418,"q":"Đơn vị kế toán phải khóa sổ kế toán vào thời điểm nào?","c":{"A":"Cuối kỳ kế toán.","B":"Khi thực hiện kiểm kê tài sản.","C":"Khi chia, tách, sáp nhập, giải thể.","D":"Tất cả các trường hợp trên."},"t":"Kế toán"},{"n":1419,"q":"Chứng từ kế toán bắt buộc phải có đủ chữ ký của:","c":{"A":"Giám đốc, kế toán trưởng","B":"Người lập, người duyệt","C":"Người đại diện theo pháp luật, thủ quỹ.","D":"Người lập, người duyệt (thủ trưởng đơn vị/người được ủy quyền), kế toán trưởng (hoặc người phụ trách kế toán), và các bên liên quan trực tiếp (như thủ quỹ, người nhận/giao tiền)"},"t":"Kế toán"},{"n":1420,"q":"Trích khấu hao TSCĐ ở phân xưởng sản xuất:","c":{"A":"Nợ 627 / Có 214","B":"Nợ 642 / Có 214","C":"Nợ 214 / Có 641","D":"Nợ 211 / Có 214"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1421,"q":"Doanh nghiệp có được thay đổi thời gian trích khấu hao TSCĐ:","c":{"A":"Không.","B":"Có thể thay đổi nếu đảm bảo điều kiện: Việc kéo dài thời gian khấu hao TSCĐ không được vượt quá tuổi thọ kỹ thuật và không làm thay đổi kết quả sản xuất kinh doanh từ lãi thành lỗ hoặc ngược lại tại năm quyết định thay đổi.","C":"Doanh nghiệp chỉ được thay đổi thời gian trích khấu hao TSCĐ một lần đối với một tài sản. Việc kéo dài thời gian trích khấu hao của TSCĐ bảo đảm không vượt quá tuổi thọ kỹ thuật của TSCĐ và không làm thay đổi kết quả kinh doanh của doanh nghiệp từ lãi thành lỗ hoặc ngược lại tại năm quyết định thay đổi.","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1422,"q":"Ứng trước tiền lương cho nhân viên bằng tiền mặt:","c":{"A":"Nợ 334 / Có 111","B":"Nợ 141 / Có 111","C":"Nợ 111 / Có 334","D":"Nợ 334 / Có 141"},"t":"Tổng hợp"},{"n":1423,"q":"Công ty Z có khoản chi tặng quà cho khách hàng 22 triệu, có hóa đơn VAT hợp lệ, thanh toán tiền mặt. Vậy khoản chi đó:","c":{"A":"Được tính toàn bộ vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN","B":"Không được tính toàn bộ vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN","C":"Được tính 50% vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN","D":"Được tính 20 triệu vào chi phí được trừ khi xác định thu nhập chịu thuế TNDN"},"t":"Tổng hợp"},{"n":1424,"q":"Đơn vị nào phải chịu sự kiểm tra kế toán của cơ quan nhà nước?","c":{"A":"Chỉ các doanh nghiệp nhà nước.","B":"Tất cả các đơn vị kế toán.","C":"Chỉ các đơn vị có nợ thuế.","D":"Chỉ các đơn vị kinh doanh đa quốc gia."},"t":"Kế toán"},{"n":1425,"q":"Một trong 5 nguyên tắc đạo đức nghề nghiệp của kế toán viên là:","c":{"A":"Trung thực","B":"Nhanh nhẹn","C":"Hòa nhã","D":"Tận tâm"},"t":"Kế toán"},{"n":1426,"q":"Khi cổ đông góp vốn bằng ô tô, giá trị được ghi nhận theo:","c":{"A":"Giá trị hợp lý được các bên thống nhất","B":"Giá gốc trên sổ kế toán","C":"Giá thị trường","D":"Giá trị còn lại"},"t":"Tổng hợp"},{"n":1427,"q":"Những người nào sau đây không được làm kế toán?","c":{"A":"Người đang bị cấm hành nghề kế toán theo bản án của Tòa án.","B":"Cha mẹ, vợ chồng, con của người quản lý đơn vị (đối với đơn vị kế toán nhà nước).","C":"Người đang bị truy cứu trách nhiệm hình sự.","D":"Tất cả các đối tượng trên."},"t":"Kế toán"},{"n":1428,"q":"Báo cáo tài chính bao gồm:","c":{"A":"Bảng cân đối kế toán.","B":"Báo cáo kết quả hoạt động kinh doanh.","C":"Báo cáo lưu chuyển tiền tệ","D":"Thuyết minh báo cáo tài chính E Tất cả các báo cáo trên."},"t":"Kế toán"},{"n":1429,"q":"Báo cáo kết quả kinh doanh phản ánh:","c":{"A":"Tình hình tài sản và nguồn vốn","B":"Kết quả lãi/lỗ trong kỳ","C":"Dòng tiền thu chi","D":"Các khoản nợ phải trả"},"t":"Tổng hợp"},{"n":1430,"q":"Đơn vị kế toán được dùng ngoại tệ làm đơn vị tiền tệ ghi sổ khi nào?","c":{"A":"Khi có nhiều khách hàng là người nước ngoài.","B":"Đơn vị kế toán chủ yếu thu, chi bằng một loại ngoại tệ thì được tự lựa chọn loại ngoại tệ đó làm đơn vị tiền tệ để kế toán, chịu trách nhiệm trước pháp luật và thông báo cho cơ quan thuế quản lý trực tiếp","C":"Khi Giám đốc đơn vị phê duyệt.","D":"Khi muốn làm báo cáo theo chuẩn quốc tế."},"t":"Kế toán"},{"n":1431,"q":"Phương pháp tính giá tài sản và nợ phải trả theo nguyên tắc nào sau đây?","c":{"A":"Giá thị trường tại thời điểm cuối năm.","B":"Giá gốc (giá trị ban đầu).","C":"Giá do doanh nghiệp tự định giá định kỳ.","D":"Giá trung bình của ngành."},"t":"Tổng hợp"},{"n":1432,"q":"Đối tượng nào sau đây có trách nhiệm lập báo cáo tài chính?","c":{"A":"Chỉ các doanh nghiệp có vốn đầu tư nước ngoài.","B":"Tất cả các đơn vị kế toán.","C":"Chỉ các công ty niêm yết trên thị trường chứng khoán.","D":"Chỉ các đơn vị có doanh thu trên 100 tỷ đồng."},"t":"Kế toán"},{"n":1433,"q":"Trong kế toán, “nguồn vốn chủ sở hữu” bao gồm:","c":{"A":"Vốn góp, lợi nhuận chưa phân phối, quỹ của doanh nghiệp","B":"Nợ vay và phải trả người bán","C":"Doanh thu và chi phí","D":"Chỉ bao gồm vốn điều lệ"},"t":"Kế toán"},{"n":1434,"q":"Trường hợp NNT kinh doanh bất động sản, xây dựng cơ sở hạ tầng, xây dựng nhà để bán, chuyển nhượng có thực hiện thu tiền theo tiến độ thực hiện dự án hoặc tiến độ thu tiền ghi trong hợp đồng thì khi thu tiền, NNT hạch toán:","c":{"A":"Nợ TK 111, 112 / Có TK 711","B":"Nợ TK 111, 112 / Có TK 511","C":"Nợ TK 111, 112 / Có TK 3387","D":"Nợ TK 111, 112 / Có TK 515"},"t":"Kế toán"},{"n":1435,"q":"Tại tờ khai thuế GTGT kỳ khai thuế tháng 12/2025, NNT khai số thuế GTGT còn được khấu trừ chuyển kỳ sau: 50 triệu đồng, số tiền này là số dư của tài khoản nào tại bảng cân đối kế toán","c":{"A":"Tài khoản 133.","B":"Tài khoản 3331.","C":"Tài khoản 331","D":"Tài khoản 131."},"t":"Thuế GTGT"},{"n":1436,"q":"Trích khấu hao tài sản cố định sử dụng cho bộ phận quản lý doanh nghiệp 5.000.000đồng, kế toán hạch toán vào tài khoản nào.","c":{"A":"Nợ 214: 5.000.000đồng / Có 642: 5.000.000đồng","B":"Nợ 642: 5.000.000đồng / Có 214: 5.000.000đồng","C":"Nợ 214: 5.000.000đồng / Có 211: 5.000.000đồng","D":"Nợ 211: 5.000.000đồng / Có 214: 5.000.000đồng"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1437,"q":"Tài sản cố định (TSCĐ) là tài sản có giá trị từ:","c":{"A":"10 triệu đồng trở lên và thời gian sử dụng trên 1 năm","B":"20 triệu đồng trở lên và thời gian sử dụng trên 1 năm","C":"30 triệu đồng trở lên và thời gian sử dụng trên 1 năm","D":"Giá trị do doanh nghiệp quyết định và thời gian sử dụng trên 1 năm"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1438,"q":"Chi phí lãi vay được vốn hóa khi:","c":{"A":"Vay cho mọi hoạt động SXKD","B":"Vay liên quan trực tiếp đến việc đầu tư, xây dựng TSCĐ","C":"Vay ngắn hạn","D":"Vay từ cá nhân"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1439,"q":"Chứng từ kế toán phải được lập mấy lần cho mỗi nghiệp vụ kinh tế?","c":{"A":"1 lần.","B":"2 lần.","C":"3 lần.","D":"Tùy theo yêu cầu của Giám đốc."},"t":"Kế toán"},{"n":1440,"q":"Đơn vị kế toán phải kiểm kê tài sản trong trường hợp nào?","c":{"A":"Cuối kỳ kế toán năm.","B":"Chia, tách, hợp nhất, sáp nhập đơn vị.","C":"Xảy ra hỏa hoạn, lũ lụt gây thiệt hại.","D":"Tất cả các trường hợp trên."},"t":"Kế toán"},{"n":1441,"q":"Trình độ chuyên môn tối thiểu để làm kế toán theo quy định là:","c":{"A":"Chứng chỉ nghề ngắn hạn.","B":"Trung cấp chuyên nghiệp trở lên.","C":"Bằng Thạc sĩ.","D":"Chỉ cần biết sử dụng phần mềm kế toán."},"t":"Kế toán"},{"n":1442,"q":"Khi kiểm kê phát hiện thừa tiền trong két, chưa rõ nguyên nhân, Kế toán hạch toán tiền thừa đó vào tài khoản:","c":{"A":"TK 711","B":"TK 3381","C":"TK 511","D":"TK 642"},"t":"Kế toán"},{"n":1443,"q":"Sổ kế toán phải có nội dung chủ yếu nào sau đây?","c":{"A":"Ngày tháng ghi sổ; Số hiệu chứng từ; Diễn giải nội dung; Số tiền.","B":"Chỉ cần số tiền và tên tài khoản.","C":"Hình ảnh người thực hiện giao dịch.","D":"Địa chỉ nhà riêng của kế toán trưởng."},"t":"Kế toán"},{"n":1444,"q":"Ai là người có thẩm quyền ký chứng từ kế toán?","c":{"A":"Bất kỳ nhân viên nào trong phòng.","B":"Người đại diện theo pháp luật hoặc người được ủy quyền.","C":"Người ngoài đơn vị có liên quan.","D":"Chỉ duy nhất kế toán trưởng."},"t":"Kế toán"},{"n":1445,"q":"Kỳ kế toán năm thông thường được tính từ:","c":{"A":"01/02 đến 31/01 năm sau.","B":"01/01 đến 31/12 năm dương lịch.","C":"Tùy thuộc vào ngày thành lập.","D":"Tùy thuộc vào lựa chọn của doanh nghiệp."},"t":"Kế toán"},{"n":1446,"q":"Khi trả tiền thuê văn phòng tại thời điểm ký hợp đồng cho 5 năm, phần chi phí kế toán sẽ hạch toán vào tài khoản:","c":{"A":"TK 242","B":"TK 642","C":"TK 641","D":"TK 111"},"t":"Kế toán"},{"n":1447,"q":"Đơn vị tiền tệ sử dụng trong kế toán tại Việt Nam là:","c":{"A":"Đô la Mỹ (USD).","B":"Đồng Việt Nam (VND).","C":"Vàng (SJC).","D":"Tùy chọn theo doanh nghiệp."},"t":"Kế toán"},{"n":1448,"q":"Hành vi nào sau đây bị nghiêm cấm theo Luật Kế toán?","c":{"A":"Lập hai hệ thống sổ kế toán tài chính trở lên.","B":"Thay đổi kế toán trưởng sau 2 năm làm việc.","C":"Áp dụng công nghệ thông tin vào công tác kế toán.","D":"Trích khấu hao nhanh theo quy định."},"t":"Kế toán"},{"n":1449,"q":"Thời hạn lưu trữ tối thiểu đối với chứng từ kế toán sử dụng trực tiếp để ghi sổ và lập BCTC là bao nhiêu năm?","c":{"A":"5 năm.","B":"10 năm.","C":"20 năm.","D":"Vĩnh viễn."},"t":"Kế toán"},{"n":1450,"q":"Số dư bên Nợ của Tài khoản 331 (Phải trả người bán) phản ánh điều gì trên Bảng cân đối kế toán?","c":{"A":"Ghi bình thường bên phần Nguồn vốn.","B":"Ghi số âm bên phần Nguồn vốn.","C":"Ghi số âm bên phần Tài sản.","D":"Ghi bình thường bên phần Tài sản."},"t":"Kế toán"},{"n":1451,"q":"Trong trường hợp doanh nghiệp bán hàng theo phương thức gửi bán đại lý, khi nào kế toán ghi nhận doanh thu bán hàng?","c":{"A":"Khi xuất kho hàng hóa để gửi cho đại lý","B":"Khi đại lý gửi thông báo hàng đã bán được hàng","C":"Khi đại lý thông báo đã nhận được số hàng do doanh nghiệp gửi bán","D":"Khi ký kết hợp đồng giữa doanh nghiệp và đại lý"},"t":"Kế toán"},{"n":1452,"q":"Nghiệp vụ \"Khách hàng ứng trước tiền hàng bằng chuyển khoản\" được ghi nhận:","c":{"A":"Nợ 112 / Có 131 (tăng tài sản, giảm phải thu - sai, đây là tăng nợ phải trả)","B":"Nợ 112 / Có 131 (tăng tài sản, tăng nợ phải trả)","C":"Nợ 131 / Có 112","D":"Nợ 112 / Có 511"},"t":"Tổng hợp"},{"n":1453,"q":"Việc tập hợp chi phí sản xuất, tính giá thành sản phẩm xây lắp theo quy định của pháp luật về quản lý đầu tư và xây dựng hiện hành đối với Doanh nghiệp hoạt động xây lắp phải như thế nào?","c":{"A":"Tập hợp toàn bộ các khoản chi phí phát sinh (nguyên liệu, vật liệu trực tiếp, nhân công trực tiếp, sử dụng máy thi công, chi phí sản xuất chung...) vào chi phí sản xuất kinh doanh dở dang.","B":"Tập hợp toàn bộ các khoản chi phí phát sinh (nguyên liệu, vật liệu trực tiếp, nhân công trực tiếp, sử dụng máy thi công, chi phí sản xuất chung...) và được vốn hoá chi phí lãi vay vào chi phí sản xuất kinh doanh dở dang.","C":"Tập hợp toàn bộ các khoản chi phí phát sinh (nguyên liệu, vật liệu trực tiếp, nhân công trực tiếp, sử dụng máy thi công, chi phí sản xuất chung...) vào chi phí sản xuất kinh doanh dở dang chi tiết theo từng công trình, hạng mục công trình.","D":"Tập hợp toàn bộ các khoản chi phí phát sinh (nguyên liệu, vật liệu trực tiếp, nhân công trực tiếp, sử dụng máy thi công, chi phí sản xuất chung...) và được vốn hoá chi phí lãi vay vào chi phí sản xuất kinh doanh dở dang chi tiết theo từng công trình, hạng mục công trình."},"t":"Tổng hợp"},{"n":1454,"q":"Hàng bán bị trả lại nhập kho, bên bán sau khi nhận lại hàng hoá sẽ hạch toán kế toán như thế nào theo nguyên tắc phù hợp:","c":{"A":"Đồng thời ghi giảm doanh thu và giảm giá vốn.","B":"Chỉ ghi giảm doanh thu kỳ này nhưng không ghi giảm giá vốn do giá vốn đã ghi nhận kỳ trước.","C":"Không hạch toán giảm doanh thu và giá vốn kỳ này, chỉ điều chỉnh trên Tờ khai quyết toán thuế TNDN.","D":"Không hạch toán giảm doanh thu và giá vốn kỳ này, chỉ kê khai thuế điều chỉnh thuế GTGT tương ứng phần doanh thu hàng bán bị trả lại."},"t":"Kế toán"},{"n":1455,"q":"Đối với trường hợp cho thuê tài sản có nhận trước tiền cho thuê của nhiều kỳ thì việc ghi nhận doanh thu được thực hiện theo nguyên tắc nào:","c":{"A":"Phân bổ số tiền cho thuê nhận trước phù hợp với thời hạn cho thuê.","B":"Ghi nhận doanh thu một lần bằng giá trị cho thuê khi hợp đồng cho thuê có hiệu lực","C":"Ghi nhận doanh thu một lần bằng giá trị cho thuê khi kết thúc hợp đồng.","D":"Ghi nhận doanh thu theo thời điểm xuất hoá đơn thoả thuận trong hợp đồng."},"t":"Kế toán"},{"n":1456,"q":"Trường hợp trong kỳ doanh nghiệp đã thu tiền nhưng đến cuối kỳ vẫn chưa giao hàng, chưa cung cấp dịch vụ cho khách hàng thì đã đủ điều kiện ghi nhận doanh thu hay chưa?","c":{"A":"Đã đủ điều kiện ghi nhận doanh thu.","B":"Tạm thời chưa ghi nhận doanh thu tại thời điểm thu tiền mà chỉ ghi nhận doanh thu tại thời điểm cuối kỳ.","C":"Không được coi là đã bán hàng, đã cung cấp dịch vụ trong kỳ và không được ghi vào Tài khoản 511 - Doanh thu bán hàng và cung cấp dịch vụ","D":"Tất cả đều sai."},"t":"Kế toán"},{"n":1457,"q":"Theo Thông tư 99/2025/TT-BTC, đối với doanh nghiệp nhà nước các khoản chênh lệch tỷ giá phát sinh lãi do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ trong giai đoạn trước hoạt động của các doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ có thực hiện dự án, công trình trọng điểm quốc gia, thì được tập hợp như thế nào?","c":{"A":"Khoản lãi tỷ giá lũy kế trong giai đoạn trước hoạt động được tập hợp vào TK 3387- doanh thu chờ phân bổ khi doanh nghiệp đi vào hoạt động.","B":"Tập hợp, phản ánh trên Tài khoản 413 - Chênh lệch tỷ giá hối đoái và phân bổ trực tiếp từ tài khoản 413 vào doanh thu hoạt động tài chính khi doanh nghiệp đi vào hoạt động.","C":"Tập hợp, phản ánh trên Tài khoản 413 - Chênh lệch tỷ giá hối đoái và phân bổ trực tiếp từ tài khoản 413 vào doanh thu hoạt động tài chính khi phát sinh.","D":"Không có câu trả lời đúng."},"t":"Kế toán"},{"n":1458,"q":"Theo Thông tư 99/2025/TT-BTC, nguyên tắc ghi sổ kế toán đối với tài sản, nợ phải trả và vốn chủ sở hữu khi chia, tách, hợp nhất, sáp nhập doanh nghiệp, phương án nào sau đây là đúng?","c":{"A":"Phần giá trị tài sản, nợ phải trả và vốn chủ sở hữu nhận về từ doanh nghiệp bị sáp nhập được doanh nghiệp nhận sáp nhập ghi nhận là số phát sinh trong kỳ; dòng số dư đầu kỳ trên sổ kế toán của doanh nghiệp nhận sáp nhập phải điều chỉnh tăng tương ứng.","B":"Phần giá trị tài sản, nợ phải trả và vốn chủ sở hữu nhận về từ doanh nghiệp bị hợp nhất được doanh nghiệp mới ghi nhận là số phát sinh trong kỳ; dòng số dư đầu kỳ trên sổ kế toán của doanh nghiệp mới được kế thừa từ các doanh nghiệp bị hợp nhất.","C":"Phần giá trị tài sản, nợ phải trả và vốn chủ sở hữu của doanh nghiệp bị chia bàn giao cho doanh nghiệp mới được ghi nhận là số phát sinh trong kỳ; dòng số dư đầu kỳ trên sổ kế toán của doanh nghiệp mới không có số liệu.","D":"Phần giá trị tài sản, nợ phải trả và vốn chủ sở hữu của doanh nghiệp bị tách bàn giao cho doanh nghiệp mới được ghi nhận là số phát sinh trong kỳ; dòng số dư đầu kỳ của cả doanh nghiệp mới và doanh nghiệp bị tách đều không có số liệu."},"t":"Kế toán"},{"n":1459,"q":"Theo Thông tư 99/2025/TT-BTC, khi thay đổi kỳ kế toán, doanh nghiệp bắt buộc phải thuyết minh:","c":{"A":"Chỉ lý do thay đổi","B":"Chỉ số liệu so sánh","C":"Lý do và vấn đề so sánh số liệu","D":"Không cần thuyết minh"},"t":"Kế toán"},{"n":1460,"q":"Theo Thông tư 99/2025/TT-BTC, khi thay đổi kỳ kế toán năm, doanh nghiệp phải:","c":{"A":"Không cần lập BCTC riêng","B":"Lập riêng BCTC cho giai đoạn giữa 2 kỳ kế toán","C":"Gộp luôn vào kỳ mới","D":"Chỉ điều chỉnh kỳ sau"},"t":"Kế toán"},{"n":1461,"q":"Theo Thông tư 99/2025/TT-BTC, sai sót trọng yếu của kỳ trước phải:","c":{"A":"Điều chỉnh kỳ hiện tại","B":"Bỏ qua","C":"Điều chỉnh hồi tố","D":"Chỉ thuyết minh"},"t":"Kế toán"},{"n":1462,"q":"Theo Thông tư 99/2025/TT-BTC, tài sản và nợ phải trả được bù trừ khi:","c":{"A":"Doanh nghiệp muốn trình bày gọn","B":"Có cùng đối tượng và giao dịch cùng loại","C":"Có giá trị nhỏ","D":"Thuộc cùng năm"},"t":"Kế toán"},{"n":1463,"q":"Theo Thông tư 99/2025/TT-BTC, khoản vay đến hạn trong 10 tháng kể từ ngày kết thúc kỳ kế toán được phân loại:","c":{"A":"Dài hạn","B":"Ngắn hạn","C":"Tùy doanh nghiệp quyết định","D":"Không cần phân loại"},"t":"Kế toán"},{"n":1464,"q":"Theo Thông tư 99/2025/TT-BTC, thông tin được coi là trọng yếu khi:","c":{"A":"Có giá trị lớn","B":"Có giá trị trên 1 tỷ đồng","C":"Việc bỏ sót có thể ảnh hưởng đến quyết định kinh tế","D":"Do kế toán trưởng đánh giá"},"t":"Kế toán"},{"n":1465,"q":"Theo Thông tư 99/2025/TT-BTC, “Không có sai sót” trên Báo cáo tài chính có nghĩa là:","c":{"A":"Chính xác tuyệt đối trong mọi trường hợp","B":"Không có sai sót trọng yếu","C":"Không bỏ sót, nhầm lẫn, gian lận và giải thích rõ ước tính","D":"Không được phép sử dụng ước tính"},"t":"Kế toán"},{"n":1466,"q":"Theo Thông tư 99/2025/TT-BTC, khi một chỉ tiêu không có số liệu trên Báo cáo tài chính, doanh nghiệp được:","c":{"A":"Xóa luôn mã số chỉ tiêu","B":"Miễn trình bày nhưng không được thay đổi mã số","C":"Đánh lại mã số cho phù hợp","D":"Bắt buộc vẫn phải trình bày"},"t":"Kế toán"},{"n":1467,"q":"Theo Thông tư 99/2025/TT-BTC, doanh nghiệp có đơn vị trực thuộc khi lập Báo cáo tài chính phải:","c":{"A":"Chỉ lập BCTC riêng cho trụ sở chính","B":"Tổng hợp thông tin tài chính của trụ sở chính và đơn vị trực thuộc, đồng thời loại trừ giao dịch nội bộ","C":"Yêu cầu từng đơn vị trực thuộc lập BCTC riêng bắt buộc","D":"Không cần loại trừ giao dịch nội bộ"},"t":"Kế toán"},{"n":1468,"q":"Theo Thông tư 99/2025/TT-BTC, đối tượng phải lập Báo cáo tài chính năm dạng đầy đủ là:","c":{"A":"Chỉ doanh nghiệp nhà nước","B":"Chỉ doanh nghiệp có vốn đầu tư nước ngoài","C":"Các doanh nghiệp thuộc mọi lĩnh vực, mọi thành phần kinh tế","D":"Chỉ doanh nghiệp có doanh thu trên 50 tỷ đồng"},"t":"Kế toán"},{"n":1469,"q":"Theo Thông tư 99/2025/TT-BTC, vai trò của “Bản thuyết minh Báo cáo tài chính” là:","c":{"A":"Cung cấp thêm thông tin, giải trình các chỉ tiêu và chính sách kế toán đã áp dụng","B":"Không bắt buộc nếu doanh nghiệp đã trình bày đầy đủ số liệu trên các báo cáo","C":"Chỉ dùng để giải thích các khoản lỗ","D":"Chỉ dùng khi cơ quan thuế yêu cầu"},"t":"Kế toán"},{"n":1470,"q":"Theo Thông tư 99/2025/TT-BTC, doanh nghiệp muốn bổ sung thêm tài khoản chi tiết mới để phục vụ quản trị nội bộ. Theo quy định, doanh nghiệp được thực hiện khi:","c":{"A":"Có văn bản chấp thuận của cơ quan thuế","B":"Đảm bảo không làm thay đổi các chỉ tiêu trình bày trên Báo cáo tài chính và phải ban hành Quy chế hạch toán kế toán về nội dung sửa đổi","C":"Không được sửa đổi vì phải áp dụng nguyên hệ thống tại Phụ lục II","D":"Chỉ cần thông báo nội bộ cho phòng kế toán"},"t":"Kế toán"},{"n":1471,"q":"Theo Thông tư 99/2025/TT-BTC, đối với mỗi nghiệp vụ kinh tế, tài chính phát sinh trong doanh nghiệp:","c":{"A":"Có thể lập nhiều chứng từ kế toán để thuận tiện quản lý","B":"Chỉ lập chứng từ khi có phát sinh thanh toán tiền","C":"Chỉ lập chứng từ đối với nghiệp vụ có giá trị lớn","D":"Phải lập chứng từ kế toán và mỗi nghiệp vụ chỉ được lập một lần"},"t":"Kế toán"},{"n":1472,"q":"Theo Thông tư 99/2025/TT-BTC, khi luân chuyển sản phẩm, hàng hóa, dịch vụ giữa các khâu trong nội bộ doanh nghiệp, việc ghi nhận doanh thu và giá vốn tại đơn vị trực thuộc:","c":{"A":"Bắt buộc phải ghi nhận nếu có xuất hóa đơn","B":"Bắt buộc không được ghi nhận vì là giao dịch nội bộ","C":"Do doanh nghiệp quyết định phân cấp, không phụ thuộc hình thức chứng từ kế toán","D":"Phải ghi nhận nếu có thanh toán tiền"},"t":"Kế toán"},{"n":1473,"q":"Theo Thông tư 99/2025/TT-BTC, chênh lệch tỷ giá phát sinh khi chuyển đổi Báo cáo tài chính từ ngoại tệ sang Đồng Việt Nam được ghi nhận:","c":{"A":"Vào chi phí tài chính trong kỳ","B":"Vào doanh thu tài chính trong kỳ","C":"Vào chỉ tiêu “Chênh lệch tỷ giá hối đoái” thuộc phần vốn chủ sở hữu","D":"Điều chỉnh trực tiếp vào lợi nhuận sau thuế chưa phân phối"},"t":"Kế toán"},{"n":1474,"q":"Theo Thông tư 99/2025/TT-BTC, khi chuyển đổi Báo cáo tài chính lập bằng ngoại tệ sang Đồng Việt Nam, khoản mục Tài sản và Nợ phải trả được quy đổi theo","c":{"A":"Tỷ giá giao dịch thực tế tại ngày phát sinh","B":"Tỷ giá mua của Ngân hàng Nhà nước tại ngày lập báo cáo","C":"Tỷ giá mua bán chuyển khoản trung bình của ngân hàng thương mại nơi doanh nghiệp thường xuyên giao dịch tại thời điểm kết thúc kỳ kế toán","D":"Tỷ giá bình quân của cả năm tài chính"},"t":"Kế toán"},{"n":1475,"q":"Theo Thông tư 99/2025/TT-BTC, khi doanh nghiệp thay đổi đơn vị tiền tệ trong kế toán, tại kỳ kế toán đầu tiên kể từ khi thay đổi, việc chuyển đổi số dư các khoản mục trên sổ kế toán và Báo cáo tình hình tài chính sang đơn vị tiền tệ mới được thực hiện theo:","c":{"A":"Tỷ giá bán chuyển khoản của ngân hàng nơi doanh nghiệp mở tài khoản","B":"Tỷ giá mua chuyển khoản của ngân hàng Nhà nước","C":"Tỷ giá mua bán chuyển khoản trung bình của ngân hàng thương mại nơi doanh nghiệp thường xuyên giao dịch tại ngày thay đổi","D":"Tỷ giá giao dịch thực tế bình quân của cả năm trước liền kề"},"t":"Kế toán"},{"n":1476,"q":"Theo Thông tư 99/2025/TT-BTC, quy định về việc lập, ký và kiểm soát chứng từ kế toán. Chọn đáp án sai:","c":{"A":"Mọi nghiệp vụ kinh tế, tài chính phát sinh liên quan đến hoạt động của doanh nghiệp phải lập chứng từ kế toán. Chứng từ kế toán chỉ lập một lần cho mỗi nghiệp vụ kinh tế, tài chính phát sinh.","B":"Việc lập và ký chứng từ kế toán được thực hiện theo quy định của Luật Kế toán, văn bản hướng dẫn Luật kế toán, hướng dẫn tại Thông tư này và các văn bản sửa đổi, bổ sung, thay thế.","C":"Việc phân cấp ký trên chứng từ kế toán của doanh nghiệp phải phù hợp với quy định của pháp luật, yêu cầu quản lý, quy chế quản trị nội bộ để đảm bảo kiểm soát chặt chẽ, an toàn tài sản, nguồn vốn của doanh nghiệp và xác định được trách nhiệm của cá nhân có liên quan.","D":"Kế toán trưởng (hoặc người được kế toán trưởng ủy quyền) được ký “thừa ủy quyền” chức danh của người quản lý, điều hành của doanh nghiệp trên chứng từ kế toán, trừ trường hợp pháp luật có quy định khác."},"t":"Kế toán"},{"n":1477,"q":"Theo Thông tư 133/2016/TT-BTC, Sự kiện \"Doanh nghiệp bị cơ quan có thẩm quyền rút giấy phép kinh doanh, buộc phải giải thể trong vòng 6 tháng tới\" sẽ làm thay đổi nguyên tắc lập BCTC nào?","c":{"A":"Vẫn lập BCTC bình thường theo giả định hoạt động liên tục.","B":"Chuyển sang áp dụng lập BCTC cho doanh nghiệp KHÔNG đáp ứng giả định hoạt động liên tục.","C":"Báo cáo bằng ngoại tệ thay vì VNĐ.","D":"Không cần lập BCTC nữa."},"t":"Kế toán"},{"n":1478,"q":"Các khoản trích trước không được phản ánh vào Tài khoản 335 - Chi phí phải trả mà được phản ánh vào TK-352 dự phòng phải trả là:","c":{"A":"Dự phòng bảo hành sản phẩm, hàng hóa, công trình xây dựng, dự phòng tái cơ cấu doanh nghiệp;","B":"Các khoản dự phòng phải trả khác (quy định trong Tài khoản 352 - Dự phòng phải trả).","C":"Trích trước chi phí lãi tiền vay phải trả trong trường hợp vay trả lãi sau, lãi trái phiếu trả sau (khi trái phiếu đáo hạn).","D":"Chỉ có A, B là đáp án đúng."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1479,"q":"Trong giao dịch ủy thác xuất nhập khẩu, doanh thu của BÊN NHẬN ỦY THÁC là gì?","c":{"A":"Toàn bộ giá trị lô hàng xuất/nhập khẩu.","B":"Giá trị lô hàng cộng với phí ủy thác.","C":"Chỉ là phí dịch vụ ủy thác mà đơn vị được hưởng.","D":"Tiền thuế thu hộ ngân sách nhà nước."},"t":"Thuế nhà thầu / XNK"},{"n":1480,"q":"Các khoản thuế nhập khẩu, thuế tiêu thụ đặc biệt, thuế bảo vệ môi trường đã tính vào giá trị hàng mua, nếu khi xuất bán hàng hóa mà các khoản thuế đó được hoàn lại thì ghi nhận như thế nào?","c":{"A":"Giảm giá trị hàng tồn kho.","B":"Ghi tăng lợi nhuận","C":"Ghi giảm giá vốn hàng bán.","D":"Tăng thu nhập khác."},"t":"Thuế nhà thầu / XNK"},{"n":1481,"q":"Trường hợp người bán vi phạm hợp đồng do giao hàng chậm theo tiến độ và chấp nhận bị phạt một khoản tiền. Người mua vẫn nhận hàng và người bán chấp nhận giảm trừ số tiền phạt vào số tiền người mua phải thanh toán thì khoản tiền phạt này bên mua xử lý thế nào?","c":{"A":"Ghi nhận là Thu nhập khác (TK 711).","B":"Ghi nhận theo số thực tế phải thanh toán cho nhà cung cấp sau khi trừ (-) khoản tiền phạt vi phạm hợp đồng được hưởng.","C":"Ghi tăng Doanh thu tài chính.","D":"Ghi nhận vào Lợi nhuận khác."},"t":"Xử phạt VPHC thuế"},{"n":1482,"q":"Khi người mua từ chối nhận hàng và bị phạt vi phạm hợp đồng (giao dịch mua chưa diễn ra hoàn tất), khoản tiền phạt mà bên bán thu được từ người mua theo quy định được hạch toán vào đâu?","c":{"A":"Doanh thu bán hàng và cung cấp dịch vụ (TK 511).","B":"Doanh thu hoạt động tài chính (TK 515).","C":"Thu nhập khác (TK 711).","D":"Ghi giảm Chi phí bán hàng (TK 6421)."},"t":"Kế toán"},{"n":1483,"q":"Theo quy định về nguyên tắc ghi nhận doanh thu, điều kiện doanh thu cung cấp dịch vụ được ghi nhận khi:","c":{"A":"Doanh thu được xác định tương đối chắc chắn. Khi hợp đồng quy định người mua được quyền trả lại dịch vụ đã mua theo những điều kiện cụ thể, doanh nghiệp chỉ được ghi nhận doanh thu khi những điều kiện cụ thể đó không còn tồn tại và người mua không được quyền trả lại dịch vụ đã cung cấp;","B":"Doanh nghiệp đã hoặc sẽ thu được lợi ích kinh tế từ giao dịch cung cấp dịch vụ đó;","C":"Xác định được phần công việc đã hoàn thành vào thời điểm báo cáo; Xác định được chi phí phát sinh cho giao dịch và chi phí để hoàn thành giao dịch cung cấp dịch vụ đó.","D":"Phải thoả tất cả các điều kiện nêu trên"},"t":"Kế toán"},{"n":1484,"q":"Theo quy định thông Thông tư 99/2025/TT-BTC, khoản chênh lệch phát sinh do đánh giá lại khi đưa tài sản đi góp vốn đầu tư vào đơn vị khác hoặc khi tổ chức lại doanh nghiệp (nếu có) theo quy định của pháp luật doanh nghiệp được phản ánh vào đầu:","c":{"A":"Phản ảnh vào Tài khoản 711 - Thu nhập khác (nếu lãi) hoặc Tài khoản 811 - Chi phí khác (nếu lỗ).","B":"Phản ảnh vào Tài khoản 515 -Doanh thu tài chính (nếu lãi) hoặc Tài khoản 635 - Chi phí tài chính (nếu lỗ).","C":"Phản ảnh bên nợ TK 412 (nếu chênh lệch phát sinh giảm) và phản ảnh bên có TK 412 (nếu chênh lệch phá sinh tăng).","D":"Phản ảnh bên nợ TK 412 (nếu chênh lệch phát sinh tăng) và phản ảnh bên có TK 412 (nếu chênh lệch phá sinh giảm)."},"t":"Kế toán"},{"n":1485,"q":"Theo quy định, chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối kỳ sau khi bù trừ lãi/lỗ, số LỖ ròng (nếu có) được kết chuyển vào đâu để lập BCTC?","c":{"A":"Vẫn treo trên TK 413 để sang năm bù trừ tiếp.","B":"Kết chuyển toàn bộ vào Chi p
