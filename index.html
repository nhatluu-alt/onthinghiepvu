t là bao nhiêu %:","c":{"A":"0%","B":"5%","C":"10%","D":"Tuỳ theo dịch vụ"},"t":"Thuế GTGT","a":"C"},{"n":132,"q":"Khi nhận hồ sơ từ cổng TTHC, nếu hệ thống trả trạng thái xử lý mã \"5A\", nội dung lỗi là gì?","c":{"A":"Trùng gói tin","B":"Phân tích XML lỗi","C":"Ghi sổ nhận hồ sơ không thành công (CQT không phải xử lý)","D":"Hồ sơ đã được giải quyết xong"},"t":"Tổng hợp","a":"C"},{"n":133,"q":"Khi xử lý miễn tiền chậm nộp, nếu hệ thống không tự xác định được \"Địa bàn hành chính 2 cấp\" từ giao dịch gốc, cán bộ thuế phải làm gì?","c":{"A":"Bỏ trống thông tin và lưu hồ sơ","B":"Thực hiện cập nhật thủ công ĐBHC 2 cấp","C":"Chờ hệ thống tự cập nhật qua job cuối ngày","D":"Hủy hồ sơ và yêu cầu NNT nộp lại"},"t":"Quản lý thuế / Hoàn thuế","a":"B"},{"n":134,"q":"Khi nhận hồ sơ hủy đề nghị hoàn thuế (01/ĐNHUY), nếu không tìm thấy mã giao dịch điện tử, TMS sẽ kiểm tra tiêu chí nào của hồ sơ gốc?","c":{"A":"Mã số thuế của Người nộp thuế","B":"Số tiền thuế đề nghị hoàn ban đầu","C":"Mã hồ sơ TTHC của hồ sơ hoàn gốc","D":"Ngày cán bộ thuế tiếp nhận hồ sơ gốc"},"t":"Quản lý thuế / Hoàn thuế","a":"C"},{"n":135,"q":"Khi ban hành Thông báo mẫu 01/TB-BSTT-NNT, thông tin \"Địa chỉ nhận thông báo\" của NNT được lấy từ đâu?","c":{"A":"Cán bộ thuế tự nhập tay khi lập dự thảo","B":"Dữ liệu quản lý thông báo/đăng ký thuế của NNT","C":"Địa chỉ của Cơ quan thuế ban hành văn bản","D":"Địa chỉ ghi trên văn bản đề nghị ban đầu của NNT"},"t":"Tổng hợp","a":"B"},{"n":136,"q":"Trường hợp trình văn bản miễn tiền chậm nộp mà Lãnh đạo chưa ký phê duyệt, chuyên viên có thể thực hiện thao tác gì?","c":{"A":"Xóa hồ sơ vĩnh viễn","B":"Hủy trình ký","C":"Chỉnh sửa trực tiếp trên văn bản đang trình","D":"Gửi hồ sơ sang ứng dụng KĐT"},"t":"Quản lý thuế / Hoàn thuế","a":"B"},{"n":137,"q":"Khi hạch toán Quyết định miễn tiền chậm nộp (QM), thông tin Kho bạc Nhà nước được hệ thống xác định dựa trên:","c":{"A":"Địa chỉ thường trú của Người nộp thuế","B":"Lựa chọn ngẫu nhiên của cán bộ thuế","C":"Thông tin ĐBH Không quá 05 ngày làm việc.","C":"Không quá 05 ngày.","D":"Không quá 07 ngày."},"t":"Thuế TNDN - Chi phí được trừ","a":"A"},{"n":199,"q":"Trường hợp sau 5 ngày kể từ ngày lập biên bản, NNT có giải trình làm thay đổi kết quả so với biên bản đã lập:","c":{"A":"Hủy biên bản đã lập, lập biên bản mới thay thế.","B":"Căn cứ biên bản đã lập và văn bản giải trình để báo cáo Lãnh đạo bộ phận kiểm tra thuế.","C":"Cả hai đáp án trên.","D":""},"t":"Tổng hợp","a":"B"},{"n":200,"q":"Kết quả kiểm tra trên biên bản kiểm tra có thể không thống nhất với số liệu xác nhận của thành viên đoàn kiểm tra không?","c":{"A":"Không. Số liệu phải thống nhất tuyệt đối.","B":"Có. Trưởng đoàn có quyền quyết định và chịu trách nhiệm. Thành viên có quyền bảo lưu số liệu và báo cáo lãnh đạo.","C":"","D":""},"t":"Tổng hợp","a":"B"},{"n":201,"q":"Trường hợp người nộp thuế vắng mặt hoặc trốn tránh không ký biên bản vi phạm hành chính hoặc biên bản công bố quyết định kiểm tra:","c":{"A":"Báo cáo tạm hoãn kiểm tra.","B":"Đề nghị cơ quan công an phối hợp mời NNT làm việc.","C":"Mời đại diện chính quyền cấp xã/phường hoặc ít nhất 01 người chứng kiến ký xác nhận. Nếu không có ai xác nhận thì ghi rõ lý do vào biên bản.","D":"Cả ba đáp án trên."},"t":"Tổng hợp"},{"n":202,"q":"Trường hợp NNT đang hoạt động bình thường nhưng không nhận Quyết định kiểm tra hoặc cố tình trốn tránh:","c":{"A":"Báo cáo Người có thẩm quyền bãi bỏ Quyết định kiểm tra.","B":"Báo cáo Người có thẩm quyền tạm dừng kiểm tra.","C":"Lập biên bản vi phạm hành chính; báo cáo Người ban hành Quyết định để xử phạt, áp dụng biện pháp quản lý thuế và thực hiện ấn định thuế.","D":"Lập biên bản vi phạm và chuyển hồ sơ sang cơ quan điều tra trong vòng 05 ngày. Đáp án: C (Quy định tại tiết e điểm 2.1 mục III phần II Quy trình Kiểm tra thuế ban hành kèm theo Quyết định số 970/QĐ-TCT ngày 14/7/2023)"},"t":"Tổng hợp"},{"n":203,"q":"Trường hợp hết thời hạn 05 ngày làm việc kể từ ngày công khai dự thảo biên bản mà NNT không ký biên bản kiểm tra:","c":{"A":"Lập biên bản vi phạm hành chính về việc không ký biên bản kiểm tra.","B":"Trưởng đoàn mời NNT lên làm việc để ký biên bản.","C":"Lập biên bản vi phạm hành chính, báo cáo Người có thẩm quyền ban hành Quyết định xử phạt, đồng thời yêu cầu NNT chấp hành.","D":""},"t":"Tổng hợp"},{"n":204,"q":"Trong quá trình kiểm tra thực tế, trường hợp cần thiết phải gia hạn thì Trưởng đoàn phải báo cáo Người ban hành Quyết định chậm nhất:","c":{"A":"01 ngày làm việc trước khi kết thúc thời gian kiểm tra.","B":"03 ngày làm việc trước khi kết thúc thời gian kiểm tra.","C":"03 ngày trước khi kết thúc thời gian kiểm tra.","D":"05 ngày trước khi kết thúc thời gian kiểm tra."},"t":"Tổng hợp"},{"n":205,"q":"Trong quá trình kiểm tra tại trụ sở NNT, nếu nội dung phát hiện có thể dẫn đến khiếu nại của người nộp thuế:","c":{"A":"Thực hiện như các cuộc kiểm tra thông thường.","B":"Trưởng đoàn kiểm tra phải tập hợp hồ sơ, tài liệu có liên quan đến nội dung vướng mắc để báo cáo Lãnh đạo bộ phận kiểm tra.","C":"Trưởng đoàn tập hợp hồ sơ làm căn cứ giải quyết khi NNT có khiếu nại.","D":"Không có đáp án nào đúng."},"t":"Tổng hợp"},{"n":206,"q":"Trường hợp trong quá trình kiểm tra thuế phát hiện hành vi trốn thuế có dấu hiệu tội phạm thì đoàn kiểm tra phải:","c":{"A":"Trong thời hạn 05 ngày làm việc kể từ ngày phát hiện, Trưởng đoàn có trách nhiệm báo cáo để Thủ trưởng cơ quan thuế xem xét chuyển hồ sơ sang cơ quan điều tra.","B":"Trong thời hạn 10 ngày làm việc kể từ ngày phát hiện hành vi vi phạm.","C":"Trong thời hạn 15 ngày làm việc kể từ ngày phát hiện hành vi vi phạm.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":207,"q":"Trường hợp kết quả kiểm tra dẫn đến phải xử lý truy thu về thuế, Thủ trưởng cơ quan thuế phải ban hành Quyết định xử phạt vi phạm hành chính trong thời hạn bao lâu?","c":{"A":"Không quá 07 ngày làm việc kể từ ngày ký biên bản (nếu NNT không yêu cầu giải trình).","B":"Trong thời hạn 01 tháng kể từ ngày ký biên bản (nếu NNT có yêu cầu giải trình hoặc cần xác minh).","C":"","D":"Cả a, b và"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":208,"q":"Trường hợp kế hoạch kiểm tra của cơ quan thuế cấp dưới nếu có sự trùng lặp về đối tượng kiểm tra với kế hoạch kiểm tra về thuế của cơ quan Thanh tra Nhà nước, Kiểm toán Nhà nước, cơ quan thuế cấp trên thì thực hiện theo kế hoạch của Thanh tra Nhà nước, Kiểm toán Nhà nước, cơ quan thuế cấp trên đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":209,"q":"Việc báo cáo kết quả kiểm tra, dự thảo Quyết định xử phạt vi phạm hành chính về thuế hoặc Kết luận kiểm tra thuế được thực hiện trong thời hạn như thế nào?","c":{"A":"Chậm nhất là 03 ngày làm việc kể từ ngày ký biên bản kiểm tra thuế.","B":"Chậm nhất là 05 ngày làm việc kể từ ngày ký biên bản kiểm tra thuế.","C":"Chậm nhất là 05 ngày kể từ ngày ký biên bản kiểm tra thuế.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":210,"q":"Việc lập và ký biên bản kiểm tra phải được thực hiện trong thời hạn như thế nào?","c":{"A":"Trong thời hạn 03 ngày làm việc kể từ ngày kết thúc kiểm tra.","B":"Trong thời hạn 05 ngày làm việc kể từ ngày kết thúc kiểm tra.","C":"Trong thời hạn 05 ngày kể từ ngày kết thúc kiểm tra tại trụ sở NNT.","D":""},"t":"Tổng hợp"},{"n":211,"q":"Theo quy định tại Luật Quản lý thuế số 38/2019/QH14, thời hạn thực hiện cuộc kiểm tra thuế quy định như thế nào?","c":{"A":"05 ngày làm việc tại trụ sở người nộp thuế.","B":"Thời hạn kiểm tra không quá 10 ngày làm việc tại trụ sở của người nộp thuế.","C":"Thời hạn không quá 10 ngày làm việc, tính từ ngày công bố quyết định; trường hợp phức tạp có thể gia hạn 01 lần nhưng không quá 10 ngày làm việc tại trụ sở NNT.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":212,"q":"Trường hợp người nộp thuế không ký biên bản công bố Quyết định kiểm tra thì đoàn kiểm tra thực hiện xử lý như thế nào:","c":{"A":"Đoàn kiểm tra báo cáo Người ban hành Quyết định để ban hành thông báo.","B":"Lập biên bản vi phạm hành chính; đoàn kiểm tra báo cáo Người ban hành Quyết định để xử phạt, áp dụng biện pháp quản lý và thực hiện ấn định thuế.","C":"","D":"Cả b và"},"t":"Tổng hợp"},{"n":213,"q":"Theo quy định tại Luật Quản lý thuế số 38/2019/QH14, việc kiểm tra theo Quyết định kiểm tra thuế phải được tiến hành chậm nhất bao nhiêu ngày kể từ ngày ban hành Quyết định kiểm tra thuế?","c":{"A":"15 ngày","B":"10 ngày làm việc","C":"10 ngày","D":"5 ngày làm việc"},"t":"Quản lý thuế / Hoàn thuế"},{"n":214,"q":"Trong các trường hợp sau trường hợp nào thì cơ quan thuế tạm dừng kiểm tra trong quá trình kiểm tra tại trụ sở người nộp thuế?","c":{"A":"Trường hợp người nộp thuế có văn bản đề nghị dừng kiểm tra do kế toán nghỉ ốm.","B":"Trường hợp người nộp thuế gặp hỏa hoạn cháy trụ sở.","C":"Trường hợp doanh nghiệp đang gặp khó khăn trong kinh doanh.","D":"Tất cả các trường hợp trên."},"t":"Tổng hợp"},{"n":215,"q":"Trường hợp nào thì cơ quan thuế tạm dừng kiểm tra trong quá trình kiểm tra tại trụ sở người nộp thuế?","c":{"A":"Trường hợp 1 thành viên đoàn kiểm tra bị ốm không tiếp tục công việc.","B":"Trường hợp người nộp thuế không kịp thời cung cấp được số liệu phục vụ kiểm tra.","C":"Trường hợp phát sinh lý do bất khả kháng, không thể tiếp tục thực hiện kiểm tra.","D":"Tất cả các trường hợp trên."},"t":"Tổng hợp"},{"n":216,"q":"Cơ quan thuế ban hành quyết định bãi bỏ Quyết định kiểm tra tại trụ sở người nộp thuế trong trường hợp nào?","c":{"A":"NNT đã bỏ kinh doanh; hoặc có văn bản đề nghị hủy hồ sơ hoàn; hoặc người đại diện vắng mặt dài ngày do lý do bất khả kháng; hoặc văn phòng đại diện chấm dứt hoạt động; hoặc cơ quan điều tra đang điều tra.","B":"Người nộp thuế có văn bản đề nghị bãi bỏ quyết định kiểm tra do đang gặp khó khăn.","C":"","D":"Cả a và"},"t":"Tổng hợp"},{"n":217,"q":"Cơ quan thuế ban hành quyết định bãi bỏ Quyết định kiểm tra tại trụ sở người nộp thuế trong trường hợp nào?","c":{"A":"NNT cung cấp tài liệu giải trình chứng minh được số thuế khai là đúng và nộp đủ số tiền thuế phải nộp trước khi công bố Quyết định kiểm tra.","B":"Quyết định kiểm tra bị trùng lặp nội dung, kỳ kiểm tra với cơ quan nhà nước có thẩm quyền khác.","C":"","D":"Cả 3 đáp án a, b,"},"t":"Tổng hợp"},{"n":218,"q":"Trong hồ sơ lưu trữ cuộc kiểm tra, Biên bản bàn giao hồ sơ, tài liệu (Mẫu 17/ QTKT) được quy định lập thành bao nhiêu bản?","c":{"A":"01 bản.","B":"02 bản (mỗi bên giữ 01 bản).","C":"03 bản.","D":"04 bản."},"t":"Tổng hợp"},{"n":219,"q":"Theo quy định tại Thông tư số 80/2021/TT-BTC, trong quá trình kiểm tra hồ sơ hoàn thuế thuộc diện kiểm tra trước hoàn, nếu cơ quan thuế xác định vừa có số thuế đủ điều kiện được hoàn vừa có số thuế cần kiểm tra xác minh:","c":{"A":"Giải quyết hoàn trả số thuế đã đủ điều kiện hoàn cho người nộp thuế, không chờ kết quả kiểm tra xác minh toàn bộ hồ sơ hoàn thuế.","B":"Chờ kết quả kiểm tra xác minh toàn bộ hồ sơ hoàn thuế để giải quyết hoàn trả một lần.","C":"Cả 2 phương án trên.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":220,"q":"Trường hợp qua kiểm tra thuế phát hiện người nộp thuế mua hàng hóa, dịch vụ của người nộp thuế khác (bên cung cấp hàng hóa, dịch vụ) có rủi ro về thuế:","c":{"A":"Cơ quan thuế phải bổ sung kế hoạch kiểm tra bên cung cấp hàng hóa, dịch vụ.","B":"Đề nghị cơ quan thuế quản lý trực tiếp bên cung cấp hàng hóa, dịch vụ bổ sung kế hoạch và thực hiện kiểm tra.","C":"Đề nghị cơ quan thuế quản lý trực tiếp bên cung cấp hàng hóa, dịch vụ cung cấp thông tin về việc chấp hành pháp luật thuế của bên cung cấp.","D":"Cả 3 phương án trên."},"t":"Quản lý thuế / Hoàn thuế"},{"n":221,"q":"Trong các trường hợp sau, trường hợp nào hồ sơ không thuộc diện kiểm tra trước hoàn thuế theo quy định tại Thông tư số 80/2021/TT-BTC:","c":{"A":"Hồ sơ của người nộp thuế đề nghị hoàn thuế lần đầu của từng trường hợp hoàn thuế theo quy định của pháp luật về thuế.","B":"Hồ sơ của người nộp thuế có nhiều lần đề nghị hoàn thuế trong thời hạn 02 năm, nếu trong lần đề nghị hoàn thuế đầu tiên tính từ sau thời điểm bị xử lý về hành vi trốn thuế, cơ quan thuế kiểm tra hồ sơ hoàn thuế của người nộp thuế không có hành vi khai sai dẫn đến thiếu số thuế phải nộp hoặc tăng số tiền thuế được hoàn hoặc hành vi trốn thuế.","C":"Hồ sơ của tổ chức giải thể, phá sản, chấm dứt hoạt động, bán, giao và chuyển giao doanh nghiệp nhà nước.","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":222,"q":"Trường hợp người nộp thuế đã được hoàn thuế giá trị gia tăng đối với hàng hóa xuất khẩu nhưng bị người bán trả lại hàng hóa đã xuất khẩu, NNT đã khai bổ sung trước khi Cơ quan thuế công bố quyết định kiểm tra tại trụ sở NNT đồng thời nộp số tiền đã được hoàn tương ứng:","c":{"A":"NNT bị xử phạt vi phạm hành chính về quản lý thuế","B":"NNT không bị xử phạt vi phạm hành chính về quản lý thuế","C":"","D":""},"t":"Thuế GTGT"},{"n":223,"q":"Trường hợp cơ quan thuế, cơ quan nhà nước có thẩm quyền qua kiểm tra phát hiện người nộp thuế đã được hoàn không đúng quy định, thì:","c":{"A":"Người nộp thuế phải nộp số tiền đã được hoàn thừa và nộp tiền chậm nộp tương ứng vào ngân sách nhà nước kể từ ngày được Kho bạc Nhà nước chi trả tiền hoàn hoặc ngày Kho bạc Nhà nước hạch toán bù trừ tiền hoàn thuế với khoản nợ ngân sách nhà nước.","B":"Người nộp thuế phải nộp số tiền đã được hoàn thừa và nộp tiền chậm nộp tương ứng vào ngân sách nhà nước kể từ ngày ban hành Quyết định hoàn thuế.","C":"Cả hai phương án trên.","D":""},"t":"Tổng hợp"},{"n":224,"q":"Theo Quyết định 970/QĐ-TCT ngày 14/7/2023 của TCT quy định hồ sơ trình để thực hiện ra thông báo giải trình, bổ sung thông tin, tài liệu lần 1:","c":{"A":"Tờ trình, Dự thảo thông báo, Quyết định giao kế hoạch kiểm tra tại trụ sở CQT, Bản nhận xét hồ sơ thuế, Hồ sơ thuế","B":"Dự thảo thông báo, Quyết định giao nhiệm vụ kiểm tra hồ sơ thuế, Bản nhận xét hồ sơ thuế, Hồ sơ thuế","C":"Tờ trình, Dự thảo thông báo, Quyết định giao nhiệm vụ kiểm tra hồ sơ thuế, Bản nhận xét hồ sơ thuế, Hồ sơ thuế","D":"Tờ trình, Dự thảo thông báo, Bản nhận xét hồ sơ thuế, Hồ sơ thuế"},"t":"Tổng hợp"},{"n":225,"q":"Hết thời hạn theo thông báo lần 2 của cơ quan thuế mà người nộp thuế không giải trình, bổ sung thông tin, tài liệu nhưng có kết quả xác minh vẫn hoạt động tại địa chỉ đăng ký kinh doanh; hoặc không khai bổ sung hồ sơ thuế; hoặc giải trình, khai bổ sung hồ sơ thuế nhưng không chứng minh được số thuế khai là đúng:","c":{"A":"Ấn định thuế","B":"Ban hành Quyết định kiểm tra thuế tại trụ sở của người nộp thuế","C":"Xây dựng kế hoạch kiểm tra tại trụ sở người nộp thuế","D":"Cả 3 phương án trên đều đúng"},"t":"Tổng hợp"},{"n":226,"q":"Tổ kiểm tra tại trụ sở cơ quan thuế được quy định:","c":{"A":"Tối thiểu 02 người/01 Tổ kiểm tra, cố định trong 1 năm","B":"Tối thiểu 02 người/01 Tổ kiểm tra, có thể thay đổi trong 1 năm","C":"Tối thiểu 03 người/01 Tổ kiểm tra, cố định trong 1 năm","D":"Tối thiểu 03 người/01 Tổ kiểm tra, có thể thay đổi trong 1 năm"},"t":"Tổng hợp"},{"n":227,"q":"Việc ghi nhật ký điện tử được thực hiện bằng hình thức nào?","c":{"A":"Bằng hình thức ghi điện tử","B":"Bằng hình thức ghi sổ giấy Đáp án: A (Quy định tại tiết e, điểm 2.2 mục III phần II Quy trình Kiểm tra thuế ban hành kèm theo Quyết định số 970/QĐ-TCT ngày 14/7/2023)","C":"","D":""},"t":"Tổng hợp"},{"n":228,"q":"Lập và phê duyệt kế hoạch kiểm tra hồ sơ thuế năm:","c":{"A":"Thực hiện 01 lần/ 1 năm","B":"Thực hiện 02 lần/ 1 năm, kế hoạch ban đầu và kế hoạch bổ sung","C":"Có thể bổ sung, điều chỉnh tùy thuộc vào thực tế phát sinh","D":""},"t":"Tổng hợp"},{"n":229,"q":"Cơ quan Thuế phải công khai kế hoạch kiểm tra hàng năm, chuyên đề kiểm tra hàng năm; chuyên đề kiểm tra phát sinh trong năm bằng hình thức nào?","c":{"A":"Công khai trên trang thông tin điện tử của cơ quan thuế.","B":"Thông báo cho người nộp thuế và cơ quan thuế trực tiếp quản lý người nộp thuế băng văn bản.","C":"Thông báo cho người nộp thuế và cơ quan thuế trực tiếp quản lý người nộp thuế qua thư điện tử và điện thoại.","D":"Cả 3 đáp án trên."},"t":"Tổng hợp"},{"n":230,"q":"Theo quy định của Luật Quản lý thuế số 38/2019/QH14, Quyết định kiểm tra thuế tại trụ sở của người nộp thuế phải được gửi cho người nộp thuế chậm nhất bao nhiêu ngày kể từ ngày ban hành Quyết định?","c":{"A":"03 ngày","B":"05 ngày làm việc","C":"03 ngày làm việc","D":"10 ngày làm việc"},"t":"Quản lý thuế / Hoàn thuế"},{"n":231,"q":"Cơ quan thuế thực hiện kiểm tra đối với hồ sơ hoàn thuế trước theo nguyên tắc quản lý rủi ro trong quản lý thuế trong thời hạn:","c":{"A":"05 năm kể từ ngày ban hành quyết định hoàn thuế","B":"03 năm kể từ ngày ban hành quyết định hoàn thuế","C":"02 năm kể từ ngày ban hành quyết định hoàn thuế","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":232,"q":"Sử dụng hóa đơn, chứng từ trong các trường hợp nào sau đây là hành vi sử dụng hóa đơn, chứng từ không hợp pháp:","c":{"A":"Hóa đơn, chứng từ giả;","B":"Hóa đơn, chứng từ chưa có giá trị sử dụng, hết giá trị sử dụng;","C":"Hóa đơn bị ngừng sử dụng trong thời gian bị cưỡng chế bằng biện pháp ngừng sử dụng hóa đơn, trừ trường hợp được phép sử dụng theo thông báo của cơ quan thuế;","D":"Tất cả đáp án trên đều đúng;"},"t":"Hóa đơn"},{"n":233,"q":"Theo Luật Xử lý vi phạm hành chính, tình tiết nào sau đây là tình tiết tăng nặng?","c":{"A":"Vi phạm hành chính có tổ chức;","B":"Vi phạm hành chính nhiều lần; tái phạm;","C":"Xúi giục, lôi kéo, sử dụng người chưa thành niên vi phạm; ép buộc người bị lệ thuộc vào mình về vật chất, tinh thần thực hiện hành vi vi phạm hành chính;","D":"Tất cả đáp án trên đều đúng;"},"t":"Xử phạt VPHC thuế"},{"n":234,"q":"Theo Nghị định 310/2025/NĐ-CP ngày 02 tháng 12 năm 2025, Biên bản vi phạm hành chính điện tử phải có các nội dung nào sau đây:","c":{"A":"Ghi rõ thời gian, địa điểm lập biên bản","B":"Thông tin về người lập biên bản; thông tin về cá nhân, tổ chức vi phạm; chữ ký số của người lập biên bản","C":"Thời gian, địa điểm thực hiện vi phạm; hành vi vi phạm hành chính; quyền và thời hạn giải trình về vi phạm hành chính của người vi phạm; cơ quan tiếp nhận giải trình.","D":"Tất cả các nội dung trên"},"t":"Tổng hợp"},{"n":235,"q":"Theo Nghị định 310/2025/NĐ-CP ngày 02 tháng 12 năm 2025, trường hợp theo quy định của pháp luật về thuế và quản lý thuế, tổ chức, cá nhân có nghĩa vụ đăng ký thuế, khai, nộp thuế thay người nộp thuế mà tổ chức, cá nhân đăng ký thuế, khai, nộp thuế thay có hành vi vi phạm hành chính về thuế, hóa đơn thì đối tượng bị xử phạt là:","c":{"A":"Người nộp thuế","B":"Tổ chức, cá nhân đăng ký thuế, khai, nộp thuế thay","C":"Cả người nộp thuế và tổ chức, cá nhân đăng ký thuế, khai, nộp thuế thay","D":"Chưa có quy định cụ thể cho trường hợp này"},"t":"Quản lý thuế / Hoàn thuế"},{"n":236,"q":"Theo quy định tại Nghị định số 310/2025/NĐ-CP ngày 02/12/2025, hành vi nào là hành vi vi phạm hành chính về thuế đối với tổ chức, cá nhân liên quan","c":{"A":"Không cung cấp thông tin về tiền lương, tiền công của người nộp thuế theo yêu cầu của cơ quan thuế","B":"Không cung cấp thông tin về tài khoản của người nộp thuế tại tổ chức tín dụng theo yêu cầu của cơ quan thuế","C":"Thông đồng, bao che người nộp thuế trốn thuế, không thực hiện quyết định cưỡng chế hành chính thuế (không thuộc Điều 18 Nghị định số 125/2020/NĐ-CP ngày 19 tháng 10 năm 2020 của Chính phủ)","D":"Tất cả các phương án trên đều đúng"},"t":"Tổng hợp"},{"n":237,"q":"Theo Nghị định số 310/2025/NĐ-CP ngày 02/12/2025, hành vi vi phạm hành chính về thuế, hóa đơn đang được thực hiện trước ngày Nghị định số 310/2025/NĐ-CP ngày 02/12/2025 có hiệu lực và được phát hiện sau ngày Nghị định số 310/2025/NĐ-CP ngày 02/12/2025 có hiệu lực thì áp dụng quy định nào để xử phạt?","c":{"A":"Áp dụng theo văn bản quy phạm pháp luật có hiệu lực tại thời điểm bắt đầu hành vi vi phạm","B":"Áp dụng theo văn bản quy phạm pháp luật có hiệu lực tại thời điểm kết thúc hành vi vi phạm","C":"Áp dụng theo quy định tại Nghị định số 310/2025/NĐ-CP ngày 02/12/2025","D":"Giải quyết theo quy định có lợi nhất cho cá nhân, tổ chức vi phạm"},"t":"Xử phạt VPHC thuế"},{"n":238,"q":"Theo Nghị định số 310/2025/NĐ-CP ngày 02/12/2025, đối với hành vi vi phạm hành chính về thuế, hóa đơn đã bị xử phạt trước ngày Nghị định số 310/2025/NĐ-CP ngày 02/12/2025 có hiệu lực, nhưng cá nhân, tổ chức còn khiếu nại hoặc khởi kiện, việc giải quyết được thực hiện như thế nào?","c":{"A":"Giải quyết theo quy định pháp luật có hiệu lực tại thời điểm thực hiện hành vi vi phạm","B":"Áp dụng theo văn bản đang có hiệu lực tại thời điểm giải quyết khiếu nại, khởi kiện","C":"Áp dụng theo Nghị định số 310/2025/NĐ-CP ngày 02/12/2025","D":"Giải quyết theo quy định có lợi nhất cho cá nhân, tổ chức vi phạm"},"t":"Xử phạt VPHC thuế"},{"n":239,"q":"Chọn phương án đúng nhất: Theo Nghị định 310/2025/NĐ-CP ngày 02 tháng 12 năm 2025, khi phạt tiền, mức phạt tiền cụ thể đối với một hành vi vi phạm thủ tục thuế, hóa đơn là mức trung bình của khung phạt tiền được quy định đối với hành vi đó. Nếu có một tình tiết giảm nhẹ thì được giảm 10% mức tiền phạt trung bình của khung tiền phạt; nếu có một tình tiết tăng nặng thì được tính tăng 10% mức tiền phạt trung bình của khung tiền phạt. Trong trường hợp có từ 02 tình tiết giảm nhẹ trở lên thì:","c":{"A":"Áp dụng mức tối thiểu của khung tiền phạt;","B":"Giảm 20% mức tiền phạt trung bình của khung tiền phạt","C":"Tùy tính chất vụ việc, áp dụng từ mức tối thiểu của khung tiền phạt đến mức trung bình của khung tiền phạt","D":"Giảm 10% mức tiền phạt trung bình của khung tiền phạt đối với mỗi tình tiết giảm nhẹ"},"t":"Xử phạt VPHC thuế"},{"n":240,"q":"Chọn phương án đúng nhất: Theo Nghị định 310/2025/NĐ-CP ngày 02 tháng 12 năm 2025, trường hợp người nộp thuế thực hiện nhiều hành vi lập hóa đơn không đúng thời điểm, các hành vi vi phạm còn trong thời hiệu xử phạt và bị xử phạt trong một vụ việc vi phạm hành chính thì:","c":{"A":"Chỉ bị xử phạt về một hành vi lập hóa đơn không đúng thời điểm có khung tiền phạt tương ứng với số lượng hóa đơn đã lập không đúng thời điểm;","B":"Bị xử phạt về từng số hóa đơn lập không đúng thời điểm, áp dụng tình tiết tăng nặng từ tờ thứ hai trở đi.","C":"Bị xử phạt về từng số hóa đơn lập không đúng thời điểm, không áp dụng tình tiết tăng nặng.","D":"Bị xử phạt về một hành vi lập hóa đơn không đúng thời điểm áp dụng tình tiết tăng nặng do vi phạm nhiều lần."},"t":"Hóa đơn"},{"n":241,"q":"Chọn phương án đúng nhất: Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, Cơ quan thuế không tính tiền chậm nộp tiền phạt trong các trường hợp nào sau đây:","c":{"A":"Trong thời gian được hoãn thi hành quyết định phạt tiền;","B":"Trong thời gian xem xét, quyết định giảm, miễn tiền phạt;","C":"Số tiền phạt chưa đến hạn nộp trong trường hợp được nộp tiền phạt nhiều lần.","D":"Tất cả các đáp án trên đều đúng"},"t":"Quản lý thuế / Hoàn thuế"},{"n":242,"q":"Nộp hồ sơ khai thuế quá hạn trên 90 ngày có phát sinh số thuế phải nộp nhưng người nộp thuế đã nộp đủ tiền thuế trước khi bị lập biên bản về hành vi chậm nộp hồ sơ khai thuế thì không bị xử phạt về hành vi trốn thuế mà chuyển sang xử phạt theo hành vi vi phạm về thủ tục thuế.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":243,"q":"Chọn phương án đúng nhất: Theo quy định tại Nghị định số 310/2025/NĐ-CP ngày 02/12/2025, căn cứ xác định cá nhân chết, mất tích là","c":{"A":"Giấy chứng tử hoặc giấy báo tử","B":"Cơ sở dữ liệu hộ tịch điện tử hoặc quyết định của tòa án tuyên bố một người là đã chết, mất tích (bản chính hoặc bản sao của văn bản giấy hoặc của văn bản điện tử theo quy định) đối với trường hợp cá nhân chết, mất tích;”.","C":"Các giấy tờ thay cho giấy báo tử theo quy định của pháp luật về hộ tịch.","D":"Quyết định của tòa án tuyên bố một người là đã chết, mất tích (bản chính hoặc bản sao theo quy định) đối với trường hợp cá nhân chết, mất tích;"},"t":"Tổng hợp"},{"n":244,"q":"Vi phạm hành chính được phát hiện bằng phương tiện, thiết bị kỹ thuật nghiệp vụ và phải giám định, xác định giá trị tang vật. Theo quy định tại Nghị định số 68/2025/NĐ-CP ngày 18/03/2025, thời hạn lập biên bản vi phạm hành chính được tính như thế nào?","c":{"A":"03 ngày làm việc, kể từ ngày xác định được đối tượng vi phạm hoặc nhận được kết quả giám định, xác định giá trị tang vật","B":"05 ngày làm việc, kể từ ngày phát hiện vi phạm","C":"05 ngày làm việc, kể từ ngày xác định được đối tượng vi phạm hoặc nhận được kết quả giám định, xác định giá trị tang vật","D":"05 ngày làm việc, kể từ ngày kết thúc thanh tra, kiểm tra"},"t":"Tổng hợp"},{"n":245,"q":"Vụ việc vi phạm hành chính có nhiều tình tiết phức tạp hoặc có phạm vi rộng, ảnh hưởng đến quyền và lợi ích hợp pháp của cá nhân, tổ chứC. Theo quy định tại Nghị định số 68/2025/NĐ-CP ngày 18/03/2025, thời hạn lập biên bản vi phạm hành chính là:","c":{"A":"03 ngày làm việc, kể từ ngày phát hiện vi phạm","B":"05 ngày làm việc, kể từ ngày phát hiện vi phạm","C":"05 ngày làm việc, kể từ ngày lập biên bản xác minh","D":"10 ngày làm việc, kể từ ngày kết thúc xác minh"},"t":"Tổng hợp"},{"n":246,"q":"Một hành vi vi phạm hành chính có 01 tình tiết giảm nhẹ, theo quy định tại Nghị định số 68/2025/NĐ-CP ngày 18/03/2025, mức phạt tiền cụ thể được xác định như thế nào?","c":{"A":"Áp dụng mức tối thiểu của khung phạt tiền","B":"Xác định trong khoảng từ trên mức tối thiểu đến dưới mức trung bình của khung phạt tiền","C":"Áp dụng mức trung bình của khung phạt tiền","D":"Áp dụng mức tối đa của khung phạt tiền"},"t":"Xử phạt VPHC thuế"},{"n":247,"q":"Theo Luật Xử lý vi phạm hành chính, Quyết định xử phạt vi phạm hành chính về thuế có hiệu lực kể từ khi nào?","c":{"A":"Kể từ ngày ký, trừ trường hợp trong quyết định có quy định ngày có hiệu lực khác.","B":"Sau 10 ngày kể từ ngày ký.","C":"Khi người nộp thuế đã nộp tiền vào kho bạc.","D":"Khi cơ quan thuế đăng lên website."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":248,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, trường hợp vi phạm hành chính về thuế do lỗi của bên thứ ba (bên cung cấp dịch vụ kế toán) thì ai là người bị xử phạt?","c":{"A":"Bên thứ ba.","B":"Người nộp thuế (Chủ doanh nghiệp).","C":"Cả hai cùng bị phạt như nhau.","D":"Không ai bị phạt."},"t":"Kế toán"},{"n":249,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, Cơ quan nào sau đây có thẩm quyền xử phạt vi phạm hành chính về thuế?","c":{"A":"Cơ quan Thuế.","B":"Cơ quan Hải quan.","C":"Ủy ban nhân dân các cấp.","D":"Cả A, B và C đều đúng."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":250,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, ngân hàng thương mại không thực hiện trách nhiệm trích chuyển tiền từ tài khoản của người nộp thuế vào tài khoản của ngân sách nhà nước theo yêu cầu của cơ quan thuế, trừ trường hợp các tài khoản của người nộp thuế tại ngân hàng thương mại đó không còn số dư hoặc đã trích chuyển toàn bộ số dư tài khoản của người nộp thuế vào tài khoản của ngân sách nhà nước nhưng vẫn không đủ số tiền mà người nộp thuế phải nộp thì bị xử phạt mức phạt tiền:","c":{"A":"Phạt 20% số tiền không trích vào tài khoản của ngân sách nhà nước","B":"Phạt từ 01 đến 03 lần số tiền không trích vào tài khoản của ngân sách nhà nước","C":"Phạt tiền tương ứng với số tiền không trích vào tài khoản của ngân sách nhà nước","D":"Tất cả đáp án trên đều sai."},"t":"Xử phạt VPHC thuế"},{"n":251,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, trường hợp NNT được miễn, giảm tiền phạt thì có được miễn, giảm tiền chậm nộp tiền phạt tương ứng hay không?","c":{"A":"Có","B":"Không","C":"Tùy thuộc vào số tiền phạt tại quyết định xử phạt","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":252,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, người nộp thuế bị thiệt hại trong trường hợp bất khả kháng quy định tại Luật Quản lý thuế, đã thực hiện xong quyết định xử phạt có được miễn, giảm tiền phạt vi phạm hành chính về thuế, hóa đơn hay không?","c":{"A":"Có","B":"Không","C":"Tùy thuộc vào số tiền bị thiệt hại","D":""},"t":"Xử phạt VPHC thuế"},{"n":253,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, tổ chức bị giải thể là đơn vị phụ thuộc, địa điểm kinh doanh của doanh nghiệp hoặc giải thể do tổ chức lại doanh nghiệp, hợp tác xã, tổ chức khác hoặc giải thể chi nhánh, văn phòng đại diện của thương nhân nước ngoài, văn phòng điều hành của nhà thầu nước ngoài tại Việt Nam thì tổ chức bị giải thể có được miễn thi hành hình thức phạt tiền tại quyết định xử phạt hay không?","c":{"A":"Có","B":"Không","C":"Tùy thuộc vào số tiền phạt tại quyết định xử phạt","D":""},"t":"Xử phạt VPHC thuế"},{"n":254,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, không ra quyết định xử phạt vi phạm hành chính về thuế, hóa đơn trong các trường hợp nào sau đây:","c":{"A":"Người nộp thuế vi phạm hành chính về thuế do thực hiện theo văn bản hướng dẫn, quyết định xử lý của cơ quan thuế, cơ quan nhà nước có thẩm quyền liên quan đến nội dung xác định nghĩa vụ thuế của người nộp thuế;","B":"Không xác định được đối tượng vi phạm hành chính về thuế, hóa đơn;","C":"Đã hết thời hiệu xử phạt vi phạm hành chính về thuế, hóa đơn hoặc hết thời hạn ra quyết định xử phạt theo quy định của pháp luật về xử lý vi phạm hành chính;","D":"Tất cả các hành vi trên."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":255,"q":"Chọn phương án đúng nhất Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, sử dụng hóa đơn, chứng từ trong các trường hợp nào sau đây là hành vi sử dụng không hợp pháp hóa đơn, chứng từ:","c":{"A":"Hóa đơn, chứng từ không ghi đầy đủ các nội dung bắt buộc theo quy định; hóa đơn tẩy xóa, sửa chữa không đúng quy định;","B":"Hóa đơn, chứng từ khống (hóa đơn, chứng từ đã ghi các chỉ tiêu, nội dung nghiệp vụ kinh tế nhưng việc mua bán hàng hóa, dịch vụ không có thật một phần hoặc toàn bộ); hóa đơn phản ánh không đúng giá trị thực tế phát sinh hoặc lập hóa đơn khống, lập hóa đơn giả;","C":"Hóa đơn có sự chênh lệch về giá trị hàng hóa, dịch vụ hoặc sai lệch các tiêu thức bắt buộc giữa các liên của hóa đơn;","D":"Tất cả đáp án trên đều đúng"},"t":"Hóa đơn"},{"n":256,"q":"Chọn phương án đúng nhất Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, hành vi nào sau đây vi phạm quy định về chấp hành quyết định kiểm tra thuế, cưỡng chế thi hành quyết định hành chính thuế:","c":{"A":"Không cung cấp số liệu, tài liệu, sổ kế toán liên quan đến việc xác định nghĩa vụ thuế khi được cơ quan có thẩm quyền yêu cầu trong thời gian kiểm tra, thanh tra thuế tại trụ sở người nộp thuế;","B":"Không thực hiện hoặc thực hiện không đúng quyết định niêm phong hồ sơ tài liệu, kết quỹ, kho hàng hóa, vật tư, nguyên liệu, máy móc, thiết bị, nhà xưởng;","C":"Tự ý tháo bỏ, thay đổi dấu hiệu niêm phong do cơ quan có thẩm quyền đã tạo lập hợp pháp.","D":"Tất cả các hành vi trên."},"t":"Quản lý thuế / Hoàn thuế"},{"n":257,"q":"Chọn phương án đúng nhất Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, hành vi nào sau đây vi phạm quy định về chấp hành quyết định kiểm tra thuế, cưỡng chế thi hành quyết định hành chính thuế:","c":{"A":"Không nhận quyết định kiểm tra thuế, quyết định cưỡng chế thi hành quyết định hành chính thuế khi được cơ quan thuế giao, gửi theo quy định của pháp luật;","B":"Không chấp hành quyết định kiểm tra thuế quá thời hạn 03 ngày làm việc trở lên, kể từ ngày phải chấp hành quyết định của cơ quan có thẩm quyền;","C":"Cung cấp hồ sơ, tài liệu, hóa đơn, chứng từ, sổ kế toán liên quan đến nghĩa vụ thuế quá thời hạn 06 giờ làm việc, kể từ khi nhận được yêu cầu của cơ quan có thẩm quyền trong thời gian kiểm tra tại trụ sở người nộp thuế;","D":"Tất cả các hành vi trên."},"t":"Quản lý thuế / Hoàn thuế"},{"n":258,"q":"Chọn phương án đúng nhất: Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, căn cứ xác định tổ chức bị giải thể, phá sản là:","c":{"A":"Thông báo chấm dứt mã số thuế của cơ quan thuế đối với trường hợp tổ chức bị giải thể không phải là doanh nghiệp, hợp tác xã (bản chính hoặc bản sao theo quy định);","B":"Thông báo về việc doanh nghiệp, hợp tác xã giải thể của cơ quan đăng ký kinh doanh, cơ quan đăng ký hợp tác xã đối với trường hợp doanh nghiệp, hợp tác xã bị giải thể;","C":"Quyết định tuyên bố phá sản đối với doanh nghiệp, hợp tác xã bị phá sản (bản chính hoặc bản sao theo quy định).","D":"Tất cả các đáp án trên đều đúng"},"t":"Tổng hợp"},{"n":259,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, NNT có hành vi vi phạm về sử dụng hóa đơn không hợp pháp, sử dụng không hợp pháp hóa đơn thuộc trường hợp bị xử phạt hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được miễn, giảm, hoàn hoặc bị xử phạt hành vi trốn thuế thì có bị xử phạt về hóa đơn hay không.","c":{"A":"Có","B":"Không","C":"Tùy thuộc vào số tiền thuế bị truy thu.","D":""},"t":"Hóa đơn"},{"n":260,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, tổ chức, cá nhân chậm nộp tiền phạt vi phạm hành chính về thuế, hóa đơn thì bị tính tiền chậm nộp tiền phạt theo mức bao nhiêu tính trên số tiền phạt chậm nộp.","c":{"A":"0,03%/ngày","B":"0,05%/ngày","C":"0,07%/ngày","D":"5%/ngày"},"t":"Quản lý thuế / Hoàn thuế"},{"n":261,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, trường hợp người nộp thuế ủy quyền cho tổ chức, cá nhân khác thực hiện các nghĩa vụ về thuế mà pháp luật về thuế, quản lý thuế quy định nghĩa vụ, trách nhiệm của bên được ủy quyền phải thực hiện thay người nộp thuế thì nếu bên được ủy quyền có hành vi vi phạm hành chính về thuế thì đối tượng bị xử phạt là:","c":{"A":"Bên được ủy quyền","B":"Bên ủy quyền","C":"Cả bên được ủy quyền và bên ủy quyền","D":"Chưa có quy định cụ thể cho trường hợp này"},"t":"Xử phạt VPHC thuế"},{"n":262,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, thời hiệu xử phạt vi phạm hành chính về hóa đơn là:","c":{"A":"01 năm","B":"02 năm","C":"05 năm","D":"10 năm"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":263,"q":"Theo Luật Xử lý vi phạm hành chính, Thời hạn thi hành quyết định xử lý vi phạm hành chính:","c":{"A":"Thời hạn thi hành quyết định là 10 ngày, kể từ ngày nhận quyết định xử phạt; trường hợp quyết định xử phạt có ghi thời hạn thi hành nhiều hơn 10 ngày thì thực hiện theo thời hạn đó;","B":"Thời hạn thi hành quyết định là 05 ngày, kể từ ngày nhận quyết định xử phạt; trường hợp quyết định xử phạt có ghi thời hạn thi hành nhiều hơn 10 ngày thì thực hiện theo thời hạn đó;","C":"Thời hạn thi hành quyết định là 07 ngày, kể từ ngày nhận quyết định xử phạt; trường hợp quyết định xử phạt có ghi thời hạn thi hành nhiều hơn 10 ngày thì thực hiện theo thời hạn đó","D":"Thời hạn thi hành quyết định là 07 ngày làm việc, kể từ ngày nhận quyết định xử phạt; trường hợp quyết định xử phạt có ghi thời hạn thi hành nhiều hơn 10 ngày thì thực hiện theo thời hạn đó"},"t":"Tổng hợp"},{"n":264,"q":"Theo Quyết định 970/QĐ-TCT năm 2023 về Quy trình kiểm tra thuế do Tổng cục trưởng Tổng cục Thuế ban hành, trường hợp không phải xử lý truy thu về thuế; không phải xử phạt vi phạm hành chính về thuế thì trong thời hạn bao nhiêu ngày kể từ ngày ký biên bản kiểm tra, Thủ trưởng cơ quan thuế phải ký kết luận kiểm tra thuế","c":{"A":"07 ngày làm việc","B":"07 ngày","C":"05 ngày làm việc","D":"03 ngày làm việc"},"t":"Quản lý thuế / Hoàn thuế"},{"n":265,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, người nộp thuế sử dụng hóa đơn, chứng từ không hợp pháp để hạch toán giá trị hàng hóa, dịch vụ mua vào làm giảm số tiền thuế phải nộp hoặc làm tăng số tiền thuế được hoàn, số tiền thuế được miễn, giảm nhưng khi cơ quan thuế thanh tra, kiểm tra phát hiện, người mua chứng minh được lỗi vi phạm sử dụng hóa đơn, chứng từ không hợp pháp thuộc về bên bán hàng và người mua đã hạch toán kế toán đầy đủ theo quy định thì người nộp thuế bị xử phạt:","c":{"A":"Phạt tiền từ 1 đến 3 lần số tiền thuế trốn","B":"Phạt thủ tục (Phạt tiền từ 5.000.000 đồng đến 8.000.000 đồng)","C":"Phạt 20% số tiền thuế khai thiếu hoặc số tiền thuế đã được miễn, giảm, hoàn cao hơn so với quy định","D":"Phạt tiền từ 20.000.000 đồng đến 50.000.000 đồng đối với hành vi sử dụng hóa đơn không hợp pháp, sử dụng không hợp pháp hóa đơn"},"t":"Kế toán"},{"n":266,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, trong cùng một thời điểm, người nộp thuế chậm nộp nhiều hồ sơ khai thuế của nhiều kỳ tính thuế nhưng cùng một sắc thuế thì xử phạt vi phạm thế nào?","c":{"A":"Phạt theo từng tờ khai thuế.","B":"Phạt vi phạm hồ sơ khai thuế có khung phạt tiền cao nhất trong số hành vi thực hiện và áp dụng tính tiết tăng nặng vi phạm nhiều lần","C":"Bị xử phạt theo từng hồ sơ khai thuế chậm nộp và không áp dụng tình tiết tăng nặng vi phạm nhiều lần;","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":267,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, trường hợp người nộp thuế khai không đầy đủ các nội dung trong hồ sơ thuế nhưng không dẫn đến thiếu số tiền thuế phải nộp hoặc không dẫn đến tăng số tiền thuế được miễn, giảm, hoàn thì thuộc hành vi vi phạm pháp luật về thuế nào sau đây:","c":{"A":"Vi phạm các thủ tục về thuế","B":"Khai sai dẫn đến thiếu số tiền thuế phải nộp","C":"Trốn thuế, gian lận thuế","D":"Chậm nộp tiền thuế"},"t":"Tổng hợp"},{"n":268,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, hành vi không lập hóa đơn khi bán hàng hóa, dịch vụ thuộc nhóm hành vi vi phạm nào sau đây:","c":{"A":"Trốn thuế, gian lận thuế","B":"Khai sai dẫn đến thiếu số tiền thuế phải nộp","C":"Vi phạm các thủ tục về thuế","D":"Chậm nộp tiền thuế"},"t":"Hóa đơn"},{"n":269,"q":"Đến 28/02/2026, Nghị định số 125/2020/NĐ-CP ngày 19 tháng 10 năm 2020 của Chính phủ quy định xử phạt vi phạm hành chính về thuế, hóa đơn đã được sửa đổi, bổ sung bởi:","c":{"A":"Nghị định 102/2021/NĐ-CP ngày 16 tháng 11 năm 2021","B":"Nghị định 310/2025/NĐ-CP ngày 02 tháng 12 năm 2025","C":"Nghị định số 118/2021/NĐ-CP ngày 23/12/2021","D":"Nghị định 102/2021/NĐ-CP ngày 16 tháng 11 năm 2021 và Nghị định 310/2025/NĐ-CP ngày 02 tháng 12 năm 2025"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":270,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, thời hiệu thi hành quyết định xử phạt vi phạm hành chính về thuế, hóa đơn:","c":{"A":"01 năm, kể từ ngày ra quyết định xử phạt;","B":"02 năm, kể từ ngày ra quyết định xử phạt;","C":"03 năm, kể từ ngày ra quyết định xử phạt;","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":271,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, Người nộp thuế có hoạt động kinh doanh trước thời hạn đã thông báo ngừng, tạm ngừng hoạt động kinh doanh nhưng không thông báo với cơ quan thuế và không phát sinh số thuế phải nộp thì bị xử phạt vi phạm hành chính:","c":{"A":"Hành vi vi phạm về thông báo tạm ngừng hoạt động kinh doanh; thông báo tiếp tục kinh doanh trước thời hạn","B":"Hành vi vi phạm về thời hạn nộp hồ sơ khai thuế","C":"Hành vi trốn thuế","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":272,"q":"Theo Luật Quản lý thuế năm 2019, thời hạn lập biên bản kiểm tra thuế là bao nhiêu ngày làm việc kể từ ngày hết thời hạn kiểm tra tại trụ sở người nộp thuế?","c":{"A":"05","B":"07","C":"10","D":"03"},"t":"Quản lý thuế / Hoàn thuế"},{"n":273,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, thời hiệu xử phạt đối với hành vi vi phạm thủ tục thuế; hành vi trốn thuế chưa đến mức truy cứu trách nhiệm hình sự, hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được miễn, giảm, hoàn lần lượt là:","c":{"A":"02 năm và 05 năm kể từ ngày thực hiện hành vi vi phạm","B":"01 năm và 06 năm kể từ ngày thực hiện hành vi vi phạm","C":"03 năm và 05 năm kể từ ngày thực hiện hành vi vi phạm","D":""},"t":"Xử phạt VPHC thuế"},{"n":274,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, hành vi sử dụng hóa đơn trong thời gian bị cưỡng chế bằng biện pháp ngừng sử dụng hóa đơn và không được phép sử dụng theo thông báo của cơ quan thuế thuộc hành vi:","c":{"A":"Sử dụng hóa đơn không hợp pháp","B":"Sử dụng không hợp pháp hóa đơn","C":"Không thuộc hành vi a và b","D":""},"t":"Hóa đơn"},{"n":275,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, hành vi không ghi chép trong sổ sách kế toán các khoản thu liên quan đến việc xác định số tiền thuế phải nộp được xử phạt theo:","c":{"A":"Hành vi trốn thuế","B":"Hành vi vi phạm thủ tục thuế","C":"hành vi khai sai","D":""},"t":"Kế toán"},{"n":276,"q":"Theo Nghị định 125/2020/NĐ -CP ngày 19 tháng 10 năm 2020 và các các văn bản sửa đổi, bổ sung, Người nộp thuế sử dụng hóa đơn không hợp pháp hoặc sử dụng không hợp pháp hóa đơn để khai thuế, làm giảm số thuế phải nộp, nếu có ít nhất một tình tiết giảm nhẹ, thì bị phạt 1 lần số thuế trốn. Nhận định trên là ĐÚNG hay SAI?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":277,"q":"Trong quá trình kiểm tra hồ sơ khai thuế, cơ quan thuế xác định doanh nghiệp không nộp hồ sơ khai thuế theo quy định; tuy nhiên qua xác minh nghĩa vụ thuế của kỳ tính thuế tương ứng không phát sinh số thuế phải nộp. Cơ quan thuế không thực hiện xử phạt vi phạm hành chính do không phát sinh nghĩa vụ thuế. Nhận định trên là ĐÚNG hay SAI?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":278,"q":"Trường hợp người nộp thuế khai sai các chỉ tiêu liên quan đến xác định nghĩa vụ thuế nhưng không làm thiếu số tiền thuế phải nộp thì không bị xử phạt vi phạm hành chính. Nhận định trên là ĐÚNG hay SAI?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":279,"q":"Trong quá trình kiểm tra hồ sơ khai thuế tại cơ quan thuế, cán bộ thuế phát hiện doanh nghiệp nộp hồ sơ khai thuế quá thời hạn 06 ngày so với thời hạn quy định; đồng thời doanh nghiệp có tình tiết giảm nhẹ do lần đầu vi phạm và chủ động khắc phục ngay sau khi phát hiện. Căn cứ hồ sơ vụ việc, cán bộ thuế áp dụng hình thức cảnh cáo đối với hành vi nộp chậm hồ sơ khai thuế. Nhận định trên là ĐÚNG hay SAI?.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":280,"q":"Trường hợp người nộp thuế khai sai nhiều chỉ tiêu trên một hồ sơ thuế vừa thuộc trường hợp bị xử phạt về thủ tục thuế, vừa thuộc trường hợp bị xử phạt theo Điều 16 hoặc Điều 17 Nghị định 125/2020/NĐ-CP thì chỉ bị xử phạt về một hành vi theo Điều 16 hoặc Điều 17 Nghị định 125/2020/NĐ-CP.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":281,"q":"Đối với vi phạm thủ tục thuế, nếu đã hết thời hiệu xử phạt, thì không xử phạt nhưng vẫn áp dụng biện pháp khắc phục hậu quả theo quy định của pháp luật.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":282,"q":"Hành vi nộp hồ sơ khai thuế quá thời hạn trên 90 ngày kể từ ngày hết hạn nộp hồ sơ khai thuế, có phát sinh số thuế phải nộp và người nộp thuế đã nộp đủ số tiền thuế, tiền chậm nộp vào ngân sách nhà nước trước thời điểm cơ quan thuế công bố quyết định kiểm tra thuế hoặc trước thời điểm cơ quan thuế lập biên bản về hành vi chậm nộp hồ sơ khai thuế thì mức phạt tiền từ 15.000.000 đồng đến 25.000.000 đồng. Trường hợp tổ chức nộp hồ sơ khai thuế có phát sinh số thuế phải nộp là 23.000.000 đồng thì số tiền phạt tối đa đối với trường hợp này là bao nhiêu ?","c":{"A":"15.000.000 đồng","B":"20.000.000 đồng","C":"23.000.000 đồng","D":"25.000.000 đồng"},"t":"Xử phạt VPHC thuế"},{"n":283,"q":"Hành vi lập hóa đơn không đúng thời điểm nhưng không làm chậm nghĩa vụ thuế thì không bị xử phạt.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":284,"q":"Hành vi không nộp hồ sơ khai thuế, nếu không phát sinh số thuế phải nộp, thì chỉ bị phạt cảnh cáo.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":285,"q":"Nộp hồ sơ khai thuế quá hạn trên 90 ngày nhưng đã nộp đủ tiền thuế và tiền chậm nộp trước khi bị lập biên bản thì không bị xử phạt vi phạm hành chính.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":286,"q":"Hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp nhưng người nộp thuế đã khai bổ sung, nộp đủ số tiền thuế phải nộp trước khi cơ quan thuế công bố quyết định kiểm tra thì không bị xử phạt vi phạm hành chính.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNDN - Chi phí được trừ"},{"n":287,"q":"Đối với hành vi không nộp các phụ lục theo quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết kèm theo hồ sơ quyết toán thuế thu nhập doanh nghiệp, ngày thực hiện hành vi vi phạm để tính thời hiệu xử phạt được xác định là ngày nào?","c":{"A":"Ngày liền kề sau ngày phát sinh nghĩa vụ thuế.","B":"Ngày kế tiếp ngày kết thúc thời hạn nộp tờ khai thuế.","C":"Ngày người có thẩm quyền thi hành công vụ phát hiện hành vi vi phạm.","D":"Ngày người nộp thuế nộp hồ sơ khai thuế"},"t":"Giao dịch liên kết"},{"n":288,"q":"Theo Nghị định 310/2025/NĐ-CP, hành vi tiêu hủy hóa đơn không đúng trình tự, thủ tục bị xử phạt như thế nào?","c":{"A":"Phạt cảnh cáo","B":"Phạt tiền từ 2.000.000 đồng đến 4.000.000 đồng","C":"Phạt tiền từ 4.000.000 đồng đến 8.000.000 đồng.","D":"Không bị xử phạt"},"t":"Hóa đơn"},{"n":289,"q":"Hộ kinh doanh, cá nhân kinh doanh đã bị ấn định thuế theo Điều 51 Luật Quản lý thuế, sau đó phát sinh hành vi vi phạm về thủ tục thuế. Việc xử lý vi phạm được thực hiện như thế nào?","c":{"A":"Vẫn xử phạt hành vi vi phạm thủ tục thuế","B":"Chỉ xử phạt khi có dấu hiệu trốn thuế","C":"Không xử phạt vi phạm thủ tục thuế","D":"Tất cả đều sai."},"t":"Quản lý thuế / Hoàn thuế"},{"n":290,"q":"Theo Nghị định 310/2025/NĐ-CP, trường hợp bất khả kháng trong xử phạt vi phạm hành chính về thuế bao gồm trường hợp nào?","c":{"A":"Thiên tai, thảm họa","B":"Dịch bệnh, hỏa hoạn","C":"Sự kiện khách quan không thể lường trước và không thể khắc phục","D":"Tất cả các phương án trên"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":291,"q":"Theo Luật Xử lý vi phạm hành chính, trong trường hợp thông thường, thời hạn ra quyết định xử phạt vi phạm hành chính kể từ ngày lập biên bản là bao lâu?","c":{"A":"07 ngày","B":"05 ngày làm việc","C":"07 ngày làm việc","D":"10 ngày"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":292,"q":"Theo Luật Xử lý vi phạm hành chính, trường hợp người vi phạm không ký vào biên bản vi phạm hành chính thì biên bản có giá trị pháp lý không?","c":{"A":"Không có giá trị","B":"Phải lập lại biên bản","C":"Có giá trị nếu có chữ ký của người lập biên bản và người chứng kiến","D":"Chỉ có giá trị khi được cấp trên xác nhận"},"t":"Tổng hợp"},{"n":293,"q":"Đối với người nộp thuế không đăng ký thuế, khi phát hiện hành vi vi phạm thì thời hạn truy thu toàn bộ số tiền thuế thiếu, thuế trốn và tiền chậm nộp được xác định như thế nào?","c":{"A":"Tối đa 10 năm trở về trước, kể từ ngày phát hiện hành vi vi phạm","B":"Tối đa 5 năm trở về trước, kể từ ngày phát hiện hành vi vi phạm","C":"Toàn bộ thời gian trở về trước, kể từ ngày phát hiện hành vi vi phạm","D":"Truy thu theo thời hiệu xử phạt vi phạm hành chính."},"t":"Quản lý thuế / Hoàn thuế"},{"n":294,"q":"Theo Luật Xử lý vi phạm hành chính, ngôn ngữ sử dụng trong xử phạt vi phạm hành chính là gì?","c":{"A":"Ngôn ngữ hành chính","B":"Tiếng Việt","C":"Song ngữ","D":"Do người lập biên bản lựa chọn"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":295,"q":"Theo quy định, ngày chấp hành xong quyết định xử phạt cảnh cáo được xác định là ngày nào?","c":{"A":"Ngày tổ chức, cá nhân ký vào biên bản vi phạm hành chính.","B":"Ngày quyết định xử phạt có hiệu lực pháp luật.","C":"Ngày quyết định xử phạt vi phạm hành chính được giao hoặc gửi cho tổ chức, cá nhân bị xử phạt.","D":"Ngày hết thời hạn khiếu nại quyết định xử phạt."},"t":"Xử phạt VPHC thuế"},{"n":296,"q":"Theo Luật Xử lý vi phạm hành chính, cá nhân, tổ chức bị xử phạt vi phạm hành chính có quyền nào sau đây?","c":{"A":"Tự lựa chọn hình thức xử phạt","B":"Khiếu nại, khởi kiện quyết định xử phạt","C":"Không chấp hành quyết định xử phạt","D":"Yêu cầu miễn xử phạt trong mọi trường hợp"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":297,"q":"Theo quy định tại Nghị định 310/2025/NĐ-CP, Người nộp thuế chậm nộp hồ sơ khai thuế bằng phương thức điện tử. Trong thời hạn bao lâu kể từ ngày cơ quan thuế gửi thông báo chấp nhận hồ sơ khai thuế điện tử, cơ quan thuế phải lập và gửi biên bản vi phạm hành chính điện tử cho người nộp thuế?","c":{"A":"01 ngày làm việc","B":"02 ngày làm việc","C":"03 ngày làm việc","D":"05 ngày làm việc"},"t":"Xử phạt VPHC thuế"},{"n":298,"q":"Theo Luật Xử lý vi phạm hành chính, cưỡng chế thi hành quyết định xử phạt vi phạm hành chính được áp dụng khi nào?","c":{"A":"Khi có khiếu nại","B":"Khi không tự nguyện chấp hành","C":"Khi có tình tiết tăng nặng","D":"Khi có yêu cầu của cấp trên"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":299,"q":"Trường hợp người nộp thuế nộp hồ sơ khai thuế quá hạn trên 90 ngày, có phát sinh số thuế phải nộp, nhưng số tiền phạt theo khung từ 15.000.000 đồng đến 25.000.000 đồng lớn hơn số tiền thuế phát sinh trên hồ sơ khai thuế thì mức phạt tiền tối đa được xác định như thế nào?","c":{"A":"Bằng mức tối thiểu của khung phạt","B":"Bằng mức trung bình của khung phạt","C":"Bằng số tiền thuế phát sinh phải nộp trên hồ sơ khai thuế nhưng không thấp hơn mức trung bình của khung phạt","D":"Bằng số tiền thuế phát sinh phải nộp trên hồ sơ khai thuế"},"t":"Xử phạt VPHC thuế"},{"n":300,"q":"Theo quy định về xử phạt vi phạm hành chính về thuế, thời hiệu xử phạt đối với hành vi trốn thuế chưa đến mức truy cứu trách nhiệm hình sự và hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được miễn, giảm, hoàn là bao lâu?","c":{"A":"02 năm, kể từ ngày phát sinh nghĩa vụ thuế","B":"03 năm, kể từ ngày người nộp thuế nộp hồ sơ khai thuế","C":"05 năm, kể từ ngày thực hiện  người có chức vụ cao nhất"},"t":"Tổng hợp"},{"n":310,"q":"Theo Luật Xử lý vi phạm hành chính, một người thực hiện nhiều hành vi vi phạm hành chính khác nhau thì bị xử lý như thế nào?","c":{"A":"Chỉ xử phạt hành vi vi phạm nghiêm trọng nhất","B":"Gộp các hành vi để xử phạt một lần","C":"Xử phạt về từng hành vi vi phạm","D":"Do người có thẩm quyền quyết định"},"t":"Tổng hợp"},{"n":311,"q":"Tổ chức, cá nhân đã bị xử phạt vi phạm hành chính về thuế, hóa đơn bằng hình thức phạt tiền. Sau bao lâu kể từ ngày chấp hành xong quyết định xử phạt, nếu không tái phạm thì được coi là chưa bị xử phạt vi phạm hành chính về hành vi đó?","c":{"A":"06 tháng","B":"01 năm","C":"02 năm","D":"05 năm"},"t":"Xử phạt VPHC thuế"},{"n":312,"q":"Theo Luật Xử lý vi phạm hành chính, hình thức xử phạt bổ sung được áp dụng trong trường hợp nào?","c":{"A":"Khi hành vi vi phạm nghiêm trọng","B":"Khi Luật có quy định","C":"Khi người vi phạm là tổ chức","D":"Khi có tình tiết tăng nặng"},"t":"Xử phạt VPHC thuế"},{"n":313,"q":"Theo Luật Xử lý vi phạm hành chính, biện pháp khắc phục hậu quả bao gồm nội dung nào sau đây?","c":{"A":"Buộc khôi phục lại tình trạng ban đầu","B":"Buộc nộp lại số lợi bất hợp pháp","C":"Buộc tiêu hủy vật phẩm gây hại","D":"Tất cả các phương án trên đều đúng"},"t":"Tổng hợp"},{"n":314,"q":"Theo quy định về cách tính thời gian, thời hạn, thời hiệu trong xử lý vi phạm hành chính, thời gian ban đêm được tính như thế nào?","c":{"A":"Từ 21 giờ ngày hôm trước đến 05 giờ ngày hôm sau","B":"Từ 22 giờ ngày hôm trước đến 05 giờ ngày hôm sau","C":"Từ 22 giờ ngày hôm trước đến 06 giờ ngày hôm sau","D":"Từ 23 giờ đến 06 giờ ngày hôm sau"},"t":"Tổng hợp"},{"n":315,"q":"Theo Luật Xử lý vi phạm hành chính, hình thức xử phạt vi phạm hành chính bao gồm những hình thức nào sau đây?","c":{"A":"Cảnh cáo","B":"Phạt tiền","C":"Tước quyền sử dụng giấy phép, chứng chỉ hành nghề có thời hạn","D":"A, B và C đều đúng"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":316,"q":"Theo Nghị định 118/2021/NĐ-CP (đã được
