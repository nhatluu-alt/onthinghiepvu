hí tài chính (TK 635).","C":"Kết chuyển toàn bộ vào Chi phí quản lý doanh nghiệp (TK 642).","D":"Ghi giảm Lợi nhuận sau thuế chưa phân phối (TK 421)."},"t":"Kế toán"},{"n":1486,"q":"Theo Thông tư 133/2016/TT-BTC, Khi doanh nghiệp sử dụng Quỹ phúc lợi để mua sắm một Tài sản cố định (TSCĐ) phục vụ cho hoạt động văn hóa, phúc lợi của nhân viên (ví dụ: mua xe ô tô đưa đón nhân viên), kế toán thực hiện bút toán đồng thời nào sau khi ghi tăng TSCĐ?","c":{"A":"Nợ TK 3531 / Có TK 3532.","B":"Nợ TK 3532 / Có TK 3533.","C":"Nợ TK 411 / Có TK 353.","D":"Không cần bút toán đồng thời."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1487,"q":"Theo Thông tư 133/2016/TT-BTC, Doanh nghiệp trích lập dự phòng bảo hành công trình xây lắp. Khi hết thời hạn bảo hành, nếu số dự phòng đã trích lớn hơn chi phí bảo hành thực tế phát sinh, số chênh lệch thừa được kế toán xử lý thế nào?","c":{"A":"Ghi nhận vào Thu nhập khác (TK 711).","B":"Hoàn nhập ghi giảm Giá vốn hàng bán (TK 632).","C":"Hoàn nhập ghi giảm Chi phí quản lý doanh nghiệp (TK 642).","D":"Ghi tăng Lợi nhuận sau thuế chưa phân phối (TK 421)."},"t":"Kế toán"},{"n":1488,"q":"Theo Thông tư 133/2016/TT-BTC, Khoản chiết khấu thương mại, giảm giá hàng bán do doanh nghiệp nhận được từ người bán (do mua số lượng lớn) sau khi đã mua hàng và xuất hóa đơn sẽ được kế toán (bên mua) hạch toán như thế nào?","c":{"A":"Ghi nhận vào Thu nhập khác (TK 711).","B":"Ghi giảm trực tiếp giá trị hàng tồn kho (hoặc giảm giá vốn hàng bán, chi phí nếu hàng đã xuất dùng).","C":"Ghi nhận vào Doanh thu hoạt động tài chính (TK 515).","D":"Ghi giảm Chi phí bán hàng."},"t":"Kế toán"},{"n":1489,"q":"Theo Thông tư 133/2016/TT-BTC trong chương trình khách hàng truyền thống (ví dụ: tích điểm thưởng đổi quà), khi khách hàng mua hàng hóa thỏa mãn điều kiện tích điểm, kế toán xử lý doanh thu như thế nào?","c":{"A":"Ghi nhận toàn bộ số tiền thu được vào doanh thu bán hàng.","B":"Phân bổ một phần doanh thu tương ứng với giá trị hợp lý của điểm thưởng vào Doanh thu chưa thực hiện (TK 3387), phần còn lại ghi vào Doanh thu (TK 511).","C":"Ghi nhận toàn bộ vào TK 3387 chờ khi khách đổi quà mới ghi doanh thu.","D":"Ghi nhận phần điểm thưởng vào Chi phí bán hàng."},"t":"Kế toán"},{"n":1490,"q":"Theo Thông tư 133/2016/TT-BTC, Doanh nghiệp nhận trước tiền của khách hàng cho việc cho thuê văn phòng trong 3 năm. Toàn bộ số tiền nhận trước này được hạch toán vào đâu tại thời điểm nhận tiền?","c":{"A":"Doanh thu bán hàng và cung cấp dịch vụ (TK 511).","B":"Doanh thu chưa thực hiện (TK 3387).","C":"Phải trả khách hàng (Bên Có TK 131).","D":"Thu nhập khác (TK 711)."},"t":"Kế toán"},{"n":1491,"q":"Trong giai đoạn đầu tư xây dựng để hình thành TSCĐ hoặc BĐSĐT, các khoản chênh lệch tỷ giá hối đoái xử lý như thế nào?","c":{"A":"Được vốn hoá vào giá trị tài sản dở dang.","B":"Được Ghi nhận vào chi phí tài chính nếu lỗ và được ghi nhận vào doanh thu hoạt động tài chính (nếu lãi) tại thời điểm phát sinh.","C":"Không được vốn hóa vào giá trị tài sản dở dang","D":"Cả B và C đều đúng"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1492,"q":"Theo quy định, Các chi phí của hợp đồng hợp tác kinh doanh (BCC) hình thành tài sản đồng kiểm soát trong quá trình xây dựng được tập hợp vào tài khoản nào đối với bên mang tài sản đi góp vốn (có chuyển quyền sở hữu chung)?","c":{"A":"TK 241 - Xây dựng cơ bản dở dang.","B":"TK 211 - TSCĐ hữu hình.","C":"TK 811 - Chi phí khác.","D":"TK 136 - Phải thu nội bộ."},"t":"Tổng hợp"},{"n":1493,"q":"Theo quy định chi phí thành lập doanh nghiệp, chi phí đào tạo nhân viên phát sinh đem lại lợi ích trong tương lai có được ghi nhận là TSCĐ vô hình không?","c":{"A":"Có, ghi nhận là TSCĐ vô hình.","B":"Không, được ghi nhận là chi phí sản xuất kinh doanh trong kỳ hoặc phân bổ (chi phí trả trước).","C":"Có, ghi nhận vào Bất động sản đầu tư.","D":"Ghi giảm vốn chủ sở hữu."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1494,"q":"Hợp đồng thuê tài sản được coi là thuê tài chính nếu thỏa mãn ít nhất điều kiện nào dưới đây?","c":{"A":"Thời hạn thuê từ 1 năm trở lên.","B":"Bên thuê có quyền hủy hợp đồng mà không phải đền bù.","C":"Bên cho thuê chuyển giao quyền sở hữu tài sản cho bên thuê khi hết thời hạn thuê.","D":"Giá trị tài sản thuê nhỏ hơn 30 triệu đồng."},"t":"Tổng hợp"},{"n":1495,"q":"Theo quy định, chi phí lãi vay phát sinh trong quá trình mua sắm TSCĐ có được vốn hóa vào nguyên giá TSCĐ không?","c":{"A":"Được vốn hóa vào TSCĐ nếu giá trị lớn.","B":"Không được vốn hóa vào nguyên giá TSCĐ.","C":"Phải được vốn hóa TSCĐ.","D":"Tùy thuộc vào quyết định của giám đốc."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1496,"q":"Theo Thông tư 133/2016/TT-BTC, Trường hợp một tòa nhà được sử dụng cho nhiều mục đích (vừa làm văn phòng, vừa cho thuê, vừa để bán), kế toán phải làm gì?","c":{"A":"Phân loại toàn bộ là TSCĐ hữu hình.","B":"Phân loại toàn bộ là Bất động sản đầu tư.","C":"Phân loại toàn bộ là Hàng tồn kho.","D":"Ước tính giá trị hợp lý của từng bộ phận để phân loại và ghi nhận phù hợp với mục đích sử dụng."},"t":"Kế toán"},{"n":1497,"q":"Theo quy định, những chi phí nào KHÔNG được hạch toán vào TK 154 - Chi phí sản xuất, kinh doanh dở dang?","c":{"A":"Chi phí nguyên liệu, vật liệu trực tiếp.","B":"Chi phí nhân công trực tiếp.","C":"Chi phí sản xuất chung.","D":"Chi phí bán hàng, chi phí quản lý doanh nghiệp, chi phí tài chính."},"t":"Kế toán"},{"n":1498,"q":"Doanh nghiệp có khoản nợ phải thu đã quá hạn thanh toán ghi trong hợp đồng kinh tế, nhưng vẫn chưa thu được. Việc xác định thời gian quá hạn của khoản nợ phải thu được xác định là khó đòi phải trích lập dự phòng được căn cứ:","c":{"A":"Thời gian trả nợ gốc theo hợp đồng mua, bán ban đầu, tính đến việc gia hạn nợ giữa các bên.","B":"Thời gian trả nợ gốc theo hợp đồng mua, bán ban đầu, không tính đến việc gia hạn nợ giữa các bên.","C":"Thời gian gia hạn nợ giữa hai bên.","D":"Thời gian nợ kéo dài trên 1 năm."},"t":"Tổng hợp"},{"n":1499,"q":"Theo quy định, việc trích lập hoặc hoàn nhập dự phòng tổn thất đầu tư vào đơn vị khác được thực hiện ở thời điểm nào:","c":{"A":"Thời điểm lập Báo cáo tài chính.","B":"Thời điểm phát sinh nghiệp vụ đầu tư.","C":"Thời điểm kết thúc năm tài chính (31/12).","D":"Tuỳ theo từng khoản mục đầu tư mà chọn lựa 1501"},"t":"Tổng hợp"},{"n":1500,"q":"Tại thời điểm kết thúc kỳ kế toán, trường hợp nào thì doanh nghiệp thực hiện hoàn nhập dự phòng giảm giá hàng tồn kho:","c":{"A":"Trường hợp khoản dự phòng giảm giá hàng tồn kho phải lập ở cuối kỳ kế toán này lớn hơn khoản dự phòng giảm giá hàng tồn kho đang ghi trên sổ kế toán","B":"Trường hợp khoản dự phòng giảm giá hàng tồn kho phải lập ở cuối kỳ kế toán này nhỏ hơn khoản dự phòng giảm giá hàng tồn kho đang ghi trên sổ kế toán.","C":"Giá trị thuần có thể thực hiện được thấp hơn so với giá gốc của hàng tồn kho.","D":"Không thực hiện hoàn nhập."},"t":"Kế toán"},{"n":1501,"q":"Theo quy định việc trích lập dự phòng giảm giá hàng tồn kho được lập dựa trên cơ sở nào?","c":{"A":"Chênh lệch giữa giá gốc của hàng tồn kho lớn hơn giá trị thuần có thể thực hiện được.","B":"Chênh lệch giữa giá bán trên thị trường lớn hơn giá gốc.","C":"Tỷ lệ phần trăm cố định trên tổng giá trị hàng tồn kho.","D":"Chênh lệch giữa giá gốc và giá trị thay thế"},"t":"Tổng hợp"},{"n":1502,"q":"Hàng hóa, nguyên vật liệu bị hao hụt, mất mát phát hiện khi kiểm kê (chưa xác định được nguyên nhân) ban đầu được treo trên TK 1381. Sau khi trừ phần bồi thường của cá nhân, phần giá trị hao hụt còn lại của hàng tồn kho được hạch toán vào đâu?","c":{"A":"Chi phí bán hàng.","B":"Chi phí khác.","C":"Giá vốn hàng bán.","D":"Chi phí quản lý doanh nghiệp."},"t":"Kế toán"},{"n":1503,"q":"Theo quy định, các khoản thuế nào sau đây KHÔNG được hoàn lại và được tính vào giá trị hàng tồn kho?","c":{"A":"Thuế GTGT đầu vào được khấu trừ.","B":"Thuế thu nhập doanh nghiệp.","C":"Thuế GTGT đầu vào không được khấu trừ, thuế tiêu thụ đặc biệt, thuế nhập khẩu.","D":"Thuế thu nhập cá nhân của nhân viên thu mua."},"t":"Tổng hợp"},{"n":1504,"q":"Theo Thông tư 99/2025/TT-BTC: Trường hợp doanh nghiệp là bên không có quyền đồng kiểm soát BCC, hợp đồng BCC quy định các bên tham gia được hưởng lợi ích cố định mà không phụ thuộc vào kết quả kinh doanh của BCC thì bản chất hợp tác này được xem như là:","c":{"A":"Đi thuê tài sản.","B":"Cho vay vốn.","C":"Đầu tư vào đơn vị khác.","D":"Tùy theo bản chất của hợp đồng là thuê tài sản hay cho vay vốn để kế toán cho phù hợp."},"t":"Kế toán"},{"n":1505,"q":"Theo Thông tư 133/2016/TT-BTC, trong trường hợp hợp đồng hợp tác kinh doanh (BCC) khi chỉ được phân chia lợi nhuận nếu kết quả hoạt động của BCC có lãi, đồng thời phải gánh chịu lỗ, bên thực hiện kế toán và nộp thuế thay (bên chủ trì) sẽ trình bày Báo cáo tình hình tài chính mục \"Lợi nhuận sau thuế chưa phân phối\" như thế nào?","c":{"A":"Ghi nhận toàn bộ 100% lợi nhuận của BCC vào chỉ tiêu này.","B":"Chỉ bao gồm phần lợi nhuận sau thuế tương ứng của từng bên được hưởng.","C":"Ghi nhận toàn bộ lợi nhuận của BCC vào Nợ phải trả.","D":"Không trình bày lợi nhuận của BCC trên BCTC của bên chủ trì."},"t":"Kế toán"},{"n":1506,"q":"Trường hợp xuất hàng tồn kho để khuyến mại, quảng cáo không thu tiền, không kèm theo các điều kiện khác như phải mua sản phẩm, hàng hóa thì doanh nghiệp ghi nhận giá trị hàng tồn kho dùng cho khuyến mại, quảng cáo vào:","c":{"A":"Chi phí bán hàng.","B":"Chi phí giá vốn.","C":"Ghi nhận doanh thu, giá vốn như giao dịch bán hàng thông thường.","D":"Phân bổ số tiền hoặc lợi ích thu được để tính doanh thu cho cả hàng bán và hàng khuyến mại."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1507,"q":"Các TSCĐ chưa tính đủ khấu hao (chưa thu hồi đủ vốn) mà đã hư hỏng không được bồi thường, không thanh lý được có tiếp tục trích khấu hao và hạch toán hao mòn tài sản không?","c":{"A":"Tiếp tục tính khấu hao và hạch toán hao mòn tài sản cho đến khi thu hồi đủ vốn.","B":"Không được tiếp tục tính khấu hao phần giá trị còn lại.","C":"Không tiếp tục tính khấu hao nhưng được xem như giá trị lỗ về thanh lý TSCĐ và hạch toán vào chi phí khác phần giá trị còn lại chưa thu hồi đủ.","D":"Không có đáp án đúng."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1508,"q":"Khi nhượng bán TSCĐ hữu hình, kế toán ghi nhận bút toán liên quan:","c":{"A":"Tăng thu nhập khác, chi phí khác tương ứng bằng giá trị nhượng bán và tăng thuế GTGT tương ứng nếu có, đồng thời ghi giảm TSCĐ","B":"Tăng thu nhập khác, ghi giảm chi phí khác tương ứng bằng giá trị nhượng bán và tăng thuế GTGT phải nộp tương ứng nếu có, đồng thời ghi giảm TSCĐ","C":"Tăng thu nhập khác giá trị bán, tăng thuế GTGT phải nộp tương ứng, tăng chi phí khác bằng giá trị còn lại của TSCĐ, đồng thời ghi giảm nguyên giá TSCĐ.","D":""},"t":"Kế toán"},{"n":1509,"q":"Doanh nghiệp tự xây dựng nhà xưởng, đã đưa vào sử dụng nhưng chưa thực hiện quyết toán công trình. Nguyên giá nhà xưởng được ghi nhận theo:","c":{"A":"Không cần thực hiện quyết toán, căn cứ giá trị tạm tính.","B":"Bắt buộc phải thực hiện quyết toán trước khi đưa vào sử dụng, chưa có giá trị chưa ghi nhận nguyên giá.","C":"Tạm thời ghi nhận nguyên giá theo giá trị dự toán.","D":"Căn cứ vào chi phí đầu tư xây dựng thực tế để hạch toán tăng nguyên giá TSCĐ theo giá tạm tính. Sau khi quyết toán vốn đầu tư xây dựng cơ bản được duyệt, nếu có chênh lệch so với giá trị TSCĐ đã tạm tính thì kế toán điều chỉnh tăng, giảm vào nguyên giá TSCĐ."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1510,"q":"Khi mua sắm tài sản là bất động sản, doanh nghiệp phải ghi nhận nguyên giá TSCĐ như thế nào?","c":{"A":"Tách riêng giá trị quyền sử dụng đất và tài sản trên đất theo quy định của pháp luật và ghi nhận vào nguyên giá TSCĐ hữu hình.","B":"Không tách riêng, ghi theo giá trị mua bất động sản toàn bộ.","C":"Tách riêng giá trị quyền sử dụng đất và tài sản trên đất theo quy định của pháp luật. Phần giá trị tài sản trên đất được ghi nhận là nguyên giá TSCĐ hữu hình; Giá trị quyền sử dụng đất được ghi nhận là nguyên giá TSCĐ vô hình hoặc chi phí chờ phân bổ tùy từng trường hợp theo quy định của pháp luật.","D":"Không có đáp án đúng."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1511,"q":"Doanh nghiệp mua TSCĐ theo phương thức trả chậm, trả góp. Nguyên giá TSCĐ được xác định theo giá nào?","c":{"A":"Tổng số tiền phải thanh toán theo hợp đồng (bao gồm cả lãi trả chậm).","B":"Giá mua trả tiền ngay tại thời điểm mua cộng các chi phí liên quan trực tiếp.","C":"Giá mua trả tiền ngay trừ đi chi phí lắp đặt chạy thử.","D":"Giá trị hợp lý do chuyên gia định giá cộng với tiền lãi trả chậm."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1512,"q":"Trường hợp khách hàng ứng trước tiền mua hàng bằng ngoại tệ, khi đủ điều kiện ghi nhận doanh thu, khoản doanh thu tương ứng với số tiền nhận trước được quy đổi theo tỷ giá nào?","c":{"A":"Tỷ giá mua chuyển khoản tại ngày ghi nhận doanh thu.","B":"Tỷ giá ghi sổ bình quân gia quyền.","C":"Tỷ giá giao dịch thực tế tại thời điểm nhận tiền ứng trước.","D":"Tỷ giá bán của ngân hàng thương mại tại ngày ghi nhận doanh thu."},"t":"Kế toán"},{"n":1513,"q":"Đối với Bất động sản đầu tư (BĐSĐT) nắm giữ với mục đích \"chờ tăng giá\", doanh nghiệp có trích khấu hao hay không?","c":{"A":"Vẫn trích khấu hao bình thường như TSCĐ.","B":"Trích khấu hao vào giá vốn hàng bán.","C":"Không trích khấu hao mà xác định tổn thất do giảm giá trị (nếu có).","D":"Chuyển sang hàng tồn kho để tính giá vốn."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1514,"q":"Kế toán xử lý thế nào đối với các khoản chi phí có hóa đơn chứng từ hợp lệ, hạch toán đúng chế độ nhưng KHÔNG được trừ theo quy định của Luật thuế TNDN (ví dụ: chi phí vượt mức khống chế)?","c":{"A":"Không được ghi nhận vào sổ sách kế toán.","B":"Ghi giảm chi phí kế toán vào cuối kỳ.","C":"Vẫn ghi nhận vào chi phí kế toán bình thường, chỉ điều chỉnh trên Tờ khai quyết toán thuế TNDN.","D":"Ghi nhận trực tiếp giảm Lợi nhuận sau thuế chưa phân phối."},"t":"Kế toán"},{"n":1515,"q":"Doanh thu và chi phí liên quan tới cùng một giao dịch phải được ghi nhận đồng thời theo nguyên tắc gì?","c":{"A":"Nguyên tắc trọng yếu.","B":"Nguyên tắc phù hợp","C":"Nguyên tắc thận trọng","D":"Nguyên tắc nhất quán."},"t":"Tổng hợp"},{"n":1516,"q":"Khi hàng hóa hoặc dịch vụ được trao đổi để lấy hàng hóa hoặc dịch vụ tương tự về bản chất và giá trị thì việc trao đổi đó có được coi là một giao dịch tạo ra doanh thu hay không?","c":{"A":"Không được xem là một giao dịch tạo ra doanh thu.","B":"Được xem là một giao dịch tạo ra doanh thu.","C":"Cả A, B đều đúng","D":"Cả A, B đều sai"},"t":"Tổng hợp"},{"n":1517,"q":"Doanh nghiệp siêu nhỏ đang áp dụng Thông tư số 133/2016/TT-BTC nếu chuyển sang áp dụng chế độ kế toán theo quy định tại Thông tư số 132/2018/TT-BTC thì phải chuyển tài khoản lợi nhuận sau thuế chưa phân phối chuyển sang tài khoản nào?","c":{"A":"331","B":"211","C":"4118","D":"131"},"t":"Kế toán"},{"n":1518,"q":"Doanh nghiệp siêu nhỏ đang áp dụng Thông tư số 133/2016/TT-BTC nếu chuyển sang áp dụng chế độ kế toán theo quy định tại Thông tư số 132/2018/TT-BTC phải chuyển số dư tài khoản nào về TK 111?","c":{"A":"TK131","B":"TK112","C":"TK152","D":"TK 211"},"t":"Kế toán"},{"n":1519,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, DN nộp TNDN theo tỷ lệ % trên doanh thu có bắt buộc mở tài khoản kế toán không?","c":{"A":"Có","B":"Không","C":"Chỉ mở TK tiền","D":"Chỉ mở TK doanh thu"},"t":"Kế toán"},{"n":1520,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, DN nộp TNDN theo tỷ lệ % trên doanh thu bán hàng hóa, dịch vụ nếu lựa chọn áp dụng chế độ kế toán quy định tại Chương II Thông tư này có bắt buộc nộp báo cáo tài chính cho thuế không?","c":{"A":"Có.","B":"Không cần lập, không cần nộp","C":"Không nộp cho cơ quan thuế nhưng vẫn phải lập và cung cấp khi có yêu cầu.","D":"Doanh thu trên 3 tỷ/năm phải lập."},"t":"Kế toán"},{"n":1521,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, DN nộp TNDN theo tỷ lệ % trên doanh thu bán hàng hóa, dịch vụ có bắt buộc nộp báo cáo tài chính cho thuế không?","c":{"A":"Có","B":"Không","C":"Tùy doanh thu","D":"Tùy ngành nghề"},"t":"Kế toán"},{"n":1522,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, thời hạn nộp báo cáo tài chính tối đa là bao nhiêu ngày sau khi kết thúc năm tài chính?","c":{"A":"30 ngày","B":"60 ngày","C":"90 ngày","D":"120 ngày"},"t":"Kế toán"},{"n":1523,"q":"Theo Thông tư 132, doanh nghiệp siêu nhỏ nộp thuế TNDN theo phương pháp theo thu nhập tính thuế có phải lập báo cáo tài chính không?","c":{"A":"Không cần lập","B":"Chỉ cần lập báo cáo thuế","C":"Phải lập Báo cáo tài chính (gồm Báo cáo tình hình tài chính, Báo cáo kết quả hoạt động kinh doanh)","D":"Chỉ lập khi có yêu cầu"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1524,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, DN siêu nhỏ có được tự xây dựng mẫu chứng từ kế toán?","c":{"A":"Không, phải sử dụng đúng mẫu biểu bắt buộc của Bộ Tài chính.","B":"Được tự xây dựng nhưng phải đảm bảo các nội dung cơ bản của chứng từ theo Luật Kế toán và phù hợp với đặc điểm hoạt động.","C":"Chỉ được tự thiết kế các loại phiếu thu, phiếu chi.","D":"Được tự thiết kế nhưng phải gửi mẫu cho Cơ quan thuế phê duyệt trước khi dùng."},"t":"Kế toán"},{"n":1525,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, doanh nghiệp siêu nhỏ có được lựa chọn áp dụng Thông tư 133 không?","c":{"A":"Không","B":"Có","C":"Chỉ khi được thuế cho phép","D":"Chỉ doanh nghiệp lớn"},"t":"Kế toán"},{"n":1526,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, DN có thể thay đổi chế độ kế toán vào thời điểm nào?","c":{"A":"Bất kỳ","B":"Giữa năm","C":"Đầu năm tài chính","D":"Cuối quý"},"t":"Kế toán"},{"n":1527,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, DN siêu nhỏ phải áp dụng chế độ kế toán nhất quán trong bao lâu?","c":{"A":"6 tháng","B":"1 năm tài chính","C":"2 năm","D":"3 năm"},"t":"Kế toán"},{"n":1528,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018, việc xác định nghĩa vụ thuế thực hiện theo quy định của pháp luật nào?","c":{"A":"Luật Doanh nghiệp","B":"Luật Thuế","C":"Luật Lao động","D":"Luật Đầu tư"},"t":"Tổng hợp"},{"n":1529,"q":"Theo quy định tại Thông tư số 132/2018/TT-BTC ngày 28/12/2018 hướng dẫn chế độ kế toán cho đối tượng nào?","c":{"A":"Doanh nghiệp vừa","B":"Doanh nghiệp nhỏ","C":"Doanh nghiệp siêu nhỏ","D":"Hộ kinh doanh"},"t":"Kế toán"},{"n":1530,"q":"Thu tiền phạt do khách hàng vi phạm hợp đồng, doanh nghiệp khấu trừ vào tiền ký quỹ ký cược, kế toán ghi:","c":{"A":"Nợ TK 344/Có TK 711.","B":"Nợ TK 3386/Có TK 711.","C":"Nợ TK 344, 3386/Có TK 711.","D":"03 câu đều đúng"},"t":"Kế toán"},{"n":1531,"q":"Khoản ứng trước cho người bán, khi lập bảng cân đối kế toán được ghi:","c":{"A":"Ghi tăng “phải thu khách hàng”","B":"Ghi giảm “phải trả người bán”.","C":"Ghi tăng “Trả trước cho người bán”","D":"Tất cả đều sai."},"t":"Kế toán"},{"n":1532,"q":"Để ghi nhận doanh thu bán hàng bằng tiền mặt theo phương pháp kê khai thường xuyên:","c":{"A":"Chỉ cần một bút toán để ghi nhận giá vốn hàng bán và xuất hàng tồn kho.","B":"Chỉ cần một bút toán ghi nhận tiền mặt và doanh thu bán hàng","C":"Hai bút toán: (1) ghi nhận tiền mặt và doanh thu (2) ghi nhận giá vốn bán hàng và hàng tồn kho","D":"Hai bút toán: (1) ghi nhận tiền mặt và hàng tồn kho (2) ghi nhận giá vốn bán hàng và doanh thu bán hàng"},"t":"Kế toán"},{"n":1533,"q":"Tài khoản bán hàng nào thường có dư Nợ:","c":{"A":"Chiết khấu bán hàng","B":"Hàng bán trả lại và giảm giá hàng bán","C":"Cả a và b","D":"Cả A và B đều không đúng."},"t":"Tổng hợp"},{"n":1534,"q":"Trong các phương pháp dưới đây, phương pháp nào không được kế toán sử dụng để tính giá hàng hóa xuất kho?","c":{"A":"Phương pháp nhập trước – xuất trước","B":"Phương pháp bình quân gia quyền","C":"Phương pháp ghi số âm","D":"Phương pháp giá đích danh"},"t":"Kế toán"},{"n":1535,"q":"Mối quan hệ giữa các báo cáo tài chính là:","c":{"A":"Lợi nhuận gộp trên Báo cáo KQKD bằng với Tiền từ hoạt động kinh doanh.","B":"Tổng tài sản trên Bảng CĐKT bằng tổng doanh thu trên Báo cáo KQKD.","C":"Không có mối quan hệ trực tiếp nào.","D":"Số dư Tiền cuối kỳ trên Báo cáo LCTT phải bằng số dư Tiền trên Bảng CĐKT."},"t":"Kế toán"},{"n":1536,"q":"Nghiệp vụ nào sau đây KHÔNG làm thay đổi tổng tài sản của doanh nghiệp?","c":{"A":"Vay ngân hàng mua hàng hóa.","B":"Bán hàng thu tiền với giá bán bằng giá vốn.","C":"Thu hồi một khoản nợ phải thu từ khách hàng bằng tiền mặt.","D":"Chủ sở hữu góp vốn bằng tài sản cố định."},"t":"Tổng hợp"},{"n":1537,"q":"Sau khi khóa sổ, tài khoản nào sau đây sẽ KHÔNG xuất hiện trên Bảng cân đối thử sau khóa sổ?","c":{"A":"Tiền mặt","B":"Vay ngắn hạn","C":"Lợi nhuận chưa phân phối","D":"Chi phí bán hàng"},"t":"Tổng hợp"},{"n":1538,"q":"Sau khi khóa sổ, tài khoản nào sau đây sẽ có số dư bằng không?","c":{"A":"Lợi nhuận chưa phân phối","B":"Vốn góp của chủ sở hữu","C":"Giá vốn hàng bán","D":"Phải trả người bán"},"t":"Tổng hợp"},{"n":1539,"q":"Sự khác biệt giữa Chiết khấu thương mại và Chiết khấu thanh toán là:","c":{"A":"Chiết khấu thương mại làm giảm giá gốc hàng mua, còn chiết khấu thanh toán liên quan đến việc thanh toán sớm và ảnh hưởng đến doanh thu tài chính hoặc chi phí tài chính.","B":"Chiết khấu thanh toán làm giảm giá gốc hàng mua.","C":"Chiết khấu thương mại chỉ áp dụng cho khách hàng thanh toán sớm.","D":"Cả hai đều được ghi nhận vào tài khoản “Thu nhập khác”."},"t":"Tổng hợp"},{"n":1540,"q":"Ghi sổ kép là việc kế toán viên:","c":{"A":"Ghi đồng thời một số tiền lên các tài khoản phản ánh tài sản","B":"Ghi đồng thời một số tiền lên các tài khoản phản ánh nguồn vốn","C":"Ghi đồng thời một số tiền lên ít nhất hai tài khoản, trong đó một tài khoản được ghi Nợ và một tài khoản được ghi Có","D":"Ghi đồng thời một số tiền lên một tài khoản phản ánh tài sản, một tài khoản phản ánh nợ phải trả hoặc vốn chủ sở hữu"},"t":"Kế toán"},{"n":1541,"q":"Thông tin kế toán được coi là trình bày trung thực khi nó:","c":{"A":"Có khả năng ảnh hưởng đến quyết định của người sử dụng.","B":"Đầy đủ, trung lập và không có sai sót trọng yếu.","C":"Được cung cấp kịp thời cho người sử dụng.","D":"Có thể so sánh được giữa các kỳ và các doanh nghiệp khác nhau."},"t":"Kế toán"},{"n":1542,"q":"Giá trị còn lại (Book Value) của một tài sản có thể bằng 0 khi:","c":{"A":"Tài sản đó không còn sử dụng được.","B":"Tài sản đó đã được khấu hao hết.","C":"Giá thị trường của tài sản bằng 0.","D":"Công ty quyết định xóa sổ tài sản."},"t":"Tổng hợp"},{"n":1543,"q":"Nghiệp vụ: “Mua nhập kho hàng hóa, chưa thanh toán tiền cho người bán” sẽ làm cho tài sản và nguồn vốn của doanh nghiệp thay đổi:","c":{"A":"Tài sản tăng, nguồn vốn giảm","B":"Tài sản tăng, nguồn vốn tăng","C":"Tài sản tăng, nợ phải trả tăng","D":"Không đáp án nào đúng"},"t":"Tổng hợp"},{"n":1544,"q":"Một công ty quảng cáo trả trước chi phí cho một chiến dịch kéo dài 3 năm. Việc ghi nhận chi phí này dần dần qua 3 năm thay vì ghi nhận toàn bộ ngay lập tức là dựa trên nguyên tắc nào?","c":{"A":"Nguyên tắc giá gốc","B":"Nguyên tắc thận trọng","C":"Nguyên tắc phù hợp","D":"Nguyên tắc nhất quán."},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1545,"q":"Nguyên tắc nào yêu cầu việc ghi chép kế toán phải dựa trên bằng chứng khách quan, không dựa trên ý muốn chủ quan của người làm kế toán?","c":{"A":"Nguyên tắc Phù hợp.","B":"Nguyên tắc Thận trọng.","C":"Nguyên tắc Trung thực.","D":"Nguyên tắc Nhất quán."},"t":"Kế toán"},{"n":1546,"q":"Các nghiệp vụ kinh tế, tài chính phát sinh liên quan đến hoạt động của đơn vị kế toán phải được lập chứng từ kế toán vào thời điểm nào?","c":{"A":"Ngay khi nghiệp vụ kinh tế, tài chính phát sinh.","B":"Cuối ngày phát sinh nghiệp vụ.","C":"Khi thực hiện xong việc kiểm kê.","D":"Khi kết thúc năm tài chính."},"t":"Kế toán"},{"n":1547,"q":"Phương trình kế toán cơ bản nào sau đây là đúng?","c":{"A":"Tài sản = Nợ phải trả - Vốn chủ sở hữu.","B":"Tài sản = Nợ phải trả + Vốn chủ sở hữu.","C":"Vốn chủ sở hữu = Tài sản + Nợ phải trả.","D":"Tài sản + Nợ phải trả = Vốn chủ sở hữu."},"t":"Kế toán"},{"n":1548,"q":"Doanh nghiệp siêu nhỏ có bắt buộc phải bổ nhiệm Kế toán trưởng không?","c":{"A":"Có, đây là quy định bắt buộc cho mọi loại hình doanh nghiệp.","B":"Không bắt buộc, doanh nghiệp siêu nhỏ có thể chỉ bố trí người phụ trách kế toán.","C":"Chỉ bắt buộc nếu doanh thu trên 3 tỷ đồng/năm.","D":"Chỉ bắt buộc nếu có trên 10 lao động."},"t":"Kế toán"},{"n":1549,"q":"Doanh nghiệp siêu nhỏ nộp thuế TNDN theo tỷ lệ % trên doanh thu bán hàng hóa, dịch vụ áp dụng chế độ kế toán theo quy định tại:","c":{"A":"Chương II Thông tư 132/2018/TT-BTC","B":"Chương III Thông tư 132/2018/TT-BTC","C":"Thông tư 200/2014/TT-BTC","D":"Thông tư 133/2016/TT-BTC"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1550,"q":"Người nộp thuế, tổ chức, cá nhân có quyền khiếu nại với cơ quan có thẩm quyền đối với quyết định hành chính, hành vi hành chính của cơ quan quản lý thuế, công chức quản lý thuế khi có căn cứ cho rằng quyết định hoặc hành vi đó là trái pháp luật, xâm phạm quyền, lợi ích hợp pháp của mình. Phát biểu trên đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1551,"q":"Cơ quan quản lý thuế nhận được khiếu nại về việc thực hiện pháp luật về thuế có quyền yêu cầu người khiếu nại cung cấp hồ sơ, tài liệu liên quan đến việc khiếu nại; nếu người khiếu nại từ chối cung cấp hồ sơ, tài liệu thì yêu cầu người khiếu nại rút đơn khiếu nại. Phát biểu trên đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1552,"q":"Mức phạt tiền đối với hành vi kê khai khấu trừ thuế GTGT đầu vào của hàng hóa, dịch vụ mua vào không phục vụ hoạt động sản xuất kinh doanh dẫn đến tăng số thuế GTGT đã được hoàn là:","c":{"A":"20% trên số thuế được hoàn cao hơn quy định","B":"10% trên số thuế được hoàn cao hơn quy định","C":"Phạt 01 lần trên số tiền thuế được hoàn cao hơn quy định","D":""},"t":"Thuế GTGT"},{"n":1553,"q":"Sử dụng chứng từ, tài liệu không phản ánh đúng bản chất giao dịch hoặc giá trị giao dịch thực tế để xác định sai số tiền thuế phải nộp, số tiền thuế được miễn, số tiền thuế được giảm, số tiền thuế được hoàn, số tiền thuế không phải nộp là hành vi trốn thuế. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":1554,"q":"Không ghi chép trong sổ kế toán các khoản thu liên quan đến việc xác định số tiền thuế phải nộp là hành vi trốn thuế. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Kế toán"},{"n":1555,"q":"Nộp hồ sơ khai thuế sau 90 ngày có phát sinh số tiền thuế phải nộp và người nộp thuế đã nộp đủ số tiền thuế, tiền chậm nộp vào ngân sách nhà nước trước thời điểm cơ quan thuế công bố quyết định kiểm tra thuế, thanh tra thuế hoặc trước thời điểm cơ quan thuế lập biên bản về hành vi chậm nộp hồ sơ khai thuế. Hành vi nêu trên sẽ bị xử lý vi phạm hành chính đối với hành vi:","c":{"A":"Hành vi vi phạm thủ tục thuế","B":"Hành vi khai sai","C":"Hành vi trốn thuế","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1556,"q":"Đối với hành vi vi phạm về thủ tục thuế thì đối với cùng một hành vi vi phạm hành chính thì mức phạt tiền đối với cá nhân bằng bao nhiêu lần mức phạt của tổ chức:","c":{"A":"0,5 lần","B":"1,5 lần","C":"02 lần","D":"03 lần"},"t":"Xử phạt VPHC thuế"},{"n":1557,"q":"Đối với hành vi vi phạm về thủ tục thuế thì đối với cùng một hành vi vi phạm hành chính thì mức phạt tiền đối với tổ chức bằng bao nhiêu lần mức phạt của cá nhân:","c":{"A":"01 lần","B":"02 lần","C":"03 lần","D":"04 lần"},"t":"Xử phạt VPHC thuế"},{"n":1558,"q":"Định nghĩa nào sau đây về mã số thuế là đúng nhất","c":{"A":"Là một dãy số gồm 10 chữ số hoặc 13 chữ số và ký tự khác do cơ quan thuế cấp cho người nộp thuế dùng để quản lý thuế","B":"Là một dãy số gồm 10 chữ số và ký tự khác do cơ quan thuế cấp cho người nộp thuế dùng để quản lý thuế","C":"Là một dãy số gồm 10 chữ số do cơ quan thuế cấp cho người nộp thuế dùng để quản lý thuế","D":"Là một dãy số gồm 13 chữ số và ký tự khác do cơ quan thuế cấp cho người nộp thuế dùng để quản lý thuế"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1559,"q":"Nội dung nào không phải là nội dung quản lý thuế:","c":{"A":"Đăng ký thuế, khai thuế, nộp thuế, ấn định thuế","B":"Hoàn thuế, miễn thuế, giảm thuế, không thu thuế","C":"Giải quyết khiếu nại, tố cáo về thuế","D":"Giải quyết tố tụng hành chính về thuế"},"t":"Tổng hợp"},{"n":1560,"q":"Theo quy định tại Luật Quản lý thuế 2019, hoàn thành nghĩa vụ nộp thuế là:","c":{"A":"Việc nộp đủ số tiền thuế phải nộp, số tiền chậm nộp, tiền phạt vi phạm pháp luật về thuế","B":"Việc nộp đủ số tiền thuế phải nộp, số tiền chậm nộp, tiền phạt vi phạm pháp luật về thuế và các khoản thu khác thuộc ngân sách nhà nước","C":"Việc nộp đủ số tiền thuế phải nộp, số tiền chậm nộp, tiền phạt vi phạm pháp luật về thuế và các khoản thu khác thuộc ngân sách nhà nước do cơ quan quản lý thuế quản lý thu.","D":"Việc nộp đủ số tiền thuế phải nộp và các khoản thu khác thuộc ngân sách nhà nước"},"t":"Tổng hợp"},{"n":1561,"q":"Khoản nào sau đây là khoản thu khác thuộc ngân sách nhà nước không do cơ quan quản lý thuế quản lý thu:","c":{"A":"Tiền cấp quyền khai thác khoáng sản","B":"Tiền nộp ngân sách nhà nước từ bán tài sản trên đất, chuyển nhượng quyền sử dụng đất theo quy định của Luật Quản lý, sử dụng tài sản công","C":"Tiền thuê đất, thuê mặt nước","D":"Tiền bảo vệ, phát triển đất trồng lúa theo quy định của pháp luật về đất đai"},"t":"Tổng hợp"},{"n":1562,"q":"Theo quy định tại Luật Quản lý thuế 2019, tiền thuế nợ là:","c":{"A":"Tiền thuế và các khoản thu khác thuộc ngân sách nhà nước do cơ quan quản lý thuế quản lý thu mà người nộp thuế chưa nộp ngân sách nhà nước khi hết thời hạn nộp theo quy định.","B":"Tiền thuế do cơ quan quản lý thuế quản lý thu mà người nộp thuế chưa nộp ngân sách nhà nước khi hết thời hạn nộp theo quy định.","C":"Tiền thuế và các khoản thu khác thuộc ngân sách nhà nước mà người nộp thuế chưa nộp ngân sách nhà nước khi hết thời hạn nộp theo quy định.","D":"Tiền thuế và các khoản thu khác thuộc ngân sách nhà nước do cơ quan quản lý thuế quản lý thu mà người nộp thuế chưa nộp ngân sách nhà nước."},"t":"Tổng hợp"},{"n":1563,"q":"Vi phạm hành chính về sử dụng hóa đơn không hợp pháp, sử dụng không hợp pháp hóa đơn hoặc sử dụng hóa đơn không đúng quy định dẫn đến thiếu thuế, trốn thuế thì không xử phạt vi phạm hành chính về hóa đơn mà bị xử phạt vi phạm hành chính về quản lý thuế và ngược lại. Phát biểu trên đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":1564,"q":"Trường hợp người nộp thuế sử dụng hóa đơn không hợp pháp dẫn đến khai sai tăng số thuế còn được khấu trừ chuyển kỳ sau thì:","c":{"A":"Xử phạt hành vi vi phạm về hóa đơn và hành vi vi phạm về thủ tục thuế","B":"Chỉ xử phạt hành vi vi phạm về thủ tục thuế","C":"Chỉ xử phạt về hóa đơn","D":""},"t":"Hóa đơn"},{"n":1565,"q":"Hành vi nào sau đây là hành vi vi phạm hành chính về thủ tục thuế:","c":{"A":"Hành vi vi phạm về thời hạn đăng ký thuế","B":"Hành vi khai sai, khai không đầy đủ các nội dung trong hồ sơ thuế nhưng không dẫn đến thiếu số tiền thuế phải nộp","C":"Hành vi khai sai, khai không đầy đủ các nội dung trong hồ sơ thuế dẫn đến tăng số tiền thuế được miễn, giảm","D":"Cả A và B đều đúng"},"t":"Tổng hợp"},{"n":1566,"q":"Các hình thức xử phạt vi phạm hành chính về quản lý thuế bao gồm:","c":{"A":"Phạt cảnh cáo","B":"Phạt tiền","C":"Đáp án B đúng","D":"Cả A, B đều đúng"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1567,"q":"Trường hợp người nộp thuế sử dụng hóa đơn không hợp pháp dẫn đến trốn thuế thì:","c":{"A":"Xử phạt vi phạm về hóa đơn và hành vi trốn thuế","B":"Không xử phạt vi phạm hành chính về hóa đơn mà bị xử phạt vi phạm hành chính về quản lý thuế","C":"Chỉ xử phạt về hóa đơn","D":""},"t":"Hóa đơn"},{"n":1568,"q":"Mức phạt tiền trong xử phạt vi phạm hành chính về quản lý thuế đối với hành vi trốn thuế:","c":{"A":"Từ 01 lần đến 05 lần số tiền thuế trốn","B":"Từ 01 lần đến 04 lần số tiền thuế trốn","C":"Từ 01 lần đến 03 lần số tiền thuế trốn","D":"Từ 01 lần đến 02 lần số tiền thuế trốn"},"t":"Xử phạt VPHC thuế"},{"n":1569,"q":"Hành vi sử dụng hóa đơn, chứng từ không hợp pháp để hạch toán hàng hóa, nguyên liệu đầu vào dẫn đến làm giảm số tiền thuế phải nộp sẽ bị xử lý vi phạm hành chính như thế nào:","c":{"A":"Phạt tiền 20% trên số tiền thuế thiếu","B":"Phạt tiền từ 01 đến 03 lần số tiền thuế thiếu","C":"Cả hai đáp án đều sai","D":""},"t":"Hóa đơn"},{"n":1570,"q":"Hành vi không lập hóa đơn đối với các hàng hóa, dịch vụ dùng để cho biếu tặng dẫn đến thiếu số tiền thuế phải nộp sẽ bị xử lý vi phạm hành chính về thuế như thế nào:","c":{"A":"Phạt tiền 20% trên số tiền thuế thiếu","B":"Phạt tiền từ 01 đến 03 lần số tiền thuế thiếu","C":"Cả hai đáp án đều sai","D":""},"t":"Hóa đơn"},{"n":1571,"q":"Hành vi nào sau đây không phải là hành vi trốn thuế:","c":{"A":"Không ghi chép trong sổ kế toán các khoản thu liên quan đến việc xác định số tiền thuế phải nộp","B":"Sử dụng hóa đơn, chứng từ không hợp pháp, sử dụng không hợp pháp hóa đơn để hạch toán hàng hóa, nguyên liệu đầu vào trong hoạt động phát sinh nghĩa vụ thuế làm giảm số tiền thuế phải nộp","C":"Không lập hóa đơn đối với các hàng hóa, dịch vụ dùng để cho biếu tặng dẫn đến thiếu số tiền thuế phải nộp","D":"Sử dụng chứng từ, tài liệu không phản ánh đúng bản chất giao dịch hoặc giá trị giao dịch thực tế để xác định sai số tiền thuế phải nộp"},"t":"Xử phạt VPHC thuế"},{"n":1572,"q":"Hành vi nào sau đây là hành vi trốn thuế:","c":{"A":"Sử dụng hóa đơn, chứng từ không hợp pháp, sử dụng không hợp pháp hóa đơn để hạch toán hàng hóa, nguyên liệu đầu vào trong hoạt động phát sinh nghĩa vụ thuế làm giảm số tiền thuế phải nộp","B":"Sử dụng hóa đơn, chứng từ không hợp pháp, sử dụng không hợp pháp hóa đơn để hạch toán giá trị hàng hóa, dịch vụ mua vào làm giảm số tiền thuế phải nộp hoặc làm tăng số tiền thuế được miễn, giảm, hoàn nhưng người mua hàng hóa, dịch vụ sử dụng hóa đơn, chứng từ không hợp pháp chứng minh được lỗi vi phạm sử dụng hóa đơn không hợp pháp thuộc về bên bán hàng","C":"Khai sai căn cứ tính thuế dẫn đến thiếu số tiền thuế phải nộp","D":""},"t":"Xử phạt VPHC thuế"},{"n":1573,"q":"Nguyên tắc nào sau đây là đúng:","c":{"A":"Vi phạm hành chính về sử dụng hóa đơn không hợp pháp, sử dụng không hợp pháp hóa đơn hoặc sử dụng hóa đơn không đúng quy định dẫn đến thiếu thuế, trốn thuế thì không xử phạt vi phạm hành chính về hóa đơn mà bị xử phạt vi phạm hành chính về quản lý thuế.","B":"Vi phạm hành chính về sử dụng hóa đơn không hợp pháp, sử dụng không hợp pháp hóa đơn hoặc sử dụng hóa đơn không đúng quy định dẫn đến khai sai thì không xử phạt vi phạm hành chính về hóa đơn mà bị xử phạt vi phạm hành chính về quản lý thuế.","C":"Vi phạm hành chính về sử dụng hóa đơn không hợp pháp dẫn đến khai sai thì không xử phạt vi phạm hành chính về hóa đơn mà bị xử phạt vi phạm hành chính về quản lý thuế.","D":"Vi phạm hành chính về sử dụng không hợp pháp hóa đơn không đúng quy định dẫn đến khai sai thì không xử phạt vi phạm hành chính về hóa đơn mà bị xử phạt vi phạm hành chính về quản lý thuế."},"t":"Tổng hợp"},{"n":1574,"q":"Số tiền phạt tối đa đối với hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được miễn, giảm, hoàn, không thu, hành vi trốn thuế là","c":{"A":"100 triệu đồng","B":"300 triệu đồng","C":"500 triệu đồng","D":"Không có mức tối đa"},"t":"Xử phạt VPHC thuế"},{"n":1575,"q":"Đối với cùng một hành vi vi phạm hành chính về quản lý thuế thì mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân, trừ mức phạt tiền đối với hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được miễn, giảm, hoàn, không thu, hành vi trốn thuế. Phát biểu trên đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":1576,"q":"Hành vi nào sau đây là hành vi trốn thuế:","c":{"A":"Không lập hóa đơn đối với các hàng hóa, dịch vụ dùng để cho biếu tặng dẫn đến thiếu số tiền thuế GTGT phải nộp","B":"Không xuất hóa đơn khi bán hàng hóa, dịch vụ theo quy định của pháp luật hoặc ghi giá trị trên hóa đơn bán hàng thấp hơn giá trị thanh toán thực tế của hàng hóa, dịch vụ đã bán.","C":"Sử dụng hóa đơn, chứng từ không hợp pháp, sử dụng không hợp pháp hóa đơn để hạch toán giá trị hàng hóa, dịch vụ mua vào làm giảm số tiền thuế phải nộp hoặc làm tăng số tiền thuế được miễn, giảm, hoàn nhưng người mua hàng hóa, dịch vụ sử dụng hóa đơn, chứng từ không hợp pháp chứng minh được lỗi vi phạm sử dụng hóa đơn không hợp pháp thuộc về bên bán hàng","D":""},"t":"Xử phạt VPHC thuế"},{"n":1577,"q":"Hành vi không lập hóa đơn đối với các hàng hóa, dịch vụ dùng để cho biếu tặng dẫn đến thiếu số tiền thuế phải nộp sẽ bị xử lý vi phạm hành chính đối với hành vi vi phạm về:","c":{"A":"Thủ tục thuế","B":"Khai sai dẫn đến thiếu số tiền thuế phải nộp","C":"Trốn thuế","D":"Hóa đơn"},"t":"Hóa đơn"},{"n":1578,"q":"Hành vi vi phạm hành chính nào sau đây không phải là hành vi vi phạm thủ tục thuế:","c":{"A":"Vi phạm về thời hạn đăng ký thuế","B":"Nộp hồ sơ khai thuế quá thời hạn quy định nhưng không phải sinh số thuế phải nộp","C":"Khai sai dẫn đến thiếu số tiền thuế phải nộp","D":"Thông báo thay đổi nội dung đăng ký thuế quá thời hạn quy định"},"t":"Tổng hợp"},{"n":1579,"q":"Mức phạt tiền đối với hành vi khai sai dẫn đến tăng số tiền thuế được miễn:","c":{"A":"10% trên số tiền thuế được miễn cao hơn quy định","B":"20% trên số tiền thuế được miễn cao hơn quy định","C":"30% trên số tiền thuế được miễn cao hơn quy định","D":"40% trên số tiền thuế được miễn cao hơn quy định"},"t":"Xử phạt VPHC thuế"},{"n":1580,"q":"Mức phạt tiền đối với hành vi khai sai dẫn đến thiếu số tiền thuế phải nộp:","c":{"A":"10% trên số tiền thuế khai thiếu","B":"20% trên số tiền thuế khai thiếu","C":"30% trên số tiền thuế khai thiếu","D":"40% trên số tiền thuế khai thiếu"},"t":"Xử phạt VPHC thuế"},{"n":1581,"q":"Thời hiệu xử phạt vi phạm hành chính đối với hành vi trốn thuế là:","c":{"A":"02 năm","B":"03 năm","C":"04 năm","D":"05 năm"},"t":"Xử phạt VPHC thuế"},{"n":1582,"q":"Nội dung nào sau đây không phải là biện pháp khắc phục hậu quả trong xử phạt vi phạm hành chính về thuế, hóa đơn:","c":{"A":"Buộc nộp đủ số tiền thuế thiếu","B":"Buộc nộp đủ số tiền thuế trốn","C":"Buộc điều chỉnh lại thời gian khấu hao tài sản cố định theo quy định","D":"Buộc nộp đủ số tiền đã miễn, giảm, hoàn, không thu thuế không đúng"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1583,"q":"Hành vi nào sau đây không phải là hành vi trốn thuế:","c":{"A":"Không nộp hồ sơ đăng ký thuế; không nộp hồ sơ khai thuế; nộp hồ sơ khai thuế sau 90 ngày kể từ ngày hết thời hạn nộp hồ sơ khai thuế hoặc ngày hết thời hạn gia hạn nộp hồ sơ khai thuế theo quy định của Luật này.","B":"Không ghi chép trong sổ kế toán các khoản thu liên quan đến việc xác định số tiền thuế phải nộp.","C":"Không xuất hóa đơn khi bán hàng hóa, dịch vụ theo quy định của pháp luật đồng thời không kê khai thuế đối với giá trị hàng hóa, dịch vụ đã bán.","D":"Không xuất hóa đơn đối với các hàng hóa, dịch vụ dùng để khuyến mại, quảng cáo, hàng mẫu"},"t":"Xử phạt VPHC thuế"},{"n":1584,"q":"Cố tình ghi giá trị trên hóa đơn bán hàng thấp hơn giá trị thanh toán thực tế của hàng hóa, dịch vụ đã bán là hành vi trốn thuế. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":1585,"q":"Trường hợp nào sau đây không bị giới hạn số lần kiểm tra trong 01 năm","c":{"A":"Trường hợp hồ sơ thuộc diện kiểm tra trước hoàn thuế","B":"Trường hợp chia, tách, sáp nhập, hợp nhất, chuyển đổi loại hình doanh nghiệp, giải thể, chấm dứt hoạt động, cổ phần hóa, chấm dứt hiệu lực mã số thuế","C":"Trường hợp có dấu hiệu vi phạm pháp luật","D":"Cả A, C đều đúng"},"t":"Tổng hợp"},{"n":1586,"q":"Đoàn kiểm tra phải lập biên bản kiểm tra thuế trong thời hạn 03 ngày làm việc kể từ ngày hết thời hạn kiểm tra. Phát biểu trên đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1587,"q":"Thời hạn kiểm tra được xác định trong quyết định kiểm tra nhưng không quá 10 ngày làm việc tại trụ sở của người nộp thuế. Thời hạn kiểm tra được tính từ ngày công bố quyết định kiểm tra; trường hợp phạm vi kiểm tra lớn, nội dung phức tạp thì người đã quyết định kiểm tra có thể gia hạn 01 lần nhưng không quá 05 ngày làm việc tại trụ sở của người nộp thuế. Phát biểu trên là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1588,"q":"Quyết định kiểm tra thuế phải được gửi cho người nộp thuế trong thời hạn 03 ngày và thực hiện công bố trong thời hạn 10 ngày kể từ ngày ký. Trước khi công bố quyết định kiểm tra mà người nộp thuế chứng minh được số tiền thuế đã khai là đúng và nộp đủ số tiền thuế phải nộp thì cơ quan quản lý thuế bãi bỏ quyết định kiểm tra thuế. Phát biểu trên là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1589,"q":"Thời hạn kiểm tra được xác định trong quyết định kiểm tra nhưng không quá 10 ngày làm việc tại trụ sở của người nộp thuế. Thời hạn kiểm tra được tính từ ngày công bố quyết định kiểm tra; trường hợp phạm vi kiểm tra lớn, nội dung phức tạp thì người đã quyết định kiểm tra có thể gia hạn 01 lần nhưng không quá 10 ngày làm việc tại trụ sở của người nộp thuế. Phát biểu trên là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1590,"q":"Cơ quan quản lý thuế thực hiện kiểm tra tại trụ sở của người nộp thuế không quá 01 lần trong 01 năm trừ trường hợp sau:","c":{"A":"Trường hợp theo kiến nghị của Kiểm toán nhà nước, Thanh tra nhà nước, cơ quan khác có thẩm quyền","B":"Kiểm tra sau hoàn thuế đối với hồ sơ thuộc diện hoàn thuế trước","C":"Trường hợp hồ sơ thuộc diện kiểm tra trước hoàn thuế","D":"Cả B, C đều đúng"},"t":"Tổng hợp"},{"n":1591,"q":"Cơ quan quản lý thuế thực hiện kiểm tra tại trụ sở của người nộp thuế không quá 01 lần trong 01 năm đối với trường hợp","c":{"A":"Trường hợp có dấu hiệu vi phạm pháp luật","B":"Trường hợp được lựa chọn theo kế hoạch, chuyên đề","C":"Trường hợp hồ sơ thuộc diện kiểm tra trước hoàn thuế","D":"Trường hợp kiểm tra sau hoàn thuế đối với hồ sơ thuộc diện hoàn thuế trước"},"t":"Tổng hợp"},{"n":1592,"q":"Kiểm tra thuế tại trụ sở của người nộp thuế được thực hiện trong trường hợp:","c":{"A":"Trường hợp hồ sơ thuộc diện kiểm tra trước hoàn thuế; kiểm tra sau hoàn thuế đối với hồ sơ thuộc diện hoàn thuế trước","B":"Trường hợp có dấu hiệu vi phạm pháp luật","C":"Trường hợp được lựa chọn theo kế hoạch, chuyên đề","D":"Cả A, B, C đều đúng"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1593,"q":"Quyết định giám sát Đoàn kiểm tra được gửi cho Đoàn kiểm tra thuế, người giám sát, đối tượng kiểm tra thuế, các cơ quan, tổ chức, cá nhân có liên quan và được công bố cùng thời điểm công bố Quyết định kiểm tra tại trụ sở người nộp thuế. Phát biểu trên đúng hay sai","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1594,"q":"Trường hợp qua kiểm tra thuế mà phát hiện hành vi vi phạm về thuế có dấu hiệu trốn thuế, gian lận về thuế thì đoàn kiểm tra có trách nhiệm báo cáo Thủ trưởng cơ quan thuế để xem xét tiến hành thanh tra hoặc chuyển hồ sơ kiểm tra sang cơ quan điều tra theo quy định của pháp luật trong thời hạn:","c":{"A":"Trong thời hạn 03 ngày làm việc kể từ ngày kết thúc kiểm tra","B":"Trong thời hạn 05 ngày làm việc kể từ ngày kết thúc kiểm tra","C":"Trong thời hạn 04 ngày làm việc kể từ ngày kết thúc kiểm tra","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1595,"q":"Trưởng đoàn kiểm tra phải báo cáo kết quả kiểm tra với lãnh đạo bộ phận kiểm tra và người ban hành quyết định kiểm tra trong thời hạn:","c":{"A":"Chậm nhất 03 ngày làm việc kể từ ngày ký Biên bản kiểm tra","B":"Chậm nhất 05 ngày làm việc kể từ ngày kết thúc kiểm tra","C":"Chậm nhất 03 ngày làm việc kể từ ngày ký Biên bản kiểm tra","D":"Chậm nhất 05 ngày làm việc kể từ ngày kết thúc kiểm tra"},"t":"Tổng hợp"},{"n":1596,"q":"Thời hiệu xử phạt vi phạm hành chính đối với hành vi khai sai nhưng không dẫn đến thiếu số tiền thuế phải nộp là:","c":{"A":"01 năm","B":"02 năm","C":"03 năm","D":"04 năm"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1597,"q":"Công chức quản lý thuế khi thực hiện kiểm tra thuế có nhiệm vụ, quyền hạn nào sau đây:","c":{"A":"Thực hiện đúng nội dung, thời hạn ghi trong quyết định kiểm tra thuế","B":"Yêu cầu người nộp thuế cung cấp thông tin, tài liệu không liên quan đến nội dung kiểm tra thuế","C":"Xử phạt vi phạm hành chính theo thẩm quyền hoặc kiến nghị với người có thẩm quyền ra kết luận, quyết định xử lý vi phạm về thuế","D":"Cả A và C đều đúng"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1598,"q":"Thủ trưởng cơ quan quản lý thuế ra quyết định kiểm tra thuế có nhiệm vụ, quyền hạn nào sau đây:","c":{"A":"Chỉ đạo thực hiện đúng nội dung, thời hạn ghi trong quyết định kiểm tra thuế","B":"Gia hạn thời hạn kiểm tra","C":"Giải quyết khiếu nại, tố cáo theo thẩm quyền","D":"Cả A, B, C đều đúng"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1599,"q":"Phát biểu nào sau đây đúng","c":{"A":"Người nộp thuế có quyền bảo lưu ý kiến trong biên bản kiểm tra thuế","B":"Người nộp thuế có quyền tố cáo hành vi vi phạm pháp luật trong quá trình kiểm tra thuế","C":"Người nộp thuế có nghĩa vụ chấp hành kiến nghị tại biên bản kiểm tra thuế, kết luận, quyết định xử lý kết quả kiểm tra thuế","D":"Cả A, B, C đều đúng 1601"},"t":"Tổng hợp"},{"n":1600,"q":"Phát biểu nào sau đây không đúng","c":{"A":"Người nộp thuế có nghĩa vụ ký biên bản kiểm tra thuế trong thời hạn 05 ngày làm việc kể từ ngày kết thúc kiểm tra","B":"Người nộp thuế không cần chấp hành kiến nghị tại biên bản kiểm tra thuế, kết luận, quyết định xử lý kết quả kiểm tra thuế nếu không đồng ý với nội dung xử lý của cơ quan thuế","C":"Người nộp thuế có quyền bảo lưu ý kiến trong biên bản kiểm tra thuế","D":"Người nộp thuế có quyền nhận biên bản kiểm tra thuế và yêu cầu giải thích nội dung biên bản kiểm tra thuế"},"t":"Tổng hợp"},{"n":1601,"q":"Trong kiểm tra tại trụ sở người nộp thuế, nội dung nào sau đây là nghĩa vụ của người nộp thuế:","c":{"A":"Chấp hành quyết định kiểm tra thuế của cơ quan quản lý thuế","B":"Ký biên bản kiểm tra thuế theo thời hạn quy định","C":"Cung cấp kịp thời, đầy đủ, chính xác các thông tin, tài liệu liên quan đến nội dung kiểm tra theo yêu cầu của đoàn kiểm tra thuế; chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của thông tin, tài liệu đã cung cấp","D":"Cả A, B, C đều đúng"},"t":"Tổng hợp"},{"n":1602,"q":"Trong kiểm tra tại trụ sở người nộp thuế, người nộp thuế không có quyền nào sau đây:","c":{"A":"Từ chối việc kiểm tra khi không có quyết định kiểm tra thuế","B":"Từ chối cung cấp thông tin, tài liệu không liên quan đến nội dung kiểm tra thuế; thông tin, tài liệu thuộc bí mật nhà nước, trừ trường hợp pháp luật có quy định khác","C":"Từ chối ký biên bản kiểm tra nếu không đồng ý với kết luận của Đoàn kiểm tra","D":""},"t":"Tổng hợp"},{"n":1603,"q":"Thời hạn lập biên bản kiểm tra thuế khi kiểm tra tại trụ sở người nộp thuế","c":{"A":"Trong thời hạn 03 ngày làm việc kể từ ngày hết thời hạn kiểm tra","B":"Trong thời hạn 04 ngày làm việc kể từ ngày hết thời hạn kiểm tra","C":"Trong thời hạn 05 ngày làm việc kể từ ngày hết thời hạn kiểm tra","D":"Trong thời hạn 06 ngày làm việc kể từ ngày hết thời hạn kiểm tra"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1604,"q":"Phát biểu nào sau đây là đúng","c":{"A":"Trường hợp phạm vi kiểm tra lớn, nội dung phức tạp thì người đã quyết định kiểm tra có thể gia hạn 01 lần nhưng không quá 05 ngày làm việc tại trụ sở của người nộp thuế","B":"Trường hợp phạm vi kiểm tra lớn, nội dung phức tạp thì người đã quyết định kiểm tra có thể gia hạn 01 lần nhưng không quá 06 ngày làm việc tại trụ sở của người nộp thuế","C":"Trường hợp phạm vi kiểm tra lớn, nội dung phức tạp thì người đã quyết định kiểm tra có thể gia hạn 01 lần nhưng không quá 07 ngày làm việc tại trụ sở của người nộp thuế","D":"Trường hợp phạm vi kiểm tra lớn, nội dung phức tạp thì người đã quyết định kiểm tra có thể gia hạn 01 lần nhưng không quá 10 ngày làm việc tại trụ sở của người nộp thuế"},"t":"Tổng hợp"},{"n":1605,"q":"Quá thời hiệu xử phạt vi phạm hành chính về quản lý thuế thì:","c":{"A":"Người nộp thuế không bị xử phạt nhưng vẫn phải nộp đủ số tiền thuế thiếu, số tiền thuế trốn vào ngân sách nhà nước trong thời hạn 10 năm trở về trước kể từ ngày phát hiện hành vi vi phạm","B":"Người nộp thuế không bị xử phạt nhưng vẫn phải nộp đủ số tiền thuế thiếu, số tiền thuế trốn, số tiền thuế được miễn, giảm, hoàn, không thu không đúng, tiền chậm nộp vào ngân sách nhà nước","C":"Người nộp thuế không bị xử phạt nhưng vẫn phải nộp đủ số tiền thuế thiếu, số tiền thuế trốn, số tiền thuế được miễn, giảm, hoàn, không thu không đúng, tiền chậm nộp vào ngân sách nhà nước trong thời hạn 10 năm trở về trước kể từ ngày phát hiện hành vi vi phạm","D":"Người nộp thuế không bị xử phạt nhưng vẫn phải nộp đủ số tiền thuế thiếu, số tiền thuế trốn, số tiền thuế được miễn, giảm, hoàn, không thu không đúng vào ngân sách nhà nước trong thời hạn 10 năm trở về trước kể từ ngày phát hiện hành vi vi phạm"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":1606,"q":"Công chức quản lý thuế khi thực hiện kiểm tra thuế có quyền hạn xử phạt vi phạm hành chính theo thẩm quyền hoặc kiến nghị với người có thẩm quyền ra kết luận, quyết định xử lý vi phạm về thuế. Phát biểu trên là đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1607,"q":"Phát biểu nào sau đây là đúng","c":{"A":"Quyết định kiểm tra thuế phải được gửi cho người nộp thuế trong thời hạn 05 ngày làm việc và thực hiện công bố trong thời hạn 10 ngày làm việc kể từ ngày ký","B":"Quyết định kiểm tra thuế phải được gửi cho người nộp thuế trong thời hạn 03 ngày làm việc và thực hiện công bố trong thời hạn 10 ngày làm việc kể từ ngày ký","C":"Quyết định kiểm tra thuế phải được gửi cho người nộp thuế trong thời hạn 03 ngày làm việc và thực hiện công bố trong thời hạn 05 ngày làm việc kể từ ngày ký","D":"Quyết định kiểm tra thuế phải được gửi cho người nộp thuế trong thời hạn 03 ngày làm việc và thực hiện công bố trong thời hạn 07 ngày làm việc kể từ ngày ký"},"t":"Tổng hợp"},{"n":1608,"q":"Thời hạn kiểm tra thuế tại trụ sở người nộp thuế","c":{"A":"Không quá 5 ngày làm việc","B":"Không qua 6 ngày làm việc","C":"Không quá 9 ngày làm việc","D":"Không quá 10 ngày làm việc"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1609,"q":"Người nộp thuế giải thể, chấm dứt hoạt động không phải thực hiện kiểm tra quyết toán thuế trong trường hợp:","c":{"A":"Người nộp thuế thuộc diện nộp thuế thu nhập doanh nghiệp theo tỷ lệ % trên doanh thu bán hàng hóa, dịch vụ theo quy định của pháp luật về thuế thu nhập doanh nghiệp thực hiện giải thể, chấm dứt hoạt động","B":"Người nộp thuế giải thể, chấm dứt hoạt động nhưng kể từ thời điểm thành lập đến thời điểm giải thể, chấm dứt hoạt động, doanh nghiệp không phát sinh doanh thu, chưa sử dụng hóa đơn","C":"Cả A, B đều đúng","D":""},"t":"Tổng hợp"},{"n":1610,"q":"Đối với kiểm tra thuế tại trụ sở của cơ quan quản lý thuế, trường hợp hết thời hạn theo thông báo của cơ quan quản lý thuế mà người nộp thuế không giải trình, bổ sung thông tin, tài liệu hoặc không khai bổ sung hồ sơ thuế hoặc giải trình, khai bổ sung hồ sơ thuế không đúng thì thủ trưởng cơ quan quản lý thuế có quyền:","c":{"A":"Quyết định ấn định số tiền thuế phải nộp","B":"Quyết định kiểm tra thuế tại trụ sở của người nộp thuế","C":"Làm căn cứ để xây dựng kế hoạch kiểm tra, thanh tra theo nguyên tắc quản lý rủi ro trong quản lý thuế","D":"Cả A, B, C đều đúng"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1611,"q":"Phát biểu nào sau đây không đúng:","c":{"A":"Khi kiểm tra thuế tại trụ sở của người nộp thuế, thủ trưởng cơ quan quản lý thuế phải ban hành quyết định kiểm tra thuế.","B":"Trường hợp xác định rõ hành vi vi phạm hành chính tại biên bản kiểm tra thuế thì biên bản kiểm tra thuế được xác định là biên bản vi phạm hành chính.","C":"Trường hợp kiểm tra thuế mà phát hiện hành vi trốn thuế có dấu hiệu tội phạm thì cơ quan quản lý thuế chuyển hồ sơ cho cơ quan điều tra có thẩm quyền để điều tra theo quy định của pháp luật.","D":"Trường hợp qua kiểm tra thuế mà phát hiện có hành vi khai sai, trốn thuế thì đoàn kiểm tra phải lập biên bản kiểm tra đồng thời lập biên bản vi phạm hành chính."},"t":"Tổng hợp"},{"n":1612,"q":"Một trong những nguyên tắc của kiểm tra thuế là “Không cản trở hoạt động bình thường của người nộp thuế”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1613,"q":"Thời hiệu xử phạt đối với hành vi về thủ tục thuế là:","c":{"A":"02 năm","B":"03 năm","C":"04 năm","D":"05 năm"},"t":"Xử phạt VPHC thuế"},{"n":1614,"q":"Qua kiểm tra tại trụ sở NNT, Đoàn Kiểm tra phát hiện NNT sử dụng hóa đơn không hợp pháp dẫn đến thiếu thuế, trốn thuế. Trong trường hợp này, NNT sẽ bị xử lý vi phạm hành chính đối với hành vi gì (tất cả các hành vi được phát hiện đều còn thời hiệu xử phạt):","c":{"A":"Chỉ xử phạt vi phạm hành chính về hóa đơn","B":"Chỉ xử phạt vi phạm hành chính về thuế","C":"Xử phạt vi phạm hành chính về thuế và hóa đơn","D":"Không bị xử phạt vi phạm hành chính"},"t":"Hóa đơn"},{"n":1615,"q":"Qua kiểm tra tại trụ sở NNT, Đoàn Kiểm tra phát hiện NNT sử dụng không hợp pháp hóa đơn dẫn đến khai sai làm tăng số thuế GTGT còn được khấu trừ chuyển kỳ sau. Trong trường hợp này, NNT sẽ bị xử lý vi phạm hành chính đối với hành vi gì (tất cả các hành vi được phát hiện đều còn thời hiệu xử phạt):","c":{"A":"Chỉ xử phạt vi phạm hành chính về hóa đơn","B":"Chỉ xử phạt vi phạm hành chính về thuế","C":"Xử phạt vi phạm hành chính về thuế và hóa đơn","D":"Không bị xử phạt vi phạm hành chính"},"t":"Thuế GTGT"},{"n":1616,"q":"Qua kiểm tra tại trụ sở NNT, Đoàn Kiểm tra phát hiện NNT sử dụng hóa đơn không hợp pháp dẫn đến khai sai làm tăng số thuế GTGT đề nghị hoàn nhưng chưa được hoàn. Trong trường hợp này, NNT sẽ bị xử lý vi phạm hành chính đối với hành vi gì (tất cả các hành vi được phát hiện đều còn thời hiệu xử phạt):","c":{"A":"Chỉ xử phạt vi phạm hành chính về hóa đơn","B":"Chỉ xử phạt vi phạm hành chính về thuế","C":"Xử phạt vi phạm hành chính về thuế và hóa đơn","D":"Không bị xử phạt vi phạm hành chính"},"t":"Hóa đơn"},{"n":1617,"q":"Phát biểu nào sau đây là đúng:","c":{"A":"Người nộp thuế cung cấp thông tin bằng văn bản hoặc thông qua kết nối mạng với các hệ thống thông tin của cơ quan quản lý thuế theo yêu cầu","B":"Người nộp thuế chỉ được cung cấp thông tin cho cơ quan thuế bằng văn bản","C":"","D":""},"t":"Tổng hợp"},{"n":1618,"q":"Cơ quan quản lý thuế được công khai thông tin người nộp thuế trong trường hợp sau đây:","c":{"A":"Chậm nộp hồ sơ khai thuế","B":"Vi phạm pháp luật về thuế","C":"Vi phạm pháp luật về thuế làm ảnh hưởng đến quyền lợi và nghĩa vụ nộp thuế của tổ chức, cá nhân khác","D":""},"t":"Tổng hợp"},{"n":1619,"q":"Cơ quan quản lý thuế được công khai thông tin người nộp thuế trong trường hợp: “Trốn thuế, chây ỳ không nộp tiền thuế và các khoản thu khác thuộc ngân sách nhà nước đúng thời hạn; nợ tiền thuế và các khoản thu khác thuộc ngân sách nhà nước”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":1620,"q":"Cơ quan quản lý thuế, công chức quản lý thuế, người đã là công chức quản lý thuế, cơ quan cung cấp, trao đổi thông tin người nộp thuế, tổ chức kinh doanh dịch vụ làm thủ tục về thuế phải giữ bí mật thông tin người nộp thuế theo quy định của pháp luật, trừ trường hợp:","c":{"A":"Để phục vụ hoạt động tố tụng, thanh tra, kiểm tra, kiểm toán trong trường hợp được yêu cầu bằng văn bản","B":"Được các cơ quan chức năng khác yêu cầu","C":"","D":""},"t":"Tổng hợp"},{"n":1621,"q":"Tổ chức cung cấp dịch vụ về hóa đơn điện tử bao gồm:","c":{"A":"Tổ chức cung cấp giải pháp hóa đơn điện tử","B":"Tổ chức cung cấp dịch vụ nhận, truyền, lưu trữ dữ liệu hóa đơn điện tử và các dịch vụ khác có liên quan đến hóa đơn điện tử","C":"Cả A, B đều đúng","D":""},"t":"Hóa đơn"},{"n":1622,"q":"Phát biểu nào sau đây không đúng:","c":{"A":"Mã của cơ quan thuế trên hóa đơn điện tử bao gồm số giao dịch là một dãy số duy nhất do hệ thống của cơ quan thuế tạo ra và một chuỗi ký tự được cơ quan thuế mã hóa dựa trên thông tin của người bán lập trên hóa đơn","B":"Hóa đơn điện tử có mã của cơ quan thuế là hóa đơn điện tử được cơ quan thuế cấp mã trước khi tổ chức, cá nhân bán hàng hóa, cung cấp dịch vụ gửi cho người mua","C":"Hóa đơn điện tử không có mã của cơ quan thuế là hóa đơn điện tử do tổ chức bán hàng hóa, cung cấp dịch vụ gửi cho người mua không có mã của cơ quan thuế","D":"Khi bán hàng hóa, cung cấp dịch vụ, người bán phải lập hóa đơn điện tử để giao cho người mua nếu có yêu cầu"},"t":"Tổng hợp"},{"n":1623,"q":"Phát biểu nào sau đây đúng nhất:","c":{"A":"Mã của cơ quan thuế trên hóa đơn điện tử bao gồm số giao dịch là một dãy số duy nhất do hệ thống của cơ quan thuế tạo ra và một chuỗi ký tự được cơ quan thuế mã hóa dựa trên thông tin của người bán lập trên hóa đơn.","B":"Mã của cơ quan thuế trên hóa đơn điện tử bao gồm số giao dịch là một dãy số được lặp lại nhiều lần do hệ thống của cơ quan thuế tạo ra và một chuỗi ký tự được cơ quan thuế mã hóa dựa trên thông tin của người bán lập trên hóa đơn.","C":"Mã của cơ quan thuế trên hóa đơn điện tử bao gồm số giao dịch là một dãy số duy nhất do hệ thống của cơ quan thuế tạo ra mỗi ngày cho các hóa đơn xuất ra tương ứng trong ngày đó.","D":""},"t":"Tổng hợp"},{"n":1624,"q":"Chọn đáp án đúng nhất, Theo luật QLT, hóa đơn điện tử bao gồm:","c":{"A":"Hóa đơn giá trị gia tăng, hóa đơn bán hàng, tem điện tử, vé điện tử, thẻ điện tử, phiếu thu điện tử, phiếu xuất kho kiêm vận chuyển điện tử hoặc các chứng từ điện tử có tên gọi khác","B":"Hóa đơn giá trị gia tăng, hóa đơn bán hàng, tem điện tử, vé điện tử, thẻ điện tử, phiếu thu điện tử, phiếu xuất kho kiêm vận chuyển điện tử hoặc các chứng từ điện tử có tên gọi khác","C":"Hóa đơn giá trị gia tăng, tem điện tử, vé điện tử, thẻ điện tử, phiếu thu điện tử, phiếu xuất kho kiêm vận chuyển điện tử hoặc các chứng từ điện tử có tên gọi khác","D":"Hóa đơn giá trị gia tăng, hóa đơn bán hàng, tem điện tử, vé điện tử, thẻ điện tử, phiếu thu điện tử hoặc các chứng từ điện tử có tên gọi khác"},"t":"Hóa đơn"},{"n":1625,"q":"Hóa đơn điện tử không có mã của cơ quan thuế là:","c":{"A":"Hóa đơn điện tử do tổ chức bán hàng hóa, cung cấp dịch vụ gửi cho người mua có mã của cơ quan thuế","B":"Hóa đơn điện tử do tổ chức bán hàng hóa, cung cấp dịch vụ gửi cho người mua không có mã của cơ quan thuế","C":"","D":""},"t":"Hóa đơn"},{"n":1626,"q":"Hóa đơn điện tử có mã của cơ quan thuế là:","c":{"A":"Hóa đơn điện tử được cơ quan thuế cấp mã trước khi tổ chức, cá nhân bán hàng hóa, cung cấp dịch vụ gửi cho người mua","B":"Hóa đơn điện tử được cơ quan thuế cấp mã sau khi tổ chức, cá nhân bán hàng hóa, cung cấp dịch vụ gửi cho người mua","C":"Hóa đơn điện tử được người bán gán mã trước bán hàng hóa, cung cấp dịch vụ gửi cho người mua","D":""},"t":"Hóa đơn"},{"n":1627,"q":"Theo quy định, trường hợp hồ sơ khai thuế không hợp pháp, không đầy đủ, không đúng mẫu quy định thì cơ quan quản lý thuế tiếp nhận hồ sơ khai thuế thông báo cho người nộp thuế trong thời hạn 03 ngày kể từ ngày tiếp nhận hồ sơ.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1628,"q":"Theo quy định, trường hợp hồ sơ khai thuế không hợp pháp, không đầy đủ, không đúng mẫu quy định thì hệ thống quản lý thuế tự động rà soát và tự động thông báo cho người nộp thuế trong thời hạn 03 ngày làm việc kể từ ngày tiếp nhận hồ sơ:","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1629,"q":"Theo quy định, trường hợp hồ sơ khai thuế không hợp pháp, không đầy đủ, không đúng mẫu quy định thì cơ quan quản lý thuế tiếp nhận hồ sơ khai thuế thông báo cho người nộp thuế trong thời hạn bao nhiêu ngày kể từ ngày tiếp nhận hồ sơ:","c":{"A":"03 ngày","B":"03 ngày làm việc","C":"05 ngày","D":"05 ngày làm việc"},"t":"Tổng hợp"},{"n":1630,"q":"Cơ quan quản lý thuế tiếp nhận hồ sơ khai thuế của người nộp thuế qua hình thức nào sau đây:","c":{"A":"Nhận hồ sơ trực tiếp tại cơ quan quản lý thuế","B":"Nhận hồ sơ gửi qua đường bưu chính","C":"Nhận hồ sơ điện tử qua cổng giao dịch điện tử của cơ quan quản lý thuế","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":1631,"q":"Cơ quan quản lý thuế tiếp nhận hồ sơ khai thuế của người nộp thuế qua bao nhiêu hình thức:","c":{"A":"1","B":"2","C":"3","D":"4"},"t":"Tổng hợp"},{"n":1632,"q":"Theo quy định, cá nhân có thu nhập từ tiền lương, tiền công thuộc diện trực tiếp khai thuế với cơ quan thuế bao gồm:","c":{"A":"Cá nhân cư trú có thu nhập từ tiền lương, tiền công được trả từ nước ngoài.","B":"Cá nhân không cư trú có thu nhập từ tiền lương, tiền công phát sinh tại Việt Nam nhưng được trả từ nước ngoài.","C":"Cá nhân có thu nhập từ tiền lương, tiền công do các tổ chức Quốc tế, Đại sứ quán, Lãnh sự quán tại Việt Nam chi trả nhưng chưa khấu trừ thuế;","D":"Tất cả các phương án"},"t":"Tổng hợp"},{"n":1633,"q":"Theo quy định, việc khai thuế TNCN từ tiền lương, tiền công đối với người lao động làm việc tại đơn vị phụ thuộc, địa điểm kinh doanh khác tỉnh với nơi có trụ sở chính thực hiện như thế nào?","c":{"A":"Người nộp thuế chi trả tiền lương, tiền công cho người lao động làm việc tại đơn vị phụ thuộc, địa điểm kinh doanh khác tỉnh với nơi có trụ sở chính, thực hiện khấu trừ thuế TNCN đối với tiền lương, tiền công theo quy định và nộp hồ sơ khai thuế theo mẫu 05/KK-TNCN, phụ lục bảng xác định số thuế TNCN phải nộp cho các địa phương được hưởng nguồn thu mẫu số 05-1/PBT-KK-TNCN cho cơ quan thuế quản lý trực tiếp.","B":"Người nộp thuế chi trả tiền lương, tiền công cho người lao động làm việc tại đơn vị phụ thuộc, địa điểm kinh doanh khác tỉnh với nơi có trụ sở chính, thực hiện khấu trừ thuế TNCN đối với tiền lương, tiền công theo quy định và nộp hồ sơ khai thuế theo mẫu 05/KK-TNCN, phụ lục bảng xác định số thuế TNCN phải nộp cho các địa phương được hưởng nguồn thu mẫu số 05-1/PBT-KK-TNCN cho cơ quan thuế quản lý trực tiếp. Số thuế TNCN xác định cho từng tỉnh theo tháng hoặc quý tương ứng với kỳ khai thuế TNCN và được xác định lại khi quyết toán thuế TNCN.","C":"Người nộp thuế chi trả tiền lương, tiền công cho người lao động làm việc tại đơn vị phụ thuộc, địa điểm kinh doanh khác tỉnh với nơi có trụ sở chính, thực hiện khấu trừ thuế TNCN đối với tiền lương, tiền công theo quy định và nộp hồ sơ khai thuế theo mẫu 05/KK-TNCN, phụ lục bảng xác định số thuế TNCN phải nộp cho các địa phương được hưởng nguồn thu mẫu số 05-1/PBT-KK-TNCN cho cơ quan thuế quản lý trực tiếp. Số thuế TNCN xác định cho từng tỉnh theo tháng hoặc quý tương ứng với kỳ khai thuế TNCN và không xác định lại khi quyết toán thuế TNCN.","D":""},"t":"Thuế TNCN"},{"n":1634,"q":"Theo quy định, số tiền thuế TNCN đã khấu trừ đối với thu nhập từ tiền lương, tiền công được trả tại trụ sở chính cho người lao động làm việc tại đơn vị phụ thuộc, địa điểm kinh doanh tại tỉnh khác có thuộc trường hợp được phân bổ không?","c":{"A":"Có","B":"Không","C":"","D":""},"t":"Thuế TNCN"},{"n":1635,"q":"Theo quy định, đối với đơn vị phụ thuộc trực tiếp bán hàng, sử dụng hóa đơn do đơn vị phụ thuộc đăng ký hoặc do người nộp thuế đăng ký với cơ quan thuế quản lý đơn vị phụ thuộc, theo dõi hạch toán đầy đủ thuế GTGT đầu ra, đầu vào thì đơn vị phụ thuộc khai thuế, nộp thuế GTGT cho cơ quan quản lý trực tiếp đơn vị phụ thuộc.","c":{"A":"Sai","B":"Đúng","C":"","D":""},"t":"Thuế GTGT"},{"n":1636,"q":"Theo quy định, đối với đơn vị phụ thuộc trực tiếp bán hàng, sử dụng hóa đơn do đơn vị phụ thuộc đăng ký hoặc do người nộp thuế đăng ký với cơ quan thuế quản lý đơn vị phụ thuộc, theo dõi hạch toán đầy đủ thuế GTGT đầu ra, đầu vào thì:","c":{"A":"Đơn vị phụ thuộc khai thuế, nộp thuế GTGT cho cơ quan quản lý trực tiếp đơn vị phụ thuộc.","B":"Đơn vị phụ thuộc khai thuế, nộp thuế GTGT tập trung tại trụ sở chính","C":"Người nộp thuế được lựa chọn việc khai thuế tại đơn vị phụ thuộc hoặc tập trung tại trụ sở chính.","D":""},"t":"Thuế GTGT"},{"n":1637,"q":"Khai thuế, nộp thuế GTGT như thế nào đối với đơn vị phụ thuộc, địa điểm kinh doanh là cơ sở sản xuất?","c":{"A":"Người nộp thuế khai thuế GTGT tập trung cho hoạt động sản xuất, kinh doanh của đơn vị phụ thuộc, địa điểm kinh doanh là cơ sở sản xuất và nộp hồ sơ khai thuế theo mẫu số 01/GTGT, phụ lục bảng phân bổ thuế GTGT phải nộp cho địa phương được hưởng nguồn thu theo mẫu 01-6/GTGT; nộp số tiền thuế phân bổ cho từng tỉnh nơi có cơ sở sản xuất theo quy định.","B":"Người nộp thuế khai thuế GTGT tập trung cho hoạt động sản xuất, kinh doanh của đơn vị phụ thuộc, địa điểm kinh doanh là cơ sở sản xuất và nộp hồ sơ khai thuế theo mẫu số 01/GTGT.","C":"Người nộp thuế khai thuế GTGT riêng cho từng hoạt động sản xuất, kinh doanh của đơn vị phụ thuộc, địa điểm kinh doanh là cơ sở sản xuất và nộp hồ sơ khai thuế theo mẫu số 05/GTGT, phụ lục bảng phân bổ thuế GTGT phải nộp cho địa phương được hưởng nguồn thu theo mẫu 01-6/GTGT; nộp số tiền thuế phân bổ cho từng tỉnh nơi có cơ sở sản xuất theo quy định.","D":""},"t":"Thuế GTGT"},{"n":1638,"q":"Khai thuế, nộp thuế GTGT như thế nào đối với công trình xây dựng tại tỉnh khác với nơi có trụ sở chính, bao gồm cả công trình, hạng mục công trình xây dựng liên quan tới nhiều tỉnh?","c":{"A":"Người nộp thuế thực hiện khai thuế GTGT của các công trình xây dựng, hạng mục công trình đó với cơ quan thuế nơi có công trình xây dựng theo mẫu số 05/ GTGT; Người nộp thuế tổng hợp doanh thu chưa có thuế GTGT đối với hoạt động xây dựng vào hồ sơ khai thuế mẫu 01/GTGT tại trụ sở chính. Số thuế GTGT đã nộp tại tỉnh nơi có công trình xây dựng được bù trừ với số thuế GTGT phải nộp tại trụ sở chính.","B":"Người nộp thuế thực hiện khai thuế GTGT của các công trình xây dựng, hạng mục công trình đó với cơ quan thuế nơi có công trình xây dựng theo mẫu số 01/GTGT; Người nộp thuế tổng hợp doanh thu chưa có thuế GTGT đối với hoạt động xây dựng vào hồ sơ khai thuế mẫu 01/GTGT tại trụ sở chính. Số thuế GTGT đã nộp tại tỉnh nơi có công trình xây dựng được bù trừ với số thuế GTGT phải nộp tại trụ sở chính.","C":"Người nộp thuế thực hiện khai thuế GTGT của các công trình xây dựng, hạng mục công trình đó vào mẫu số 01/GTGT tổng hợp toàn đơn vị và nộp tại tại trụ sở chính.","D":""},"t":"Thuế GTGT"},{"n":1639,"q":"Trường hợp người nộp thuế bị ấn định số thuế phải nộp do thuộc một trong các trường hợp bị ấn định thuế theo quy định tại Điều 14 Nghị định số 126/2020/NĐ-CP nhưng người nộp thuế không đồng ý với số thuế ấn định thì:","c":{"A":"Người nộp thuế yêu cầu cơ quan thuế giải thích.","B":"Người nộp thuế có quyền khiếu nại, khởi kiện về việc ấn định thuế.","C":"Người nộp thuế vẫn phải nộp số thuế đã bị cơ quan thuế ấn định; đồng thời yêu cầu cơ quan thuế giải thích.","D":"Người nộp thuế vẫn phải nộp số thuế đã bị cơ quan thuế ấn định; đồng thời yêu cầu cơ quan thuế giải thích hoặc khiếu nại, khởi kiện về việc ấn định thuế."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1640,"q":"Theo quy định, thủ tục ấn định thuế qua kiểm tra thuế, thanh tra thuế gồm:","c":{"A":"Trường hợp cơ quan thuế thực hiện ấn định thuế qua kiểm tra thuế, thanh tra thuế thì lý do ấn định thuế, căn cứ ấn định thuế, số tiền thuế ấn định, thời hạn nộp tiền thuế phải được ghi trong biên bản kiểm tra thuế, thanh tra thuế.","B":"Trường hợp cơ quan thuế thực hiện ấn định thuế qua kiểm tra thuế, thanh tra thuế thì lý do ấn định thuế, số tiền thuế ấn định phải được ghi trong biên bản kiểm tra thuế, thanh tra thuế.","C":"Trường hợp cơ quan thuế thực hiện ấn định thuế qua kiểm tra thuế, thanh tra thuế thì căn cứ ấn định thuế, số tiền thuế ấn định phải được ghi trong biên bản kiểm tra thuế, thanh tra thuế, quyết định xử lý về thuế của cơ quan thuế.","D":"Trường hợp cơ quan thuế thực hiện ấn định thuế qua kiểm tra thuế, thanh tra thuế thì lý do ấn định thuế, căn cứ ấn định thuế, số tiền thuế ấn định, thời hạn nộp tiền thuế phải được ghi trong biên bản kiểm tra thuế, thanh tra thuế, quyết định xử lý về thuế của cơ quan thuế."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1641,"q":"Theo quy định, thủ tục ấn định thuế gồm:","c":{"A":"Khi ấn định thuế, cơ quan thuế ban hành quyết định ấn định thuế.","B":"Khi ấn định thuế, cơ quan thuế thông báo bằng văn bản cho người nộp thuế về việc ấn định thuế và ban hành quyết định ấn định thuế.","C":"Khi ấn định thuế, cơ quan thuế thông báo bằng văn bản cho người nộp thuế về việc ấn định thuế và ban hành quyết định ấn định thuế. Quyết định ấn định thuế phải nêu rõ lý do ấn định thuế, căn cứ ấn định thuế, số tiền ấn định, thời hạn nộp tiền thuế.","D":"Không có phương án đúng"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1642,"q":"Theo quy định, việc phân bổ số tiền thuế TNCN đã khấu trừ đối với thu nhập từ tiền lương, tiền công được trả tại trụ sở chính cho người lao động làm việc tại đơn vị phụ thuộc, địa điểm kinh doanh tại tỉnh khác như sau:","c":{"A":"Người nộp thuế xác định riêng số thuế TNCN phải phân bổ đối với thu nhập từ tiền lương, tiền công của cá nhân làm việc tại từng tỉnh theo số thuế thực tế đã khấu trừ của từng cá nhân.","B":"Người nộp thuế xác định riêng số thuế TNCN phải phân bổ đối với thu nhập từ tiền lương, tiền công của cá nhân làm việc tại từng tỉnh theo số thuế thực tế đã khấu trừ của từng cá nhân. Trường hợp người lao động được điều chuyển, luân chuyển, biệt phái thì căn cứ thời điểm trả thu nhập, người lao động đang làm việc tại tỉnh nào thì số thuế TNCN khấu trừ phát sinh được tính cho tỉnh đó.","C":"Người nộp thuế xác định riêng số thuế TNCN phải phân bổ đối với thu nhập từ tiền lương, tiền công của cá nhân làm việc tại từng tỉnh theo số thuế thực tế đã khấu trừ của từng cá nhân. Trường hợp không xác định được thực hiện phân bổ trên cơ sở tỷ lệ (%) thu nhập tại từng tỉnh với tổng thu nhập đã trả cho người lao đồng với tổng số thuế TNCN đã khấu trừ. Trường hợp người lao động được điều chuyển, luân chuyển, biệt phái thì căn cứ thời điểm trả thu nhập, người lao động đang làm việc tại tỉnh nào thì số thuế TNCN khấu trừ phát sinh được tính cho tỉnh đó.","D":"Không có phương án đúng"},"t":"Thuế TNCN"},{"n":1643,"q":"Căn cứ ấn định thuế đối với cá nhân chuyển nhượng, nhận thừa kế, quà tặng là bất động sản:","c":{"A":"Cơ quan thuế ấn định giá tính thuế trong trường hợp xác định được cá nhân kê khai, nộp thuế với giá tính thuế thấp hơn so với giá giao dịch thông thường trên thị trường. Giá tính thuế do cơ quan thuế ấn định phải đảm bảo phù hợp với giá giao dịch thông thường trên thị trường nhưng không thấp hơn giá do Ủy ban nhân dân tỉnh, thành phố quy định tại thời điểm xác định giá tính thuế.","B":"Cơ quan thuế ấn định giá tính thuế trong trường hợp xác định được cá nhân kê khai, nộp thuế với giá tính thuế thấp hơn hoặc bằng so với giá giao dịch thông thường trên thị trường. Giá tính thuế do cơ quan thuế ấn định phải đảm bảo phù hợp với giá giao dịch thông thường trên thị trường nhưng không thấp hơn hoặc bằng giá do Ủy ban nhân dân tỉnh, thành phố quy định tại thời điểm xác định giá tính thuế.","C":"Cơ quan thuế ấn định giá tính thuế trong trường hợp xác định được cá nhân kê khai, nộp thuế với giá tính thuế không theo giá giao dịch thông thường trên thị trường. Giá tính thuế do cơ quan thuế ấn định phải đảm bảo phù hợp với giá giao dịch thông thường trên thị trường nhưng ít nhất phải bằng giá do Ủy ban nhân dân tỉnh, thành phố quy định tại thời điểm xác định giá tính thuế.","D":"Không có phương án nào đúng"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1644,"q":"Căn cứ ấn định thuế từng yếu tố đối với người nộp thuế là tổ chức:","c":{"A":"Căn cứ cơ sở dữ liệu của cơ quan quản lý thuế và cơ sở dữ liệu thương mại; tài liệu và kết quả kiểm tra, thanh tra còn hiệu lực; kết quả xác minh; số tiền thuế phải nộp bình quân tối thiểu của 03 cơ sở kinh doanh cùng mặt hàng, ngành, nghề, quy mô tại địa phương; trường hợp tại địa phương, cơ sở kinh doanh không có hoặc có nhưng không đủ thông tin về mặt hàng, ngành, nghề, quy mô cơ sở kinh doanh thì lấy thông tin của cơ sở kinh doanh tại địa phương khác để thực hiện ấn định theo từng yếu tố.","B":"Căn cứ cơ sở dữ liệu của cơ quan quản lý thuế và cơ sở dữ liệu thương mại; tài liệu và kết quả kiểm tra, thanh tra còn hiệu lực; kết quả xác minh; số tiền thuế phải nộp bình quân tối thiểu của 05 cơ sở kinh doanh cùng mặt hàng, ngành, nghề, quy mô tại địa phương; trường hợp tại địa phương, cơ sở kinh doanh không có hoặc có nhưng không đủ thông tin về mặt hàng, ngành, nghề, quy mô cơ sở kinh doanh thì lấy thông tin của cơ sở kinh doanh tại địa phương khác để thực hiện ấn định theo từng yếu tố.","C":"Căn cứ cơ sở dữ liệu của cơ quan quản lý thuế và cơ sở dữ liệu thương mại; tài liệu và kết quả kiểm tra, thanh tra còn hiệu lực; kết quả xác minh; số tiền thuế phải nộp bình quân tối thiểu của 03 cơ sở kinh doanh cùng mặt hàng, ngành, nghề, quy mô tại địa phương.","D":"Căn cứ cơ sở dữ liệu của cơ quan quản lý thuế và cơ sở dữ liệu thương mại; tài liệu và kết quả kiểm tra, thanh tra còn hiệu lực; kết quả xác minh; số tiền thuế phải nộp bình quân tối thiểu của 03 cơ sở kinh doanh cùng mặt hàng, ngành, nghề, quy mô hoặc tương đương tại địa phương; trường hợp tại địa phương, cơ sở kinh doanh không có hoặc có nhưng không đủ thông tin về mặt hàng, ngành, nghề, quy mô cơ sở kinh doanh thì lấy thông tin của cơ sở kinh doanh tại địa phương khác để thực hiện ấn định theo từng yếu tố."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1645,"q":"Tổ chức, cá nhân bị ấn định từng yếu tố liên quan đến việc xác định số tiền thuế phải nộp khi thuộc một trong các trường hợp nào sau đây:","c":{"A":"Qua kiểm tra hồ sơ khai thuế, cơ quan thuế có căn cứ cho rằng người nộp thuế khai chưa đầy đủ hoặc chưa chính xác các yếu tố làm cơ sở xác định số tiền thuế phải nộp, đã yêu cầu người nộp thuế khai bổ sung nhưng người nộp thuế không khai bổ sung hoặc khai bổ sung không chính xác, trung thực theo yêu cầu của cơ quan thuế.","B":"Qua kiểm tra sổ kế toán, hóa đơn, chứng từ liên quan đến việc xác định số tiền thuế phải nộp của người nộp thuế hoặc qua kiểm tra, đối chiếu, xác minh, sổ kế toán, hóa đơn, chứng từ của tổ chức, cá nhân có liên quan, cơ quan thuế có cơ sở chứng minh người nộp thuế hạch toán không chính xác, không trung thực các yếu tố liên quan đến việc xác định số tiền thuế phải nộp.","C":"Người nộp thuế nộp hồ sơ khai thuế nhưng không xác định được các yếu tố làm cơ sở xác định căn cứ tính thuế hoặc có xác định được các yếu tố làm cơ sở xác định căn cứ tính thuế nhưng không tự tính được số tiền phải nộp.","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":1646,"q":"Tổ chức, cá nhân bị ấn định từng yếu tố liên quan đến việc xác định số tiền thuế phải nộp khi thuộc một trong các trường hợp nào sau đây:","c":{"A":"Qua kiểm tra hồ sơ khai thuế, cơ quan thuế có căn cứ cho rằng người nộp thuế khai chưa đầy đủ hoặc chưa chính xác các yếu tố làm cơ sở xác định số tiền thuế phải nộp, đã yêu cầu người nộp thuế khai bổ sung nhưng người nộp thuế không khai bổ sung hoặc khai bổ sung không chính xác, trung thực theo yêu cầu của cơ quan thuế.","B":"Qua kiểm tra sổ kế toán, hóa đơn, chứng từ liên quan đến việc xác định số tiền thuế phải nộp của người nộp thuế hoặc qua kiểm tra, đối chiếu, xác minh, sổ kế toán, hóa đơn, chứng từ của tổ chức, cá nhân có liên quan, cơ quan thuế có cơ sở chứng minh người nộp thuế hạch toán không chính xác, không trung thực các yếu tố liên quan đến việc xác định số tiền thuế phải nộp.","C":"Hạch toán giá bán hàng hóa, dịch vụ không đúng với giá thực tế thanh toán làm giảm doanh thu tính thuế hoặc hạch toán giá mua bán hàng hóa, nguyên vật liệu phục vụ cho sản xuất, kinh doanh không theo giá thực tế thanh toán phù hợp với thị trường làm tăng chi phí, tăng thuế GTGT được khấu trừ, giảm nghĩa vụ thuế phải nộp.","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":1647,"q":"Các trường hợp nào sau đây người nộp thuế bị ấn định thuế trong trường hợp vị phạm pháp luật về thuế","c":{"A":"Có dấu hiệu bỏ trốn hoặc phát tán tài sản để không thực hiện nghĩa vụ thuế.","B":"Thực hiện các giao dịch không đúng với bản chất kinh tế, không đúng thực tế phát sinh nhằm mục đích giảm nghĩa vụ thuế của người nộp thuế.","C":"Không tuân thủ quy định về nghĩa vụ kê khai, xác định giá giao dịch liên kết hoặc không cung cấp thông tin theo quy định về quản lý thuế đối với doanh nghiệp có giao dịch liên kết.","D":"Tất cả các phương án trên"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1648,"q":"Các trường hợp nào sau đây người nộp thuế bị ấn định thuế trong trường hợp vị phạm pháp luật về thuế","c":{"A":"Không chấp hành quyết định thanh tra, kiểm tra thuế theo quy định.","B":"Mua, bán, trao đổi và hạch toán giá trị hàng hóa, dịch vụ không theo giá trị giao dịch thông thường trên thị trường.","C":"Mua, trao đổi hàng hóa sử dụng hóa đơn không hợp pháp, sử dụng không hợp pháp hóa đơn mà hàng hóa là có thật theo xác định của cơ quan có thẩm quyền và đã được kê khai doanh thu tính thuế.","D":"Tất cả các phương án trên"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1649,"q":"Các trường hợp nào sau đây người nộp thuế bị ấn định thuế trong trường hợp vị phạm pháp luật về thuế","c":{"A":"Không đăng ký thuế, không khai thuế, không nộp bổ sung hồ sơ thuế theo yêu cầu của cơ quan thuế hoặc khai không đầy đủ, trung thực, chính xác về căn cứ tính thuế.","B":"Không phản ánh hoặc phản ánh không đầy đủ, trung thực, chính xác số liệu trên sổ kế toán để xác định nghĩa vụ thuế.","C":"Không xuất trình sổ kế toán, hóa đơn, chứng từ và các tài liệu cần thiết liên quan đến việc xác định số tiền thuế phải nộp trong thời hạn quy định.","D":"Tất cả các phương án trên"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1650,"q":"Cơ quan quản lý thuế ấn định số tiền thuế phải nộp hoặc ấn định từng yếu tố, căn cứ tính thuế để xác định số tiền thuế phải nộp:","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1651,"q":"Thời gian gia hạn nộp hồ sơ khai thuế trong trường hợp người nộp thuế không có khả năng nộp thuế đúng thời hạn do thiên tai, thảm họa, dịch bệnh.... được thủ trưởng cơ quan thuế quản lý trực tiếp gia hạn:","c":{"A":"Không quá 30 ngày đối với việc nộp hồ sơ khai thuế tháng, khai thuế quý, khai thuế năm, khai thuế theo từng lần phát sinh nghĩa vụ thuế.","B":"Không quá 60 ngày đối với việc nộp hồ sơ khai quyết toán thuế kể từ ngày hết hạn phải nộp hồ sơ thuế tháng.","C":"Không quá 40 ngày đối với việc nộp hồ sơ khai thuế tháng, khai thuế quý, khai thuế năm, khai thuế theo từng lần phát sinh nghĩa vụ thuế.","D":"Không quá 70 ngày đối với việc nộp hồ sơ khai quyết toán thuế kể từ ngày hết hạn phải nộp hồ sơ thuế tháng. E Cả A và B"},"t":"Tổng hợp"},{"n":1652,"q":"Phân bổ thuế TNDN đối với người nộp thuế có đơn vị phụ thuộc, địa điểm kinh doanh là cơ sở sản xuất:","c":{"A":"Số thuế TNDN phải nộp tại từng tỉnh nơi có cơ sở sản xuất bằng (=) số thuế TNDN phải nộp của hoạt động sản xuất, kinh doanh nhân (X) với tỷ lệ (%) chi phí của từng cơ sở sản xuất trên tổng chi phí của người nộp thuế (không bao gồm chi phí của hoạt động được hưởng ưu đãi thuế TNDN). Chi phí để xác định tỷ lệ phân bổ là chi phí thực tế phát sinh của kỳ tính thuế.","B":"Số thuế TNDN phải nộp tại từng tỉnh nơi có cơ sở sản xuất bằng (=) số thuế TNDN phải nộp của hoạt động sản xuất, kinh doanh nhân (X) với tỷ lệ (%) doanh thu của từng cơ sở sản xuất trên tổng doanh thu của người nộp thuế (không bao gồm doanh thu của hoạt động được hưởng ưu đãi thuế TNDN). Doanh thu để xác định tỷ lệ phân bổ là doanh thu thực tế phát sinh của kỳ tính thuế.","C":"Cả A và B","D":"Không có phương án nào"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":1653,"q":"Phân bổ thuế TNDN đối với hoạt động chuyển nhượng bất động sản:","c":{"A":"Số thuế TNDN phải nộp cho từng tỉnh nơi có hoạt động chuyển nhượng bất động sản tạm nộp hàng quý và quyết toán bằng (=) doanh thu tính thuế TNDN của hoạt động chuyển nhượng bất động sản tại từng tỉnh nhân (X) 1%.","B":"Số thuế TNDN phải nộp cho từng tỉnh nơi có hoạt động chuyển nhượng bất động bằng (=) doanh thu tính thuế TNDN của hoạt động chuyển nhượng bất động sản tại từng tỉnh nhân (X) 1%.","C":"Số thuế TNDN phải nộp cho từng tỉnh nơi có hoạt động chuyển nhượng bất động sản tạm nộp hàng quý và quyết toán bằng (=) doanh thu tính thuế TNDN của hoạt động chuyển nhượng bất động sản tại từng tỉnh nhân (X) 1%.","D":"Số thuế TNDN của từng tỉnh nơi có hoạt động chuyển nhượng bất động sản nộp hàng quý và quyết toán bằng (=) doanh thu tính thuế TNDN của hoạt động chuyển nhượng bất động sản tại từng tỉnh nhân (X) 1%."},"t":"Thuế TNCN"},{"n":1654,"q":"Phân bổ số thuế GTGT phải nộp cho tỉnh nơi đơn vị phụ thuộc, địa điểm kinh là cơ sở sản xuất","c":{"A":"Số thuế GTGT phải nộp cho tỉnh nơi có cơ sở sản xuất bằng (=)
