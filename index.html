h vi vi phạm đó.","B":"Cá nhân, tổ chức đã bị ra quyết định xử phạt vi phạm hành chính nhưng chưa hết thời hạn được coi là chưa bị xử phạt mà lại thực hiện hành vi vi phạm hành chính đã bị xử phạt.","C":"Cá nhân, tổ chức thực hiện hành vi vi phạm hành chính lần đầu.","D":"Cá nhân, tổ chức đã bị ra quyết định xử phạt nhưng chưa thi hành quyết định."},"t":"Tổng hợp"},{"n":322,"q":"Cùng một ngày, người nộp thuế khai sai nhiều chỉ tiêu trên các hồ sơ thuế, các hành vi này đều thuộc trường hợp xử phạt về thủ tục thuế. Việc xử phạt được thực hiện như thế nào?","c":{"A":"Xử phạt riêng đối với từng hành vi khai sai trên từng hồ sơ thuế","B":"Chỉ xử phạt một hành vi khai sai chỉ tiêu trên hồ sơ thuế có khung phạt tiền thấp nhất, áp dụng tình tiết tăng nặng “vi phạm nhiều lần”.","C":"Chỉ xử phạt một hành vi khai sai chỉ tiêu trên hồ sơ thuế có khung phạt tiền cao nhất","D":"Tất cả đều sai"},"t":"Xử phạt VPHC thuế"},{"n":323,"q":"Theo Luật Xử lý vi phạm hành chính, tình tiết nào sau đây là tình tiết tăng nặng?","c":{"A":"Người vi phạm là phụ nữ mang thai","B":"Vi phạm lần đầu","C":"Vi phạm hành chính nhiều lần; tái phạm","D":"Thành khẩn khai báo"},"t":"Xử phạt VPHC thuế"},{"n":324,"q":"Theo Luật Xử lý vi phạm hành chính, tình tiết nào sau đây là tình tiết giảm nhẹ?","c":{"A":"Vi phạm có tổ chức","B":"Vi phạm nhiều lần","C":"Tự nguyện khắc phục hậu quả, bồi thường thiệt hại","D":"Lợi dụng chức vụ, quyền hạn"},"t":"Xử phạt VPHC thuế"},{"n":325,"q":"Theo Luật Xử lý vi phạm hành chính, trường hợp nào sau đây không xử phạt vi phạm hành chính?","c":{"A":"Vi phạm hành chính lần đầu","B":"Thực hiện hành vi vi phạm hành chính trong tình thế cấp thiết","C":"Có tình tiết giảm nhẹ","D":"Vi phạm do lỗi vô ý"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":326,"q":"Theo Luật Xử lý vi phạm hành chính, đối với cùng một hành vi vi phạm, mức phạt tiền đối với tổ chức được xác định như thế nào?","c":{"A":"Bằng mức phạt của cá nhân","B":"Thấp hơn mức phạt của cá nhân","C":"Bằng 02 lần mức phạt của cá nhân","D":"Do nghị định chuyên ngành quy định"},"t":"Xử phạt VPHC thuế"},{"n":327,"q":"Theo Luật Xử lý vi phạm hành chính, ai có trách nhiệm chứng minh vi phạm hành chính?","c":{"A":"Cá nhân, tổ chức vi phạm","B":"Người lập biên bản","C":"Người có thẩm quyền xử phạt","D":"Cơ quan quản lý cấp trên"},"t":"Tổng hợp"},{"n":328,"q":"Theo Luật Xử lý vi phạm hành chính, một hành vi vi phạm hành chính bị xử phạt như thế nào?","c":{"A":"Có thể bị xử phạt nhiều lần","B":"Chỉ bị xử phạt một lần","C":"Bị xử phạt theo số lần phát hiện","D":"Do người có thẩm quyền quyết định"},"t":"Xử phạt VPHC thuế"},{"n":329,"q":"Theo quy định tại Nghị định 310/2025/NĐ-CP, thời hiệu xử phạt đối với hành vi vi phạm thủ tục thuế được xác định như thế nào?","c":{"A":"01 năm, kể từ ngày phát hiện hành vi vi phạm","B":"02 năm, kể từ ngày thực hiện hành vi vi phạm","C":"05 năm, kể từ ngày thực hiện hành vi vi phạm","D":"10 năm, kể từ ngày phát sinh nghĩa vụ thuế"},"t":"Xử phạt VPHC thuế"},{"n":330,"q":"Theo Luật Xử lý vi phạm hành chính, vi phạm hành chính được hiểu là gì?","c":{"A":"Hành vi nguy hiểm cho xã hội do cá nhân, tổ chức thực hiện","B":"Hành vi có lỗi do cá nhân, tổ chức thực hiện, vi phạm quy định của pháp luật về quản lý nhà nước","C":"Hành vi vi phạm pháp luật bị xử lý hình sự","D":"Hành vi vi phạm pháp luật nhưng chưa gây hậu quả"},"t":"Tổng hợp"},{"n":331,"q":"Cá nhân, tổ chức vi phạm hành chính nhiều lần thì không áp dụng tình tiết tăng nặng “vi phạm hành chính nhiều lần” khi xử phạt đối với từng hành vi vi phạm. Nhận định trên là ĐÚNG hay SAI?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Xử phạt VPHC thuế"},{"n":332,"q":"Người nộp thuế thuộc đối tượng sử dụng hóa đơn điện tử không có mã của cơ quan thuế theo quy định tại khoản 2 Điều 91 Luật Quản lý thuế nếu thuộc trường hợp được xác định rủi ro cao về thuế thì:","c":{"A":"Người nộp thuế phải thực hiện chuyển đổi sang áp dụng HĐĐT có mã cơ quan thuế trong thời gian 05 ngày làm việc kể từ ngày cơ quan thuế ban hành Thông báo về việc chuyển đổi sang áp dụng HĐĐT có mã","B":"Người nộp thuế phải thực hiện chuyển đổi sang áp dụng HĐĐT có mã cơ quan thuế trong thời gian 10 ngày làm việc kể từ ngày cơ quan thuế ban hành Thông báo về việc chuyển đổi sang áp dụng HĐĐT có mã","C":"Nếu có nhu cầu sử dụng HĐĐT không mã, người nộp thuế gửi văn bản đến cơ quan thuế, cơ quan thuế cứ quy định tại khoản 2 Điều 91 Luật Quản lý thuế và quy định tại Thông tư số 31/2021/TT-BTC để xem xét, quyết định","D":"Người nộp thuế thực hiện giải trình trong thời gian 05 ngày làm việc từ ngày cơ quan thuế ban hành Thông báo về việc chuyển đổi sang áp dụng HĐĐT có mã và được tiếp tục sử dụng HĐĐT không mã"},"t":"Hóa đơn"},{"n":333,"q":"Hóa đơn điện tử có các ký tự “1C26TAA” là.","c":{"A":"Hóa đơn bán hàng có mã của cơ quan thuế được lập năm 2026 và là hóa đơn điện tử do doanh nghiệp, tổ chức đăng ký sử dụng với cơ quan thuế","B":"Hóa đơn giá trị gia tăng loại không có mã được lập năm 2026 và là hóa đơn điện tử do doanh nghiệp, tổ chức đăng ký sử dụng với cơ quan thuế","C":"Hóa đơn giá trị gia tăng có mã của cơ quan thuế được lập năm 2026 và là hóa đơn điện tử do doanh nghiệp, tổ chức đăng ký sử dụng với cơ quan thuế","D":"Hóa đơn giá trị gia tăng có mã của cơ quan thuế được lập năm 2026 và là hóa đơn điện tử của cơ quan thuế cấp theo từng lần phát sinh"},"t":"Hóa đơn"},{"n":334,"q":"Chuỗi ký tự nào sau đây thể hiện là “hóa điện tử có mã của cơ quan thuế khởi tạo từ máy tính tiền là hóa đơn giá trị gia tăng và được lập năm 2026”","c":{"A":"1C26MAA","B":"2C26MAY","C":"1C26TMA","D":"2C26MTT"},"t":"Tổng hợp"},{"n":335,"q":"Hóa đơn điện tử có các ký tự “5C26TAA”, ký tự “5” được hiểu là.","c":{"A":"Ký hiệu mẫu số hóa đơn điện tử là hóa đơn giá trị gia tăng","B":"Ký hiệu mẫu số hóa đơn điện tử là hóa đơn bán hàng","C":"Ký hiệu mẫu số hóa đơn điện tử là loại hóa đơn điện tử khác.","D":"Ký hiệu mẫu số hóa đơn điện tử là hóa đơn thương mại điện tử"},"t":"Hóa đơn"},{"n":336,"q":"Theo quy định về hóa đơn điện tử hiện nay thì các loại hóa đơn khác bao gồm:","c":{"A":"Tem, vé, thẻ điện tử; Phiếu thu tiền cước vận chuyển hàng không; chứng từ thu cước phí vận tải quốc tế; chứng từ thu phí dịch vụ ngân hàng","B":"Phiếu xuất kho kiêm vận chuyển nội bộ, phiếu xuất kho hàng gửi bán đại lý;","C":"Hóa đơn điện tử bán tài sản công;","D":"Hóa đơn thương mại điện tử;"},"t":"Hóa đơn"},{"n":337,"q":"Các trường hợp bán hàng hóa, cung cấp dịch vụ với số lượng lớn, phát sinh thường xuyên, cần có thời gian đối soát số liệu giữa doanh nghiệp bán hàng hóa, cung cấp dịch vụ và khách hàng theo hướng dẫn của Bộ trưởng Bộ Tài chính bao gồm:","c":{"A":"Dịch vụ cung cấp suất ăn công nghiệp","B":"Dịch vụ kinh doanh vận tải hành khách bằng xe taxi (đối với khách hàng là các doanh nghiệp, tổ chức).","C":"Dịch vụ kinh doanh vận tải hành khách bằng xe taxi có sử dụng phần mềm tính tiền theo quy định của pháp luật.","D":"A và B"},"t":"Tổng hợp"},{"n":338,"q":"Tổ chức cho thuê tài chính cho thuê tài sản thuộc đối tượng chịu thuế GTGT khi lập hóa đơn đối với hoạt động cho thuê tài chính thì:","c":{"A":"Thuế suất gạch chéo, tiền thuế giá trị gia tăng thể hiện bằng tiền thuế giá trị gia tăng đầu vào của tài sản cho thuê tài chính","B":"Thuế suất thể hiện “CTTC”, tiền thuế giá trị gia tăng thể hiện bằng tiền thuế giá trị gia tăng đầu vào của tài sản cho thuê tài chính","C":"Thuế suất thể hiện “KCT”, tiền thuế giá trị gia tăng thể hiện bằng tiền thuế giá trị gia tăng đầu vào của tài sản cho thuê tài chính","D":"Thuế suất thể hiện “10%”, tiền thuế giá trị gia tăng thể hiện bằng tiền thuế giá trị gia tăng đầu vào của tài sản cho thuê tài chính."},"t":"Thuế GTGT"},{"n":339,"q":"Để thu thuế sử dụng đất nông nghiệp, thuế sử dụng đất phi nông nghiệp đối với hộ gia đình, cá nhân thì:","c":{"A":"Cục Thuế đặt in biên lai thuế Mẫu CTT50 và cấp cho Thuế địa phương trên cơ sở kế hoạch và đề nghị cấp của Thuế tỉnh/ thành phố.","B":"Cục Thuế phê duyệt kế hoạch và dự toán in biên lai thuế Mẫu CTT50 của Thuế tỉnh/ thành phố, Thuế tỉnh/ thành phố thực hiện đặt in biên lai và thông báo phát hành chứng từ CTT50.","C":"Thuế tỉnh/ thành phố khởi tạo biên lai thuế điện tử CTT50.","D":"Thuế cơ sở khởi tạo biên lai thuế điện tử biên lai thuế điện tử CTT50 ."},"t":"Tổng hợp"},{"n":340,"q":"Quy định nào sau đây là chính xác:","c":{"A":"Đối với tổ chức, Doanh nghiệp sử dụng hóa đơn điện tử trong trường hợp cần điều chỉnh một số tiêu thức nội dung trên hóa đơn điện tử cho phù hợp với thực tế, tổ chức, Doanh nghiệp có văn bản trao đổi với Bộ Tài chính (Cục Thuế, Cục Hải quan) xem xét và có hướng dẫn trước khi thực hiện;","B":"Đối với tổ chức thu phí, lệ phí sử dụng biên lai điện tử trong trường hợp cần điều chỉnh một số tiêu thức nội dung trên biên lai điện tử cho phù hợp với thực tế, tổ chức thu phí, lệ phí có văn bản trao đổi với Bộ Tài chính (Cục Thuế, Cục Hải quan) xem xét và có hướng dẫn trước khi thực hiện.","C":"A và B đều đúng","D":"A và B đều sai"},"t":"Tổng hợp"},{"n":341,"q":"Quy định nào sau đây về nội dung của biên lai điện tử là chính xác:","c":{"A":"Ngoài các thông tin bắt buộc theo quy định, tổ chức thu phí, lệ phí có thể tạo thêm các thông tin khác, kể cả tạo lo-go, hình ảnh trang trí hoặc quảng cáo phù hợp với quy định của pháp luật và không che khuất, làm mờ các nội dung bắt buộc thể hiện trên biên lai. Cỡ chữ của các thông tin tạo thêm không được lớn hơn cỡ chữ của các nội dung bắt buộc thể hiện trên biên lai.","B":"Ngoài các thông tin bắt buộc theo quy định, tổ chức thu phí, lệ phí có thể tạo thêm các thông tin khác, kể cả tạo lo-go, hình ảnh trang trí hoặc quảng cáo phù hợp với quy định của pháp luật và không che khuất, làm mờ các nội dung bắt buộc thể hiện trên biên lai.","C":"Ngoài các thông tin bắt buộc, tổ chức thu phí, lệ phí muốn tạo thêm các thông tin khác như lo-go, hình ảnh trang trí hoặc quảng cáo phù hợp với quy định của pháp luật và không che khuất, làm mờ các nội dung bắt buộc thể hiện trên biên lai thì tổ chức phải có văn bản trao đổi với Bộ Tài chính (Cục Thuế, Cục Hải quan) xem xét và có hướng dẫn trước khi thực hiện;","D":"Ngoài các thông tin bắt buộc theo quy định, tổ chức thu phí, lệ phí muốn tạo thêm các thông tin khác như lo-go, hình ảnh trang trí hoặc quảng cáo phù hợp với quy định của pháp luật và không che khuất, làm mờ các nội dung bắt buộc thể hiện trên biên lai thì tổ chức phải thực hiện thay đổi thông tin đăng ký sử dụng chứng từ điện tử đến cơ quan thuế."},"t":"Tổng hợp"},{"n":342,"q":"Quy định về áp dụng hóa đơn điện tử khi Doanh nghiệp xuất hàng hóa bán lưu động","c":{"A":"Sử dụng hóa đơn điện tử có mã của cơ quan thuế","B":"Sử dụng hóa đơn điện tử khởi tạo từ máy tính tiền","C":"Sử dụng Phiếu xuất kho kiêm vận chuyển nội bộ, khi bán hàng lập hóa đơn điện tử theo quy định.","D":"Sử dụng hóa đơn thương mại điện tử, khi bán hàng lập hóa đơn điện tử theo quy định."},"t":"Hóa đơn"},{"n":343,"q":"Trường hợp nào trên hóa đơn điện tử không nhất thiết phải có đơn vị tính, số lượng, đơn giá","c":{"A":"","B":"","C":"Tem, vé, thẻ điện tử in sẵn mệnh giá","D":"Tất cả các phương án trên"},"t":"Hóa đơn"},{"n":344,"q":"Các trường hợp không nhất thiết phải có tiêu thức người mua (tên, địa chỉ, mã số thuế của người mua) là:","c":{"A":"Hóa đơn điện tử là tem, vé, thẻ;","B":"Hóa đơn điện tử khởi tạo từ máy tính tiền;","C":"Hóa đơn điện tử bán hàng tại siêu thị, trung tâm thương mại mà người mua là cá nhân không kinh doanh","D":"Tất cả các phương án trên"},"t":"Quản lý thuế / Hoàn thuế"},{"n":345,"q":"Các trường hợp không bắt buộc phải có chữ ký số của người bán trên hóa đơn là","c":{"A":"Hóa đơn điện tử có mã của cơ quan thuế cấp từng lần phát sinh.","B":"Hóa đơn điện tử khởi tạo từ máy tính tiền.","C":"Tem, vé, thẻ điện tử không có mã của cơ quan thuế;","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":346,"q":"Trước thời điểm Nghị định 70/2025/NĐ-CP ngày 20/3/2025 của Chính phủ có hiệu lực, tổ chức/doanh nghiệp khấu trừ thuế TNCN sử dụng chứng từ khấu trừ thuế thu nhập cá nhân như thế nào?","c":{"A":"Cơ quan thuế tiếp tục bán chứng từ khấu trừ thuế TNCN do cơ quan thuế đặt in","B":"Tổ chức khấu trừ thuế TNCN tự xây dựng hệ thống phần mềm để sử dụng chứng từ điện tử đảm bảo các nội dung bắt buộc theo quy định tại khoản 1 Điều 32 Nghị định số 123/2020/NĐ-CP;","C":"Tổ chức khấu trừ thuế TNCN đăng ký sử dụng chứng từ điện tử theo Mẫu số 01/ĐKTĐ-HĐĐT Phụ lục IA Nghị định số 123/2020/NĐ-CP","D":"Tất cả các phương án trên"},"t":"Thuế TNCN"},{"n":347,"q":"Tổ chức khấu trừ thuế thu nhập cá nhân phải ngừng sử dụng chứng từ khấu trừ thuế thu nhập cá nhân điện tử đã thực hiện theo các quy định trước đây và chuyển sang áp dụng chứng từ khấu trừ thuế thu nhập cá nhân điện tử theo quy định tại Nghị định số 70/2025/NĐ-CP kể từ:","c":{"A":"01/07/2022;","B":"01/07/2025;","C":"01/06/2025;","D":"30/06/2025;"},"t":"Thuế TNCN"},{"n":348,"q":"Trên hóa đơn điện tử khởi tạo từ máy tính tiền của Doanh nghiệp A kinh doanh dịch vụ ăn uống, có thể hiện mã của cơ quan thuế gồm 23 ký tự như sau: M2-26-n25BH-00000015382 Theo anh/chị, ý nghĩa của chuỗi ký hiệu “n25BH” là gì?","c":{"A":"Là chuỗi ký tự được tự sinh từ phần mềm bán hàng của Doanh nghiệp đảm bảo tính duy nhất;","B":"Là chuỗi ký tự thể hiện loại hóa đơn, năm phát hành hóa đơn tự sinh từ phần mềm bán hàng của Doanh nghiệp;","C":"Là chuỗi ký tự do cơ quan thuế cấp theo hình thức tự sinh từ hệ thống hóa đơn điện tử của cơ quan thuế đảm bảo tính duy nhất;","D":"Là chuỗi ký hiệu được gắn cố định để thể hiện loại hóa đơn điện tử (hóa đơn điện tử giá trị gia tăng/ hóa đơn điện tử bán hàng/ hóa đơn điện tử bán tài sản công/ hóa đơn điện tử bán hàng dự trữ quốc gia/ hóa đơn điện tử khác/ chứng từ điện tử) theo quy định tại điểm a khoản 1 Điều 5 Thông tư số 32/2025/TT-BTC."},"t":"Hóa đơn"},{"n":349,"q":"Kể từ thời điểm doanh nghiệp, tổ chức, hộ, cá nhân kinh doanh sử dụng hóa đơn điện tử theo quy định tại Nghị định số 123/2020/NĐ-CP (được sửa đổi, bổ sung tại Nghị định số 70/2025/NĐ-CP), nếu phát hiện hóa đơn đã lập theo quy định tại Nghị định số 51/2010/NĐ-CP, Nghị định số 04/2014/NĐ-CP mà hóa đơn đã lập sai thì người bán và người mua phải:","c":{"A":"Lập văn bản thỏa thuận ghi rõ nội dung sai và lập hóa đơn điện tử mới (hóa đơn điện tử có mã của cơ quan thuế hoặc hóa đơn điện tử không có mã) thay thế cho hóa đơn đã lập sai;","B":"Lập văn bản thỏa thuận ghi rõ nội dung sai và lập hóa đơn điện tử mới (hóa đơn điện tử có mã của cơ quan thuế hoặc hóa đơn điện tử không có mã) điều chỉnh cho hóa đơn đã lập sai;","C":"Lập văn bản thỏa thuận ghi rõ sai sót, người bán thực hiện thông báo với cơ quan thuế theo Mẫu số 04/SS-HĐĐT ban hành kèm theo Nghị định số 123/2020/NĐ-CP và lập hóa đơn hóa đơn điện tử mới (hóa đơn điện tử có mã của cơ quan thuế hoặc hóa đơn điện tử không có mã) thay thế cho hóa đơn đã lập có sai sót;","D":"Lập văn bản thỏa thuận ghi rõ sai sót, người bán thực hiện thông báo với cơ quan thuế theo Mẫu số 04/SS-HĐĐT ban hành kèm theo Nghị định số 123/2020/NĐ-CP và lập hóa đơn hóa đơn điện tử mới (hóa đơn điện tử có mã của cơ quan thuế hoặc hóa đơn điện tử không có mã) điểu chỉnh cho hóa đơn đã lập có sai sót;"},"t":"Hóa đơn"},{"n":350,"q":"Các trường hợp người bán phải thực hiện thông báo với cơ quan thuế về hóa đơn điện tử đã lập sai theo mẫu 04/SS-HĐĐT là:","c":{"A":"Trường hợp có sai về tên, địa chỉ của người mua nhưng không sai mã số thu, các nội dung khác không sai;","B":"Trường hợp có sai: mã số thuế; sai về số tiền ghi trên hóa đơn, sai về thuế suất, tiền thuế hoặc hàng hóa ghi trên hóa đơn không đúng quy cách, chất lượng; người bán lựa chọn lập hóa đơn điều chỉnh hoặc hóa đơn điện tử thay thế;","C":"Trường hợp người bán phát hiện hóa đơn điện tử đã được cấp mã của cơ quan thuế chưa gửi cho người mua có sai sót và người bán lựa chọn hủy hóa đơn điện tử đã lập;","D":"Tất cả các phương án trên"},"t":"Hóa đơn"},{"n":351,"q":"Đâu là nguyên tắc của ủy nhiệm lập hóa đơn điện tử:","c":{"A":"Người bán hàng hóa, cung cấp dịch vụ được ủy nhiệm cho bên thứ ba là đối tượng đủ điều kiện sử dụng hóa đơn điện tử và không thuộc trường hợp ngừng sử dụng hóa đơn điện tử theo quy định tại Điều 16 Nghị định số 123/2020/NĐ-CP (được sửa đổi, bổ sung tại khoản 12 Điều 1 Nghị định số 70/2025/NĐ-CP) để lập hóa đơn điện tử cho hoạt động bán hàng hóa, cung cấp dịch vụ;","B":"Việc ủy nhiệm được thực hiện qua hợp đồng hoặc thỏa thuận dưới nhiều hình thức (lời nói, văn bản, thông điệp dữ liệu điện tử) giữa bên ủy nhiệm và bên nhận ủy nhiệm;","C":"Việc ủy nhiệm phải thông báo bằng văn bản cho cơ quan thuế.","D":"Tất cả các đáp án trên"},"t":"Hóa đơn"},{"n":352,"q":"Các cơ quan, đơn vị thuộc hệ thống cơ quan dự trữ nhà nước bán hàng dự trữ quốc gia theo quy định của pháp luật thì sử dụng:","c":{"A":"Hóa đơn điện tử bán tài sản công","B":"Hóa đơn điện tử bán hàng dự trữ quốc gia","C":"Hóa đơn giá trị gia tăng điện tử","D":"Hóa đơn bán hàng điện tử"},"t":"Tổng hợp"},{"n":353,"q":"Khi tổ chức được giao quản lý tài sản công thực hiện bán, chuyển nhượng các tài sản công theo đúng quy định của pháp luật về quản lý, sử dụng tài sản công thì:","c":{"A":"Đề nghị cơ quan thuế cấp hóa đơn điện tử có mã của cơ quan thuế theo từng lần phát sinh","B":"Đăng ký sử dụng hóa đơn điện tử bán tài sản công","C":"Liên hệ Sở Tài chính thực hiện mua hóa đơn bằng giấy do Bộ Tài chính đặt in","D":"Tổ chức không cần lập hóa đơn"},"t":"Tổng hợp"},{"n":354,"q":"“Theo dõi, kiểm tra hoạt động hủy hóa đơn, chứng từ theo quy định của Bộ Tài chính trong phạm vi được phân cấp quản lý thuế” là trách nhiệm của","c":{"A":"Cục Thuế","B":"Thuế cơ sở","C":"Thuế tỉnh/thành phố","D":"Tất cả các phương án trên"},"t":"Hóa đơn"},{"n":355,"q":"Trách nhiệm của Thuế tỉnh/thành phố trong việc quản lý, hóa đơn chứng từ điện tử là:","c":{"A":"Quản lý hoạt động tạo, phát hành hóa đơn, chứng từ của các tổ chức, cá nhân trên địa bàn","B":"Đặt in, phát hành các loại hóa đơn để bán cho các đối tượng theo quy định tại Nghị định 123/2020/NĐ-CP;","C":"Thanh tra, kiểm tra hoạt động tạo, phát hành và sử dụng hóa đơn, chứng từ trên địa bàn","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":356,"q":"Trách nhiệm của Cục Thuế trong việc quản lý, hóa đơn chứng từ điện tử là:","c":{"A":"Xây dựng cơ sở dữ liệu về hóa đơn điện tử, hóa đơn do cơ quan thuế đặt in, chứng từ điện tử để phục vụ công tác quản lý thuế, phục vụ công tác quản lý nhà nước của các cơ quan khác của nhà nước (công an, quản lý thị trường, bộ đội biên phòng, các cơ quan có liên quan), phục vụ nhu cầu xác minh, đối chiếu hóa đơn của các doanh nghiệp, tổ chức, cá nhân;","B":"Đặt in, phát hành các loại hóa đơn để bán cho các đối tượng theo quy định tại Nghị định 123/2020/NĐ-CP;","C":"Thanh tra, kiểm tra hoạt động tạo, phát hành và sử dụng hóa đơn, chứng từ","D":"Tất cả các phương án trên."},"t":"Tổng hợp"},{"n":357,"q":"Trách nhiệm của người mua hàng hóa, dịch vụ là","c":{"A":"Cung cấp thông tin trên hóa đơn cho các cơ quan có thẩm quyền khi được yêu cầu, trường hợp sử dụng hóa đơn do cơ quan thuế đặt in thì phải cung cấp hóa đơn bản gốc, trường hợp sử dụng hóa đơn điện tử thì thực hiện quy định về việc tra cứu, cung cấp, sử dụng thông tin hóa đơn điện tử;","B":"Sử dụng hóa đơn hợp pháp theo quy định pháp luật cho các hoạt động kinh doanh; để chứng minh quyền sử dụng, quyền sở hữu hàng hóa, dịch vụ; xổ số hoặc được bồi thường thiệt hại theo quy định của pháp luật; được dùng để hạch toán kế toán hoạt động mua hàng hóa, dịch vụ theo quy định của pháp luật về kế toán; kê khai các loại thuế; đăng ký quyền sử dụng, quyền sở hữu và để kê khai thanh toán vốn ngân sách nhà nước theo các quy định của pháp luật. Hóa đơn dùng cho mục đích này phải là hóa đơn có thông tin xác định được người mua;","C":"Ký các liên hóa đơn đã ghi đầy đủ nội dung trong trường hợp các bên có thỏa thuận về việc người mua ký trên hóa đơn","D":"Tất cả các phương án trên."},"t":"Tổng hợp"},{"n":358,"q":"Quyền của người mua hàng hóa, dịch vụ là","c":{"A":"Yêu cầu người bán lập và giao hóa đơn khi mua hàng hóa, dịch vụ","B":"Cung cấp chính xác thông tin cần thiết để người bán lập hóa đơn.","C":"Tra cứu, nhận file gốc hóa đơn điện tử của người bán.","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":359,"q":"Tổ chức, cá nhân bán hàng hóa, cung cấp dịch vụ có nghĩa vụ:","c":{"A":"Đăng ký sử dụng hóa đơn điện tử theo Điều 15 Nghị định số 123/2020/NĐ-CP nếu sử dụng hóa đơn điện tử và chuyển dữ liệu hóa đơn điện tử đến cơ quan thuế trong trường hợp sử dụng hóa đơn điện tử không có mã của cơ quan thuế theo quy định tại Điều 22 Nghị định số 123/2020/NĐ-CP","B":"Báo cáo việc sử dụng hóa đơn cho cơ quan thuế quản lý trực tiếp theo Mẫu số BC26/ HĐG Phụ lục IA ban hành kèm theo Nghị định 123/2020/NĐ-CP.","C":"A và B đều đúng","D":"A và B đều sai"},"t":"Tổng hợp"},{"n":360,"q":"Tổ chức, cá nhân bán hàng hóa, cung cấp dịch vụ có nghĩa vụ:","c":{"A":"Quản lý các hoạt động tạo hóa đơn theo quy định tại Nghị định số 123/2020/NĐ-CP;","B":"Đăng ký sử dụng hóa đơn điện tử theo Điều 15 Nghị định số 123/2020/NĐ-CP nếu sử dụng hóa đơn điện tử và chuyển dữ liệu hóa đơn điện tử đến cơ quan thuế trong trường hợp sử dụng hóa đơn điện tử không có mã của cơ quan thuế theo quy định tại Điều 22 Nghị định số 123/2020/NĐ-CP;","C":"Công khai cách thức tra cứu, nhận file gốc hóa đơn điện tử của người bán tới người mua hàng hóa, dịch vụ;","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":361,"q":"Tổ chức, cá nhân bán hàng hóa, cung cấp dịch vụ có nghĩa vụ:","c":{"A":"Lập và giao hóa đơn khi bán hàng hóa, cung cấp dịch vụ cho khách hàng","B":"","C":"Khiếu kiện các tổ chức, cá nhân có hành vi xâm phạm các quyền tạo, phát hành và sử dụng hóa đơn hợp pháp","D":"A và"},"t":"Tổng hợp"},{"n":362,"q":"Tổ chức, cá nhân bán hàng hóa, cung cấp dịch vụ có quyền:","c":{"A":"Tạo hóa đơn điện tử không có mã của cơ quan thuế để sử dụng nếu đáp ứng các yêu cầu theo quy định tại khoản 2 Điều 91 Luật Quản lý thuế số 38/2019/QH14","B":"Sử dụng hóa đơn điện tử có mã của cơ quan thuế nếu thuộc trường hợp và đối tượng quy định tại khoản 1, 3, 4 Điều 91 Luật Quản lý thuế số 38/2019/QH14","C":"Khiếu kiện các tổ chức, cá nhân có hành vi xâm phạm các quyền tạo, phát hành và sử dụng hóa đơn hợp pháp","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":363,"q":"Trách nhiệm của bên sử dụng thông tin hóa đơn điện tử là:","c":{"A":"Sử dụng thông tin hóa đơn điện tử đúng mục đích, phục vụ cho hoạt động nghiệp vụ theo chức năng, nhiệm vụ của bên sử dụng thông tin, đúng quy định của pháp luật về bảo vệ bí mật nhà nước.","B":"Sử dụng thông tin hóa đơn điện tử đúng mục đích, phục vụ cho hoạt động nghiệp vụ theo chức năng, nhiệm vụ của bên sử dụng thông tin, đúng quy định của pháp luật về bảo vệ bí mật nhà nước. Các thông tin thu thập từ cơ quan thuế, bên sử dụng thông tin không cung cấp thông tin cho bên thứ ba khi chưa có sự đồng ý của cơ quan thuế cung cấp thông tin hoặc tài khoản.","C":"Đảm bảo việc xây dựng, triển khai, vận hành hệ thống tiếp nhận thông tin hóa đơn điện tử.","D":"A và C"},"t":"Hóa đơn"},{"n":364,"q":"Quy định nào sau đây là đúng về trách nhiệm thông báo của Cục Thuế khi tạm ngừng cung cấp thông tin hóa đơn điện tử là:","c":{"A":"Tổng cục Thuế thực hiện thông báo với các bên sử dụng thông tin. Nội dung thông báo phải nêu rõ khoảng thời gian dự kiến phục hồi các hoạt động cung cấp thông tin.","B":"Tổng cục Thuế thực hiện thông báo trên Cổng thông tin điện tử của Tổng cục Thuế về hóa đơn điện tử với các bên sử dụng thông tin. Nội dung thông báo phải nêu rõ khoảng thời gian dự kiến phục hồi các hoạt động cung cấp thông tin","C":"Tổng cục Thuế thực hiện thông báo với các bên sử dụng thông tin trên Cổng thông tin điện tử của Tổng cục Thuế về hóa đơn điện tử, tin nhắn hoặc thư điện tử. Nội dung thông báo phải nêu rõ khoảng thời gian dự kiến phục hồi các hoạt động cung cấp thông tin.","D":"Tổng cục Thuế thực hiện thông báo trên Cổng thông tin điện tử của Tổng cục Thuế về hóa đơn điện tử với các bên sử dụng thông tin."},"t":"Hóa đơn"},{"n":365,"q":"Trước thời điểm chính thức chấm dứt sử dụng các hình thức cung cấp, sử dụng thông tin hóa đơn điện tử của bên sử dụng thông tin (trừ trường hợp đầu mối đăng ký của bên sử dụng thông tin có đề nghị bằng văn bản), Cục Thuế, Thuế tỉnh/ thành phố thông báo bằng hình thức điện tử cho bên sử dụng thông tin về việc chấm dứt sử dụng các hình thức cung cấp, sử dụng thông tin hóa đơn điện tử, chứng từ điện tử trong thời hạn bao lâu:","c":{"A":"Chậm nhất là 02 ngày làm việc","B":"Chậm nhất là 03 ngày làm việc","C":"Chậm nhất là 05 ngày làm việc","D":"Chậm nhất là 10 ngày làm việc"},"t":"Hóa đơn"},{"n":366,"q":"Cục Thuế, Thuế tỉnh/ thành phố thực hiện việc thu hồi tài khoản truy cập Cổng thông tin điện tử trong các trường hợp sau:","c":{"A":"Khi có đề nghị từ đầu mối đăng ký của bên sử dụng thông tin","B":"Phát hiện trường hợp sử dụng thông tin hóa đơn điện tử không đúng mục đích, phục vụ cho hoạt động nghiệp vụ theo chức năng, nhiệm vụ của bên sử dụng thông tin, không đúng quy định của pháp luật về bảo vệ bí mật nhà nước","C":"Thời hạn sử dụng đã hết","D":"Cả 3 phương án trên"},"t":"Tổng hợp"},{"n":367,"q":"Cơ quan thuế cung cấp thông tin hóa đơn điện tử dưới dạng:","c":{"A":"Văn bản điện tử và dữ liệu điện tử","B":"Văn bản và dữ liệu điện tử","C":"Tin nhắn","D":"A và C"},"t":"Hóa đơn"},{"n":368,"q":"Việc đăng ký sử dụng thông tin hóa đơn điện tử trên Cổng thông tin điện tử đối với cơ quan quản lý nhà nước, các tổ chức tín dụng, tổ chức cung cấp dịch vụ hóa đơn điện tử được quy định như sau:","c":{"A":"Các cơ quan quản lý nhà nước, các tổ chức tín dụng, tổ chức cung cấp dịch vụ hóa đơn điện tử có trách nhiệm phân công đầu mối đăng ký sử dụng thông tin hóa đơn điện tử (sau đây gọi tắt là đầu mối đăng ký) và thông báo cho Cục Thuế bằng văn bản. Cục Thuế, Thuế thành phố thực hiện cấp tài khoản khai thác sử dụng thông tin hóa đơn điện tử cho người sử dụng của cơ quan, tổ chức quản lý đồng cấp theo văn bản giữa các bên.","B":"Các cơ quan quản lý nhà nước, các tổ chức tín dụng, tổ chức cung cấp dịch vụ hóa đơn điện tử có trách nhiệm phân công đầu mối đăng ký sử dụng thông tin hóa đơn điện tử (sau đây gọi tắt là đầu mối đăng ký) và thông báo cho Cục Thuế bằng văn bản. Cục Thuế, Thuế thành phố thực hiện cấp số lượng tài khoản khai thác sử dụng thông tin hóa đơn điện tử cho người sử dụng của cơ quan, tổ chức quản lý đồng cấp theo đề nghị trong văn bản giữa các bên.","C":"Các cơ quan quản lý nhà nước, các tổ chức tín dụng, tổ chức cung cấp dịch vụ hóa đơn điện tử có trách nhiệm phân công đầu mối đăng ký sử dụng thông tin hóa đơn điện tử (sau đây gọi tắt là đầu mối đăng ký) và thông báo cho Cục Thuế bằng văn bản. Cục Thuế, Thuế thành phố thực hiện cấp tối đa 02 tài khoản khai thác sử dụng thông tin hóa đơn điện tử cho người sử dụng của cơ quan, tổ chức quản lý đồng cấp theo văn bản giữa các bên.","D":"Các cơ quan quản lý nhà nước, các tổ chức tín dụng, tổ chức cung cấp dịch vụ hóa đơn điện tử có trách nhiệm phân công đầu mối đăng ký sử dụng thông tin hóa đơn điện tử (sau đây gọi tắt là đầu mối đăng ký) và thông báo cho Cục Thuế bằng văn bản. Cục Thuế, Thuế thành phố thực hiện cấp 01 tài khoản khai thác sử dụng thông tin hóa đơn điện tử cho người sử dụng của cơ quan, tổ chức quản lý đồng cấp theo văn bản giữa các bên."},"t":"Hóa đơn"},{"n":369,"q":"“Xây dựng cơ sở dữ liệu về chứng từ điện tử để phục vụ công tác quản lý thuế, phục vụ công tác quản lý nhà nước của các cơ quan khác của nhà nước” là trách nhiệm của","c":{"A":"Cục Hải quan","B":"Chi cục Hải quan khu vực","C":"Thuế tỉnh/thành phố","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":370,"q":"Các hình thức khai thác, sử dụng thông tin hóa đơn điện tử trên Cổng thông tin điện tử bao gồm:","c":{"A":"Người bán và người mua hàng hóa, dịch vụ khai thác thông tin từ hóa đơn điện tử theo các nội dung thông tin từ Cổng thông tin điện tử của Tổng cục Thuế.","B":"Các cơ quan quản lý nhà nước, các tổ chức tín dụng, tổ chức cung cấp dịch vụ hóa đơn điện tử: tra cứu, sử dụng thông tin hóa đơn điện tử, chứng từ điện tử theo phạm vi, thời gian, trách nhiệm và quyền truy cập Cổng thông tin điện tử về hóa đơn điện tử được quy định cụ thể tại văn bản thống nhất giữa hai bên.","C":"A và B đều sai","D":"A và B đều đúng"},"t":"Hóa đơn"},{"n":371,"q":"Các bên sử dụng thông tin hóa đơn điện tử bao gồm","c":{"A":"Các tổ chức cung cấp dịch vụ hóa đơn điện tử","B":"Các doanh nghiệp, tổ chức kinh tế, hộ kinh doanh, cá nhân kinh doanh là người bán hàng hóa, cung cấp dịch vụ, các tổ chức, cá nhân là người mua hàng hóa, dịch vụ;","C":"Các tổ chức tín dụng sử dụng thông tin hóa đơn điện tử để thực hiện các thủ tục về thuế, thủ tục thanh toán qua ngân hàng.","D":"Tất cả các đáp án trên"},"t":"Hóa đơn"},{"n":372,"q":"Việc tra cứu, cung cấp thông tin hóa đơn điện tử phải đảm bảo nguyên tắc:","c":{"A":"Đầy đủ","B":"Chính xác, kịp thời","C":"Đúng đối tượng","D":"Tất cả các ý trên"},"t":"Hóa đơn"},{"n":373,"q":"Việc xây dựng, quản lý, khai thác sử dụng, cập nhật cơ sở dữ liệu về hóa đơn, chứng từ phải đảm bảo nguyên tắc:","c":{"A":"Chính xác, kịp thời","B":"Khoa học","C":"Khách quan","D":"Tất cả các ý trên"},"t":"Tổng hợp"},{"n":374,"q":"Cơ sở dữ liệu hóa đơn, chứng từ phải bảo đảm nguyên tắc:","c":{"A":"Phục vụ kịp thời cho công tác quản lý thuế, quản lý khác của nhà nước","B":"Đáp ứng yêu cầu phát triển kinh tế - xã hội","C":"Bảo đảm tính an toàn, bảo mật và an ninh quốc gia","D":"Tất cả các ý trên"},"t":"Tổng hợp"},{"n":375,"q":"Đối tượng chịu trách nhiệm về tính chính xác của việc mất, cháy, hỏng biên lai.","c":{"A":"Tổ chức thu phí, lệ phí","B":"Người nộp phí, lệ phí","C":"Người nộp thuế","D":"Tất cả các ý trên"},"t":"Tổng hợp"},{"n":376,"q":"Đối với các số biên lai đã thực hiện thông báo phát hành nhưng chưa sử dụng hết có in sẵn tên, địa chỉ, khi có sự thay đổi tên, địa chỉ nhưng không thay đổi mã số thuế và cơ quan thuế quản lý trực tiếp, nếu tổ chức thu phí, lệ phí vẫn có nhu cầu sử dụng biên lai đã đặt in thì thực hiện đóng dấu tên, địa chỉ mới vào đâu để tiếp tục sử dụng","c":{"A":"Bên cạnh tiêu thức tên, địa chỉ đã in sẵn","B":"Góc trên cùng, bên phải biên lai","C":"Góc trên cùng, bên trái biên lai","D":"Bên dưới tiêu thức tên, địa chỉ đã in sẵn"},"t":"Quản lý thuế / Hoàn thuế"},{"n":377,"q":"Nếu không có sự thay đổi về nội dung và hình thức biên lai đã thông báo phát hành với cơ quan thuế, tổ chức thu thuế, phí, lệ phí khi phát hành biên lai từ lúc nào thì không phải gửi kèm biên lai mẫu?","c":{"A":"Từ lần thứ ba trở đi","B":"Từ lần thứ hai trở đi","C":"Từ lần thứ tư trở đi","D":"Từ lần thứ năm trở đi"},"t":"Tổng hợp"},{"n":378,"q":"Trường hợp cơ quan thuế phát hiện Thông báo phát hành biên lai do tổ chức thu thuế, phí, lệ phí gửi đến không đảm bảo đủ nội dung theo đúng quy định thì trong thời hạn bao lâu kể từ ngày nhận được Thông báo, cơ quan thuế phải có văn bản thông báo cho tổ chức thu thuế, phí, lệ phí biết?","c":{"A":"05 ngày làm việc","B":"03 ngày làm việc","C":"10 ngày làm việc","D":"01 ngày làm việc"},"t":"Tổng hợp"},{"n":379,"q":"Biên lai do cơ quan quản lý thuế đặt in trước khi bán hoặc cấp lần đầu phải lập thông báo phát hành biên lai. Thời hạn gởi thông báo phát hành biên lai được gửi đến tất cả các cơ quan thuế hoặc cơ quan Hải quan trong cả nước là:","c":{"A":"05 ngày làm việc","B":"30 ngày làm việc","C":"10 ngày làm việc","D":"01 ngày làm việc"},"t":"Thuế nhà thầu / XNK"},{"n":380,"q":"Thời điểm lập biên lai là khi nào?","c":{"A":"Khi nộp tờ khai phí, lệ phí","B":"Khi hoàn thành việc cung cấp dịch vụ","C":"Tại thời điểm thu thuế, phí, lệ phí,","D":"Khi cơ quan thuế yêu cầu"},"t":"Tổng hợp"},{"n":381,"q":"Thời điểm ký số trên chứng từ điện tử được xác định là:","c":{"A":"Thời điểm gửi chứng từ cho cơ quan thuế","B":"Thời điểm người nộp thuế nhận chứng từ","C":"Thời điểm sử dụng chữ ký số để ký trên chứng từ điện tử","D":"Thời điểm lập tờ khai thuế"},"t":"Tổng hợp"},{"n":382,"q":"Số biên lai được thể hiện trên biên lai thu thuế, phí, lệ phí bằng","c":{"A":"Chữ số La Mã","B":"Chữ số Ả-rập, tối đa 7 chữ số","C":"Chữ số tự nhiên, không giới hạn","D":"Ký tự chữ và số"},"t":"Tổng hợp"},{"n":383,"q":"Biên lai được thể hiện bằng ngôn ngữ nào?","c":{"A":"Tiếng Anh","B":"So 37,"q":"Khi hệ thống cấp mã của cơ quan thuế gặp sự cố, Tổng cục Thuế có thể:","c":{"A":"Ngừng cấp mã hoàn toàn","B":"Bán hóa đơn giấy tạm thời","C":"Chuyển sang cấp mã thủ công","D":"Yêu cầu doanh nghiệp chờ"},"t":"Tổng hợp"},{"n":438,"q":"Hóa đơn điện tử có mã của cơ quan thuế phải được:","c":{"A":"Gửi người mua trước khi ký số","B":"Ký số và gửi cơ quan thuế để cấp mã","C":"In ra giấy trước khi gửi","D":"Nộp trực tiếp tại cơ quan thuế"},"t":"Hóa đơn"},{"n":439,"q":"Doanh nghiệp được tiếp tục sử dụng hóa đơn điện tử khi:","c":{"A":"Có yêu cầu của khách hàng","B":"Được cơ quan thuế khôi phục mã số thuế","C":"Có đơn xin tiếp tục sử dụng","D":"Có xác nhận của kế toán"},"t":"Hóa đơn"},{"n":440,"q":"Trường hợp người nộp thuế không giải trình theo thông báo thì cơ quan thuế sẽ:","c":{"A":"Phạt tiền ngay","B":"Chuyển hồ sơ sang công an","C":"Ra thông báo ngừng sử dụng hóa đơn điện tử","D":"Thu hồi giấy phép kinh doanh"},"t":"Tổng hợp"},{"n":441,"q":"Doanh nghiệp bị cưỡng chế nợ thuế bằng biện pháp ngừng sử dụng hóa đơn. Trong thời gian này doanh nghiệp:","c":{"A":"Vẫn được lập hóa đơn nếu có hợp đồng","B":"Được lập hóa đơn không mã","C":"Không được sử dụng hóa đơn","D":"Chỉ cần xin phép cơ quan thuế"},"t":"Hóa đơn"},{"n":442,"q":"Doanh nghiệp lập hóa đơn điều chỉnh nhưng không ghi dòng dẫn chiếu đến hóa đơn sai sót. Hóa đơn điều chỉnh:","c":{"A":"Hợp lệ","B":"Không đúng quy định","C":"Chỉ sai hình thức","D":"Không ảnh hưởng"},"t":"Hóa đơn"},{"n":443,"q":"Hóa đơn đã gửi cho người mua, sai thuế suất. Doanh nghiệp phải:","c":{"A":"Lập hóa đơn điều chỉnh","B":"Hủy","C":"Không xử lý","D":"Lập lại không dẫn chiếu"},"t":"Tổng hợp"},{"n":444,"q":"Doanh nghiệp B mất hóa đơn đã mua của cơ quan thuế ngày 01/3, đến ngày 08/3 mới báo cơ quan thuế. Việc này:","c":{"A":"Đúng thời hạn","B":"Chậm thời hạn","C":"Không cần báo","D":"Chỉ cần báo nội bộ"},"t":"Tổng hợp"},{"n":445,"q":"Khi chuyển địa điểm kinh doanh sang cơ quan thuế khác quản lý, người nộp thuế phải:","c":{"A":"Tiếp tục dùng hóa đơn","B":"Hủy toàn bộ","C":"Báo cáo tình hình sử dụng và bảng kê hóa đơn sử dụng trong kỳ với cơ quan thuế nơi chuyển đi","D":"Bán lại hóa đơn"},"t":"Tổng hợp"},{"n":446,"q":"Chứng từ trong lĩnh vực quản lý thuế, phí, lệ phí của cơ quan thuế bao gồm loại nào sau đây?","c":{"A":"Phiếu thu nội bộ","B":"Hóa đơn bán lẻ","C":"Chứng từ khấu trừ thuế thu nhập cá nhân và biên lai thu thuế, phí, lệ phí","D":"Hợp đồng kinh tế"},"t":"Tổng hợp"},{"n":447,"q":"Khi lập hóa đơn điều chỉnh đối với hóa đơn giấy đã giao và đã kê khai thuế, hóa đơn điều chỉnh có được ghi số âm (-) không?","c":{"A":"Được ghi số âm","B":"Không được ghi số âm","C":"Chỉ được ghi âm phần thuế","D":"Chỉ được ghi âm phần số lượng"},"t":"Hóa đơn"},{"n":448,"q":"Doanh nghiệp mua hóa đơn của cơ quan thuế phải nộp báo cáo tình hình sử dụng hóa đơn theo quý chậm nhất vào thời điểm nào?","c":{"A":"Ngày cuối cùng của quý","B":"Ngày 20 của tháng đầu quý sau","C":"Ngày cuối cùng của tháng đầu của quý tiếp theo","D":"Trong vòng 15 ngày kể từ khi kết thúc quý"},"t":"Hóa đơn"},{"n":449,"q":"Hóa đơn điện tử điều chỉnh phải có dòng chữ nào?","c":{"A":"“Hủy hóa đơn...”","B":"“Điều chỉnh cho hóa đơn Mẫu số... ký hiệu... số... ngày... tháng... năm”","C":"“Lập lại hóa đơn...”","D":"“Bổ sung thông tin...”"},"t":"Hóa đơn"},{"n":450,"q":"Doanh nghiệp được sử dụng hóa đơn điện tử không có mã của cơ quan thuế khi nào?","c":{"A":"Khi tự đăng ký sử dụng phần mềm hóa đơn","B":"Sau khi có thông báo chấp nhận của cơ quan thuế","C":"Khi có nhu cầu sử dụng","D":"Sau khi ký hợp đồng với khách hàng"},"t":"Hóa đơn"},{"n":451,"q":"Hệ thống nào thực hiện việc cấp mã hóa đơn điện tử và gửi trả kết quả cho người gửi?","c":{"A":"Cục Thuế tỉnh","B":"Chi cục Thuế","C":"Hệ thống cấp mã hóa đơn của Tổng cục Thuế","D":"Tổ chức cung cấp dịch vụ hóa đơn điện tử"},"t":"Hóa đơn"},{"n":452,"q":"Đối với xuất khẩu hàng hóa (bao gồm cả gia công xuất khẩu), thời điểm lập hóa đơn thương mại điện tử, hóa đơn GTGT điện tử hoặc hóa đơn bán hàng điện tử được xác định như thế nào?","c":{"A":"Ngày ký hợp đồng xuất khẩu","B":"Ngày hàng hóa được xuất khỏi kho","C":"Do người bán tự xác định nhưng chậm nhất không quá ngày làm việc tiếp theo kể từ ngày hàng hóa được thông quan","D":"Ngày bên mua thanh toán tiền hàng"},"t":"Thuế GTGT"},{"n":453,"q":"Thời điểm lập hóa đơn đối với trường hợp tổ chức kinh doanh mua dịch vụ vận tải hàng không xuất qua website và hệ thống thương mại điện tử được thực hiện như thế nào?","c":{"A":"Lập ngay tại thời điểm khách hàng thanh toán dịch vụ.","B":"Lập chậm nhất không quá 03 ngày kể từ ngày chứng từ dịch vụ vận tải hàng không được xuất trên hệ thống.","C":"Lập chậm nhất không quá 05 ngày kế tiếp kể từ ngày chứng từ dich vụ vận tải hàng không xuất ra trên hệ thống website và hệ thống thương mại điện tử.","D":"Lập trong vòng 10 ngày kể từ ngày hoàn thành chuyến bay."},"t":"Hóa đơn"},{"n":454,"q":"Đối với bán khí thiên nhiên, khí đồng hành, khí than chuyển bằng đường ống, thời điểm lập hóa đơn được xác định:","c":{"A":"Khi thu được tiền bán khí","B":"Khi ký hợp đồng mua bán khí","C":"Khi bên mua và bên bán xác định khối lượng khí giao của tháng, nhưng chậm nhất là ngày cuối cùng của thời hạn kê khai, nộp thuế","D":"Ngày đầu tiên của tháng kế tiếp"},"t":"Hóa đơn"},{"n":455,"q":"Thời điểm lập hóa đơn đối với bán dầu thô, condensate và sản phẩm chế biến từ dầu thô là:","c":{"A":"Thời điểm giao hàng thực tế","B":"Thời điểm thu được tiền bán hàng","C":"Thời điểm bên mua và bên bán xác định được giá bán chính thức","D":"Cuối tháng phát sinh sản lượng"},"t":"Hóa đơn"},{"n":456,"q":"Thời điểm lập hóa đơn đối với hoạt động cho vay của tổ chức tín dụng được xác định như thế nào?","c":{"A":"Thời điểm ký hợp đồng tín dụng","B":"Thời điểm giải ngân khoản vay","C":"Theo kỳ hạn thu lãi ghi trong hợp đồng tín dụng; trường hợp không thu được lãi và theo dõi ngoại bảng thì là thời điểm thu được lãi","D":"Cuối năm tài chính của tổ chức tín dụng"},"t":"Hóa đơn"},{"n":457,"q":"Thời điểm lập hóa đơn GTGT chung đối với cung cấp dịch vụ viễn thông (bao gồm cả dịch vụ viễn thông giá trị gia tăng) thông qua bán thẻ trả trước khi khách hàng không lấy hóa đơn là:","c":{"A":"Ngay khi bán thẻ","B":"Cuối mỗi ngày hoặc định kỳ trong tháng","C":"Cuối năm tài chính","D":"Khi cơ quan thuế yêu cầu"},"t":"Thuế GTGT"},{"n":458,"q":"Thời điểm lập hóa đơn đối với dịch vụ viễn thông, CNTT chậm nhất là:","c":{"A":"Không quá 1 tháng kể từ tháng phát sinh cước","B":"Không quá 2 tháng kể từ tháng phát sinh cước","C":"Không quá 3 tháng kể từ tháng phát sinh cước","D":"Theo thỏa thuận giữa các bên"},"t":"Hóa đơn"},{"n":459,"q":"Đối với dịch vụ viễn thông và dịch vụ công nghệ thông tin phải đối soát dữ liệu kết nối, thời điểm lập hóa đơn là:","c":{"A":"Thời điểm phát sinh cước dịch vụ","B":"Thời điểm khách hàng thanh toán","C":"Thời điểm hoàn thành việc đối soát dữ liệu theo hợp đồng","D":"Cuối tháng phát sinh cước"},"t":"Hóa đơn"},{"n":460,"q":"Trường hợp khách hàng không cung cấp tên, địa chỉ, mã số thuế, cơ sở kinh doanh dịch vụ viễn thông được phép:","c":{"A":"Không lập hóa đơn","B":"Lập hóa đơn GTGT chung","C":"Lập hóa đơn bán hàng thay thế","D":"Ghi thông tin người mua giả định"},"t":"Quản lý thuế / Hoàn thuế"},{"n":461,"q":"Hóa đơn GTGT lập chung trong trường hợp cung cấp dịch vụ viễn thông (bao gồm cả dịch vụ viễn thông giá trị gia tăng) thông qua bán thẻ trả trước áp dụng cho:","c":{"A":"Khách hàng là doanh nghiệp","B":"Khách hàng yêu cầu xuất hóa đơn","C":"Người mua không lấy hóa đơn hoặc không cung cấp thông tin","D":"Tất cả khách hàng"},"t":"Thuế GTGT"},{"n":462,"q":"Khi tên, địa chỉ người mua quá dài, người bán được phép:","c":{"A":"Lược bỏ bớt thông tin","B":"Viết tắt một số danh từ thông dụng nhưng phải đảm bảo đầy đủ số nhà, tên đường phố, phường, xã, quận, huyện, thành phố, xác định được chính xác tên, địa chỉ doanh nghiệp và phù hợp với đăng ký kinh doanh, đăng ký thuế của doanh nghiệp.","C":"Chỉ ghi tên doanh nghiệp","D":"Không cần ghi địa chỉ"},"t":"Tổng hợp"},{"n":463,"q":"Đối với hóa đơn điện tử bán xăng dầu cho khách hàng là cá nhân không kinh doanh, nội dung nào sau đây không bắt buộc phải có?","c":{"A":"Tên hàng hóa","B":"Tên, địa chỉ, mã số thuế của người mua, chữ ký số của người mua.","C":"Thuế suất thuế giá trị gia tăng","D":"Thời điểm lập hóa đơn"},"t":"Hóa đơn"},{"n":464,"q":"Trường hợp nào sau đây không phải lập hóa đơn theo quy định","c":{"A":"Bán đấu giá tài sản của tổ chức không nộp thuế GTGT theo phương pháp khấu trừ","B":"Điều chuyển tài sản giữa công ty mẹ và đơn vị hạch toán phụ thuộc","C":"Thanh lý tài sản khi doanh nghiệp ngừng hoạt động nhưng chưa chấm dứt mã số thuế","D":"Hộ kinh doanh tạm ngừng kinh doanh nhưng thực hiện hợp đồng đã ký trước đó"},"t":"Hóa đơn"},{"n":465,"q":"Hộ kinh doanh không có địa điểm kinh doanh cố định khi đề nghị cấp hóa đơn điện tử có mã theo từng lần phát sinh thì nộp hồ sơ tại đâu?","c":{"A":"Chi cục Thuế nơi phát sinh doanh thu","B":"Chi cục Thuế nơi khách hàng cư trú","C":"Chi cục Thuế nơi cá nhân cư trú hoặc nơi đăng ký kinh doanh","D":"Tổng cục Thuế"},"t":"Hóa đơn"},{"n":466,"q":"Doanh nghiệp nộp thuế GTGT theo phương pháp trực tiếp, đang bị cơ quan thuế cưỡng chế bằng biện pháp ngừng sử dụng hóa đơn, khi phát sinh bán hàng thì:","c":{"A":"Không được lập hóa đơn dưới bất kỳ hình thức nào","B":"Được tự lập hóa đơn điện tử không có mã","C":"Được đề nghị cơ quan thuế cấp hóa đơn điện tử có mã theo từng lần phát sinh","D":"Chỉ được lập hóa đơn giấy"},"t":"Thuế GTGT"},{"n":467,"q":"Cấp hóa đơn điện tử có mã của cơ quan thuế theo từng lần phát sinh là hóa đơn bán hàng trong các trường hợp:","c":{"A":"Doanh nghiệp sau khi đã giải thể, phá sản, đã chấm dứt hiệu lực mã số thuế có phát sinh thanh lý tài sản cần có hóa đơn để giao cho người mua;","B":"Doanh nghiệp, tổ chức kinh tế, hộ kinh doanh, cá nhân kinh doanh thuộc diện nộp thuế giá trị gia tăng theo phương pháp trực tiếp thuộc các trường hợp sau:","C":"Ngừng hoạt động kinh doanh nhưng chưa hoàn thành thủ tục chấm dứt hiệu lực mã số thuế có phát sinh thanh lý tài sản, hàng hóa cần có hóa đơn để giao cho người mua;","D":"Cả 3 câu trên đều đúng"},"t":"Hóa đơn"},{"n":468,"q":"Trường hợp sử dụng hóa đơn điện tử có mã của cơ quan thuế không phải trả tiền dịch vụ trong thời gian 12 tháng kể từ khi bắt đầu sử dụng hóa đơn điện tử gồm:","c":{"A":"Doanh nghiệp nhỏ và vừa","B":"Hợp tác xã","C":"Hộ kinh doanh, cá nhân kinh doanh","D":"Doanh nghiệp nhỏ và vừa, hợp tác xã, hộ kinh doanh, cá nhân kinh doanh tại địa bàn có điều kiện kinh tế - xã hội khó khăn, địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn."},"t":"Hóa đơn"},{"n":469,"q":"Đối tượng áp dụng của Nghị định 123/2020/NĐ-CP?","c":{"A":"Tổ chức có trách nhiệm khấu trừ thuế thu nhập cá nhân","B":"Nhà cung cấp ở nước ngoài không có cơ sở thường trú tại Việt Nam có hoạt động kinh doanh thương mại điện tử, kinh doanh dựa trên nền tảng số và các dịch vụ khác đăng ký tự nguyện sử dụng hóa đơn điện tử theo quy định tại Nghị định này.","C":"Cơ quan thuế, Cơ quan hải quan","D":"Tất cả các đối tượng trên"},"t":"Hóa đơn"},{"n":470,"q":"Hóa đơn điện tử khởi tạo từ máy tính tiền có các nội dung:","c":{"A":"Tên, địa chỉ, mã số thuế người bán;","B":"Thời điểm lập hóa đơn","C":"Mã của cơ quan thuế hoặc dữ liệu điện tử để người mua có thể truy xuất, kê khai thông tin hóa đơn điện tử khởi tạo từ máy tính tiền;","D":"Cả 3 nội dung trên đều đúng;"},"t":"Hóa đơn"},{"n":471,"q":"Đâu không phải là nguyên tắc của Hóa đơn điện tử khởi tạo từ máy tính tiền kết nối chuyển dữ liệu điện tử với cơ quan thuế phải đảm bảo:","c":{"A":"Nhận biết được hóa đơn in từ máy tính tiền kết nối chuyển dữ liệu điện tử với cơ quan thuế;","B":"Có đầy đủ thông tin của người mua (họ tên, mã số thuế, địa chỉ)","C":"Không bắt buộc có chữ ký số;","D":"Khoản chi mua hàng hóa, dịch vụ sử dụng hóa đơn (hoặc sao chụp hóa đơn hoặc tra thông tin từ Cổng thông tin Tên, địa chỉ, mã số thuế người bán được xác định là khoản chi có đủ hóa đơn, chứng từ hợp pháp khi xác định nghĩa vụ thuế."},"t":"Hóa đơn"},{"n":472,"q":"Doanh nghiệp hoạt động lĩnh vực nào dưới đây phải sử dụng hóa đơn điện tử khởi tạo từ máy tính tiền?","c":{"A":"Doanh nghiệp xây dựng","B":"Doanh nghiệp phần mềm","C":"Doanh nghiệp kinh doanh nhà hàng, khách sạn","D":"Doanh nghiệp tư vấn tài chính"},"t":"Hóa đơn"},{"n":473,"q":"Đối tượng nào sau đây bắt buộc sử dụng hóa đơn điện tử khởi tạo từ máy tính tiền?","c":{"A":"Hộ kinh doanh có doanh thu dưới 500 triệu đồng/năm","B":"Cá nhân kinh doanh bán hàng online","C":"Hộ kinh doanh có doanh thu từ 1 tỷ đồng/năm trở lên","D":"Doanh nghiệp xuất khẩu hàng hóa"},"t":"Hóa đơn"},{"n":474,"q":"Đối với hoạt động xây dựng, lắp đặt, thời điểm lập hóa đơn là:","c":{"A":"Khi ký hợp đồng xây dựng","B":"Khi thu tiền theo tiến độ","C":"Khi nghiệm thu, bàn giao khối lượng hoàn thành","D":"Khi quyết toán công trình"},"t":"Hóa đơn"},{"n":475,"q":"Khi giao hàng nhiều lần hoặc bàn giao từng hạng mục, công đoạn dịch vụ thì việc lập hóa đơn được thực hiện như thế nào?","c":{"A":"Lập một hóa đơn khi kết thúc hợp đồng","B":"Lập hóa đơn theo từng lần giao hàng hoặc bàn giao","C":"Lập hóa đơn cuối tháng","D":"Chỉ lập hóa đơn khi thu đủ tiền"},"t":"Hóa đơn"},{"n":476,"q":"Trường hợp người cung cấp dịch vụ thu tiền trước hoặc trong khi cung cấp dịch vụ thì thời điểm lập hóa đơn là:","c":{"A":"Khi hoàn thành dịch vụ","B":"Khi thu tiền","C":"Khi ký hợp đồng","D":"Khi quyết toán"},"t":"Hóa đơn"},{"n":477,"q":"Thời điểm lập hóa đơn đối với bán hàng hóa là thời điểm nào sau đây?","c":{"A":"Ngay sau khi ký hợp đồng","B":"Sau khi xuất kho","C":"Thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho người mua, không phân biệt đã thu được tiền hay chưa thu được tiền.","D":"Khi thu đủ tiền của khách hàng"},"t":"Hóa đơn"},{"n":478,"q":"Thời điểm lập hóa đơn đối với cung cấp dịch vụ là:","c":{"A":"Khi ký hợp đồng","B":"Khi xuất hóa đơn định kỳ cuối tháng","C":"Khi hoàn thành việc cung cấp dịch vụ","D":"Khi quyết toán hợp đồng"},"t":"Hóa đơn"},{"n":479,"q":"Loại chứng từ nào sau đây được in, phát hành, sử dụng và quản lý như hóa đơn theo Nghị định 123/2020/NĐ-CP:","c":{"A":"Phiếu thu tiền mặt","B":"Phiếu chi","C":"Phiếu xuất kho kiêm vận chuyển nội bộ","D":"Giấy báo có ngân hàng"},"t":"Hóa đơn"},{"n":480,"q":"Hóa đơn điện tử bán hàng dự trữ quốc gia được sử dụng trong trường hợp nào?","c":{"A":"Khi doanh nghiệp bán hàng tồn kho","B":"Khi cơ quan, đơn vị thuộc hệ thống dự trữ nhà nước bán hàng dự trữ quốc gia","C":"Khi xuất khẩu hàng hóa","D":"Khi bán tài sản công"},"t":"Hóa đơn"},{"n":481,"q":"Tổ chức, cá nhân trong khu phi thuế quan khi bán hàng hóa, cung cấp dịch vụ vào nội địa và khi bán hàng hóa, cung cấp dịch vụ giữa các tổ chức, cá nhân trong khu phi thuế quan với nhau, xuất khẩu hàng hóa, cung cấp dịch vụ ra nước ngoài, trên hóa đơn phải ghi rõ nội dung nào sau đây?","c":{"A":"“Không chịu thuế GTGT”","B":"“Hàng xuất khẩu”","C":"“Dành cho tổ chức, cá nhân trong khu phi thuế quan”","D":"“Bán hàng nội địa”"},"t":"Tổng hợp"},{"n":482,"q":"Hóa đơn bán hàng được sử dụng cho trường hợp nào sau đây?","c":{"A":"Doanh nghiệp khai thuế GTGT theo phương pháp khấu trừ","B":"Tổ chức, cá nhân khai, tính thuế GTGT theo phương pháp trực tiếp","C":"Chỉ áp dụng cho khu phi thuế quan","D":"Chỉ áp dụng cho xuất khẩu"},"t":"Tổng hợp"},{"n":483,"q":"Hóa đơn giấy được chuyển đổi từ hóa đơn điện tử không có hiệu lực để:","c":{"A":"Lưu trữ kế toán","B":"Theo dõi sổ sách","C":"Giao dịch, thanh toán","D":"Kiểm tra nội bộ"},"t":"Hóa đơn"},{"n":484,"q":"Hóa đơn điện tử sau khi chuyển đổi thành hóa đơn giấy thông thường có giá trị pháp lý nào?","c":{"A":"Giá trị thanh toán","B":"Giá trị giao dịch","C":"Giá trị lưu giữ để ghi sổ, theo dõi","D":"Giá trị khấu trừ thuế"},"t":"Hóa đơn"},{"n":485,"q":"Cơ quan nào sau đây có quyền yêu cầu chuyển đổi hóa đơn điện tử thành hóa đơn giấy?","c":{"A":"Ngân hàng","B":"UBND cấp xã","C":"Cơ quan quản lý thuế, cơ quan kiểm toán, thanh tra, kiểm tra, điều tra","D":"Phòng công chứng"},"t":"Hóa đơn"},{"n":486,"q":"Hóa đơn điện tử, chứng từ điện tử .","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":499,"q":"Cơ quan thuế thực hiện cấp tối đa 02 tài khoản khai thác sử dụng thông tin hóa đơn điện tử cho người sử dụng của cơ quan, tổ chức quản lý đồng cấp theo văn bản giữa các bên.","c":{"A":"Đúng","B":"Sai 501","C":"","D":""},"t":"Hóa đơn"},{"n":500,"q":"Quy định về thẩm quyền cung cấp thông tin hóa đơn điện tử sau đây đúng hay sai: “Cục Thuế là đơn vị chịu trách nhiệm cung cấp thông tin hóa đơn điện tử đối với tất cả đề nghị của các cơ quan, tổ chức quản lý nhà nước”","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":501,"q":"Tổ chức, cá nhân khấu trừ thuế sau khi lập chứng từ khấu trừ thuế thu nhập cá nhân điện tử gửi cho người bị khấu trừ thuế và đồng thời gửi cho cơ quan thuế chậm nhất là 01 ngày làm việc kể từ ngày lập chứng từ","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNCN"},{"n":502,"q":"Tại thời điểm khấu trừ thuế thu nhập cá nhân, tổ chức khấu trừ thuế thu nhập cá nhân phải lập biên lai để giao cho người có thu nhập bị khấu trừ thuế","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNCN"},{"n":503,"q":"Đối với ngành hàng không, hóa đơn đổi, hoàn chứng từ vận chuyển được coi là hóa đơn điều chỉnh và không cần ghi dòng chữ “Điều chỉnh cho hóa đơn...”.","c":{"A":"","B":"","C":"","D":""},"t":"Tổng hợp"},{"n":504,"q":"Hóa đơn điện tử có mã chỉ cần đúng nội dung là đủ điều kiện được cấp mã.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":505,"q":"Doanh nghiệp đang tạm ngừng kinh doanh không được phép sử dụng bất kỳ loại hóa đơn nào trong thời gian tạm ngừng.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":506,"q":"Người nộp thuế có thể giải trình trực tiếp tại cơ quan thuế hoặc bằng văn bản.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":507,"q":"Khi chuyển sang sử dụng hóa đơn điện tử, doanh nghiệp phải tiếp tục sử dụng hết hóa đơn giấy đã mua trước đó.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":508,"q":"Khi hệ thống cấp mã của cơ quan thuế gặp sự cố, Tổng cục Thuế có thể ủy quyền cho tổ chức cung cấp dịch vụ hóa đơn điện tử cấp mã.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":509,"q":"Đối với hóa đơn giấy mua của cơ quan thuế, hóa đơn điều chỉnh được phép ghi số âm (-) để thể hiện phần giảm giá trị.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":510,"q":"Nếu hóa đơn đã gửi người mua chỉ sai tên, địa chỉ nhưng đúng mã số thuế thì không phải lập lại hóa đơn.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":511,"q":"Doanh nghiệp được sử dụng hóa đơn điện tử không có mã ngay khi có chữ ký số mà không cần thông báo của cơ quan thuế.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":512,"q":"Hệ thống cấp mã hóa đơn của cơ quan thuế thực hiện cấp mã thủ công.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":513,"q":"Đối với hoạt động đại lý đổi ngoại tệ và cung ứng dịch vụ nhận, chi trả ngoại tệ của tổ chức tín dụng, thời điểm lập hóa đơn là cuối kỳ kế toán tháng.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Kế toán"},{"n":514,"q":"Đối với hoạt động bán điện của các công ty phát điện trên thị trường điện thì thời điểm lập hóa đơn điện tử được xác định căn cứ thời điểm về đối soát số liệu thanh toán giữa đơn vị vận hành hệ thống điện và thị trường điện, đơn vị phát điện và đơn vị mua điện theo quy định của Bộ Công Thương hoặc hợp đồng mua bán điện đã được Bộ Công Thương hướng dẫn, phê duyệt nhưng chậm nhất là ngày cuối cùng của thời hạn kê khai, nộp thuế đối với tháng phát sinh nghĩa vụ thuế theo quy định pháp luật về thuế.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":515,"q":"Thời điểm lập hóa đơn điện tử đối với trường hợp bán xăng dầu tại các cửa hàng bán lẻ cho khách hàng là thời điểm kết thúc việc bán xăng dầu theo từng lần bán. Người bán phải đảm bảo lưu trữ đầy đủ hóa đơn điện tử đối với trường hợp bán xăng dầu cho khách hàng là cá nhân không kinh doanh, cá nhân kinh doanh và đảm bảo có thể tra cứu khi cơ quan có thẩm quyền yêu cầu.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":516,"q":"Đối với hóa đơn điện tử, Trường hợp người bán là doanh nghiệp, tổ chức thì chữ ký số của người bán trên hóa đơn là chữ ký số của doanh nghiệp, tổ chức; trường hợp người bán là cá nhân thì sử dụng chữ ký số của cá nhân hoặc người được ủy quyền","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":517,"q":"Đối với hóa đơn của hoạt động xây dựng, lắp đặt; hoạt động xây nhà để bán có thu tiền theo tiến độ theo hợp đồng thì trên hóa đơn không nhất thiết phải có đơn vị tính, số lượng, đơn giá.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":518,"q":"Đối với hóa đơn điện tử là tem, vé, thẻ thì trên hóa đơn phải có chữ ký số của người bán (trừ trường hợp tem, vé, thẻ là hóa đơn điện tử do cơ quan thuế cấp mã), tiêu thức người mua (tên, địa chỉ, mã số thuế), tiền thuế, thuế suất thuế giá trị gia tăng.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế GTGT"},{"n":519,"q":"Trường hợp hóa đơn điện tử đã lập có thời điểm ký số trên hóa đơn khác thời điểm lập hóa đơn thì thời điểm ký số và thời điểm gửi cơ quan thuế cấp mã đối với hóa đơn có mã của cơ quan thuế hoặc thời điểm chuyển dữ liệu hóa đơn điện tử đến cơ quan thuế đối với hóa đơn điện tử không có mã của cơ quan thuế chậm nhất là ngày làm việc tiếp theo kể từ thời điểm lập hóa đơn.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":520,"q":"Thời điểm ký số trên hóa đơn điện tử là thời điểm người bán, người mua sử dụng chữ ký số để ký trên hóa đơn điện tử được hiển thị theo định dạng ngày, tháng, năm của năm dương lịch:","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":521,"q":"Nội dung hóa đơn giấy sau khi chuyển đổi có thể khác một phần so với hóa đơn điện tử gốc.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":522,"q":"Khi bán hàng hóa, cung cấp dịch vụ, người bán phải lập hóa đơn để giao cho người mua (bao gồm cả các trường hợp hàng hóa, dịch vụ dùng để khuyến mại, quảng cáo, hàng mẫu; hàng hóa, dịch vụ dùng để cho, biếu, tặng, trao đổi, trả thay lương cho người lao động và tiêu dùng nội bộ (trừ hàng hóa luân chuyển nội bộ để tiếp tục quá trình sản xuất); xuất hàng hóa dưới các hình thức cho vay, cho mượn hoặc hoàn trả hàng hóa) và phải ghi đầy đủ nội dung theo quy định tại Điều 10 Nghị định này, trường hợp sử dụng hóa đơn điện tử thì phải theo định dạng chuẩn dữ liệu của cơ quan thuế theo quy định tại Điều 12 Nghị định này.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":523,"q":"Đồng tiền ghi trên hóa đơn là:","c":{"A":"USD","B":"EUR","C":"Đồng Việt Nam (đ)","D":"Đồng tiền do người bán lựa chọn"},"t":"Tổng hợp"},{"n":524,"q":"Tổ chức thu các khoản thuế, phí lệ phí nếu phát hiện mất, cháy, hỏng biên lai đã lập hoặc chưa lập phải lập báo cáo về việc mất, cháy, hỏng và thông báo với cơ quan quản lý thuế quản lý trực tiếp","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":525,"q":"Tổ chức thu phí, lệ phí không được phép ủy nhiệm cho bên thứ ba lập biên lai.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":526,"q":"Tổ chức thu phí, lệ phí ủy nhiệm cho bên thứ ba theo hình thức văn bản, không cần phải gửi thông báo cho cơ quan thuế","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":527,"q":"Kể từ thời điểm cơ quan quản lý thuế chấp nhận đăng ký sử dụng chứng từ điện tử, tổ chức phải ngừng sử dụng chứng từ điện tử đã thực hiện theo các quy định trước đây, tiêu hủy những chứng từ giấy còn tồn chưa sử dụng (nếu có) theo quy định.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":528,"q":"Trường hợp chứng từ điện tử đã lập sai thì tổ chức khấu trừ thuế thực hiện xử lý chứng từ điện tử đã lập theo nguyên tắc tương tự xử lý hóa đơn điện tử.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Hóa đơn"},{"n":529,"q":"Tiêu hủy biên lai điện tử là biện pháp làm cho biên lai điện tử không còn tồn tại trên hệ thống thông tin, không thể t
