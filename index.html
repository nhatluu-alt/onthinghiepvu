anh nghiệp bị tuyên bố phá sản?","c":{"A":"Doanh nghiệp đã hoàn thành thủ tục phá sản theo quy định của pháp luật.","B":"Doanh nghiệp đã thực hiện các khoản thanh toán theo quy định của pháp luật về phục hồi, phá sản.","C":"Doanh nghiệp không còn tài sản để nộp tiền thuế, tiền phạt, tiền chậm nộp sau khi đã thực hiện các khoản thanh toán theo quy định của pháp luật về phá sản.","D":"Tất cả các điều kiện trên."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1816,"q":"Trường hợp khoanh nợ đối với người nộp thuế không còn hoạt động kinh doanh tại địa chỉ đã đăng ký, thời gian khoanh nợ được tính từ ngày cơ quan thuế có văn bản thông báo trên toàn quốc về việc người nộp thuế hoặc đại diện theo pháp luật của người nộp thuế không hiện diện tại địa chỉ kinh doanh, địa chỉ liên lạc đã đăng ký với cơ quan quản lý thuế?","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1817,"q":"Theo Luật Quản lý thuế, trách nhiệm giải quyết hồ sơ xóa nợ tiền thuế, tiền chậm nộp, tiền phạt được quy định như thế nào nếu hồ sơ chưa đầy đủ?","c":{"A":"Cơ quan tiếp nhận hồ sơ có trách nhiệm thông báo cho cơ quan đã gửi hồ sơ để hoàn chỉnh trong thời hạn 05 ngày làm việc kể từ ngày tiếp nhận hồ sơ. B* Cơ quan tiếp nhận hồ sơ có trách nhiệm thông báo cho cơ quan đã gửi hồ sơ để hoàn chỉnh trong thời hạn 10 ngày làm việc kể từ ngày tiếp nhận hồ sơ.","C":"","D":"","B":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1818,"q":"Hồ sơ xóa nợ tiền thuế, tiền chậm nộp, tiền phạt không bao gồm loại giấy tờ nào sau đây?","c":{"A":"Văn bản đề nghị xóa nợ của cơ quan quản lý thuế.","B":"Quyết định tuyên bố phá sản (nếu có).","C":"Bản sao giấy chứng nhận đăng ký kinh doanh của người nộp thuế.","D":"Các tài liệu liên quan đến việc đề nghị xóa nợ."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1819,"q":"Một công ty có số tiền thuế nợ là 120 triệu đồng và đã được tổ chức tín dụng bảo lãnh với số tiền là 100 triệu đồng. Công ty này đề nghị nộp dần số tiền thuế nợ trong vòng 12 tháng. Theo quy định, công ty phải đảm bảo điều gì trong quá trình nộp dần?","c":{"A":"Công ty được nộp dần 120 triệu đồng trong vòng 12 tháng, không cần quan tâm đến bảo lãnh.","B":"Công ty phải nộp dần số tiền thuế nợ không vượt quá 100 triệu đồng, đúng theo mức bảo lãnh của tổ chức tín dụng.","C":"Công ty có thể nộp dần toàn bộ số tiền thuế nợ và không cần phải nộp chậm nộp.","D":""},"t":"Tổng hợp"},{"n":1820,"q":"Theo Luật Quản lý thuế, trường hợp nào sau đây không thuộc trường hợp được xóa nợ tiền thuế, tiền chậm nộp, tiền phạt?","c":{"A":"Doanh nghiệp bị tuyên bố phá sản đã thực hiện các khoản thanh toán theo quy định của pháp luật về phá sản mà không còn tài sản để nộp tiền thuế, tiền chậm nộp, tiền phạt.","B":"Cá nhân đã chết mà không có tài sản để nộp tiền thuế, tiền chậm nộp, tiền phạt còn nợ.","C":"Các khoản nợ tiền thuế đã quá 5 năm kể từ ngày hết thời hạn nộp thuế nhưng không có khả năng thu hồi.","D":"Tiền thuế đối với các trường hợp bị ảnh hưởng do thiên tai, dịch bệnh có phạm vi rộng đã được xem xét miễn tiền chậm nộp và gia hạn nộp thuế theo quy định mà vẫn còn thiệt hại, không có khả năng phục hồi được sản xuất, kinh doanh."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1821,"q":"Cơ quan nào có thẩm quyền quyết định việc khoanh nợ tiền thuế?","c":{"A":"Chủ tịch UBND tỉnh.","B":"Cục trưởng Cục Thuế.","C":"Thủ trưởng cơ quan quản lý thuế quản lý trực tiếp người nộp thuế.","D":"Tất cả các phương án"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1822,"q":"Điều kiện nào sau đây không phải là điều kiện để được khoanh tiền thuế nợ?","c":{"A":"Người nộp thuế là người đã chết.","B":"Người nộp thuế có quyết định giải thể gửi cơ quan quản lý thuế.","C":"Người nộp thuế bị mất năng lực hành vi dân sự.","D":"Người nộp thuế chuyển địa điểm kinh doanh nhưng không thông báo với cơ quan quản lý thuế."},"t":"Tổng hợp"},{"n":1823,"q":"Trong trường hợp cơ quan quản lý thuế quyết định miễn thuế, giảm thuế, thời hạn giải quyết hồ sơ là bao nhiêu ngày kể từ ngày nhận đủ hồ sơ?","c":{"A":"15 ngày.","B":"20 ngày.","C":"30 ngày.","D":"45 ngày."},"t":"Tổng hợp"},{"n":1824,"q":"Theo Luật Quản lý thuế, thời hạn cơ quan quản lý thuế phải thông báo bằng văn bản cho người nộp thuế nếu hồ sơ miễn thuế, giảm thuế không hợp pháp, không đầy đủ là bao nhiêu ngày làm việc kể từ ngày tiếp nhận hồ sơ?","c":{"A":"01 ngày làm việc.","B":"02 ngày làm việc.","C":"03 ngày làm việc","D":"05 ngày làm việc."},"t":"Tổng hợp"},{"n":1825,"q":"Đăng ký thuế bao gồm:","c":{"A":"Đăng ký thuế lần đầu; Thông báo thay đổi thông tin đăng ký thuế","B":"Thông báo khi tạm ngừng hoạt động, kinh doanh; Chấm dứt hiệu lực mã số thuế;","C":"Khôi phục mã số thuế","D":"Tất cả các đáp án trên"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1826,"q":"Cơ quan có thẩm quyền cấp mã số thuế là:","c":{"A":"UBND các cấp","B":"Cơ quan thuế","C":"Cơ quan đăng ký kinh doanh","D":"Cơ quan thuế và cơ quan đăng ký kinh doanh"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1827,"q":"Khi thay đổi thông tin đăng ký thuế, người nộp thuế phải thông báo trong thời hạn:","c":{"A":"03 ngày","B":"05 ngày làm việc","C":"10 ngày làm việc","D":"30 ngày"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1828,"q":"Trường hợp mã số thuế của người nộp thuế đã bị cơ quan thuế cập nhật sang trạng thái 06 “không hoạt động tại địa chỉ đã đăng ký” được khôi phục thì:","c":{"A":"Hoàn thành nghĩa vụ thuế","B":"Chưa bị thu hồi giấy phép đăng ký doanh nghiệp","C":"Đã nộp hồ sơ đề nghị khôi phục mã số thuế và cơ quan thuế đã lập Biên bản xác minh có sự hoạt động của người nộp thuế tại địa chỉ trụ sở kinh doanh của người nộp thuế.","D":"Tất cả các đáp án trên"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1829,"q":"Doanh nghiệp A và Doanh nghiệp B bị hợp nhất thành Doanh nghiệp C thì:","c":{"A":"Doanh nghiệp A bị chấm dứt hiệu lực mã số thuế","B":"Doanh nghiệp B bị chấm dứt hiệu lực mã số thuế","C":"Doanh nghiệp A và Doanh nghiệp B cùng bị chấm dứt hiệu lực mã số thuế","D":"Doanh nghiệp A và Doanh nghiệp B cùng bị chấm dứt hiệu lực mã số thuế. Doanh nghiệp C thực hiện cấp mã số thuế mới"},"t":"Tổng hợp"},{"n":1830,"q":"Doanh nghiệp A bị sáp nhập vào Doanh nghiệp B thì:","c":{"A":"Doanh nghiệp A bị chấm dứt hiệu lực mã số thuế","B":"Doanh nghiệp B bị chấm dứt hiệu lực mã số thuế","C":"Doanh nghiệp A và Doanh nghiệp B cùng bị chấm dứt hiệu lực mã số thuế","D":"Tất cả các đáp án trên"},"t":"Tổng hợp"},{"n":1831,"q":"Mã số thuế bị chấm dứt hiệu lực khi:","c":{"A":"Chấm dứt hoạt động kinh doanh hoặc giải thể, phá sản;","B":"Bị chia, bị sáp nhập, bị hợp nhất;","C":"Bị thu hồi giấy chứng nhận đăng ký doanh nghiệp, giấy chứng nhận đăng ký hợp tác xã, giấy chứng nhận đăng ký kinh doanh;","D":"Tất cả các đáp án trên đều đúng."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1832,"q":"Người nộp thuế đăng ký thuế trực tiếp với cơ quan thuế khi có thay đổi thông tin đăng ký thuế thì phải thông báo cho cơ quan thuế quản lý trực tiếp trong thời hạn ....... .... kể từ ngày phát sinh thông tin thay đổi.","c":{"A":"10 ngày;","B":"15 ngày;","C":"10 ngày làm việc;","D":"15 ngày làm việc."},"t":"Quản lý thuế / Hoàn thuế"},{"n":1833,"q":"Trường hợp nào hồ sơ đăng ký thuế là hồ sơ đăng ký doanh nghiệp:","c":{"A":"Người nộp thuế đăng ký thuế cùng với đăng ký doanh nghiệp","B":"Người nộp thuế là tổ chức đăng ký thuế trực tiếp với cơ quan thuế","C":"Người nộp thuế là hộ gia đình, hộ kinh doanh, cá nhân đăng ký thuế trực tiếp với cơ quan thuế","D":"Tất cả các trường hợp trên"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1834,"q":"Mã số thuế của doanh nghiệp, tổ chức kinh tế, tổ chức khác sau khi chuyển đổi loại hình, bán, tặng, cho, thừa kế được giữ nguyên.","c":{"A":"Đúng.","B":"Sai.","C":"","D":""},"t":"Quản lý thuế / Hoàn thuế"},{"n":1835,"q":"Theo quy định, cá nhân có nhiều hoạt động sản xuất kinh doanh được cấp tối đã là bao nhiêu mã số thuế:","c":{"A":"1","B":"2","C":"3","D":"4"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1836,"q":"Người nộp thuế có Văn phòng đại diện không phát sinh nghĩa vụ thuế thì:","c":{"A":"Không cần đăng ký thuế","B":"Phải đăng ký mã số thuế phụ thuộc","C":"Phải đăng ký mã số thuế 6 Luật Khiếu nại thì thụ lý giải quyết theo quy định của Luật Tố cáo. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1851,"q":"Ngày 02/02/2026, Thuế tỉnh X nhận được đơn tố cáo của ông A, tố cáo công ty B thuộc quản lý của Thuế cơ sở 1 tỉnh X kê khai khống tiền lương tiền công của ông trong năm 2025, đơn đồng thời được gửi cho Thuế cơ sở 1. Công chức được giao nhiệm vụ xử lý đơn đã phân loại đơn không đủ điều kiện xử lý và đề xuất lưu đơn có đúng quy định không?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Thuế TNCN"},{"n":1852,"q":"Nhận định nào sau đây là đúng về xử lý đơn theo quy định tại Thông tư 05/2021/TT-TTCP","c":{"A":"Xử lý đơn là việc cơ quan, tổ chức, đơn vị, người có thẩm quyền phân loại đơn nhằm thụ lý giải quyết đơn thuộc thẩm quyền","B":"Xử lý đơn là việc cơ quan, tổ chức, đơn vị, người có thẩm quyền căn cứ vào nội dung vụ việc được trình bày trong đơn mà phân loại nhằm thụ lý giải quyết đơn thuộc thẩm quyền.","C":"Xử lý đơn là việc cơ quan, tổ chức, đơn vị, người có thẩm quyền căn cứ vào nội dung vụ việc được trình bày trong đơn mà phân loại nhằm thụ lý giải quyết đơn thuộc thẩm quyền, hướng dẫn hoặc chuyển đơn đến cơ quan, tổ chức, đơn vị, người có thẩm quyền giải quyết theo quy định của pháp luật","D":"Xử lý đơn là việc cơ quan, tổ chức, đơn vị, người có thẩm quyền căn cứ vào nội dung vụ việc được trình bày trong đơn mà phân loại nhằm thụ lý giải quyết đơn thuộc thẩm quyền theo quy định của pháp luật"},"t":"Tổng hợp"},{"n":1853,"q":"Đơn khiếu nại không thuộc thẩm quyền giải quyết của cơ quan thuế tiếp nhận đơn thì xử lý như thế nào?","c":{"A":"Hướng dẫn người khiếu nại gửi đơn đến cơ quan, tổ chức, đơn vị, người có thẩm quyền giải quyết.","B":"Chuyển đơn và các thông tin, tài liệu kèm theo (nếu có) đến cơ quan, tổ chức, đơn vị có thẩm quyền giải quyết theo quy định của pháp luật","C":"Thực hiện Lưu đơn","D":"Thông báo đơn không đủ điều kiện thụ lý"},"t":"Tổng hợp"},{"n":1854,"q":"Việc phân loại đơn khiếu nại, tố cáo, kiến nghị, phản ánh căn cứ vào?","c":{"A":"Chỉ phụ thuộc Tiêu đề của đơn","B":"Nội dung trình bày trong đơn, mục đích, yêu cầu của người viết đơn và phụ thuộc tiêu đề của đơn","C":"Nội dung trình bày trong đơn, mục đích, yêu cầu của người viết đơn","D":"Theo yêu cầu của người viết đơn"},"t":"Tổng hợp"},{"n":1855,"q":"Đơn nào không đủ điều kiện xử lý theo Thông tư 05/2021/TT-TTCP","c":{"A":"Đơn kiến nghị, phản ánh ghi rõ nội dung kiến nghị, phản ánh","B":"Đơn phản ánh kiến nghị không ghi rõ họ tên, địa chỉ của người gửi đơn.","C":"Đơn tố cáo ghi rõ họ tên, địa chỉ của người bị tố cáo; hành vi vi phạm pháp luật bị tố cáo; cách thức liên hệ với người tố cáo và các thông tin khác có liên quan","D":"Đơn khiếu nại ghi rõ tên, địa chỉ của cơ quan, tổ chức, cá nhân bị khiếu nại; nội dung, lý do khiếu nại, tài liệu liên quan đến nội dung khiếu nại và yêu cầu của người khiếu nại"},"t":"Tổng hợp"},{"n":1856,"q":"Thuế thành phố X nhận được đơn tố cáo ghi ngày 03/03/2026 (không có họ tên, địa chỉ, cách thức liên hệ với người tố cáo) có nội dung tố cáo công chức T.V.A công tác tại tổ Kiểm tra Thuế cơ sở 1 thành phố X có hành vi sách nhiễu trong thực thi công vụ. Đơn không kèm theo tài liệu, chứng cứ cụ thể về hành vi vi phạm pháp luật của người bị tố cáo. Nhận định nào sau đây là đúng?","c":{"A":"Đơn nhận ngày 03/03/2026 là đơn không đủ điều kiện xử lý, nên thực hiện lưu đơn","B":"Đơn nhận ngày 03/03/2026 là đơn có thông tin tố cáo nên phải thụ lý giải quyết theo quy định Luật tố cáo","C":"Đơn nhận ngày 03/03/2026 là đơn tố cáo không đủ điều kiện thụ lý nên phải ban hành Thông báo không thụ lý nội dung tố cáo","D":"Đơn nhận ngày 03/03/2026 thuộc thẩm quyền giải quyết của Thuế cơ sở 1 nên phải làm phiếu chuyển đơn đến Thuế cơ sở 1 để giải quyết"},"t":"Quản lý thuế / Hoàn thuế"},{"n":1857,"q":"Đơn có nhiều nội dung khác nhau thì xử lý thế nào?","c":{"A":"Lưu đơn không giải quyết","B":"Chuyển đơn đến từng cơ quan đơn vị có thẩm quyền giải quyết","C":"Tiếp nhận và giải quyết tất cả các nội dung","D":"Hướng dẫn người gửi đơn tách riêng từng nội dung để gửi đến đúng cơ quan, tổ chức, đơn vị, cá nhân có thẩm quyền giải quyết"},"t":"Tổng hợp"},{"n":1858,"q":"Ông A không đồng ý với Kết quả giải quyết khiếu nại lần đầu của Trưởng thuế cơ sở 1 thành phố X (kết luận khiếu nại của ông A là sai toàn bộ), Ông A cho rằng Trưởng thuế cơ sở 1 đã vi phạm trình tự, thủ tục giải quyết khiếu nại lần đầu (không thực hiện đối thoại với ông A trước khi ban hành Quyết định giải quyết khiếu nại) nên gửi đơn tố cáo đến Trưởng thuế thành phố X. Nhận định nào sau đây là đúng?","c":{"A":"Trường hợp này này phải thụ lý đơn để giải quyết tố cáo theo thẩm quyền.","B":"Trường hợp này phải Chuyển đơn đến Thuế cơ sở 1 để giải quyết tố cáo theo thẩm quyền.","C":"Trường hợp này không thụ lý giải quyết tố cáo, người xử lý đơn hướng dẫn người có đơn tiếp tục thực hiện việc khiếu nại hoặc khởi kiện vụ án hành chính tại Tòa án có thẩm quyền theo quy định của pháp luật","D":"Trường hợp này phải chuyển đơn sang cơ quan công an giải quyết theo thẩm quyền."},"t":"Tổng hợp"},{"n":1859,"q":"Đơn có nhiều nội dung khác nhau (khiếu nại + tố cáo + kiến nghị) được xử lý thế nào?","c":{"A":"Thụ lý giải quyết toàn bộ nội dung đơn","B":"Thông báo Không thụ lý giải quyết đơn","C":"Hướng dẫn người viết tách nội dung gửi đúng cơ quan có thẩm quyền","D":"Thực hiện Lưu đơn"},"t":"Tổng hợp"},{"n":1860,"q":"Trong thời hạn 10 ngày làm việc kể từ ngày tiếp nhận nội dung khiếu nại của công dân, người tiếp công dân có trách nhiệm trả lời trực tiếp hoặc thông báo bằng văn bản đến người đã đến khiếu nại về Quyết định giải quyết khiếu nại","c":{"A":"Sai","B":"Đúng","C":"","D":""},"t":"Tổng hợp"},{"n":1861,"q":"Trong buổi tiếp công dân tại Thuế thành phố X, ông A trong tình trạng bức xúc đã có hành vi đe dọa, xúc phạm người tiếp công dân. Trường hợp này người tiếp công dân được từ chối tiếp công dân.","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1862,"q":"Hành vi nào bị nghiêm cấm trong tiếp công dân?","c":{"A":"Phản ánh kiến nghị không đúng thẩm quyền của cơ quan tiếp công dân","B":"Gây phiền hà, sách nhiễu hoặc cản trở người đến khiếu nại, tố cáo, kiến nghị, phản ánh","C":"Yêu cầu người vi phạm nội quy nơi tiếp công dân chấm dứt hành vi vi phạm","D":"Cử người đại diện để trình bày nội dung khiếu nại, tố cáo, kiến nghị, phản ánh"},"t":"Tổng hợp"},{"n":1863,"q":"Trong thời hạn 10 ngày làm việc, kể từ ngày tiếp nhận nội dung khiếu nại, tố cáo, kiến nghị, phản ánh, người tiếp công dân có trách nhiệm trả lời trực tiếp hoặc thông báo bằng văn bản đến người đã đến khiếu nại, tố cáo, kiến nghị, phản ánh về một trong các nội dung:","c":{"A":"Khiếu nại, tố cáo, kiến nghị, phản ánh đã được thụ lý để giải quyết. Hoặc Từ chối thụ lý đối với khiếu nại, tố cáo không thuộc thẩm quyền giải quyết của cơ quan, tổ chức, đơn vị mình hoặc không đủ điều kiện thụ lý","B":"Việc xem xét khiếu nại, tố cáo để thụ lý cần kéo dài thời gian do cần xác minh thêm theo quy định của Luật khiếu nại, Luật tố cáo","C":"Nội dung khiếu nại, tố cáo, kiến nghị, phản ánh đã được chuyển đến cơ quan, tổ chức, đơn vị, cá nhân có thẩm quyền giải quyết","D":"Tất cả các đáp án đều đúng"},"t":"Tổng hợp"},{"n":1864,"q":"Người đứng đầu cơ quan đơn vị có trách nhiệm?","c":{"A":"Tiếp công dân thường xuyên, tiếp công dân định kỳ và tiếp công dân đột xuất.","B":"Tiếp công dân thường xuyên và tiếp công dân định kỳ","C":"Tiếp công dân định kỳ và tiếp công dân đột xuất.","D":"Tiếp công dân định kỳ"},"t":"Tổng hợp"},{"n":1865,"q":"Tiếp công dân bao gồm?","c":{"A":"Tiếp công dân thường xuyên và tiếp công dân đột xuất.","B":"Tiếp công dân thường xuyên và tiếp công dân định kỳ","C":"Tiếp công dân thường xuyên, tiếp công dân định kỳ và tiếp công dân đột xuất.","D":"Tiếp công dân định kỳ và tiếp công dân đột xuất"},"t":"Tổng hợp"},{"n":1866,"q":"Ngày 12/02/2026, ông A đến Thuế tỉnh X yêu cầu được tiếp công đân để phản ánh việc Thuế cơ sở 1 tỉnh X không tiếp nhận, giải quyết hồ sơ khai Lệ phí trước bạ đối với tài sản là xe ô tô (ông mua lại từ cá nhân, không có hóa đơn), ông yêu cầu cơ quan thuế phải giải quyết hồ sơ trước bạ xe của ông để sớm đưa xe sử dụng, ông không có đơn. Nhận định nào sau đây là đúng?","c":{"A":"Người tiếp công dân không tiếp nhận kiến nghị phản ánh của ông A do không đúng thẩm quyền giải quyết","B":"Người tiếp công dân không tiếp nhận kiến nghị phản ánh của ông A do không có đơn kiến nghị phản ánh","C":"Người tiếp công dân hướng dẫn ông A viết đơn phản ánh hoặc ghi chép đầy đủ, trung thực, chính xác nội dung trình bày của ông A; nội dung nào chưa rõ thì đề nghị công dân trình bày thêm, sau đó đọc lại cho công dân nghe và đề nghị họ ký tên hoặc điểm chỉ xác nhận vào văn bản.","D":"Người tiếp công dân có hướng dẫn ông A đến Thuế cơ sở 1 để được tiếp công dân theo thẩm quyền"},"t":"Tổng hợp"},{"n":1867,"q":"Trường hợp tiếp công dân đoàn trên 05 người đến khiếu nại, tố cáo, kiến nghị, phản ánh về cùng một nội dung thì:","c":{"A":"Người tiếp công dân hướng dẫn họ cử người đại diện để trình bày, ghi lại nội dung trình bày và đề nghị người đại diện ký tên hoặc điểm chỉ xác nhận vào văn bản.","B":"Người tiếp công dân được quyền từ chối tiếp công dân.","C":"Người tiếp công dân ghi lại nội dung trình bày và đề nghị từng công dân ký tên hoặc điểm chỉ vào sổ tiếp công dân","D":"Người tiếp công dân hướng dẫn từng công dân phải có đơn riêng mới đủ điều kiện tiếp nhận."},"t":"Tổng hợp"},{"n":1868,"q":"Người đứng đầu cơ quan đơn vị có trách nhiệm trực tiếp tiếp công dân tối thiểu mấy ngày trong tháng tại địa điểm tiếp công dân của cơ quan mình?","c":{"A":"01 ngày","B":"02 ngày","C":"Không bắt buộc","D":"05 ngày"},"t":"Tổng hợp"},{"n":1869,"q":"Tại địa điểm tiếp công dân phải niêm yết:","c":{"A":"Nội quy tiếp công dân","B":"Hướng dẫn về quy trình tiếp công dân","C":"Hướng dẫn về quy trình tiếp giải quyết khiếu nại, tố cáo, kiến nghị, phản ánh","D":"Tất cả các đáp án đều đúng"},"t":"Tổng hợp"},{"n":1870,"q":"Ngày 31/12/2025, không đồng ý với Kết quả đánh giá, xếp loại công chức, người lao động năm 2025, ông A công chức thuộc Thuế thành phố X gửi đơn khiếu nại đến Trưởng thuế thành phố X để được giải quyết. Ngày 05/01/2026, Thuế thành phố X ban hành Thông báo thụ lý giải quyết khiếu nại lần đầu của ông A, đúng hay sai?","c":{"A":"Sai","B":"Đúng","C":"","D":""},"t":"Tổng hợp"},{"n":1871,"q":"Người khiếu nại không được ủy quyền thực hiện việc khiếu nại mà phải tự mình khiếu nại. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1872,"q":"Nhận định nào dưới đây không đúng về việc cử người đại diện khi có nhiều người cùng khiếu nại về một nội dung?","c":{"A":"Khi cử người đại diện không phải là người khiếu nại thì bắt buộc phải có văn bản cử người đại diện có chữ ký của tất cả những người khiếu nại và và được chứng thực hoặc công chứng","B":"Trường hợp có từ năm đến mười người khiếu nại thì cử một hoặc hai người đại diện;","C":"Việc cử người đại diện phải thể hiện bằng văn bản có chữ ký của tất cả những người khiếu nại.","D":"Trường hợp có 20 người khiếu nại thì tối đa 5 người đại diện"},"t":"Tổng hợp"},{"n":1873,"q":"Đối với khiếu nại quyết định hành chính, hành vi hành chính thì Tổ chức đối thoại với người khiếu nại, người bị khiếu nại và cơ quan, tổ chức, cá nhân có liên quan trong những trường hợp nào?","c":{"A":"Trong quá trình giải quyết khiếu nại lần đầu, lần hai nếu yêu cầu của người khiếu nại và kết quả xác minh nội dung khiếu nại còn khác nhau","B":"Trong quá trình giải quyết khiếu nại lần đầu đối với vụ việc phức tạp cần gia hạn thời gian giải quyết khiếu nại và trong giải quyết khiếu nại lần hai","C":"Trong quá trình giải quyết khiếu nại lần đầu, nếu yêu cầu của người khiếu nại và kết quả xác minh nội dung khiếu nại còn khác nhau và trong giải quyết khiếu nại lần hai","D":"Tổ chức đối thoại với người khiếu nại, người bị khiếu nại và cơ quan, tổ chức, cá nhân có liên quan là bắt buộc với tất cả các trường hợp"},"t":"Tổng hợp"},{"n":1874,"q":"Nhận định nào dưới đây là đúng?","c":{"A":"Người khiếu nại chỉ có thể rút khiếu nại trước khi người giải quyết khiếu nại thông báo thụ lý giải quyết khiếu nại","B":"Người khiếu nại có thể rút khiếu nại tại bất cứ thời điểm nào trong quá trình khiếu nại nhưng phải trước khi người giải quyết khiếu nại thực hiện đối thoại để giải quyết khiếu nại","C":"Trong mọi trường hợp khi nhận được đơn xin rút toàn bộ nội dung khiếu nại thì người giải quyết khiếu nại đình chỉ việc giải quyết và thông báo bằng văn bản cho người khiếu nại về việc đình chỉ giải quyết khiếu nại.","D":"Khi nhận được đơn xin rút toàn bộ nội dung khiếu nại thì người giải quyết khiếu nại chỉ đình chỉ việc giải quyết khiếu nại khi có căn cứ xác định nội dung khiếu nại là sai và thông báo bằng văn bản cho người khiếu nại về việc đình chỉ giải quyết khiếu nại."},"t":"Tổng hợp"},{"n":1875,"q":"Đối với khiếu nại quyết định hành chính, hành vi hành chính thì Quyết định giải quyết khiếu nại lần hai có hiệu lực từ khi nào?","c":{"A":"Sau 30 ngày, kể từ ngày ban hành; đối với vùng sâu, vùng xa đi lại khó khăn thì thời hạn có thể kéo dài hơn nhưng không quá 45 ngày","B":"Sau 30 ngày làm việc, kể từ ngày ban hành; đối với vùng sâu, vùng xa đi lại khó khăn thì thời hạn có thể kéo dài hơn nhưng không quá 45 ngày làm việc","C":"Có hiệu lực thi hành ngay kể từ ngày ký","D":"Có hiệu lực thi hành ngay kể từ ngày ký nếu người khiếu có văn bản cam đoan không khởi kiện vụ án hành chính."},"t":"Tổng hợp"},{"n":1876,"q":"Không đồng ý với quyết định giải quyết khiếu nại lần đầu ngày 02/02/2026 của Thuế cơ sở 1 thành phố X, công ty F đã khởi kiện vụ án hành chính và được Tòa án cấp có thẩm quyền giải quyết theo bản án ngày 28/02/2026 bác đơn của Công ty F. Ngày 01/03/2026, Công ty F gửi đơn khiếu nại lần 2 đến Thuế thành phố X. Trong trường hợp này, Thuế thành phố X sẽ xử lý như thế nào?","c":{"A":"Thông báo thụ lý giải quyết khiếu nại lần 2 do đơn thuộc thẩm quyền giải quyết khiếu nại lần 2 và còn thời hiệu khiếu nại lần 2.","B":"Thông báo không thụ lý do đơn không đủ điều kiện thụ lý","C":"Chuyển đơn đến tòa án cấp cao giải quyết theo thẩm quyền và thông báo cho người khiếu nại biết","D":"Lưu đơn"},"t":"Tổng hợp"},{"n":1877,"q":"Thời hiệu khiếu nại lần đầu đối với quyết định kỷ luật là việc cán bộ?","c":{"A":"15 ngày, kể từ ngày ban hành quyết định kỷ luật","B":"15 ngày, kể từ ngày cán bộ, công chức nhận được quyết định kỷ luật","C":"90 ngày kể từ ngày cán bộ, công chức nhận được quyết định kỷ luật","D":"90 ngày, kể từ ngày ban hành quyết định kỷ luật"},"t":"Tổng hợp"},{"n":1878,"q":"Đối với khiếu nại quyết định hành chính, hành vi hành chính lần đầu, khi tiếp nhận đơn khiếu nại đã hết thời hiệu mà không có lý do chính đáng thì xử lý thế nào?","c":{"A":"Chuyển đơn đến cơ quan thuế cấp trên để giải quyết và thông báo cho người khiếu nại biết","B":"Chuyển đơn đến Tòa án nhân dân cùng cấp để giải quyết theo thẩm quyền và thông báo cho người khiếu nại biết","C":"Thông báo cho người khiếu nại về việc không thụ lý","D":"Thực hiện lưu đơn"},"t":"Tổng hợp"},{"n":1879,"q":"Đối với khiếu nại quyết định hành chính, hành vi hành chính (không ở vùng sâu, vùng xa đi lại khó khăn) thì thời hạn giải quyết khiếu nại lần đầu tối đa bao lâu?","c":{"A":"30 ngày làm việc kể từ ngày nhận đơn","B":"30 ngày làm việc kể từ ngày nhận đơn","C":"30 ngày kể từ ngày thụ lý","D":"30 ngày làm việc kể từ ngày thụ lý"},"t":"Tổng hợp"},{"n":1880,"q":"Các hành vi bị nghiêm cấm trong phòng, chống tham nhũng là:","c":{"A":"Các hành vi tham nhũng","B":"Đe dọa, trả thù, trù dập, tiết lộ thông tin về người phản ánh, báo cáo, tố cáo, tố giác, báo tin, cung cấp thông tin về hành vi tham nhũng","C":"Lợi dụng việc phản ánh, báo cáo, tố cáo, tố giác, báo tin, cung cấp thông tin về hành vi tham nhũng để vu khống cơ quan, tổ chức, đơn vị, cá nhân khác","D":"Tất cả các đáp án đều đúng"},"t":"Tổng hợp"},{"n":1881,"q":"Tải sản, thu nhập phải kê khai bao gồm?","c":{"A":"Quyền sử dụng đất, nhà ở.","B":"Tổng thu nhập giữa 02 lần kê khai","C":"Tài sản, tài khoản ở nước ngoài.","D":"Tất cả đều đúng"},"t":"Tổng hợp"},{"n":1882,"q":"Chuyển đổi vị trí công tác nhằm mục đích gì?","c":{"A":"Nâng cao thu nhập","B":"Phòng ngừa tham nhũng","C":"Tăng kỷ luật lao động","D":"Giảm biên chế"},"t":"Tổng hợp"},{"n":1883,"q":"Tài sản nào sau đây của người có nghĩa vụ kê khai tài sản khi tăng thêm phải giải trình nguồn gốc?","c":{"A":"Các loại nhà ở, công trình xây dạng, các quyền sử dụng đất khi tăng giảm về số lượng, diện tích. hoặc thay đổi về cấp nhà, công trình, loại đất so với kỳ kê khai trước đó","B":"Xe máy trị giá 40 triệu đồng.","C":"Sổ tiết kiệm tăng thêm 14,5 triệu đồng.","D":"Đá quý trị giá 49 triệu đồng"},"t":"Tổng hợp"},{"n":1884,"q":"Tài sản thu nhập nào dưới đây không thuộc tài sản, thu nhập phải kê khai?","c":{"A":"Tài sản, tài khoản ở nước ngoài.","B":"Quyền sử dụng đất, nhà ở, công trình xây dựng và tài sản khác gần liền với đất, nhà ở, công trình xây dựng","C":"Giấy tờ có giá có giá trị đến dưới 50.000.000 đồng","D":"Kim khí quy, đã quy tiền, giấy tờ có giá và động sản khác mà mỗi tài sản có giá trị từ 50 triệu đồng trở lên."},"t":"Tổng hợp"},{"n":1885,"q":"Người kê khai tài sản, thu nhập phải có nghĩa vụ gì?","c":{"A":"Người có nghĩa vụ kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình, của vợ hoặc của chồng, con chưa thành niên theo quy định của Luật Phòng, chống tham nhũng năm 2018","B":"Người có nghĩa vụ kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình, con chưa thành niên","C":"Người có nghĩa vụ kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình, của vợ hoặc của chồng","D":"Người có nghĩa vụ kê khai tài sản, thu nhập và biến động về tài sản, thu nhập của mình"},"t":"Tổng hợp"},{"n":1886,"q":"Người nào có nghĩa vụ kê khai khai tài sản, thu nhập hằng năm","c":{"A":"Kiểm tra viên thuế","B":"Kiểm tra viên hải quan","C":"Kiểm toán viên","D":"Tất cả các đáp án"},"t":"Tổng hợp"},{"n":1887,"q":"Người đứng đầu cơ quan quản lý nhà nước có trách nhiệm gì?","c":{"A":"Tổ chức kiểm tra việc chấp hành pháp luật của cơ quan, tổ chức, đơn vị, cá nhân thuộc phạm vi quản lý của mình nhằm kịp thời phát hiện, ngăn chặn, xử lý tham nhũng","B":"Khi phát hiện có hành vi tham nhũng, người đứng đầu cơ quan quản lý nhà nước phải kịp thời xử lý theo thẩm quyền","C":"Khi phát hiện có hành vi tham nhũng, người đứng đầu cơ quan quản lý nhà nước phải kịp thời báo cho cơ quan có thẩm quyền xử lý theo quy định của pháp luật.","D":"Tất cả các đáp án"},"t":"Tổng hợp"},{"n":1888,"q":"Thanh tra Chính phủ chịu trách nhiệm về phòng, chống tham nhũng trước:","c":{"A":"Thủ tướng Chính phủ","B":"Quốc hội","C":"Chủ tịch nước","D":"Bộ Công an"},"t":"Tổng hợp"},{"n":1889,"q":"Cơ quan nào có trách nhiệm xây dựng, quản lý cơ sở dữ liệu quốc gia về kiểm soát tài sản, thu nhập?","c":{"A":"Thanh tra Chính phủ và Cơ quan kiểm soát tài sản, thu nhập khác","B":"Bộ Tài chính","C":"Bộ Công an","D":"Quốc hội"},"t":"Tổng hợp"},{"n":1890,"q":"Tải sản, thu nhập phải kê khai hao gồm: Kim khí, đã quý, tiền, giấy tờ có già và động sản khác mà mỗi tài sản có giá trị từ ... đồng trở lên?","c":{"A":"30 triệu","B":"50 triệu","C":"70 triệu","D":"100 triệu"},"t":"Tổng hợp"},{"n":1891,"q":"Người có nghĩa vụ kê khai khai tài sản, thu nhập phải lập mấy bản để bàn giao cho cơ quan, tổ chức, đơn vị mình","c":{"A":"01 bản","B":"02 bản","C":"03 bản","D":"05 bản"},"t":"Tổng hợp"},{"n":1892,"q":"Có mấy phương thức kê khai tài sản, thu nhập","c":{"A":"01 phương thức (kê khai tài sản của cán bộ, công chức)","B":"02 phương thức (kê khai hằng năm, kê khai phục vụ công tác cán bộ)","C":"03 phương thức (kê khai lần đầu; kê khai hằng năm; kê khai phục vụ công tác cán bộ)","D":"04 phương thức (kê khai lần đầu; kê khai hằng năm; kê khai phục vụ công tác cán bộ; kê khai bổ sung)"},"t":"Tổng hợp"},{"n":1893,"q":"Tài sản, thu nhập phải kê khai bao gồm Tổng thu nhập giữa mấy lần kê khai","c":{"A":"2","B":"3","C":"4","D":"5"},"t":"Tổng hợp"},{"n":1894,"q":"Theo Luật Phòng, chống tham nhũng 2018, hành vi nào sau đây là tham nhũng?","c":{"A":"Lợi dụng chức vụ, quyền hạn sử dụng trái phép tài sản công vì vụ lợi","B":"Không thực hiện, thực hiện không đúng hoặc không đầy đủ nhiệm vụ, công vụ vì vụ lợi","C":"Lợi dụng chức vụ, quyền hạn vì vụ lợi","D":"Tất cả các đáp án trên"},"t":"Tổng hợp"},{"n":1895,"q":"Cơ quan nào là là cơ quan đầu mối giúp Chính phủ quản lý nhà nước về công tác phòng, chống tham nhũng?","c":{"A":"Bộ Công an","B":"Bộ Tư Pháp","C":"Thanh tra Chính phủ","D":"Tòa án nhân dân tối cao"},"t":"Tổng hợp"},{"n":1896,"q":"Các đơn vị nào có bộ phận chuyên trách về chống tham nhũng?","c":{"A":"Thanh tra Chính phủ","B":"Bộ Công an","C":"Viện kiểm sát nhân dân tối cao","D":"Tất cả các đáp án"},"t":"Tổng hợp"},{"n":1897,"q":"Thời hạn người được báo cáo và có trách nhiệm xử lý hành vi tham nhũng phải xử lý khi nhận được được báo cáo về hành vi tham nhũng là bao nhiêu ngày?","c":{"A":"5 ngày làm việc","B":"10 ngày làm việc","C":"Trong thời hạn 15 ngày kể từ ngày nhận được báo cáo về hành vi tham nhũng; đối với vụ việc phức tạp thì thời hạn có thể kéo dài nhưng không quá 30 ngày","D":"20 ngày làm việc"},"t":"Tổng hợp"},{"n":1898,"q":"Khi kê khai tài sản, thu nhập thì giấy chứng nhận quyền sử dụng đất, người kê khai phải khai giá trị bao nhiêu?","c":{"A":"Trường hợp tài sản có được do mua, chuyển nhượng thì ghi số tiền thực tế phải trả khi mua hoặc nhận chuyển nhượng cộng với các khoản thuế, phí khác (nếu có);","B":"Trường hợp tài sản được cho, tặng, thừa kế thì ghi theo giá thị trường tại thời điểm được cho, tặng, thừa kế cộng với các khoản thuế, phí khác (nếu có) và ghi “giá trị ước tính”.","C":"trường hợp trường hợp không thể ước tính giá trị tài sản vì các lý do như tài sản sử dụng đã quá lâu hoặc không có giao dịch đối với tài sản tương tự thì ghi “không xác định được giá trị” và ghi rõ lý do.","D":"Tất cả các đáp án"},"t":"Tổng hợp"},{"n":1899,"q":"Thời gian hoàn thành bản kê khai của người có nghĩa vụ kê khai tài sản, thu nhập hằng năm là","c":{"A":"Trước ngày 15/12","B":"Trước ngày 30/12","C":"Trước ngày 31/12","D":"Trước ngày 15/01 năm sau 901"},"t":"Tổng hợp"},{"n":1900,"q":"Một người bạn thân của công chức thuế C nhờ C tra cứu giúp tình hình doanh thu và số thuế đã nộp của một doanh nghiệp đối thủ để họ \"tham khảo kinh doanh\". Theo quy tắc bảo mật thông tin NNT, công chức C phải làm gì?","c":{"A":"Tra giúp vì là bạn thân và thông tin này không gây hại gì cho cơ quan thuế.","B":"Chỉ cung cấp những thông tin cơ bản như mã số thuế và địa chỉ, còn số liệu tài chính thì giữ kín.","C":"Từ chối thẳng thắn và giải thích rằng đây là bí mật của NNT mà công chức có trách nhiệm bảo mật theo pháp luật, không được tiết lộ cho bất kỳ ai không có thẩm quyền.","D":"Yêu cầu người bạn đó phải trả một khoản phí nhỏ thì mới cung cấp thông tin."},"t":"Tổng hợp"},{"n":1901,"q":"Đang trong giờ cao điểm tiếp nhận hồ sơ, hệ thống mạng của cơ quan Thuế bị lỗi khiến việc tra cứu dữ liệu rất chậm. NNT chờ đợi lâu nên bắt đầu to tiếng, quát tháo tại quầy giao dịch. Trong tình huống này, công chức thuế cần làm gì để đúng quy tắc ứng xử?","c":{"A":"Giữ im lặng, tập trung làm việc và không trả lời cho đến khi NNT bình tĩnh lại.","B":"Đối đáp lại tương đương với thái độ của NNT để giữ uy nghiêm của cơ quan nhà nước.","C":"Đứng dậy, mỉm cười lịch sự, nói lời xin lỗi vì sự cố khách quan, giải thích rõ nguyên nhân và mong NNT thông cảm chờ đợi hoặc hẹn quay lại vào giờ khác nếu NNT không thể chờ.","D":"Mời lực lượng bảo vệ đến đưa NNT ra ngoài ngay lập tức vì hành vi gây rối trật tự."},"t":"Tổng hợp"},{"n":1902,"q":"Nếu bạn đang trong giờ tiếp công dân nhưng có điện thoại cá nhân gọi đến, theo quy tắc ứng xử bạn nên làm gì?","c":{"A":"Từ chối cuộc gọi, ưu tiên giải quyết công việc cho NNT đang đứng trước mặt.","B":"Xin phép NNT để nghe điện thoại nhanh rồi làm tiếp","C":"Nghe điện thoại bình thường vì đó là quyền cá nhân.","D":""},"t":"Tổng hợp"},{"n":1903,"q":"Theo quy định về quy tắc ứng xử, khi Người nộp thuế (NNT) cần hướng dẫn hoặc giải đáp vướng mắc, công chức thuế phải đảm bảo thông tin trao đổi đạt được các tiêu chí cốt lõi nào sau đây?","c":{"A":"Nhanh chóng, ngắn gọn, ưu tiên các trường hợp doanh nghiệp lớn.","B":"Chính xác, đầy đủ, cụ thể, kịp thời và dễ hiểu.","C":"Chỉ trả lời những nội dung có sẵn trong văn bản, không giải thích thêm.","D":"Tiếp nhận thông tin và hẹn trả lời bằng văn bản trong mọi trường hợp."},"t":"Tổng hợp"},{"n":1904,"q":"Khi NNT đến cơ quan thuế để giải quyết công việc nhưng hồ sơ còn thiếu hoặc chưa đúng quy định, cán bộ thuế phải xử lý như thế nào?","c":{"A":"Yêu cầu NNT về bổ sung và không giải thích gì thêm.","B":"Hướng dẫn cụ thể, đầy đủ một lần bằng Phiếu hướng dẫn để NNT hoàn thiện hồ sơ theo đúng quy định","C":"Nhận hồ sơ trước rồi gọi điện báo bổ sung sau.","D":""},"t":"Tổng hợp"},{"n":1905,"q":"Công chức thuế vi phạm các quy định về quy tắc ứng xử thì bị xử lý như thế nào?","c":{"A":"Chỉ cần rút kinh nghiệm nội bộ trong tổ công tác.","B":"Tùy theo tính chất, mức độ vi phạm sẽ bị xử lý kỷ luật theo quy định của pháp luật và quy định của Ngành Thuế.","C":"Phạt tiền trực tiếp trừ vào lương tháng khi phát hiện vi phạm.","D":"Buộc thôi việc ngay lập tức không cần xét duyệt."},"t":"Tổng hợp"},{"n":1906,"q":"Quy tắc ứng xử với người nộp thuế được vận dụng cho đối tượng nào","c":{"A":"Công chức trực tiếp thực hiện công tác quản lý thuế tại các đơn vị thuộc cơ quan thuế các cấp.","B":"Người làm việc theo chế độ hợp đồng theo quy định của Chính phủ về hợp đồng đối với một số loại công việc trong cơ quan hành chính","C":"Công chức trực tiếp thực hiện công tác quản lý thuế tại các đơn vị thuộc cơ quan thuế các cấp và người làm việc theo chế độ hợp đồng theo quy định của Chính phủ về hợp đồng đối với một số loại công việc trong cơ quan hành chính","D":""},"t":"Tổng hợp"},{"n":1907,"q":"Những hành vi nào của công chức thuế bị cấm nhằm phòng ngừa tiêu cực, trục lợi cá nhân và bảo vệ bí mật thông tin của tổ chức, cá nhân trong quản lý thuế?","c":{"A":"Thông đồng, móc ngoặc, tiếp tay cho người nộp thuế vi phạm quy định trong công tác quản lý thuế để trục lợi cá nhân, gây thiệt hại cho ngân sách nhà nước.","B":"Tiết lộ thông tin về hồ sơ, tài liệu, dữ liệu và các thông tin liên quan đến bí mật của tổ chức, cá nhân hoặc sử dụng thông tin đó để trục lợi.","C":"Không được nhận lợi ích bằng tiền, quà tặng (sai quy định) của người nộp thuế dưới mọi hình thức.","D":"Tất cả đáp án trên"},"t":"Tổng hợp"},{"n":1908,"q":"Trong các đáp án sau chọn đáp án đúng những việc phải làm trong giao tiếp, ứng xử với người nộp thuế:","c":{"A":"Khi thực hiện giao dịch trực tiếp, qua văn bản hành chính hoặc thông qua các phương tiện thông tin (điện thoại, thư điện tử, mạng điện tử...), công chức thuế phải bảo đảm việc trao đổi thông tin với người nộp thuế được thực hiện đầy đủ, rõ ràng, chính xác và đúng nội dung cần hướng dẫn, giải đáp.","B":"Khi giao dịch trực tiếp, hoặc bằng văn bản hành chính hoặc qua các phương tiện thông tin (điện thoại, thư tín, qua mạng...) phải bảo đảm thông tin được trao đổi đúng, đủ, cụ thể, chính xác các nội dung mà người nộp thuế cần hướng dẫn, trả lời.","C":"Trong mọi hình thức giao dịch (trực tiếp, văn bản, điện thoại, trực tuyến...), công chức thuế phải cung cấp thông tin kịp thời, đúng quy định, đầy đủ và cụ thể, bảo đảm người nộp thuế hiểu và thực hiện đúng hướng dẫn.","D":""},"t":"Tổng hợp"},{"n":1909,"q":"Khi giao tiếp qua điện thoại và các phương thức giao tiếp trực tuyến khác, trước tiên công chức phải:","c":{"A":"Trao đổi ngắn gọn, rõ ràng, đúng trọng tâm, sử dụng ngôn ngữ dễ hiểu, tránh gây nhầm lẫn.","B":"Giải đáp, hướng dẫn cụ thể, chính xác, nếu chưa rõ phải ghi nhận và phản hồi lại sau.","C":"Giữ thái độ lịch sự, chuẩn mực, xưng hô đúng mực, giới thiệu rõ họ tên, đơn vị công tác.","D":"Giữ bí mật thông tin theo quy định, không cung cấp thông tin khi chưa được phép."},"t":"Tổng hợp"},{"n":1910,"q":"Trong các đáp án sau chọn đáp án đúng những việc phải làm trong giao tiếp, ứng xử với người nộp thuế:","c":{"A":"Thực hiện “4 xin, 4 luôn”: Xin chào, xin lỗi, xin cảm ơn, xin phép; luôn mỉm cười, luôn nhẹ nhàng, luôn lắng nghe, luôn giúp đỡ trong giao tiếp, ứng xử với người nộp thuế.","B":"Thực hiện “4 xin, 4 luôn”: Xin chào, xin lỗi, xin cảm ơn, xin phép, luôn niềm nở, luôn tận tình, luôn lắng nghe, luôn hỗ trợ kịp thời khi giải quyết công việc cho người nộp thuế.","C":"Thực hiện “4 xin, 4 luôn”: Xin chào khi tiếp đón, xin lỗi khi có sai sót, xin cảm ơn khi được phối hợp, xin phép khi cần trao đổi, luôn thân thiện, luôn trách nhiệm, luôn cầu thị, luôn hướng dẫn, hỗ trợ chu đáo người nộp thuế.","D":""},"t":"Tổng hợp"},{"n":1911,"q":"Khi tiếp nhận phản ánh của người nộp thuế, công chức thuế phải:","c":{"A":"Phớt lờ","B":"Ghi nhận và xử lý theo quy định","C":"Tranh cãi","D":"Gửi cho người khác"},"t":"Tổng hợp"},{"n":1912,"q":"Quy tắc ứng xử với người nộp thuế nhằm nâng cao:","c":{"A":"Văn hóa công vụ","B":"Quyền mạnh nhất cho người nộp thuế","C":"Các thủ tục rườm rà","D":"Thời gian chờ"},"t":"Tổng hợp"},{"n":1913,"q":"Trang phục công chức thuế khi tiếp xúc với NNT phải:","c":{"A":"Tuân thủ theo quy định của ngành","B":"Tự do","C":"Thiếu chỉnh tề","D":"Không quan trọng"},"t":"Tổng hợp"},{"n":1914,"q":"Việc sử dụng mạng xã hội để chia sẻ thông tin sai lệch liên quan đến người nộp thuế là:","c":{"A":"Được khuyến khích","B":"Bị nghiêm cấm","C":"Trung lập","D":"Không liên quan"},"t":"Tổng hợp"},{"n":1915,"q":"Công chức thuế khi xử lý hồ sơ không được:","c":{"A":"Thực hiện đúng luật","B":"Trì hoãn, yêu cầu hồ sơ ngoài quy định","C":"Hỗ trợ qua mạng","D":"Giải thích rõ ràng"},"t":"Tổng hợp"},{"n":1916,"q":"Trong quá trình tiếp xúc với người nộp thuế, công chức thuế phải thực hiện hành vi nào sau đây?","c":{"A":"Gây khó khăn để người nộp thuế phải nhờ hỗ trợ riêng","B":"Ưu tiên giải quyết hồ sơ cho người quen trước","C":"Hướng dẫn đầy đủ, rõ ràng, đúng quy định về thủ tục thuế","D":"Từ chối tiếp nhận hồ sơ nếu chưa hoàn chỉnh mà không hướng dẫn"},"t":"Tổng hợp"},{"n":1917,"q":"Nghiêm cấm hành vi nào sau đây trong mối quan hệ với NNT?","c":{"A":"Gây khó khăn, phiền hà, kéo dài thời gian giải quyết hồ sơ.","B":"Ưu tiên giải quyết nhanh cho người thân, người quen.","C":"Gợi ý NNT chi bồi dưỡng hoặc quà biếu.","D":"Tất cả các phương án trên."},"t":"Tổng hợp"},{"n":1918,"q":"Hành vi nào sau đây vi phạm quy định về đạo đức công vụ của công chức thuế trong quan hệ với người nộp thuế?","c":{"A":"Từ chối lời mời ăn uống, quà tặng từ Người nộp thuế.","B":"Đề nghị Người nộp thuế cung cấp hồ sơ bổ sung theo đúng quy định.","C":"Gợi ý, đòi hỏi Người nộp thuế chi tiền \"bồi dưỡng\" hoặc tặng quà để giải quyết hồ sơ nhanh hơn.","D":"Hướng dẫn Người nộp thuế nộp hồ sơ qua mạng."},"t":"Tổng hợp"},{"n":1919,"q":"Theo quy tắc ứng xử của ngành Thuế, công chức thuế không được làm điều nào sau đây khi tiếp xúc với Người nộp thuế?","c":{"A":"Hướng dẫn đầy đủ các thủ tục hành chính bằng văn bản.","B":"Có thái độ hách dịch, cửa quyền, gây khó khăn, phiền hà khi giải quyết công việc.","C":"Lắng nghe và ghi chép ý kiến phản hồi của Người nộp thuế.","D":"Giải thích các quy định pháp luật thuế cho Người nộp thuế."},"t":"Tổng hợp"},{"n":1920,"q":"Khi giao dịch, công chức thuế phải đảm bảo:","c":{"A":"Thông tin sơ sài","B":"Nhiều từ chuyên môn","C":"Thông tin trao đổi đầy đủ, chính xác","D":"Không trao đổi"},"t":"Tổng hợp"},{"n":1921,"q":"Theo quy tắc ứng xử của công chức thuế, trách nhiệm đối với hồ sơ, tài liệu và bí mật kinh doanh của Người nộp thuế (NNT) được quy định như thế nào?","c":{"A":"Công chức được quyền chia sẻ thông tin của NNT với các đồng nghiệp khác để cùng nghiên cứu mà không cần sự đồng ý của lãnh đạo.","B":"Công chức có trách nhiệm giữ bí mật thông tin của NNT, không được tiết lộ, cung cấp thông tin cho bên thứ ba trừ trường hợp pháp luật có quy định hoặc được sự đồng ý của NNT.","C":"Sau khi NNT đã hoàn thành nghĩa vụ thuế, công chức thuế có quyền sử dụng thông tin kinh doanh của họ làm dữ liệu tham khảo cho cá nhân.","D":"Chỉ những thông tin được đóng dấu \"Mật\" mới cần giữ bí mật, các thông tin khác về doanh thu và lợi nhuận của NNT có thể công khai cho cơ quan truyền thông."},"t":"Tổng hợp"},{"n":1922,"q":"Theo quy tắc ứng xử của ngành Thuế, khi giao tiếp trực tiếp với Người nộp thuế (NNT), công chức thuế phải thực hiện những yêu cầu nào sau đây?","c":{"A":"Giữ thái độ nghiêm nghị để thể hiện sự uy nghiêm của cơ quan công quyền.","B":"Có thái độ lịch sự, tôn trọng, khiêm tốn; ngôn ngữ giao tiếp chuẩn mực, rõ ràng, mạch lạc.","C":"Giải quyết hồ sơ nhanh nhất có thể mà không cần giải thích thêm các quy định pháp lý.","D":"Chủ động gợi ý NNT tặng quà cảm ơn sau khi công việc đã được hoàn thành tốt đẹp."},"t":"Tổng hợp"},{"n":1923,"q":"Việc thực hiện quy tắc ứng xử là căn cứ để cơ quan Thuế thực hiện công việc nào sau đây?","c":{"A":"Đánh giá, xếp loại chất lượng công chức, viên chức hàng năm.","B":"Xét thi đua, khen thưởng và quy hoạch, bổ nhiệm cán bộ.","C":"Xem xét việc chuyển đổi vị trí công tác.","D":"Tất cả các phương án trên."},"t":"Tổng hợp"},{"n":1924,"q":"Trong phương châm của ngành Thuế, người nộp thuế được xác định là:","c":{"A":"Trung tâm phục vụ","B":"Đối tượng kiểm tra","C":"Chủ thể bị quản lý","D":"Người thực hiện nghĩa vụ"},"t":"Tổng hợp"},{"n":1925,"q":"Công chức thuế được phép phát ngôn, cung cấp thông tin cho báo chí. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1926,"q":"Công chức thuế không được phép mang, mặc trang phục thuế khi ăn, uống ở hàng quán. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1927,"q":"Công chức Thuế được phép cho, tặng trang phục ngành cho các cá nhân khác trong cùng ngành Thuế. Đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":1928,"q":"Văn bản nào quy định việc quản lý, sử dụng trang phục và thẻ của ngành thuế?","c":{"A":"Quyết định số 2733/QĐ-CT ngày 01/7/2025 của Cục Thuế","B":"Quyết định số 2733/QĐ-CT ngày 01/3/2025 của Cục Thuế","C":"Quyết định số 2733/QĐ-CT ngày 01/6/2025 của Cục Thuế","D":"Quyết định số 2733/QĐ-CT ngày 01/8/2025 của Cục Thuế"},"t":"Tổng hợp"},{"n":1929,"q":"Áp dụng hình thức kỷ luật cảnh cáo đối với công chức trong trường hợp nào sau đây?","c":{"A":"Trường hợp bán, cầm cố, tặng, cho mượn trang phục, phù hiệu, cấp hiệu, biển hiệu, thẻ công chức dẫn đến người khác sử dụng vào việc trái pháp luật","B":"Trường hợp bán, cầm cố, tặng, cho mượn trang phục, phù hiệu, cấp hiệu, biển hiệu, thẻ công chức dẫn đến người khác sử dụng","C":"Trường hợp bán, cầm cố trang phục, phù hiệu, cấp hiệu, biển hiệu, thẻ công chức dẫn đến người khác sử dụng","D":"Tất cả đáp án trên đều đúng"},"t":"Tổng hợp"},{"n":1930,"q":"Công chức thuế được mặc thường phục dân sự khi thi hành công vụ trong trường hợp nào?","c":{"A":"Thực hiện các công tác của ngành Thuế theo yêu cầu phải giữ bí mật","B":"Công chức thuế là nữ mang thai từ tháng thứ 3 trở đi đến khi sinh con được 6 tháng tuổi","C":"Công chức chưa được cấp trang phục thuế","D":"Tất cả đáp án trên đều đúng"},"t":"Tổng hợp"},{"n":1931,"q":"Quy định chung về thời gian mang, mặc trang phục thu đông của ngành Thuế?","c":{"A":"Từ tháng 10 năm trước đến hết tháng 3 năm sau","B":"Từ tháng 11 năm trước đến hết tháng 3 năm sau","C":"Từ tháng 11 năm trước đến hết tháng 4 năm sau","D":"Cả A, B và C đều sai"},"t":"Tổng hợp"},{"n":1932,"q":"Quy định chung về thời gian mang, mặc trang phục xuân hè của ngành Thuế?","c":{"A":"Từ tháng 4 đến hết tháng 10 hàng năm","B":"Từ tháng 4 đến hết tháng 9 hàng năm","C":"Từ tháng 3 đến hết tháng 10 hàng năm","D":"Cả A, B và C đều sai"},"t":"Tổng hợp"},{"n":1933,"q":"Đơn vị trực tiếp quản lý công chức có trách nhiệm thu hồi phù hiệu, cấp hiệu, biển hiệu, mũ kêpi, mũ mềm (nữ) đã cấp cho công chức trong trường hợp nào?","c":{"A":"Công chức khi thôi việc, chuyển ngành hoặc bị kỷ luật buộc thôi việc","B":"Công chức nghỉ hưu hưởng chế độ BHXH","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"t":"Tổng hợp"},{"n":1934,"q":"Quy định về việc sử dụng hộp thư điện tử công vụ như thế nào?","c":{"A":"Có thể dùng Zalo hoặc Gmail cá nhân để trao đổi việc     <div class="sbox3"><div class="sv3" style="color:#10b981" id="r-ok">0</div><div class="sl3">Câu đúng</div></div>
    <div class="sbox3"><div class="sv3" style="color:#ef4444" id="r-bad">0</div><div class="sl3">Câu sai</div></div>
    <div class="sbox3"><div class="sv3" style="color:#f59e0b" id="r-pct">0%</div><div class="sl3">Tỷ lệ</div></div>
  </div>
  <div class="rlist" id="rlist"></div>
  <button class="rbtn rb1" onclick="startQuiz()">🔄 Làm lại cùng chủ đề</button>
  <button class="rbtn rb2" onclick="goHome()">🏠 Về trang chủ</button>
</div>
</div>

<script>
// Load data an toàn từ script tag
const ALL_Q = JSON.parse(document.getElementById('qdata').textContent);
const TM = {"Thuế GTGT": {"icon": "🧾", "color": "#0ea5e9"}, "Thuế TNDN - Thu nhập / Ưu đãi": {"icon": "🏢", "color": "#6366f1"}, "Thuế TNDN - Chi phí được trừ": {"icon": "💰", "color": "#8b5cf6"}, "Kế toán": {"icon": "📊", "color": "#10b981"}, "Thuế TNCN": {"icon": "👤", "color": "#ec4899"}, "Quản lý thuế / Hoàn thuế": {"icon": "🔍", "color": "#f59e0b"}, "Hóa đơn": {"icon": "🗒️", "color": "#f97316"}, "Xử phạt VPHC thuế": {"icon": "⚖️", "color": "#ef4444"}, "Thuế nhà thầu / XNK": {"icon": "🌐", "color": "#14b8a6"}, "Giao dịch liên kết": {"icon": "🔗", "color": "#a855f7"}, "Tổng hợp": {"icon": "📚", "color": "#64748b"}};
const TOPICS = ["Tất cả (có đáp án)","Tất cả","Thuế GTGT","Thuế TNDN - Thu nhập / Ưu đãi","Thuế TNDN - Chi phí được trừ","Kế toán","Thuế TNCN","Quản lý thuế / Hoàn thuế","Hóa đơn","Xử phạt VPHC thuế","Giao dịch liên kết","Thuế nhà thầu / XNK","Tổng hợp"];

let selTopic="Tất cả (có đáp án)", sz=20;
let queue=[], idx=0, sc=0, okCnt=0, badCnt=0, log=[];
let answered=false, firstChoice=null;

function sh(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function shuf(a){
  const r=[...a];
  for(let i=r.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [r[i],r[j]]=[r[j],r[i]];
  }
  return r;
}
function getPool(t){
  if(t==='Tất cả (có đáp án)') return ALL_Q.filter(q=>q.a);
  if(t==='Tất cả') return ALL_Q;
  return ALL_Q.filter(q=>q.t===t);
}
function getMeta(t){
  if(t==='Tất cả (có đáp án)') return {icon:'⭐',color:'#f59e0b'};
  if(t==='Tất cả') return {icon:'🎲',color:'#60a5fa'};
  return TM[t]||{icon:'📚',color:'#64748b'};
}

function buildGrid(){
  const g=document.getElementById('tgrid');
  g.innerHTML='';
  TOPICS.forEach(t=>{
    const m=getMeta(t), cnt=getPool(t).length;
    const b=document.createElement('button');
    b.className='tbtn'+(t===selTopic?' on':'');
    b.style.setProperty('--ac',m.color);
    b.innerHTML=m.icon+' '+t+' <span style="opacity:.5;font-size:10px">('+cnt+')</span>';
    b.onclick=()=>{ selTopic=t; buildGrid(); updInfo(); };
    g.appendChild(b);
  });
  updInfo();
}
function setSz(n){
  sz=n;
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('on',parseInt(b.textContent)===n));
  updInfo();
}
function updInfo(){
  const cnt=getPool(selTopic).length, take=Math.min(sz,cnt);
  document.getElementById('pool-info').textContent='Sẽ bốc '+take+' câu từ '+cnt+' câu trong bộ đề này';
  document.getElementById('go-btn').disabled=cnt===0;
}

function startQuiz(){
  queue=shuf(getPool(selTopic)).slice(0,sz);
  idx=0; sc=0; okCnt=0; badCnt=0; log=[];
  answered=false; firstChoice=null;
  sh('s-quiz');
  renderQ();
}

function renderQ(){
  const q=queue[idx], tot=queue.length;
  const m=TM[q.t]||{icon:'📚',color:'#64748b'};

  document.getElementById('qi').textContent=idx+1;
  document.getElementById('qt').textContent=tot;
  document.getElementById('pfill').style.width=(idx/tot*100)+'%';
  document.getElementById('sc-sc').textContent=sc;
  document.getElementById('sc-ok').textContent=okCnt;
  document.getElementById('sc-bad').textContent=badCnt;
  document.getElementById('sc-rem').textContent=tot-idx;
  document.getElementById('qnum-lbl').textContent='Câu '+q.n;

  const ttag=document.getElementById('ttag');
  ttag.textContent=m.icon+' '+q.t;
  ttag.style.background=m.color+'1a';
  ttag.style.color=m.color;

  document.getElementById('qtext').textContent=q.q;

  const cc=document.getElementById('choices');
  cc.innerHTML='';
  Object.entries(q.c||{}).forEach(function([k,v]){
    if(!v) return;
    const b=document.createElement('button');
    b.className='cbtn';
    b.dataset.k=k;
    const letter=document.createElement('span');
    letter.className='cletter';
    letter.textContent=k;
    const txt=document.createElement('span');
    txt.textContent=v;
    b.appendChild(letter);
    b.appendChild(txt);
    b.onclick=()=>choose(k);
    cc.appendChild(b);
  });

  document.getElementById('asec').style.display='none';
  document.getElementById('retry-btn').style.display='';
  answered=false;
  firstChoice=null;
}

function choose(k){
  const q=queue[idx];
  if(answered && firstChoice && k===firstChoice) return; // Không cho chọn lại cùng đáp án

  const isRetry = answered; // Đây là lần chọn lại
  if(!answered){
    firstChoice=k;
    answered=true;
  }

  // Highlight choices
  document.querySelectorAll('.cbtn').forEach(b=>{
    b.classList.remove('sel','ok','bad');
    const bk=b.dataset.k;
    if(!q.a){
      if(bk===k) b.classList.add('sel');
    } else {
      if(bk===k && k===q.a) b.classList.add('ok');
      else if(bk===k && k!==q.a) b.classList.add('bad');
      else if(bk===q.a) b.classList.add('ok');
    }
  });

  // Answer box
  const as=document.getElementById('astatus');
  const ad=document.getElementById('adetail');
  document.getElementById('asec').style.display='block';

  if(!q.a){
    as.className='astatus na';
    as.textContent='⚠️ Câu này chưa có đáp án chuẩn';
    ad.textContent='Bạn đã chọn: '+k+'. Câu này chưa được ghi nhận đáp án đúng trong bộ đề.';
    if(!isRetry){
      log.push({n:q.n, q:q.q, ch:k, a:null, ok:null});
    }
  } else if(k===q.a){
    if(!isRetry){
      // Lần đầu chọn đúng → +1 điểm
      sc++; okCnt++;
      log.push({n:q.n, q:q.q, ch:k, a:q.a, ok:true});
      as.className='astatus ok';
      as.textContent='✅ Chính xác! +1 điểm';
    } else {
      // Chọn lại đúng → không tính điểm
      as.className='astatus ok';
      as.textContent='✅ Chính xác! (chọn lại — không tính điểm)';
      const entry=log.find(l=>l.n===q.n);
      if(entry) entry.ch=k;
    }
    ad.textContent='Đáp án đúng: '+q.a+'. '+q.c[q.a];
  } else {
    as.className='astatus bad';
    as.textContent='❌ Chưa đúng! Hãy thử lại hoặc sang câu tiếp.';
    ad.textContent='Bạn chọn: '+k+'. Đáp án đúng: '+q.a+'. '+q.c[q.a];
    if(!isRetry){
      badCnt++;
      log.push({n:q.n, q:q.q, ch:k, a:q.a, ok:false});
    } else {
      const entry=log.find(l=>l.n===q.n);
      if(entry) entry.ch=k;
    }
  }

  document.getElementById('sc-sc').textContent=sc;
  document.getElementById('sc-ok').textContent=okCnt;
  document.getElementById('sc-bad').textContent=badCnt;
  document.getElementById('retry-btn').style.display=q.a?'':'none';
  document.getElementById('next-btn').textContent=idx+1>=queue.length?'📊 Xem kết quả':'Câu tiếp →';
}

function doRetry(){
  // Cho chọn lại — reset visual nhưng giữ firstChoice để biết lần đầu
  answered=false;
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('sel','ok','bad'));
  document.getElementById('asec').style.display='none';
}

function nextQ(){
  if(idx+1>=queue.length){ showResult(); return; }
  idx++;
  renderQ();
}

function abortQuiz(){
  if(confirm('Nộp bài ngay?\nCác câu chưa làm sẽ không được tính vào kết quả.')){
    showResult();
  }
}

function showResult(){
  const tot=queue.length;
  const right=log.filter(l=>l.ok===true).length;
  const wrong=log.filter(l=>l.ok===false).length;
  const graded=right+wrong;
  const pct=graded>0?Math.round(right/graded*100):0;

  document.getElementById('r-ok').textContent=right;
  document.getElementById('r-bad').textContent=wrong;
  document.getElementById('r-pct').textContent=pct+'%';
  document.getElementById('r-score').textContent=sc+' / '+tot;
  document.getElementById('r-score').style.color=pct>=80?'#34d399':pct>=60?'#f59e0b':'#ef4444';

  const ri=document.getElementById('r-icon'), rt=document.getElementById('r-title');
  if(pct>=90){ri.textContent='🏆';rt.textContent='Xuất sắc!'}
  else if(pct>=80){ri.textContent='🎉';rt.textContent='Rất tốt!'}
  else if(pct>=60){ri.textContent='👍';rt.textContent='Khá tốt!'}
  else if(pct>=40){ri.textContent='📖';rt.textContent='Cần ôn thêm!'}
  else{ri.textContent='💪';rt.textContent='Hãy cố gắng hơn!'}

  document.getElementById('r-sub').textContent=
    'điểm · '+right+'/'+graded+' câu có đáp án · tỷ lệ đúng '+pct+'%';

  const rl=document.getElementById('rlist');
  if(log.length===0){
    rl.innerHTML='<div style="text-align:center;color:#475569;padding:20px;font-size:13px">Chưa có câu nào được ghi nhận</div>';
  } else {
    rl.innerHTML=log.map(function(l){
      const ico=l.ok===true?'✅':l.ok===false?'❌':'❓';
      let aans='';
      if(l.a){
        if(l.ok) aans='<span class="ok-c">'+l.ch+'</span>';
        else aans='<span class="bad-c">'+l.ch+'</span> <span class="arr-c">→'+l.a+'</span>';
      } else {
        aans='<span>'+l.ch+'</span>';
      }
      return '<div class="ri"><span style="font-size:14px;flex-shrink:0">'+ico+'</span>'
           +'<span class="ric">Câu '+l.n+': '+l.q.slice(0,55)+'…</span>'
           +'<span class="rians">'+aans+'</span></div>';
    }).join('');
  }
  sh('s-result');
}

function goHome(){ sh('s-home'); }

// Init
buildGrid();
</script>
</body>
</html>
