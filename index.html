n lượng khoáng sản khai thác thực tế × Mức thu phí tương ứng.","B":"Sản lượng khoáng sản tiêu thụ × Giá bán khoáng sản.","C":"Doanh thu bán khoáng sản × Tỷ lệ % phí.","D":"Trữ lượng được cấp phép × Mức thu phí"},"t":"Tổng hợp"},{"n":570,"q":"Theo Nghị định 27/2023/NĐ-CP ngày 31/5/2023 của chính phủ, ai quyết định mức thu, đơn vị tính phí BVMT đối với khai thác khoáng sản cụ thể tại địa phương?","c":{"A":"Bộ Công an.","B":"Chủ tịch UBND tỉnh.","C":"HĐND cấp tỉnh.","D":"Bộ Nông nghiệp và Môi trường"},"t":"Tổng hợp"},{"n":571,"q":"Phí BVMT đối với khai thác “tận thu” theo Nghị định 27/2023/NĐ-CP ngày 31/5/2023 của chính phủ thì khoáng sản được tính bằng:","c":{"A":"50% mức thu phí của loại khoáng sản tương ứng trong biểu khung.","B":"60% mức thu phí của loại khoáng sản tương ứng trong biểu khung.","C":"70% mức thu phí của loại khoáng sản tương ứng trong biểu khung.","D":"100% mức thu phí của loại khoáng sản tương ứng trong biểu khung"},"t":"Tổng hợp"},{"n":572,"q":"Tại Nghị định 27/2023/NĐ-CP ngày 31/5/2023 của Chính phủ thì ai quyết định mức thu, đơn vị tính phí BVMT đối với khai thác khoáng sản cụ thể tại địa phương?","c":{"A":"Uỷ ban Thường vụ Quốc hội.","B":"Chủ tịch UBND tỉnh","C":"HĐND cấp tỉnh.","D":"Quốc hội"},"t":"Tổng hợp"},{"n":573,"q":"Hộ gia đình, cá nhân khai thác khoáng sản làm vật liệu thông thường trong phạm vi diện tích đất thuộc quyền sử dụng đất theo Nghị định 27/2023/NĐ-CP ngày 31/5/2023 của chính phủ thì:","c":{"A":"Phải nộp phí BVMT như hoạt động khai thác thông thường.","B":"Được miễn phí BVMT.","C":"Chỉ được miễn 50% phí.","D":"Không phải kê khai phí"},"t":"Tổng hợp"},{"n":574,"q":"Đối tượng chịu phí BVMT nước thải theo quy định Nghị định 346/2025 ngày 29/12/2025 của Chính phủ gồm:","c":{"A":"Chỉ nước thải sinh hoạt.","B":"Chỉ nước thải công nghiệp.","C":"Nước thải công nghiệp và nước thải sinh hoạt.","D":"Tất cả nguồn nước."},"t":"Tổng hợp"},{"n":575,"q":"Phí BVMT đối với khai thác khoáng sản (không phải dầu khí) được xác định tại theo Nghị định 27/2023/NĐ-CP ngày 31/5/2023 của chính phủ:","c":{"A":"Biểu khung mức thu kèm theo Nghị định.","B":"Giá thị trường.","C":"Hợp đồng lao động.","D":"Do doanh nghiệp tự chọn"},"t":"Tổng hợp"},{"n":576,"q":"Tại Nghị định 27/2023/NĐ-CP ngày 31/5/2023 của chính phủ. Trường hợp khoáng sản khai thác phải qua sàng, tuyển, phân loại, làm giàu trước khi bán ra và các trường hợp khác mà cần thiết phải quy đổi thì cơ quan nào có thẩm quyền quyết định tỷ lệ quy đổi từ số lượng khoáng sản thành phẩm ra số lượng khoáng sản nguyên khai làm căn cứ tính phí bảo vệ môi trường:","c":{"A":"Ủy ban Thường vụ Quốc hội","B":"Bộ Tài chính","C":"Uỷ ban nhân dân cấp tỉnh","D":""},"t":"Tổng hợp"},{"n":577,"q":"Số lượng khoáng sản kê khai trong kỳ nộp phí BVMT theo Nghị định 27/2023/ NĐ-CP ngày 31/5/2023 của chính phủ là:","c":{"A":"Số lượng khoáng sản nguyên khai khai thác thực tế trong kỳ","B":"Số lượng khoáng sản bán ra thực tế trong kỳ","C":"Doanh nghiệp có thể lựa chọn kê khai theo sản lượng khoáng sản thực tế khai thác hoặc số lượng khoáng sản thực tế bán ra nhưng phải đăng ký với cơ quan thuế vào kỳ khai phí BVMT đầu tiên.","D":""},"t":"Tổng hợp"},{"n":578,"q":"Đối tượng nào phải nộp phí bảo vệ môi trường theo quy định tại Nghị định 27/2023/NĐ-CP ngày 31/5/2023 của chính phủ","c":{"A":"Tổ chức, cá nhân hoạt động khai thác khoáng sản","B":"Tổ chức, cá nhân bán khoáng sản ở khâu thương mại","C":"Doanh nghiệp hoạt động khai thác khoáng sản","D":""},"t":"Tổng hợp"},{"n":579,"q":"Theo quy định tại Luật thuế BVMT số 57/2010/QH12 ngày 15/11/2010, thuế BVMT đối với xăng thường tính theo đơn vị:","c":{"A":"Lít","B":"Kg","C":"Tấn","D":"% giá bán"},"t":"Tổng hợp"},{"n":580,"q":"Theo quy định tại Luật thuế BVMT số 57/2010/QH12 ngày 15/11/2010, hàng hóa không thuộc đối tượng chịu thuế BVMT là:","c":{"A":"Xăng","B":"Than đá","C":"Thuốc trừ mối không thuộc loại hạn chế sử dụng","D":"Túi ni lông thuộc diện chịu thuế"},"t":"Tổng hợp"},{"n":581,"q":"Theo quy định tại Luật thuế BVMT số 57/2010/QH12 ngày 15/11/2010 thì than nâu, than mỡ, than đá thuộc đối tượng:","c":{"A":"Không chịu thuế","B":"Chịu thuế BVMT","C":"Chỉ chịu thuế xuất khẩu","D":"Miễn thuế"},"t":"Tổng hợp"},{"n":582,"q":"Bảng giá tính thuế tài nguyên tại địa phương do cơ quan nào ban hành?","c":{"A":"Bộ Tài chính","B":"Tổng cục Thuế (nay là Cục Thuế)","C":"Ủy ban nhân dân cấp tỉnh","D":"Bộ Công Thương"},"t":"Tổng hợp"},{"n":583,"q":"Giá tính thuế tài nguyên đối với tài nguyên xuất khẩu được xác định căn cứ vào yếu tố nào?","c":{"A":"Giá bán trong nước của doanh nghiệp","B":"Trị giá hải quan của tài nguyên xuất khẩu","C":"Giá bán sản phẩm sau chế biến","D":"Chi phí khai thác tài nguyên"},"t":"Tổng hợp"},{"n":584,"q":"Đối với nước khoáng thiên nhiên, nước nóng thiên nhiên, nước thiên nhiên tinh lọc đóng chai, đóng hộp, nước thiên nhiên dùng cho sản xuất, kinh doanh thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Được xác định bằng mét khối (m3) hoặc lít (l) theo hệ thống đo đếm đạt tiêu chuẩn đo lường chất lượng Việt Nam.","B":"Được xác định bằng sản lượng quy đổi từ sản lượng sản phẩm sản xuất trong kỳ để bán ra theo định mức sử dụng tài nguyên tính trên một đơn vị sản phẩm.","C":"Cả hai đáp án trên đều đúng.","D":"Cả hai đáp án trên đều sai"},"t":"Tổng hợp"},{"n":585,"q":"Đối với nước thiên nhiên dùng cho sản xuất thuỷ điện thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Sản lượng điện của cơ sở sản xuất điện bán cho bên mua điện theo hợp đồng mua bán điện.","B":"Sản lượng điện giao nhận trong trường hợp không có hợp đồng mua bán điện được xác định theo hệ thống đo đếm đạt tiêu chuẩn đo lường chất lượng Việt Nam, có xác nhận của bên mua, bên bán hoặc bên giao, bên nhận.","C":"Cả hai đáp án trên đều sai.","D":"Cả A và B đều đúng"},"t":"Tổng hợp"},{"n":586,"q":"Đối với tài nguyên khai thác phải qua sản xuất, chế biến mới bán ra (tiêu thụ trong nước hoặc xuất khẩu) thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Là sản lượng tài nguyên thực tế khai thác trong kỳ.","B":"Là sản lượng tài nguyên khai thác được xác định bằng cách quy đổi từ sản lượng sản phẩm sản xuất trong kỳ để bán ra theo định mức sử dụng tài nguyên tính trên một đơn vị sản phẩm.","C":"Cả hai đáp án trên đều đúng.","D":"Cả A và B đều sai"},"t":"Tổng hợp"},{"n":587,"q":"Đối với đất, đá, phế thải, bã xít thu được qua sàng tuyển các tài nguyên tài nguyên chứa nhiều chất, tạp chất khác nhau cần phải sàng tuyển khi bán ra thì phải nộp thuế tài nguyên như thế nào?","c":{"A":"Phải nộp thuế tài nguyên đối với lượng tài nguyên có trong phế thải, bã xít bán ra theo giá bán và thuế suất cao nhất của tài nguyên có trong phế thải, bã xít.","B":"Phải nộp thuế tài nguyên đối với lượng tài nguyên có trong phế thải, bã xít bán ra theo giá bán và thuế suất thấp nhất của tài nguyên có trong phế thải, bã xít.","C":"Phải nộp thuế tài nguyên đối với lượng tài nguyên có trong phế thải, bã xít bán ra theo giá bán và thuế suất tương ứng của tài nguyên có trong phế thải, bã xít.","D":"Cả A và C đều đúng"},"t":"Tổng hợp"},{"n":588,"q":"Đối với tài nguyên khai thác chưa xác định được số lượng, trọng lượng hoặc khối lượng thực tế khai thác do chứa nhiều chất, tạp chất khác nhau thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Theo số lượng, trọng lượng hoặc khối lượng của từng chất thu được sau khi sàng tuyển, phân loại.","B":"Được xác định theo sản lượng từng loại tài nguyên có cùng cấp độ, chất lượng, giá trị thương mại như nhau.","C":"Phải quy ra sản lượng của loại tài nguyên có sản lượng bán ra lớn nhất để làm căn cứ xác định sản lượng tính thuế cho toàn bộ sản lượng tài nguyên khai thác trong kỳ.","D":"Cả hai đáp án trên đều đúng."},"t":"Tổng hợp"},{"n":589,"q":"Đối với tài nguyên khai thác xác định được số lượng, trọng lượng hoặc khối lượng thì sản lượng tài nguyên tính thuế là số lượng, trọng lượng hoặc khối lượng của?","c":{"A":"Tài nguyên thực tế khai thác và bán ra trong kỳ tính thuế","B":"Tài nguyên thực tế khai thác trong kỳ tính thuế.","C":"Cả A và B đều đúng.","D":"Cả A và B đều sai."},"t":"Tổng hợp"},{"n":590,"q":"Đối với tài nguyên thiên nhiên cấm khai thác hoặc khai thác trái phép bị bắt giữ, tịch thu thuộc đối tượng chịu thuế tài nguyên và được phép bán ra thì:","c":{"A":"Tổ chức được giao bán phải khai, nộp thuế tài nguyên theo từng lần phát sinh tại cơ quan thuế quản lý trực tiếp tổ chức được giao bán tài nguyên.","B":"Tổ chức bị tịch thu tài nguyên phải khai, nộp thuế tài nguyên theo từng lần bán.","C":"Tổ chức được giao bán không phải khai, nộp thuế tài nguyên.","D":"Tất cả các đáp án trên đều sai."},"t":"Tổng hợp"},{"n":591,"q":"Trường hợp tổ chức được cơ quan nhà nước có thẩm quyền cấp Giấy phép khai thác khoáng sản, sau đó có văn bản giao cho các đơn vị trực thuộc thực hiện khai thác tài nguyên thì người nộp thuế tài nguyên là?","c":{"A":"Tổ chức được cấp Giấy phép khai thác khoáng sản không được giao lại cho các đơn vị trực thuộc thực hiện khai thác.","B":"Các đơn vị trực thuộc thực hiện khai thác.","C":"Tổ chức được cấp Giấy phép khai thác khoáng sản.","D":"Tất cả các đáp án trên đều đúng."},"t":"Tổng hợp"},{"n":592,"q":"Người nộp thuế tài nguyên là?","c":{"A":"Tổ chức, cá nhân khai thác tài nguyên thuộc đối tượng chịu thuế tài nguyên.","B":"Doanh nghiệp khai thác tài nguyên được thành lập trên cơ sở liên doanh.","C":"Tổ chức, cá nhân khai thác tài nguyên nhỏ, lẻ bán cho tổ chức, cá nhân làm đầu mối thu mua và tổ chức, cá nhân làm đầu mối thu mua cam kết chấp thuận bằng văn bản về việc kê khai, nộp thuế thay cho tổ chức, cá nhân khai thác.","D":"Tất cả các đáp án trên."},"t":"Tổng hợp"},{"n":593,"q":"Trường hợp nào sau đây không thuộc đối tượng của thuế Tài nguyên?","c":{"A":"Hải sản tự nhiên.","B":"Yến sào thiên nhiên.","C":"Nước thiên nhiên dùng cho thủy điện","D":"Động vật do người nộp thuế nuôi tại khu vực rừng tự nhiên được khoanh nuôi"},"t":"Tổng hợp"},{"n":594,"q":"Trường hợp được miễn thuế tài nguyên là:","c":{"A":"Miễn thuế tài nguyên đối với tổ chức, cá nhân khai thác hải sản tự nhiên.","B":"Miễn thuế tài nguyên cho cá nhân khai thác nhỏ lẻ.","C":"Miễn thuế tài nguyên cho tổ chức, cá nhân khai thác cát sạn thủ công.","D":"Miễn thuế tài nguyên cho khai thác nước máy sinh hoạt."},"t":"Tổng hợp"},{"n":595,"q":"Khi quyết toán, giá tính thuế là giá bán bình quân một đơn vị sản phẩm tài nguyên được xác định bằng cách","c":{"A":"Tổng doanh thu (chưa thuế GTGT) bán tài nguyên chia cho tổng sản lượng tài nguyên bán ra tương ứng trong năm.","B":"Tổng doanh thu bán ra chia cho tổng sản lượng bán ra của tất cả tài nguyên, cấp độ khác nhau bán ra trong năm.","C":"Giá bình quân số học","D":"Giá bán của đơn vị tài nguyên cộng dồn chia cho số lần bán ra trong năm."},"t":"Tổng hợp"},{"n":596,"q":"Thuế suất thuế tài nguyên của Cát là bao nhiêu?","c":{"A":"12%","B":"14%","C":"8%","D":"15%"},"t":"Tổng hợp"},{"n":597,"q":"Bảng giá tính thuế tài nguyên tại địa phương do cơ quan nào ban hành?","c":{"A":"Bộ Tài chính","B":"Tổng cục Thuế (nay là Cục Thuế)","C":"Ủy ban nhân dân cấp tỉnh","D":"Bộ Công Thương"},"t":"Tổng hợp"},{"n":598,"q":"Giá tính thuế tài nguyên đối với tài nguyên xuất khẩu được xác định căn cứ vào yếu tố nào?","c":{"A":"Giá bán trong nước của doanh nghiệp","B":"Trị giá hải quan của tài nguyên xuất khẩu","C":"Giá bán sản phẩm sau chế biến","D":"Chi phí khai thác tài nguyên"},"t":"Tổng hợp"},{"n":599,"q":"Đối với nước khoáng thiên nhiên, nước nóng thiên nhiên, nước thiên nhiên tinh lọc đóng chai, đóng hộp, nước thiên nhiên dùng cho sản xuất, kinh doanh thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Được xác định bằng mét khối (m3) hoặc lít (l) theo hệ thống đo đếm đạt tiêu chuẩn đo lường chất lượng Việt Nam.","B":"Được xác định bằng sản lượng quy đổi từ sản lượng sản phẩm sản xuất trong kỳ để bán ra theo định mức sử dụng tài nguyên tính trên một đơn vị sản phẩm.","C":"Cả hai đáp án trên đều đúng.","D":"Cả hai đáp án trên đều sai 01"},"t":"Tổng hợp"},{"n":600,"q":"Đối với nước thiên nhiên dùng cho sản xuất thuỷ điện thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Sản lượng điện của cơ sở sản xuất điện bán cho bên mua điện theo hợp đồng mua bán điện.","B":"Sản lượng điện giao nhận trong trường hợp không có hợp đồng mua bán điện được xác định theo hệ thống đo đếm đạt tiêu chuẩn đo lường chất lượng Việt Nam, có xác nhận của bên mua, bên bán hoặc bên giao, bên nhận.","C":"Cả hai đáp án trên đều sai.","D":"Cả A và B đều đúng"},"t":"Tổng hợp"},{"n":601,"q":"Đối với tài nguyên khai thác phải qua sản xuất, chế biến mới bán ra (tiêu thụ trong nước hoặc xuất khẩu) thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Là sản lượng tài nguyên thực tế khai thác trong kỳ.","B":"Là sản lượng tài nguyên khai thác được xác định bằng cách quy đổi từ sản lượng sản phẩm sản xuất trong kỳ để bán ra theo định mức sử dụng tài nguyên tính trên một đơn vị sản phẩm.","C":"Cả hai đáp án trên đều đúng.","D":"Cả A và B đều sai"},"t":"Tổng hợp"},{"n":602,"q":"Đối với đất, đá, phế thải, bã xít thu được qua sàng tuyển các tài nguyên tài nguyên chứa nhiều chất, tạp chất khác nhau cần phải sàng tuyển khi bán ra thì phải nộp thuế tài nguyên như thế nào?","c":{"A":"Phải nộp thuế tài nguyên đối với lượng tài nguyên có trong phế thải, bã xít bán ra theo giá bán và thuế suất cao nhất của tài nguyên có trong phế thải, bã xít.","B":"Phải nộp thuế tài nguyên đối với lượng tài nguyên có trong phế thải, bã xít bán ra theo giá bán và thuế suất thấp nhất của tài nguyên có trong phế thải, bã xít.","C":"Phải nộp thuế tài nguyên đối với lượng tài nguyên có trong phế thải, bã xít bán ra theo giá bán và thuế suất tương ứng của tài nguyên có trong phế thải, bã xít.","D":"Cả A và C đều đúng"},"t":"Tổng hợp"},{"n":603,"q":"Đối với tài nguyên khai thác chưa xác định được số lượng, trọng lượng hoặc khối lượng thực tế khai thác do chứa nhiều chất, tạp chất khác nhau thì sản lượng tài nguyên tính thuế được xác định như thế nào?","c":{"A":"Theo số lượng, trọng lượng hoặc khối lượng của từng chất thu được sau khi sàng tuyển, phân loại.","B":"Được xác định theo sản lượng từng loại tài nguyên có cùng cấp độ, chất lượng, giá trị thương mại như nhau.","C":"Phải quy ra sản lượng của loại tài nguyên có sản lượng bán ra lớn nhất để làm căn cứ xác định sản lượng tính thuế cho toàn bộ sản lượng tài nguyên khai thác trong kỳ.","D":"Cả hai đáp án trên đều đúng."},"t":"Tổng hợp"},{"n":604,"q":"Đối với tài nguyên khai thác xác định được số lượng, trọng lượng hoặc khối lượng thì sản lượng tài nguyên tính thuế là số lượng, trọng lượng hoặc khối lượng của?","c":{"A":"Tài nguyên thực tế khai thác và bán ra trong kỳ tính thuế","B":"Tài nguyên thực tế khai thác trong kỳ tính thuế.","C":"Cả A và B đều đúng.","D":"Cả A và B đều sai."},"t":"Tổng hợp"},{"n":605,"q":"Đối với tài nguyên thiên nhiên cấm khai thác hoặc khai thác trái phép bị bắt giữ, tịch thu thuộc đối tượng chịu thuế tài nguyên và được phép bán ra thì:","c":{"A":"Tổ chức được giao bán phải khai, nộp thuế tài nguyên theo từng lần phát sinh tại cơ quan thuế quản lý trực tiếp tổ chức được giao bán tài nguyên.","B":"Tổ chức bị tịch thu tài nguyên phải khai, nộp thuế tài nguyên theo từng lần bán.","C":"Tổ chức được giao bán không phải khai, nộp thuế tài nguyên.","D":"Tất cả các đáp án trên đều sai."},"t":"Tổng hợp"},{"n":606,"q":"Trường hợp tổ chức được cơ quan nhà nước có thẩm quyền cấp Giấy phép khai thác khoáng sản, sau đó có văn bản giao cho các đơn vị trực thuộc thực hiện khai thác tài nguyên thì người nộp thuế tài nguyên là?","c":{"A":"Tổ chức được cấp Giấy phép khai thác khoáng sản không được giao lại cho các đơn vị trực thuộc thực hiện khai thác.","B":"Các đơn vị trực thuộc thực hiện khai thác.","C":"Tổ chức được cấp Giấy phép khai thác khoáng sản.","D":"Tất cả các đáp án trên đều đúng."},"t":"Tổng hợp"},{"n":607,"q":"Người nộp thuế tài nguyên là?","c":{"A":"Tổ chức, cá nhân khai thác tài nguyên thuộc đối tượng chịu thuế tài nguyên.","B":"Doanh nghiệp khai thác tài nguyên được thành lập trên cơ sở liên doanh.","C":"Tổ chức, cá nhân khai thác tài nguyên nhỏ, lẻ bán cho tổ chức, cá nhân làm đầu mối thu mua và tổ chức, cá nhân làm đầu mối thu mua cam kết chấp thuận bằng văn bản về việc kê khai, nộp thuế thay cho tổ chức, cá nhân khai thác.","D":"Tất cả các đáp án trên."},"t":"Tổng hợp"},{"n":608,"q":"Trường hợp nào sau đây không thuộc đối tượng của thuế Tài nguyên?","c":{"A":"Hải sản tự nhiên.","B":"Yến sào thiên nhiên.","C":"Nước thiên nhiên dùng cho thủy điện","D":"Động vật do người nộp thuế nuôi tại khu vực rừng tự nhiên được khoanh nuôi"},"t":"Tổng hợp"},{"n":609,"q":"Khi xác định giá tính thuế tài nguyên đối với sản phẩm công nghiệp được chế biến từ tài nguyên, khoản chi phí nào sau đây không được trừ?","c":{"A":"Chi phí chế biến phát sinh từ công đoạn chế biến","B":"Chi phí sản xuất sản phẩm công nghiệp","C":"Chi phí khai thác, sàng, tuyển, làm giàu hàm lượng","D":"Chi phí gia công sản phẩm"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":610,"q":"Trường hợp được miễn thuế tài nguyên là:","c":{"A":"Miễn thuế tài nguyên đối với tổ chức, cá nhân khai thác hải sản tự nhiên.","B":"Miễn thuế tài nguyên cho cá nhân khai thác nhỏ lẻ.","C":"Miễn thuế tài nguyên cho tổ chức, cá nhân khai thác cát sạn thủ công.","D":"Miễn thuế tài nguyên cho khai thác nước máy sinh hoạt."},"t":"Tổng hợp"},{"n":611,"q":"Khi quyết toán, giá tính thuế là giá bán bình quân một đơn vị sản phẩm tài nguyên được xác định bằng cách","c":{"A":"Tổng doanh thu (chưa thuế GTGT) bán tài nguyên chia cho tổng sản lượng tài nguyên bán ra tương ứng trong năm.","B":"Tổng doanh thu bán ra chia cho tổng sản lượng bán ra của tất cả tài nguyên, cấp độ khác nhau bán ra trong năm.","C":"Giá bình quân số học","D":"Giá bán của đơn vị tài nguyên cộng dồn chia cho số lần bán ra trong năm."},"t":"Tổng hợp"},{"n":612,"q":"Xác định đối tượng không chịu thuế tài nguyên","c":{"A":"Khoáng sản không kim loại","B":"Vàng khai thác","C":"Cát khai thác","D":"Rừng trồng"},"t":"Tổng hợp"},{"n":613,"q":"Đối tượng chịu thuế tài nguyên nào sau đây là đúng:","c":{"A":"Khoáng sản kim loại","B":"Rừng trồng","C":"Hải sản nuôi, trồng","D":"Cả ba đáp án đều đúng"},"t":"Tổng hợp"},{"n":614,"q":"Hao hụt 10% trong vận chuyển sau khai thác. Sản lượng tính thuế tài nguyên tính trên:","c":{"A":"Sản lượng sau hao hụt","B":"Sản lượng tiêu thụ","C":"Sản lượng khai thác","D":"Sản lượng xuất hóa đơn."},"t":"Tổng hợp"},{"n":615,"q":"Doanh nghiệp khai thác nhiều loại khoáng sản khác nhau. Việc kê khai sản lượng:","c":{"A":"Gộp chung","B":"Kê khai riêng từng loại","C":"Chỉ kê loại chính","D":"Tùy chọn"},"t":"Tổng hợp"},{"n":616,"q":"Trường hợp nào sau đây thuộc đối tượng của thuế Tài nguyên?","c":{"A":"Nước thiên nhiên dùng cho sản xuất thuỷ điện.","B":"Nước thiên nhiên dùng cho nông nghiệp.","C":"Nước thiên nhiên dùng cho diêm nghiệp.","D":"Nước biển để làm mát máy."},"t":"Tổng hợp"},{"n":617,"q":"Nếu khai thác ở nhiều địa phương khác nhau thì:","c":{"A":"Nộp thuế tại trụ sở chính","B":"Nộp thuế tại từng địa phương khai thác","C":"Chỉ nộp một nơi","D":"Không cần phân bổ"},"t":"Tổng hợp"},{"n":618,"q":"Thuế tài nguyên được nộp vào ngân sách nhà nước theo:","c":{"A":"Nơi đặt trụ sở chính","B":"Nơi tiêu thụ tài nguyên","C":"Nơi khai thác tài nguyên","D":"Nơi ký hợp đồng"},"t":"Tổng hợp"},{"n":619,"q":"Than khai thác để xuất khẩu có chịu thuế tài nguyên không?","c":{"A":"Không","B":"Có","C":"Chỉ chịu thuế xuất khẩu","D":"Được miễn thuế"},"t":"Tổng hợp"},{"n":620,"q":"Hàng hoá nào sau đây KHÔNG thuộc diện chịu thuế tài nguyên?","c":{"A":"Dầu thô","B":"Khí thiên nhiên","C":"Nước máy do công ty cấp nước sản xuất","D":"Vàng khai thác"},"t":"Tổng hợp"},{"n":621,"q":"Sản lượng tính thuế tài nguyên là:","c":{"A":"Sản lượng khai thác thực tế","B":"Sản lượng tiêu thụ","C":"Sản lượng xuất khẩu","D":"Sản lượng dự kiến"},"t":"Tổng hợp"},{"n":622,"q":"Người nộp thuế tài nguyên là:","c":{"A":"Người tiêu dùng","B":"Doanh nghiệp bán lẻ","C":"Tổ chức, cá nhân khai thác tài nguyên","D":"Cơ quan thuế"},"t":"Tổng hợp"},{"n":623,"q":"Thuế tài nguyên là loại thuế gì?","c":{"A":"Thuế gián thu","B":"Thuế trực thu","C":"Thuế xuất khẩu","D":"Thuế tiêu dùng"},"t":"Tổng hợp"},{"n":624,"q":"Thời điểm xác định sản lượng tính thuế là khi:","c":{"A":"Bán ra","B":"Khai thác","C":"Nộp thuế","D":"Ký hợp đồng"},"t":"Tổng hợp"},{"n":625,"q":"Tại tỉnh X, UBND tỉnh đã ban hành bảng giá tính thuế tài nguyên đối với đá xây dựng là 180.000 đồng/m3. Doanh nghiệp D khai thác và bán với giá 150.000 đồng/ m3, kê khai theo giá bán thực tế thấp hơn bảng giá của tỉnh. Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Doanh nghiệp được kê khai theo mọi mức giá bán thực tế dù thấp hơn bảng giá tỉnh.","B":"Bắt buộc áp dụng giá do UBND tỉnh ban hành.","C":"Khi giá kê khai không phù hợp với giá thị trường, có thể lựa chọn áp dụng giá do UBND tỉnh quy định.","D":"Bảng giá của UBND tỉnh chỉ mang tính tham khảo, không có giá trị pháp lý"},"t":"Tổng hợp"},{"n":626,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Giá tính thuế tài nguyên được xác định theo giá tại thời điểm ký hợp đồng khai thác.","B":"Giá tính thuế tài nguyên được xác định theo giá tại thời điểm cấp phép khai thác.","C":"Giá tính thuế tài nguyên gắn với sản lượng khai thác trong kỳ và được xác định theo quy định tại Điều 6 Thông tư 152/2015/TT-BTC.","D":"Giá tính thuế tài nguyên được cố định trong suốt thời gian khai thác mỏ"},"t":"Tổng hợp"},{"n":627,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Cơ quan thuế bắt buộc chấp nhận mọi mức giá do doanh nghiệp kê khai.","B":"Nếu giá bán thấp bất thường so với giá thị trường, cơ quan thuế có thể xác định lại giá tính thuế theo quy định nhưng không thấp hơn giá quy định của UBND tỉnh.","C":"Giá tính thuế luôn bằng giá xuất khẩu nếu có hoạt động xuất khẩu.","D":"Giá tính thuế được xác định theo mức lợi nhuận của doanh nghiệp."},"t":"Tổng hợp"},{"n":628,"q":"Căn cứ tính thuế tài nguyên nào sau đây là đúng?","c":{"A":"Sản lượng tài nguyên tính thuế","B":"Giá tính thuế đơn vị tài nguyên","C":"Thuế suất thuế tài nguyên","D":"Cả ba đáp án đều đúng"},"t":"Tổng hợp"},{"n":629,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Doanh nghiệp tự xác định giá tính thuế mà không cần căn cứ quy định giá của địa phương.","B":"Cơ quan thuế trung ương ấn định giá tính thuế thống nhất cho mọi địa phương.","C":"Hàng năm Ủy ban nhân dân cấp tỉnh ban hành bảng giá tính thuế tài nguyên để thực hiện cho năm tiếp theo.","D":"Giá tính thuế luôn là giá ghi trên hợp đồng mua bán."},"t":"Tổng hợp"},{"n":630,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Khi khai thác đồng thời nhiều loại tài nguyên thì chỉ kê khai thuế đối với loại có giá trị lớn nhất.","B":"Người nộp thuế phải xác định riêng sản lượng, giá tính thuế và thuế suất cho từng loại tài nguyên khai thác.","C":"Có thể gộp chung các loại tài nguyên để tính một mức thuế suất bình quân.","D":"Chỉ cần kê khai tổng doanh thu từ hoạt động khai thác tài nguyên."},"t":"Tổng hợp"},{"n":631,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Mọi hoạt động khai thác tài nguyên quy mô nhỏ đều được miễn thuế tài nguyên.","B":"Nước thiên nhiên do hộ gia đình khai thác phục vụ sinh hoạt được miễn thuế tài nguyên.","C":"Tài nguyên khai thác trong mọi trường hợp thiên tai đều được miễn toàn bộ thuế.","D":"Doanh nghiệp mới thành lập khai thác tài nguyên được miễn thuế trong 3 năm đầu."},"t":"Tổng hợp"},{"n":632,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Thuế suất thuế tài nguyên do doanh nghiệp tự lựa chọn theo mức lợi nhuận.","B":"Thuế suất thuế tài nguyên do cơ quan thuế địa phương tự quy định.","C":"Thuế suất thuế tài nguyên thực hiện theo Biểu mức thuế suất do Nhà nước ban hành theo từng loại tài nguyên.","D":"Mọi loại tài nguyên đều áp dụng cùng một mức thuế suất."},"t":"Tổng hợp"},{"n":633,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Giá tính thuế là giá thành khai thác tài nguyên.","B":"Giá tính thuế là giá sản phẩm sau chế biến.","C":"Giá tính thuế là giá bán của tài nguyên khai thác chưa có thuế GTGT nhưng không thấp hơn giá quy định của UBND cấp tỉnh.","D":"Giá tính thuế do Ủy ban nhân dân cấp xã xác định."},"t":"Tổng hợp"},{"n":634,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Nếu không xác định được sản lượng thực tế thì doanh nghiệp không phải nộp thuế tài nguyên.","B":"Cơ quan thuế có quyền ấn định thuế tài nguyên theo quy định pháp luật về quản lý thuế.","C":"Doanh nghiệp được tự kê khai sản lượng ước tính mà không cần căn cứ.","D":"Chỉ khi có kết luận thanh tra mới được xác định lại sản lượng tính thuế."},"t":"Tổng hợp"},{"n":635,"q":"Chọn đáp án đúng trong các nhận định sau:","c":{"A":"Tài nguyên khai thác dùng nội bộ trong doanh nghiệp không phải nộp thuế tài nguyên.","B":"Chỉ tài nguyên khai thác vượt Giấy phép mới phải nộp thuế tài nguyên.","C":"Tài nguyên khai thác dùng nội bộ vẫn phải tính thuế tài nguyên theo quy định.","D":"Tài nguyên dùng nội bộ chỉ phải kê khai thuế khi có lãi."},"t":"Tổng hợp"},{"n":636,"q":"Trường hợp sản phẩm tài nguyên được vận chuyển đi tiêu thụ, trong đó chi phí vận chuyển, giá bán sản phẩm tài nguyên được ghi nhận riêng trên hóa đơn thì giá tính thuế tài nguyên được xác định như thế nào?","c":{"A":"Là giá bán sản phẩm tài nguyên bao gồm cả chi phí vận chuyển.","B":"Là giá bán sản phẩm tài nguyên không bao gồm chi phí vận chuyển.","C":"Giá tính thuế tài nguyên do UBND cấp tỉnh quy định.","D":"Tất cả đáp án trên đều đúng."},"t":"Tổng hợp"},{"n":637,"q":"Theo quy định của pháp luật về thuế tài nguyên, khoáng sản tận thu trong quá trình thi công công trình có thuộc đối tượng chịu thuế tài nguyên hay không?","c":{"A":"Không thuộc đối tượng chịu thuế tài nguyên.","B":"Chỉ chịu thuế khi khối lượng tận thu vượt mức do địa phương quy định.","C":"Thuộc đối tượng chịu thuế tài nguyên theo quy định của pháp luật.","D":"Chỉ chịu thuế khi hoạt động tận thu có lãi."},"t":"Tổng hợp"},{"n":638,"q":"Theo quy định về cơ chế phối hợp quản lý thuế tài nguyên tại địa phương, trách nhiệm phối hợp cung cấp thông tin giữa cơ quan Tài nguyên và Môi trường và cơ quan thuế được hiểu như thế nào?","c":{"A":"Cơ quan thuế tự thu thập thông tin, cơ quan Tài nguyên và Môi trường không có trách nhiệm phối hợp.","B":"Cơ quan Tài nguyên và Môi trường có trách nhiệm đối chiếu sản lượng tài nguyên đã khai thác tại từng mỏ do đơn vị khai thác khai, nộp thuế với dữ liệu đã có tại cơ quan tài nguyên và môi trường. Trường hợp sản lượng khai thuế không phù hợp sản lượng được phép khai thác ghi trên Giấy phép khai thác hoặc có dấu hiệu vi phạm pháp luật thì cơ quan Tài nguyên và môi trường sẽ thực hiện các biện pháp nghiệp vụ để xác định sản lượng khai thác thực tế của đơn vị.","C":"Chỉ UBND cấp tỉnh mới có trách nhiệm cung cấp thông tin cho cơ quan thuế.","D":"Chỉ khi doanh nghiệp đề nghị thì cơ quan Tài nguyên và Môi trường mới cung cấp thông tin cho cơ quan thuế."},"t":"Tổng hợp"},{"n":639,"q":"Công ty B khai thác đá và sử dụng 60% sản lượng để xây dựng nhà xưởng nội bộ, chỉ bán 40% ra thị trường. Doanh nghiệp chỉ kê khai thuế tài nguyên trên phần bán ra. Xử lý đúng là:","c":{"A":"Chỉ tính thuế phần bán ra.","B":"Không phải tính thuế phần dùng nội bộ.","C":"Phải tính thuế trên toàn bộ sản lượng khai thác.","D":"Chỉ kê khai nhưng không nộp thuế phần tiêu dùng nội bộ."},"t":"Tổng hợp"},{"n":640,"q":"Văn bản pháp lý nào quy định biểu thuế suất thuế tài nguyên hiện hành?","c":{"A":"Luật Thuế GTGT.","B":"Nghị quyết của Ủy ban Thường vụ Quốc hội về biểu thuế suất thuế tài nguyên.","C":"Luật Doanh nghiệp.","D":"Luật Thuế tài nguyên."},"t":"Tổng hợp"},{"n":641,"q":"Trong hoạt động khai thác tài nguyên, việc kê khai thuế không phụ thuộc vào việc tài nguyên đã tiêu thụ hay chưa. Do đó, khi tài nguyên đã khai thác nhưng còn tồn kho cuối kỳ, doanh nghiệp phải:","c":{"A":"Không kê khai thuế.","B":"Kê khai và nộp thuế theo sản lượng khai thác.","C":"Chỉ kê khai khi bán ra.","D":"Được tạm miễn thuế."},"t":"Tổng hợp"},{"n":642,"q":"Một hộ gia đình khai thác nước thiên nhiên quy mô nhỏ phục vụ sinh hoạt trong phạm vi hộ gia đình theo đúng quy định pháp luật. Trường hợp này được áp dụng chính sách thuế tài nguyên như thế nào?","c":{"A":"Phải nộp thuế đầy đủ.","B":"Được miễn thuế tài nguyên theo quy định.","C":"Chỉ nộp 50% thuế.","D":"Không cần kê khai nhưng vẫn phải nộp thuế."},"t":"Tổng hợp"},{"n":643,"q":"Một doanh nghiệp khai thác cát sông và sử dụng một phần để phục vụ nội bộ cho hoạt động xây dựng công trình của chính doanh nghiệp, phần còn lại bán ra thị trường. Theo quy định về thuế tài nguyên, phần tài nguyên sử dụng nội bộ này được xử lý như thế nào?","c":{"A":"Không phải kê khai và nộp thuế.","B":"Vẫn phải tính thuế tài nguyên như tài nguyên tiêu thụ.","C":"Được miễn thuế hoàn toàn.","D":"Chỉ kê khai không nộp thuế."},"t":"Tổng hợp"},{"n":644,"q":"Theo quy định hiện hành, sản lượng tính thuế tài nguyên được xác định chủ yếu dựa trên:","c":{"A":"Sản lượng tiêu thụ trong kỳ.","B":"Số lượng, trọng lượng hoặc khối lượng của tài nguyên thực tế khai thác trong kỳ tính thuế","C":"Sản lượng dự kiến theo kế hoạch.","D":"Sản lượng xuất khẩu."},"t":"Tổng hợp"},{"n":645,"q":"Việc thu thuế tài nguyên nhằm mục tiêu chủ yếu nào dưới đây?","c":{"A":"Khuyến khích khai thác tối đa tài nguyên.","B":"Điều tiết hoạt động khai thác và góp phần bảo vệ tài nguyên.","C":"Tăng tiêu dùng nội địa.","D":"Hỗ trợ xuất khẩu khoáng sản."},"t":"Tổng hợp"},{"n":646,"q":"Trong các trường hợp sau, trường hợp nào thuộc đối tượng chịu thuế tài nguyên?","c":{"A":"Sản phẩm công nghiệp đã qua chế biến.","B":"Khoáng sản kim loại khai thác từ lòng đất.","C":"Hàng hóa nhập khẩu.","D":"Dịch vụ khai thác thuê."},"t":"Tổng hợp"},{"n":647,"q":"Theo quy định về nghĩa vụ thuế tài nguyên, tổ chức, cá nhân nhận thầu thi công công trình trong quá trình thi công có phát sinh sản lượng tài nguyên và được phép khai thác sử dụng hoặc tiêu thụ thì phải thực hiện nghĩa vụ nào sau đây?","c":{"A":"Không phải nộp thuế tài nguyên vì hoạt động khai thác chỉ mang tính chất phát sinh.","B":"Chỉ phải kê khai thuế khi sản lượng tài nguyên vượt mức do cơ quan thuế quy định.","C":"Phải khai và nộp thuế tài nguyên với cơ quan thuế địa phương nơi phát sinh tài nguyên khai thác.","D":"Chỉ phải nộp thuế tài nguyên tại nơi đặt trụ sở chính của doanh nghiệp."},"t":"Tổng hợp"},{"n":648,"q":"Theo quy định về trách nhiệm của Ủy ban nhân dân cấp tỉnh, cơ quan nào được giao chủ trì xây dựng Bảng giá tính thuế tài nguyên áp dụng tại địa phương?","c":{"A":"Thuế tỉnh/thành phố.","B":"Sở Tài chính, phối hợp với các cơ quan liên quan.","C":"Sở Công thương, phối hợp với các cơ quan liên quan.","D":"Hội đồng nhân dân cấp tỉnh."},"t":"Tổng hợp"},{"n":649,"q":"Trường hợp tài nguyên khai thác có chứa nhiều chất khác nhau, sản lượng tính thuế được xác định như thế nào?","c":{"A":"Tính chung cho toàn bộ khối lượng tài nguyên khai thác","B":"Xác định sản lượng của từng chất có trong tài nguyên để tính thuế","C":"Chỉ tính thuế đối với chất có giá trị cao nhất","D":"Không phải nộp thuế"},"t":"Tổng hợp"},{"n":650,"q":"Quy định khai thuế tài nguyên nào dưới đây là đầy đủ nhất.","c":{"A":"Tháng, từng lần phát sinh","B":"Tháng, từng lần phát sinh, quyết toán năm","C":"Tháng, từng lần phát sinh, từng lần xuất bán","D":"Tháng, từng lần phát sinh, từng lần xuất bán, quyết toán năm"},"t":"Tổng hợp"},{"n":651,"q":"Trường hợp trong tháng có khai thác tài nguyên nhưng không phát sinh doanh thu bán tài nguyên thì giá tính thuế tài nguyên được xác định như thế nào?","c":{"A":"Là giá tính thuế đơn vị tài nguyên bình quân cả kỳ của tháng trước gần nhất có doanh thu.","B":"Là giá tính thuế đơn vị tài nguyên bình quân gia quyền của tháng trước gần nhất có doanh thu.","C":"Đơn vị khai thác không phải nộp thuế tài nguyên cho tháng đó.","D":"Cả hai đáp án A và B đều đúng."},"t":"Tổng hợp"},{"n":652,"q":"Thời hạn nộp thuế thuế tài nguyên, thuế thu nhập doanh nghiệp theo lần xuất bán dầu thô là bao nhiêu ngày, kể từ ngày xuất bán đối với dầu thô bán nội địa.","c":{"A":"20 ngày","B":"30 ngày","C":"35 ngày","D":"45 ngày"},"t":"Tổng hợp"},{"n":653,"q":"Thời hạn nộp tiền cấp quyền khai thác nước từ năm thứ hai trở đi theo quy định của Luật quản lý thuế và các văn bản hướng dẫn hiện hành.","c":{"A":"Chậm nhất là 90 ngày, kể từ ngày ban hành thông báo của cơ quan thuế.","B":"Được chọn nộp tiền cấp quyền khai thác tài nguyên nước một lần hoặc hai lần trong năm. Trường hợp người nộp thuế chọn nộp tiền cấp quyền khai thác tài nguyên nước một lần trong năm thì thời hạn nộp tiền chậm nhất là 31 tháng 5.","C":"Trường hợp người nộp thuế chọn nộp tiền cấp quyền khai thác tài nguyên nước hai lần trong năm thì thời hạn nộp tiền cho từng kỳ như sau: kỳ thứ nhất nộp 50% chậm nhất là ngày 31 tháng 5; kỳ thứ hai nộp đủ phần còn lại chậm nhất là ngày 31 tháng 10","D":"Cả B và C đều đúng"},"t":"Tổng hợp"},{"n":654,"q":"Trường hợp nào không được miễn thuế tài nguyên","c":{"A":"Tổ chức, cá nhân khai thác cành, ngọn, củi, tre, trúc, nứa, mai, giang, tranh, vầu, lồ ô do cá nhân được phép khai thác phục vụ sinh hoạt.","B":"Tổ chức, cá nhân khai thác hải sản tự nhiên.","C":"Đất khai thác để san lấp, xây dựng công trình công cộng.","D":"Đất do tổ chức, cá nhân được giao, được thuê khai thác và sử dụng tại chỗ trên diện tích đất được giao, được thuê"},"t":"Tổng hợp"},{"n":655,"q":"Trường hợp nào được giảm thuế tài nguyên","c":{"A":"Tổ chức, cá nhân khai thác cành, ngọn, củi, tre, trúc, nứa, mai, giang, tranh, vầu, lồ ô do cá nhân được phép khai thác phục vụ sinh hoạt.","B":"Tổ chức, cá nhân khai thác hải sản tự nhiên.","C":"Người nộp thuế tài nguyên gặp thiên tai, hoả hoạn, tai nạn bất ngờ gây tổn thất đến tài nguyên đã kê khai, nộp thuế.","D":"Cả A và B đều đúng"},"t":"Tổng hợp"},{"n":656,"q":"Người nộp thuế tài nguyên là","c":{"A":"Đối với hoạt động khai thác tài nguyên khoáng sản thì người nộp thuế là tổ chức, hộ kinh doanh được cơ quan nhà nước có thẩm quyền cấp Giấy phép khai thác khoáng sản","B":"Doanh nghiệp khai thác tài nguyên được thành lập trên cơ sở liên doanh thì doanh nghiệp liên doanh là người nộp thuế","C":"Tổ chức, cá nhân sử dụng nước từ công trình thuỷ lợi để phát điện là người nộp thuế tài nguyên theo quy định tại Thông tư này, không phân biệt nguồn vốn đầu tư công trình thuỷ lợi","D":"Tất cả các phương án trên"},"t":"Tổng hợp"},{"n":657,"q":"Người nộp thuế tài nguyên nào sau đây được miễn thuế tài nguyên","c":{"A":"Tổ chức, cá nhân khai thác tài nguyên","B":"Tổ chức, cá nhân nhận thầu thi công công trình trong quá trình thi công có phát sinh sản lượng tài nguyên.","C":"Hộ gia đình, cá nhân khai thác phục vụ sinh hoạt","D":"Cả B và C đều đúng"},"t":"Tổng hợp"},{"n":658,"q":"Đối tượng nộp thuế tài nguyên đối với Trường hợp tổ chức được cơ quan nhà nước có thẩm quyền cấp Giấy phép khai thác khoáng sản, sau đó có văn bản giao cho các đơn vị trực thuộc thực hiện khai thác tài nguyên","c":{"A":"Tổ chức được cơ quan nhà nước có thẩm quyền cấp Giấy phép khai thác khoáng sản.","B":"Mỗi đơn vị trực thuộc khai thác là người nộp thuế tài nguyên.","C":"Tổ chức được cơ quan nhà nước có thẩm quyền cấp Giấy phép khai thác khoáng sản và các đơn vị trực thuộc khai thác là người nộp thuế tài nguyên.","D":"Cả B và C đều đúng"},"t":"Tổng hợp"},{"n":659,"q":"Đối tượng chịu thuế tài nguyên không bao gồm:","c":{"A":"Khoáng sản kim loại, Khoáng sản không kim loại.","B":"Yến sào do tổ chức, cá nhân thu được từ hoạt động đầu tư xây dựng nhà để dẫn dụ chim yến tự nhiên về nuôi và khai thác.","C":"Hải sản tự nhiên, gồm động vật và thực vật biển.","D":"Cả B và C đều đúng"},"t":"Tổng hợp"},{"n":660,"q":"Căn cứ tính thuế tài nguyên.","c":{"A":"Sản lượng tài nguyên tính thuế, giá tính thuế tài nguyên, thuế suất thuế tài nguyên.","B":"Sản lượng tài nguyên tính thuế, giá tính thuế tài nguyên, thuế suất thuế tài nguyên, chi phí khai thác tài nguyên.","C":"Sản lượng tài nguyên tính thuế, giá tính thuế tài nguyên, thuế suất thuế tài nguyên, tổng doanh thu, chi phí khai thác tài nguyên.","D":"Tất cả đều sai"},"t":"Tổng hợp"},{"n":661,"q":"Sản lượng tài nguyên tính thuế được xác định trong trường hợp tài nguyên khai thác thu được sản phẩm tài nguyên có nhiều cấp độ, chất lượng, giá trị thương mại khác nhau:","c":{"A":"Sản lượng từng loại tài nguyên có cùng cấp độ, chất lượng, giá trị thương mại như nhau hoặc quy ra sản lượng của loại tài nguyên có sản lượng bán ra lớn nhất để làm căn cứ xác định sản lượng tính thuế cho toàn bộ sản lượng tài nguyên khai thác trong kỳ.","B":"Quy ra sản lượng của loại tài nguyên có sản lượng bán ra lớn nhất để làm căn cứ xác định sản lượng tính thuế cho toàn bộ sản lượng tài nguyên khai thác trong kỳ.","C":"Sản lượng từng loại tài nguyên có cùng cấp độ, chất lượng, giá trị thương mại như nhau.","D":"Tất cả đều đúng"},"t":"Tổng hợp"},{"n":662,"q":"Sản lượng tài nguyên tính thuế khi quyết toán thuế đối với hoạt động khai thác khoáng sản:","c":{"A":"Sản lượng tài nguyên tính thuế là tổng sản lượng tài nguyên khai thác trong năm, không phân biệt tồn kho hay đang trong quá trình chế biến hoặc vận chuyển.","B":"Sản lượng tài nguyên tính thuế là số lượng, trọng lượng hoặc khối lượng của tài nguyên thực tế khai thác chế biến trong kỳ tính thuế.","C":"Sản lượng tài nguyên tính thuế được xác định đối với từng chất căn cứ sản lượng tài nguyên thực tế khai thác (quặng) và tỷ lệ của từng chất có trong tài nguyên.","D":"Tất cả đều sai"},"t":"Tổng hợp"},{"n":663,"q":"Trong trường hợp tài nguyên khai thác được bán ra thị trường trong nước, giá tính thuế được xác định theo nguyên tắc nào?","c":{"A":"Giá bán lẻ đã bao gồm thuế GTGT.","B":"Giá bán đơn vị sản phẩm tài nguyên chưa có thuế GTGT.","C":"Giá do doanh nghiệp tự kê khai không cần căn cứ.","D":"Giá nhập khẩu tương đương."},"t":"Tổng hợp"},{"n":664,"q":"Các trường hợp điều chỉnh khung giá tính thuế tài nguyên theo quy định tại Thông tư 41/2024/TT-BTC ngày 20/5/2024 của Bộ Tài chính:","c":{"A":"Giá tài nguyên phổ biến trên thị trường biến động giảm từ 20% và tăng từ 20% so với mức giá tối thiểu của Khung giá tính thuế tài nguyên;","B":"Giá tài nguyên phổ biến trên thị trường biến động giảm trên 20% hoặc tăng trên 20% so với mức giá tối thiểu của Khung giá tính thuế tài nguyên;","C":"Phát sinh loại tài nguyên mới chưa được quy định trong Khung giá tính thuế tài nguyên.","D":"Tất cả đều đúng"},"t":"Tổng hợp"},{"n":665,"q":"Căn cứ tính thuế tài nguyên được pháp luật quy định dựa trên nguyên tắc phản ánh đầy đủ giá trị tài nguyên khai thác. Theo đó, các yếu tố nào là căn cứ bắt buộc để xác định số thuế tài nguyên phải nộp?","c":{"A":"Doanh thu, chi phí và lợi nhuận.","B":"Sản lượng tài nguyên khai thác, giá tính thuế và thuế suất.","C":"Giá bán và lợi nhuận sau thuế.","D":"Doanh thu và tỷ lệ khấu hao."},"t":"Tổng hợp"},{"n":666,"q":"Giá bán điện thương phẩm bình quân để tính thuế tài nguyên đối với các cơ sở sản xuất thủy điện được xác định theo giá bán lẻ điện bình quân do cơ quan nào quy định.","c":{"A":"Bộ Tài chính","B":"Cục Điện lực và Năng lượng tái tạo","C":"Tập đoàn điện lực Việt Nam","D":"Bộ Công Thương"},"t":"Tổng hợp"},{"n":667,"q":"Giá tính thuế tài nguyên đối với nước thiên nhiên dùng sản xuất thủy điện là","c":{"A":"Giá bán điện thương phẩm bình quân.","B":"Giá bán lẻ điện sinh hoạt cho người dân","C":"Giá bán lẻ điện bình quân","D":"cả a và b đều sai"},"t":"Tổng hợp"},{"n":668,"q":"Đối với nước khoáng thiên nhiên, nước nóng thiên nhiên, nước thiên nhiên tinh lọc đóng chai, đóng hộp, nước thiên nhiên dùng cho sản xuất, kinh doanh mà không có giá bán ra thì giá tính thuế tài nguyên do:","c":{"A":"Cơ quan thuế thực hiện ấn định theo quy định của Luật quản lý thuế","B":"Giá tính thuế tài nguyên do UBND cấp tỉnh quy định theo nguyên tắc hướng dẫn tại khoản 5 Điều 6 Thông tư 152/2015/TT-BTC.","C":"Cả 02 đáp án trên đều sai.","D":"Cả 02 đáp án trên đều đúng."},"t":"Tổng hợp"},{"n":669,"q":"Trường hợp trong tháng có khai thác tài nguyên nhưng không phát sinh doanh thu bán tài nguyên thì giá tính thuế tài nguyên","c":{"A":"Giá tính thuế đơn vị tài nguyên bình quân của tháng trước gần nhất có doanh thu;","B":"Đơn vị khai thác chưa phải kê khai nộp thuế tài nguyên.","C":"Giá tính thuế đơn vị tài nguyên bình quân gia quyền của tháng trước gần nhất có doanh thu;","D":"Tất cả đều sai"},"t":"Tổng hợp"},{"n":670,"q":"Giá tính thuế tài nguyên đối với loại tài nguyên xác định được giá bán đơn vị sản phẩm tài nguyên là?","c":{"A":"Giá bán đơn vị sản phẩm tài nguyên có cùng phẩm cấp, chất lượng chưa bao gồm thuế giá trị gia tăng và được áp dụng cho toàn bộ sản lượng tài nguyên khai thác và bán ra trong tháng.","B":"Giá bán đơn vị sản phẩm tài nguyên có cùng phẩm cấp, chất lượng đã bao gồm thuế giá trị gia tăng và được áp dụng cho toàn bộ sản lượng tài nguyên khai thác và bán ra trong tháng.","C":"Giá bán đơn vị sản phẩm tài nguyên có cùng phẩm cấp, chất lượng chưa bao gồm thuế giá trị gia tăng và được áp dụng cho toàn bộ sản lượng tài nguyên khai thác trong tháng.","D":"Cả A và C đều đúng."},"t":"Tổng hợp"},{"n":671,"q":"Trường hợp sản phẩm tài nguyên được vận chuyển đi tiêu thụ, trong đó chi phí vận chuyển, giá bán sản phẩm tài nguyên được ghi nhận riêng trên hóa đơn thì giá tính thuế tài nguyên","c":{"A":"Giá bán sản phẩm tài nguyên không bao gồm chi phí vận chuyển.","B":"Giá bán sản phẩm tài nguyên bao gồm chi phí vận chuyển.","C":"Giá tính thuế tài nguyên do UBND quy định.","D":"Tất cả đều sai"},"t":"Tổng hợp"},{"n":672,"q":"Đối với tài nguyên khai thác mà phải qua sản xuất, chế biến mới bán ra là sản phẩm tài nguyên thì giá tính thuế được xác định như thế nào?","c":{"A":"Là giá bán đơn vị sản phẩm tài nguyên tương ứng với sản lượng tài nguyên bán ra ghi trên chứng từ bán hàng.","B":"Là giá bán đơn vị sản phẩm tài nguyên tương ứng với sản lượng tài nguyên bán ra ghi trên chứng từ bán hàng trừ đi chi phí chế biến phát sinh của công đoạn chế biến.","C":"Là giá bán đơn vị sản phẩm tài nguyên tương ứng với sản lượng tài nguyên bán ra ghi trên chứng từ bán hàng nhưng không thấp hơn giá tính thuế do UBND cấp tỉnh quy định.","D":"Cả A và C đều đúng."},"t":"Tổng hợp"},{"n":673,"q":"Đối với loại tài nguyên không xác định được giá bán đơn vị tài nguyên khai thác do có chứa nhiều chất khác nhau thì giá tính thuế tài nguyên là:","c":{"A":"Giá tính thuế là giá bán đơn vị tài nguyên của từng chất, được xác định căn cứ tổng doanh thu bán tài nguyên trong tháng (chưa có thuế GTGT) tính cho từng chất có trong tài nguyên khai thác theo tỷ lệ hàm lượng của từng chất đã được cơ quan nhà nước có thẩm quyền kiểm phê duyệt và sản lượng tài nguyên bán ra ghi trên chứng từ bán hàng tương ứng với từng chất.","B":"Giá bán thực tế trên thị trường khu vực của từng đơn vị sản phẩm tài nguyên cùng loại nhưng không thấp hơn giá tính thuế do Ủy ban nhân dân cấp tỉnh quy định.","C":"Giá tính thuế tài nguyên là giá bán đơn vị sản phẩm tài nguyên có cùng phẩm cấp, chất lượng chưa bao gồm thuế giá trị gia tăng và được áp dụng cho toàn bộ sản lượng tài nguyên khai thác trong tháng; Giá bán của một đơn vị tài nguyên được tính bằng tổng doanh thu (chưa có thuế GTGT) của loại tài nguyên bán ra chia cho tổng sản lượng tài nguyên tương ứng bán ra trong tháng.","D":"Tất cả đều sai"},"t":"Tổng hợp"},{"n":674,"q":"Giá tính thuế khi quyết toán thuế đối với hoạt động khai thác khoáng sản.","c":{"A":"Giá tính thuế tài nguyên là giá bán đơn vị sản phẩm tài nguyên của tổ chức, cá nhân khai thác chưa bao gồm thuế giá trị gia tăng nhưng không được thấp hơn giá tính thuế tài nguyên do UBND cấp tỉnh quy định.","B":"Giá tính thuế tài nguyên là giá bán đơn vị sản phẩm tài nguyên có cùng phẩm cấp, chất lượng chưa bao gồm thuế giá trị gia tăng và được áp dụng cho toàn bộ sản lượng tài nguyên khai thác trong tháng;","C":"Giá tính thuế là giá bán bình quân một đơn vị sản phẩm tài nguyên được xác định bằng cách lấy tổng doanh thu bán tài nguyên chia cho tổng sản lượng tài nguyên bán ra tương ứng trong năm.","D":"Tất cả đều sai"},"t":"Tổng hợp"},{"n":675,"q":"Khi xác định giá tính thuế tài nguyên đối với sản phẩm công nghiệp được chế biến từ tài nguyên, khoản chi phí nào sau đây không được trừ?","c":{"A":"Chi phí chế biến phát sinh từ công đoạn chế biến","B":"Chi phí sản xuất sản phẩm công nghiệp","C":"Chi phí khai thác, sàng, tuyển, làm giàu hàm lượng","D":"Chi phí gia công sản phẩm"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":676,"q":"Thuế suất thuế tài nguyên của Cát là bao nhiêu?","c":{"A":"12%","B":"14%","C":"8%","D":"15%"},"t":"Tổng hợp"},{"n":677,"q":"Ông A là cá nhân cư trú, trong năm 2026 có đăng ký giảm trừ gia cảnh cho vợ là bà B. Bà B 49 tuổi, trong độ tuổi lao động, không bị khuyết tật, trong năm chỉ phát sinh thu nhập từ bán hàng online nhỏ lẻ với tổng doanh thu 9 triệu đồng/năm. Theo quy định của Luật Thuế thu nhập cá nhân hiện hành, việc ông A đăng ký bà B là người phụ thuộc được xác định như thế nào?","c":{"A":"Không được tính là người phụ thuộc vì bà B đang trong độ tuổi lao động","B":"Không được tính là người phụ thuộc vì bà B có phát sinh thu nhập trong năm","C":"Không được tính là người phụ thuộc vì bà B trong độ tuổi lao động và không thuộc trường hợp mất khả năng lao động","D":"Được tính là người phụ thuộc"},"t":"Thuế TNCN"},{"n":678,"q":"Tháng 2/2026, bà A phát sinh các khoản thu nhập sau trong năm: - Nhận tiền trúng thưởng từ chương trình khuyến mại với số tiền 19 triệu đồng; - Nhận tiền bản quyền từ việc cho phép sử dụng tác phẩm với số tiền 21 triệu đồng; - Nhận quà tặng bằng tiền từ một cá nhân khác với giá trị 50 triệu đồng. Các khoản thu nhập trên đều phát sinh riêng lẻ, không đồng thời. Phát biểu nào sau đây là đúng?","c":{"A":"Tất cả các khoản thu nhập nêu trên đều thuộc diện chịu thuế thu nhập cá nhân","B":"Chỉ các khoản thu nhập có giá trị từ 21 triệu đồng trở lên mới thuộc diện chịu thuế thu nhập cá nhân","C":"Các khoản thu nhập từ tiền bản quyền và quà tặng thuộc diện chịu thuế thu nhập cá nhân","D":"Chỉ khoản thu nhập từ quà tặng 50 triệu đồng thuộc diện chịu thuế thu nhập cá nhân"},"t":"Thuế TNCN"},{"n":679,"q":"Năm 2025, ông A là cá nhân cư trú tại Việt Nam ký hợp đồng lao động và làm việc thường xuyên tại Công ty X. Ngoài ra, trong năm, ông A còn phát sinh thu nhập từ 2 đơn vị khác theo từng lần chi trả tổng 200 triệu đồng; các khoản thu nhập này đã được khấu trừ 10% thuế TNCN tại nguồn. Khi thực hiện quyết toán thuế TNCN năm 2025, ông A dự kiến ủy quyền cho Công ty X thực hiện quyết toán thay cho mình. Theo quy định của pháp luật thuế hiện hành, việc ủy quyền quyết toán thuế của ông A được xác định như thế nào?","c":{"A":"Không đủ điều kiện ủy quyền, do có thu nhập vãng lai ở các nơi khác bình quân tháng trong năm vượt quá 10 triệu đồng","B":"Được ủy quyền, do ông A đang làm việc tại Công ty X vào thời điểm quyết toán","C":"Được ủy quyền, vì các khoản thu nhập ngoài Công ty X đã bị khấu trừ thuế đầy đủ","D":"Được ủy quyền, nếu ông A không yêu cầu quyết toán đối với các khoản thu nhập phát sinh ngoài Công ty X"},"t":"Thuế TNCN"},{"n":680,"q":"Bà B mang quốc tịch nước ngoài, có hợp đồng thuê nhà để ở tại Việt Nam thời hạn 01 năm, trong năm tính thuế chỉ có mặt tại Việt Nam 160 ngày. Trường hợp bà B không xuất trình được Giấy chứng nhận cư trú của quốc gia khác theo quy định của điều ước quốc tế mà Việt Nam là thành viên thì bà B được xác định là:","c":{"A":"Cá nhân không cư trú","B":"Cá nhân cư trú của quốc gia mang quốc tịch","C":"Cá nhân cư trú tại Việt Nam","D":"Cá nhân cư trú tại Việt Nam nếu có thu nhập phát sinh trong lãnh thổ Việt Nam"},"t":"Thuế TNDN - Chi phí được trừ"},{"n":681,"q":"Ông B là người nước ngoài lần đầu tiên đến Việt Nam là ngày 20/4/2023. Trong năm 2023 tính đến ngày 31/12/2023, ông B có mặt tại Việt Nam tổng cộng 130 ngày. Trong năm 2024, tính đến ngày 19/4/2024 ông B có mặt tại Việt Nam tổng cộng 65 ngày. Kỳ tính thuế đầu tiên của ông B được xác định Từ ngày 20/4/2023 đến ngày 31/12/2023, nhận định trên đúng hay sai?","c":{"A":"Đúng","B":"Sai","C":"","D":""},"t":"Tổng hợp"},{"n":682,"q":"Chị B là cá nhân cư trú tại Việt Nam, trong năm 2026 chị B có phát sinh thu nhập từ việc chuyển nhượng vàng miếng. Kỳ tính thuế đối với khoản thu nhập này được xác định như thế nào?","c":{"A":"Theo năm","B":"Theo quý","C":"Theo từng lần phát sinh thu nhập","D":"Theo tháng"},"t":"Thuế TNCN"},{"n":683,"q":"Ông A là chủ công ty TNHH một thành viên kinh doanh về vật liệu xây dựng. Năm 2025, công ty đã thực hiện kê khai và nộp thuế thu nhập doanh nghiệp theo quy định. Sau khi nộp thuế, ông A sử dụng phần lợi nhuận còn lại để chi tiêu cá nhân, khoản tiền này có phải nộp thuế TNCN không?","c":{"A":"Phải nộp thuế TNCN theo biểu thuế lũy tiến từng phần","B":"Phải nộp thuế TNCN với thuế suất 5%","C":"Không phải nộp thuế TNCN","D":"Phải kê khai quyết toán thuế TNCN"},"t":"Thuế TNCN"},{"n":684,"q":"Ông A là cá nhân cư trú tại Việt Nam, trong năm có thu nhập từ tiền lương phát sinh tại Nhật Bản (quốc gia đã ký Hiệp định tránh đánh thuế hai lần với Việt Nam) và đã nộp thuế thu nhập cá nhân tại Nhật Bản theo quy định của nước này. Khi quyết toán thuế TNCN tại Việt Nam, khoản thuế đã nộp tại Nhật Bản được xử lý như thế nào?","c":{"A":"Không được trừ khi tính thuế tại Việt Nam","B":"Được trừ toàn bộ số thuế đã nộp tại Nhật Bản","C":"Được trừ số thuế đã nộp tại Nhật Bản nhưng không vượt quá số thuế phải nộp theo biểu thuế của Việt Nam tính phân bổ cho phần thu nhập phát sinh tại nước ngoài","D":"Chỉ được trừ 50% số thuế đã nộp tại Nhật Bản"},"t":"Thuế TNCN"},{"n":685,"q":"Ông A là nhân viên của Công ty X, được thưởng bằng cổ phiếu của công ty theo chương trình thưởng cho người lao động. Theo quy định về thuế TNCN, thời điểm nào ông A phải kê khai thuế đối với khoản thu nhập này là khi nào?","c":{"A":"Ngay khi nhận cổ phiếu thưởng","B":"Khi cổ phiếu được niêm yết trên thị trường chứng khoán","C":"Khi cá nhân chuyển nhượng cổ phiếu thưởng","D":"Khi kết thúc năm tính thuế"},"t":"Thuế TNCN"},{"n":686,"q":"Ông A là cá nhân không cư trú tại Việt Nam, trong năm ông nhận 200 triệu đồng tiền lương do thực hiện công việc tại Việt Nam. Thuế thu nhập cá nhân phải nộp của ông A được xác định như thế nào?","c":{"A":"Áp dụng biểu thuế lũy tiến từng phần","B":"Áp dụng thuế suất 10% trên thu nhập","C":"Áp dụng thuế suất 20% trên tổng thu nhập từ tiền lương, tiền công nhận được","D":"Áp dụng thuế suất 20% sau khi trừ giảm trừ gia cảnh"},"t":"Thuế TNCN"},{"n":687,"q":"Công ty A thuê dịch vụ khai thuế thu nhập cá nhân cho ông B (Giám đốc công ty). Chi phí này do công ty thanh toán trực tiếp cho đơn vị tư vấn. Theo quy định về thuế TNCN, khoản chi này được xác định như thế nào?","c":{"A":"Không tính vào thu nhập chịu thuế của ông B","B":"Tính vào thu nhập chịu thuế của ông B","C":"Chỉ tính 50% vào thu nhập chịu thuế","D":"Chỉ tính vào thu nhập chịu thuế nếu ông B nhận tiền mặt"},"t":"Thuế TNCN"},{"n":688,"q":"Ông A được cơ quan bố trí chỗ ở tại trụ sở làm việc. Tổng chi phí tiền thuê nhà, điện, nước và các dịch vụ khác của toàn bộ trụ sở trong tháng là 20 triệu đồng. Diện tích ông A sử dụng để ở chiếm 10% tổng diện tích trụ sở. Thu nhập chịu thuế từ tiền nhà ở tính vào thu nhập chịu thuế TNCN của ông A trong tháng là bao nhiêu?","c":{"A":"1 triệu đồng","B":"2 triệu đồng","C":"20 triệu đồng","D":"Miễn thuế TNCN"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":689,"q":"Công ty A trả lương tháng 12/2025 cho người lao động vào ngày 05/01/2026. Theo quy định, thời điểm xác định thu nhập tính thuế TNCN đối với khoản tiền lương này là:","c":{"A":"Tháng 12/2025","B":"Tháng 01/2026","C":"Thời điểm ký hợp đồng lao động","D":"Thời điểm quyết toán thuế"},"t":"Thuế TNCN"},{"n":690,"q":"Chị H không nghỉ phép năm theo quy định và được công ty thanh toán tiền lương cho những ngày chưa nghỉ phép. Theo Luật Thuế TNCN năm 2025, khoản tiền này:","c":{"A":"Là thu nhập chịu thuế TNCN","B":"Là thu nhập từ tiền lương phải tính thuế","C":"Là thu nhập được miễn thuế TNCN","D":"Chỉ miễn thuế nếu dưới 10 triệu đồng"},"t":"Thuế TNCN"},{"n":691,"q":"Tháng 3/2026, anh A nhận học bổng từ ngân sách nhà nước theo chương trình hỗ trợ khuyến học để tham gia chương trình đào tạo thạc sĩ. Khoản học bổng này được xác định như thế nào khi tính thuế TNCN?","c":{"A":"Là thu nhập chịu thuế từ tiền lương, tiền công","B":"Là thu nhập chịu thuế từ quà tặng","C":"Là thu nhập được miễn thuế TNCN","D":"Phải tính thuế nếu nhận trên 20 triệu đồng"},"t":"Thuế TNCN"},{"n":692,"q":"Ông A có đăng ký thường trú tại Việt Nam nhưng trong năm tính thuế chỉ có mặt tại Việt Nam 120 ngày. Ông A cũng không cung cấp được giấy tờ chứng minh là cá nhân cư trú của bất kỳ quốc gia nào khác. Theo quy định của pháp luật thuế TNCN, ông A được xác định là:","c":{"A":"Cá nhân không cư trú tại Việt Nam","B":"Cá nhân cư trú tại Việt Nam","C":"Cá nhân cư trú tại nước ngoài","D":"Không thuộc đối tượng nộp thuế TNCN tại Việt Nam"},"t":"Thuế TNCN"},{"n":693,"q":"Ông A là cá nhân cư trú, theo hợp đồng lao động, ông A được công ty Unilever Việt Nam trả tiền thuê nhà 12 triệu đồng/1 tháng (xuất hóa đơn cho công ty). Tổng thu nhập chịu thuế từ tiền lương tiền công của ông A chưa kể tiền thuê nhà Công ty trả hộ là 632tr. Xác định thu nhập chịu thuế từ tiền thuê nhà được Unilever trả thay?","c":{"A":"144tr","B":"63,2tr","C":"94,8tr","D":"Số khác"},"t":"Thuế TNCN"},{"n":694,"q":"Ông A là cá nhân cư trú có hoạt động kinh doanh cửa hàng tạp hóa, không thực hiện chế độ kế toán, hóa đơn, chứng từ, và doanh thu trong năm 2026 của Ông A là 450 triệu đồng. Tính số thuế TNCN ông A phải nộp?","c":{"A":"2,25tr","B":"5tr","C":"10tr","D":"Không nộp thuế TNCN"},"t":"Thuế TNCN"},{"n":695,"q":"Trong năm 2025, Ông A ký hợp đồng cung cấp dịch vụ với Công ty X do Chi cục Thuế Quận 1 quản lý và công ty Y do Chi cục Thuế quận Hoàn Kiếm quản lý với thu nhập như sau: công ty X: thu nhập 140tr, công ty đã khấu trừ thuế TNCN 14tr; công ty Y: thu nhập 15tr, công ty đã khấu trừ 1,5tr. Ông A nộp hồ sơ quyết toán thuế TNCN năm 2025 để hoàn thuế. Xác định nơi nộp hồ sơ, biết rằng tại thời điểm quyết toán ông A không giảm trừ gia cảnh tại đâu và đang cư trú tại quận Tây Hồ?","c":{"A":"Chi cục thuế Quận 1","B":"Chi cục thuế Hoàn Kiếm","C":"Chi cục thuế quận Tây Hồ","D":"Cả A,B,C đều đúng"},"t":"Thuế TNCN"},{"n":696,"q":"Ông A là cá nhân cư trú tại Việt Nam. Năm 2025, Ông A có thu nhập từ tiền lương, tiền công ký hợp đồng lao động trên 3 tháng với công ty","c":{"B":"Không","A":"Có","C":"","D":""},"t":"Thuế TNCN"},{"n":697,"q":"Anh X và chị Y là 2 vợ chồng có một căn hộ cao cấp duy nhất tại An Phú do 2 vợ chồng cùng đứng tên, ngoài ra chị Y còn sở hữu một căn nhà khác tại Phú Mỹ Hưng. Khi bán căn nhà tại An phú thì:","c":{"A":"Anh X nộp thuế TNCN","B":"Chị Y nộp thuế TNCN","C":"Chị Y không nộp thuế TNCN","D":"Không ai nộp thuế TNCN"},"t":"Tổng hợp"},{"n":698,"q":"Thu nhập từ quà tặng nào sau đây được miễn thuế TNCN:","c":{"A":"Anh ruột tặng cho em ruột một căn nhà 400 trđ","B":"Anh ruột tặng cho em ruột một xe máy trị giá 40 trđ","C":"Anh ruột tặng cho em ruột một xe ô tô 300 trđ","D":"Anh nuôi tặng cho em một căn nhà 400 trđ"},"t":"Thuế TNCN"},{"n":699,"q":"Ngày 15/07/2026, ông A nhận thu nhập 40 triệu đồng khi thực hiện hợp đồng chuyển giao công nghệ, thu nhập tính thuế TNCN về bản quyền của cá nhân này là:","c":{"A":"10 triệu đồng","B":"20 triệu đồng","C":"30 triệu đồng","D":"40 triệu đồng 701"},"t":"Thuế TNCN"},{"n":700,"q":"Cá nhân A là cá nhân cư trú, trong tháng 9/2026 được thừa kế 01 xe ô tô có giá tính lệ phí trước bạ 1.200 triệu đồng từ anh ruột. Số thuế TNCN cá nhân này phải nộp đối với thu nhập từ thừa kế nêu trên là?","c":{"A":"118.000.000 đồng.","B":"119.000.000 đồng.","C":"120.000.000 đồng.","D":"Không phải nộp thuế TNCN do thuộc trường hợp được miễn thuế TNCN."},"t":"Thuế TNCN"},{"n":701,"q":"Cá nhân A là cá nhân cư trú, ký hợp đồng chuyển nhượng bản quyền một trò chơi cho tổ chức B vào 15/08/2026, giá trị chuyển nhượng theo hợp đồng là 600 triệu đồng. Số thuế TNCN phát sinh từ hoạt động chuyển nhượng này là?","c":{"A":"12.000.000 đồng.","B":"29.500.000 đồng.","C":"29.000.000 đồng.","D":"60.000.000 đồng."},"t":"Thuế TNCN"},{"n":702,"q":"Cá nhân A là cá nhân cư trú, trong năm 2026 có thu nhập theo hợp đồng cho vay ký với tổ chức B là 50 triệu đồng. Số thuế TNCN phát sinh từ khoản thu nhập này là?","c":{"A":"5.000.000 đồng.","B":"2.500.000 đồng.","C":"1.000.000 đồng.","D":"Không phát sinh số thuế TNCN phải nộp"},"t":"Thuế TNCN"},{"n":703,"q":"Trong các khoản thu nhập từ quà tặng dưới đây, khoản nào không được miễn thuế thu nhập cá nhân theo quy định của pháp luật thuế hiện hành?","c":{"A":"Cha dượng tặng cho con riêng của vợ một căn nhà trị giá 1,8 tỷ đồng","B":"Ông ngoại chuyển nhượng cho cháu ngoại quyền sử dụng đất trị giá 900 triệu đồng","C":"Anh ruột tặng cho em một căn hộ chung cư trị giá 2,5 tỷ đồng","D":"Thừa kế từ cha nuôi một căn nhà trị giá 1,2 tỷ đồng"},"t":"Thuế TNCN"},{"n":704,"q":"Tháng 08/2026, cá nhân B nhận tiền bản quyền theo hợp đồng với tổng số tiền chi trả một lần là 50 triệu đồng. Theo Luật Thuế thu nhập cá nhân năm 2025, thu nhập tính thuế từ tiền bản quyền của cá nhân B được xác định là:","c":{"A":"50 triệu đồng","B":"30 triệu đồng","C":"20 triệu đồng","D":"10 triệu đồng"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":705,"q":"Ông A thực hiện chuyển nhượng một bất động sản tại Việt Nam với giá chuyển nhượng ghi trên hợp đồng là 3 tỷ đồng. Ông A thuộc đối tượng cá nhân không cư trú tại Việt Nam. Theo quy định của pháp luật thuế TNCN hiện hành, số thuế TNCN ông A phải nộp đối với khoản thu nhập từ chuyển nhượng bất động sản này được xác định như thế nào?","c":{"A":"Thuế TNCN được xác định theo biểu thuế lũy tiến từng phần.","B":"Thuế TNCN bằng 10% trên thu nhập từ chuyển nhượng bất động sản.","C":"Thuế TNCN bằng 2% trên thu nhập tính thuế (giá chuyển nhượng trừ giá vốn và chi phí hợp lệ).","D":"Thuế TNCN bằng 2% trên giá chuyển nhượng ghi trên hợp đồng."},"t":"Thuế TNCN"},{"n":706,"q":"Dự kiến tháng 8/2026, bà A bán 01 nhẫn vàng cho một cửa hàng kinh doanh vàng với giá 60 triệu đồng. Theo Luật Thuế thu nhập cá nhân năm 2025, khoản thu nhập từ giao dịch nêu trên được xác định như thế nào?","c":{"A":"Thuộc diện chịu thuế thu nhập cá nhân với thuế suất 0,1% trên giá chuyển nhượng","B":"Thuộc diện chịu thuế thu nhập cá nhân theo quy định về thu nhập khác","C":"Không thuộc diện chịu thuế thu nhập cá nhân","D":"Cả 3 đáp án trên đều sai"},"t":"Thuế TNCN"},{"n":707,"q":"Cá nhân nhận thừa kế một chiếc ô tô, theo quy định hiện hành, thời hạn nộp hồ sơ khai thuế TNCN trong trường hợp này là:","c":{"A":"Chậm nhất là ngày thứ 10 kể từ ngày phát sinh nghĩa vụ thuế đối với thu nhập nhận thừa kế.","B":"Chậm nhất là ngày thứ 20 kể từ ngày lập văn bản khai nhận thừa kế.","C":"Chậm nhất là ngày thứ 30 kể từ ngày người nhận thừa kế nhận được tài sản.","D":"Tại thời điểm thực hiện thủ tục đăng ký quyền sở hữu ô tô với cơ quan có thẩm quyền."},"t":"Thuế TNCN"},{"n":708,"q":"Cá nhân cư trú A ký hợp đồng chuyển nhượng bản quyền một trò chơi cho tổ chức B, giá trị chuyển nhượng theo hợp đồng là 600 triệu đồng. Theo Luật số 109/2025/QH15, số thuế TNCN phát sinh từ hoạt động chuyển nhượng này là?","c":{"A":"12.000.000 đồng.","B":"29.500.000 đồng.","C":"29.000.000 đồng.","D":"60.000.000 đồng."},"t":"Thuế TNCN"},{"n":709,"q":"Anh A là cá nhân cư trú, ký HĐLĐ 12 tháng, thu nhập 25 triệu/tháng. Công ty khấu trừ thuế như thế nào ?","c":{"A":"10% trên thu nhập","B":"20% trên thu nhập.","C":"Theo Biểu thuế lũy tiến từng phần.","D":"5% trên thu nhập"},"t":"Thuế TNCN"},{"n":710,"q":"Ông A là cá nhân không cư trú, có thu nhập từ tiền lương, tiền công tại Việt Nam là 100 triệu đồng/tháng. Thuế TNCN phải nộp là?","c":{"A":"20 triệu đồng","B":"15 triệu đồng","C":"10 triệu đồng","D":"5 triệu đồng"},"t":"Thuế TNCN"},{"n":711,"q":"Chị A ký hợp đồng lao động 2 tháng, nhận 5 triệu/lần chi trả. Công ty thực hiện khấu trừ như thế nào ?","c":{"A":"5%","B":"10%","C":"Không khấu trừ.","D":"Lũy tiến từng phần"},"t":"Tổng hợp"},{"n":712,"q":"Theo Luật thuế TNCN năm 2025, ông A là cá nhân cư trú, nhận cổ tức 200 triệu đồng từ công ty cổ phần. Thuế TNCN phải nộp là:","c":{"A":"20 triệu","B":"10 triệu","C":"5 triệu","D":"0 đồng"},"t":"Thuế TNCN"},{"n":713,"q":"Theo luật thuế TNCN, tổ chức, cá nhân thuê lao động là cá nhân cư trú theo thời vụ từ trên 03 tháng đến dưới 12 thá thuế TNCN từ tiền bản quyền là:","c":{"A":"Là toàn bộ phần thu nhập nhận được khi chuyển giao, chuyển quyền sử dụng các đối tượng của quyền sở hữu trí tuệ, chuyển giao công nghệ theo từng hợp đồng.","B":"Là thu nhập nhận được khi chuyển giao, chuyển quyền sử dụng các đối tượng của quyền sử hữu trí tuệ, chuyển giao công nghệ có giá trị từ 10 triệu đồng trở lên theo từng hợp đồng.","C":"Là phần thu nhập vượt trên 10 triệu đồng mà người nộp thuế nhận được khi chuyển giao, chuyển quyền sử dụng các đối tượng của quyền sở hữu trí tuệ, chuyển giao công nghệ theo từng hợp đồng.","D":"Là phần thu nhập vượt trên 20 triệu đồng mà người nộp thuế nhận được khi chuyển giao, chuyển quyền sử dụng các đối tượng của quyền sở hữu trí tuệ, chuyển giao công nghệ theo từng hợp đồng."},"t":"Thuế TNCN"},{"n":765,"q":"Người nộp thuế nộp hồ sơ khai thuế quá thời hạn trên 90 ngày có phát sinh số tiền thuế phải nộp và người nộp thuế đã nộp đủ số tiền thuế, tiền chậm nộp vào ngân sách nhà nước trước thời điểm cơ quan thuế lập biên bản về hành vi chậm nộp hồ sơ khai thuế thì bị xử phạt như thế nào?","c":{"A":"Phạt 1,5 lần trên số thuế trốn","B":"Phạt tiền từ 15-20 triệu đồng. Trường hợp số tiền phạt lớn hơn số tiền thuế phát sinh trên hồ sơ khai thuế thì số tiền phạt tối đa đối với trường hợp này bằng số tiền thuế phát sinh phải nộp trên hồ sơ khai thuế nhưng không thấp hơn 5.750.000 đồng","C":"Phạt 20% số thuế phải nộp và tính tiền chậm nộp","D":"Chỉ tính tiền chậm nộp 0,03%/ngày"},"t":"Xử phạt VPHC thuế"},{"n":766,"q":"Thu nhập nào sau đây phải chịu thuế TNCN:","c":{"A":"Thu nhập từ học bổng của nước ngoài","B":"Thu nhập từ lương hưu","C":"Thu nhập từ thừa kế một căn nhà trị giá 500 triệu đồng từ cậu ruột","D":"Thu nhập từ bồi thường lao động"},"t":"Thuế TNCN"},{"n":767,"q":"Trường hợp nào được miễn thuế TNCN đối với chuyển nhượng bất động sản:","c":{"A":"Giữa dì và cháu ruột","B":"Giữa cậu và cháu ruột","C":"Giữa ông ngoại và cháu ngoại","D":"Giữa anh chị em nuôi."},"t":"Thuế TNCN"},{"n":768,"q":"Thu nhập nào sau đây chịu thuế TNCN?","c":{"A":"Tiền nhuận bút viết báo","B":"Thu nhập từ chuyển nhượng bất động sản giữa mẹ nuôi với con nuôi","C":"Thu nhập từ bán nhà mà người đó chỉ có một căn nhà duy nhất","D":"Thu nhập từ kiều hối"},"t":"Thuế TNCN"},{"n":769,"q":"Theo Luật thuế TNCN năm 2025 có hiệu lực từ 01/7/2026, những khoản thu nhập chịu thuế nào không được trừ 20 triệu đồng trước khi tính thuế:","c":{"A":"Thu nhập từ trúng thưởng","B":"Thu nhập từ thừa kế","C":"Thu nhập từ quà tặng","D":"Thu nhập từ đầu tư vốn"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":770,"q":"Theo Luật thuế TNCN năm 2025, thu nhập chịu thuế TNCN từ trúng thưởng bao gồm những khoản nào sau đây:","c":{"A":"Trúng thưởng xổ số","B":"Trúng thưởng trong các hình thức đặt cược","C":"Trúng thưởng trong các trò chơi, cuộc thi có thưởng và các hình thức trúng thưởng khác, trừ trúng thưởng trong casino","D":"Cả 3 đáp án A, B, C đều đúng"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":771,"q":"Những trường hợp nào thì con của đối tượng nộp thuế được xác định là người phụ thuộc được tính giảm trừ gia cảnh?","c":{"A":"Con dưới 18 tuổi.","B":"Con trên 18 tuổi nhưng bị tàn tật, không có khả năng lao động.","C":"Con đang theo học tại các trường đại học, cao đẳng, trung học chuyên nghiệp, dạy nghề, không có thu nhập hoặc có thu nhập nhưng không vượt quá mức quy định (mức thu nhập bình quân tháng trong năm từ tất cả các nguồn thu nhập không vượt quá 1.000.000 đồng).","D":"Tất cả các trường hợp trên"},"t":"Thuế TNCN"},{"n":772,"q":"Trường hợp nào sau đây được miễn thuế TNCN trong thời hạn 05 năm đối với thu nhập từ tiền lương, tiền công của cá nhân là nhân lực công nghiệp công nghệ số chất lượng cao ?","c":{"A":"Thu nhập từ dự án nghiên cứu và phát triển, sản xuất sản phẩm công nghệ số trọng điểm, chip bán dẫn, hệ thống trí tuệ nhân tạo","B":"Thu nhập từ các hoạt động đào tạo nhân lực công nghiệp công nghệ số.","C":"Thu nhập từ dự án hoạt động công nghiệp công nghệ số trong khu công nghệ số tập trung","D":"Cả A,B,C đều đúng"},"t":"Thuế TNCN"},{"n":773,"q":"Theo quy định của pháp luật thuế TNCN, thuế TNCN đối với thu nhập từ tiền bản quyền (bao gồm chuyển quyền sử dụng đối tượng sở hữu trí tuệ, chuyển giao công nghệ) của cá nhân cư trú được xác định theo công thức nào sau đây ?","c":{"A":"Thuế TNCN = Tổng số tiền bản quyền nhận được × 5%.","B":"Thuế TNCN = (Tổng thu nhập từ tiền bản quyền − các chi phí hợp lệ) × 5%","C":"Thuế TNCN = Thu nhập tính thuế × 10%, trong đó thu nhập tính thuế là phần thu nhập vượt trên 20 triệu đồng.","D":"Thuế TNCN = (Tổng thu nhập từ tiền bản quyền −20 triệu đồng) × 5% theo từng hợp đồng."},"t":"Thuế TNCN"},{"n":774,"q":"Theo Luật thuế thu nhập cá nhân năm 2025, thuế thu nhập cá nhân đối với thu nhập từ chuyển nhượng vốn của cá nhân cư trú được xác định ?","c":{"A":"Thu nhập tính thuế nhân (x) với thuế suất 20% theo từng lần chuyển nhượng","B":"Giá chuyển nhượng nhân (x) với thuế suất 2% nếu không xác định giá mua và các chi phí liên quan đến việc chuyển nhượng vốn","C":"Giá chuyển nhượng nhân (x) với thuế suất 0,1% nếu không xác định giá mua và các chi phí liên quan đến việc chuyển nhượng vốn","D":"Cả A và B đều đúng"},"t":"Thuế TNCN"},{"n":775,"q":"Theo quy định của Luật Thuế thu nhập cá nhân năm 2025, từ ngày 01/7/2026, khoản thu nhập nào sau đây được áp dụng ngưỡng chịu thuế thu nhập cá nhân là phần thu nhập vượt trên 20 triệu đồng cho mỗi lần phát sinh?","c":{"A":"Thu nhập từ tiền lương, tiền công","B":"Thu nhập từ trúng thưởng","C":"Thu nhập từ chuyển nhượng bất động sản","D":"Thu nhập từ hoạt động kinh doanh của cá nhân"},"t":"Thuế TNCN"},{"n":776,"q":"Theo Luật số 109/2025/QH15, trong các khoản phụ cấp, trợ cấp sau đây, khoản nào không tính vào thu nhập chịu thuế thu nhập cá nhân từ tiền lương, tiền công?","c":{"A":"Phụ cấp trách nhiệm công việc chi trả hằng tháng theo thỏa thuận trong hợp đồng lao động","B":"Phụ cấp độc hại, nguy hiểm đối với ngành, nghề hoặc công việc ở nơi làm việc có yếu tố độc hại, nguy hiểm theo quy định của pháp luật","C":"Phụ cấp điện thoại khoán chi trả cố định bằng tiền hằng tháng","D":"Phụ cấp hiệu suất lao động chi trả căn cứ vào kết quả hoàn thành công việc"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":777,"q":"Theo quy định pháp luật thuế TNCN năm 2025, người nộp thuế TNCN là:","c":{"A":"Cá nhân cư trú có thu nhập phát sinh trong lãnh thổ Việt Nam","B":"Cá nhân cư trú và cá nhân không cư trú có thu nhập phát sinh trong và ngoài lãnh thổ Việt Nam","C":"Cá nhân cư trú có thu nhập phát sinh trong và ngoài lãnh thổ Việt Nam","D":"Cá nhân cư trú có thu nhập chịu thuế theo quy định của Luật phát sinh trong và ngoài lãnh thổ Việt Nam và cá nhân không cư trú có thu nhập chịu thuế theo quy định của Luật phát sinh trong lãnh thổ Việt Nam."},"t":"Thuế TNCN"},{"n":778,"q":"Khoản thu nhập nào sau đây thuộc diện thu nhập chịu thuế TNCN theo quy định của Luật Thuế Thu nhập cá nhân năm 2025?","c":{"A":"Thu nhập từ chuyển nhượng lần đầu trái phiếu xanh sau khi phát hành","B":"Thu nhập từ quyền tác giả của nhiệm vụ khoa học, công nghệ và đổi mới sáng tạo khi kết quả nhiệm vụ được thương mại hóa theo quy định của pháp luật về khoa học, công nghệ và đổi mới sáng tạo, pháp luật về sở hữu trí tuệ","C":"Thu nhập của nhà đầu tư cá nhân, chuyên gia từ dự án khởi nghiệp sáng tạo, sáng lập viên cho doanh nghiệp khởi nghiệp sáng tạo, nhà đầu tư cá nhân góp vốn vào quỹ đầu tư mạo hiểm.","D":"Chuyển nhượng chứng chỉ quỹ mở thành lập theo quy định của pháp luật về chứng khoán được nắm giữ 01 năm kể từ ngày mua."},"t":"Thuế TNCN"},{"n":779,"q":"Trong các khoản thu nhập của cá nhân nêu dưới đây, khoản thu nhập nào chịu thuế TNCN:","c":{"A":"Tiền thưởng tháng, quý, năm.","B":"Tiền thưởng kèm theo các giải thưởng quốc gia được Nhà nước Việt Nam thừa nhận.","C":"Tiền thưởng về cải tiến kỹ thuật, sáng chế, phát minh được cơ quan nhà nước có thẩm quyền công nhận.","D":"Tiền thưởng về phát hiện, khai báo hành vi vi phạm pháp luật với cơ quan nhà nước có thẩm quyền."},"t":"Thuế TNCN"},{"n":780,"q":"Cá nhân vừa làm việc ở Việt Nam vừa làm việc ở nước ngoài nhưng được xác định cư trú tại Việt Nam thì thu nhập chịu thuế TNCN là :","c":{"A":"Thu nhập phát sinh tại Việt Nam.","B":"Thu nhập phát sinh ở Việt Nam và ở nước ngoài, không phân biệt nơi trả và nhận thu nhập.","C":"Thu nhập phát sinh ở nước ngoài.","D":"Không tính thuế TNCN"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":781,"q":"Khoản thu nhập nào sau đây được miễn thuế TNCN?","c":{"A":"Tiền lãi cho vay","B":"Thu nhập từ chuyển nhượng chứng khoán.","C":"Thu nhập từ thừa kế là bất động sản giữa vợ và chồng.","D":"Tiền thưởng năng suất."},"t":"Thuế TNCN"},{"n":782,"q":"Trong trường hợp nào sau đây thì cá nhân cư trú có thu nhập từ tiền lương, tiền công trực tiếp khai quyết toán thuế TNCN với cơ quan Thuế:","c":{"A":"Cá nhân có mặt tại Việt Nam tính trong năm dương lịch đầu tiên dưới 183 ngày, nhưng tính trong 12 tháng liên tục kể từ ngày đầu tiên có mặt tại Việt Nam là từ 183 ngày trở lên.","B":"Cá nhân cư trú có thu nhập từ tiền lương, tiền công đồng thời thuộc diện xét giảm thuế do thiên tai, hoả hoạn, tai nạn, bệnh hiểm nghèo ảnh hưởng đến khả năng nộp thuế","C":"Cá nhân là người nước ngoài kết thúc hợp đồng làm việc tại Việt Nam","D":"Cả A, B, C đều đúng"},"t":"Thuế TNCN"},{"n":783,"q":"Những trường hợp nào thì con của đối tượng nộp thuế được xác định là người phụ thuộc được tính giảm trừ gia cảnh:","c":{"A":"Con dưới 18 tuổi","B":"Con trên 18 tuổi nhưng bị tàn tật, không có khả năng lao động","C":"Con đang theo học tại các trường đại học, cao đẳng, trung học chuyên nghiệp, dạy nghề, không có thu nhập hoặc có thu nhập nhưng không vượt quá mức quy định.","D":"Tất cả các trường hợp trên."},"t":"Thuế TNCN"},{"n":784,"q":"Người nộp thuế đã đăng ký người phụ thuộc tại đơn vị A, sau đó thay đổi nơi làm việc tại đơn vị B thì có thực hiện đăng ký giảm trừ cho người phụ thuộc tại công ty B không?","c":{"A":"Người nộp thuế đăng ký lại và không cần nộp hồ sơ chứng minh người phụ thuộc","B":"Thực hiện đăng ký và nộp hồ sơ chứng minh người phụ thuộc như trường hợp đăng ký người phụ thuộc lần đầu.","C":"Không cần đăng ký lại người phụ thuộc.","D":"Cả a, b, c đều sai"},"t":"Thuế TNCN"},{"n":785,"q":"Thu nhập từ nhận thừa kế, quà tặng là bất động sản được miễn thuế TNCN đối với các trường hợp nào sau đây:","c":{"A":"Nhận thừa kế giữa cháu với cô, dì, chú, bác ruột","B":"Nhận thừa kế giữa ông nội, bà nội với cháu nội; ông ngoại, bà ngoại với cháu ngoại; anh chị em ruột với nhau.","C":"Nhận thừa kế giữa anh, chị em họ con của cô, dì, chú, bác ruột","D":"Tất cả các trường hợp trên"},"t":"Thuế TNCN"},{"n":786,"q":"Các trường hợp nào dưới đây phải trực tiếp nộp hồ sơ Quyết toán thuế thu nhập cá nhân:","c":{"A":"Cá nhân có thu nhập từ tiền lương, tiền công đã ủy quyền cho tổ chức chi trả thu nhập quyết toán thuế thay, đồng thời có thu nhập vãng lai ở các nơi khác bình quân tháng trong năm không quá 10 triệu đồng và đã được khấu trừ thuế thu nhập cá nhân theo tỷ lệ 10%.","B":"Cá nhân có thu nhập từ tiền lương, tiền công phát sinh số thuế phải nộp sau quyết toán của từng năm từ 50.000 đồng trở xuống.","C":"Cá nhân cư trú có thu nhập từ tiền lương, tiền công đồng thời thuộc diện xét giảm thuế do thiên tai, hoả hoạn, tai nạn, bệnh hiểm nghèo ảnh hưởng đến khả năng nộp thuế.","D":""},"t":"Thuế TNCN"},{"n":787,"q":"Theo Luật thuế TNCN, người phụ thuộc của người nộp thuế không bao gồm:","c":{"A":"Con từ 18 tuổi trở lên bị khuyết tật, không có khả năng lao động.","B":"Con đang theo học tại các trường học đại học, cao đẳng, trung học chuyên nghiệp, trung học phổ thông hoặc học nghề không có thu nhập hoặc có thu nhập dưới mức quy định.","C":"Con đang học trình độ thạc sỹ tại các trường đại học.","D":"Bố mẹ ngoài độ tuổi lao động và không có thu nhập."},"t":"Thuế TNCN"},{"n":788,"q":"Theo Luật thuế TNCN, thời điểm xác định thu nhập tính thuế từ quà tặng là:","c":{"A":"Thời điểm tổ chức, cá nhân tặng cho người nộp thuế","B":"Thời điểm người nộp thuế nhận được thu nhập","C":"Cả A và B đều đúng.","D":"Cả A và B đều sai"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":789,"q":"Theo Luật thuế TNCN, thời điểm xác định thu nhập tính thuế từ nhượng quyền thương mại là:","c":{"A":"Thời điểm tổ chức, cá nhân trả thu nhập cho người nộp thuế.","B":"Thời điểm hợp đồng chuyển nhượng có hiệu lực.","C":"Thời điểm bên nhượng quyền thương mại và bên nhận quyền thương mại ký hợp đồng.","D":"Cả A và B đều đúng."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":790,"q":"Các khoản trợ cấp, phụ cấp nào dưới đây không tính vào Thu nhập chịu thuế TNCN:","c":{"A":"Khoản tiền nhận được theo chế độ nhà ở công vụ theo quy định của pháp luật","B":"Phụ cấp quốc phòng, an ninh; các khoản trợ cấp đối với lực lượng vũ trang theo quy định.","C":"Phụ cấp khó khăn đột xuất, trợ cấp thôi việc theo quy định","D":"Trợ cấp, phụ cấp ưu đãi hàng tháng và trợ cấp một lần theo quy định của pháp luật về ưu đãi người có công"},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":791,"q":"Thu nhập nào là thu nhập chịu thuế TNCN","c":{"A":"Lãi trái phiếu Chính phủ là khoản lãi mà cá nhân nhận được từ việc mua trái phiếu Chính phủ do Bộ Tài chính phát hành;","B":"Tiền nhuận bút theo quy định của pháp luật về chế độ nhuận bút.","C":"Thu nhập từ học bổng.","D":"Tiền thưởng kèm theo các danh hiệu thi đua như Chiến sĩ thi đua toàn quốc; Chiến sĩ thi đua cấp Bộ, ngành, đoàn thể Trung ương, tỉnh, thành phố trực thuộc Trung ương; Chiến sĩ thi đua cơ sở, Lao động tiên tiến, Chiến sỹ tiên tiến."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":792,"q":"Theo Luật số 109/2025/QH15, thu nhập nào là thu nhập được miễn thuế TNCN?","c":{"A":"Tiền lương làm việc ban đêm, làm thêm giờ, tiền lương, tiền công trả cho những ngày không nghỉ phép theo quy định của pháp luật.","B":"Tiền lương hưu do Quỹ bảo hiểm xã hội trả.","C":"Thu nhập từ chuyển nhượng, nhận thừa kế, quà tặng là bất động sản giữa vợ với chồng; cha đẻ, mẹ đẻ với con đẻ; cha nuôi, mẹ nuôi với con nuôi; cha chồng, mẹ chồng với con dâu; cha vợ, mẹ vợ với con rể; ông nội, bà nội với cháu nội; ông ngoại, bà ngoại với cháu ngoại; anh, chị, em ruột với nhau.","D":"Tất cả các khoản thu nhập trên."},"t":"Thuế TNDN - Thu nhập / Ưu đãi"},{"n":793,"q":"Theo Luật thuế TNCN năm 2025, biểu thuế lũy tiến từng phần đối với thu nhập từ tiền lương, tiền công có mức thuế suất cao nhất là:","c":{"A":"25%","B":"30%","C":"35%","D":"40%"},"t":"Thuế TNCN"},{"n":794,"q":"Theo Luật thuế TNCN năm 2025, thu nhập từ chuyển nhượng chứng chỉ quỹ mở thành lập theo quy định của pháp luật về chứng khoán được miễn thuế TNCN khi đáp ứng điều kiện nào sau đây?","c":{"A":"Nắm giữ từ 01 năm trở lên","B":"Nắm giữ từ 02 năm trở lên kể từ ngày mua","C":"Nắm giữ từ 03 năm trở lên","D":"Chỉ cần có lãi khi chuyển nhượng"},"t":"Thuế TNCN"},{"n":795,"q":"Các quy định liên quan đến thu nhập từ tiền lương, tiền công của cá nhân cư trú theo Luật thuế TNCN số 109/2025/QH15 áp dụng từ khi nào?","c":{"A":"Từ ngày 01/07/2026","B":"Từ kỳ tính thuế năm 2026","C":"Từ ngày 10/12/2025","D":"Từ ngày Luật được Quốc hội thông qua"},"t":"Thuế TNCN"},{"n":796,"q":"Theo Luật thuế TNCN năm 2025, thuế thu nhập cá nhân đối với thu nhập từ chuyển nhượng vàng miếng của cá nhân cư trú được xác định như thế nào ?","c":{"A":"Thu nhập tính thuế x thuế suất 2%","B":"Thu nhập tính thuế x thuế suất 5%","C":"Giá chuyển nhượng nhân (x) với thuế suất 2%","D":"Giá chuyển nhượng nhân (x) với thuế suất 0,1%"},"t":"Thuế TNCN"},{"n":797,"q":"Theo Luật thuế TNCN năm 2025, thu nhập nào sau đây được miễn thuế TNCN:","c":{"A":"Thu nhập từ chuyển nhượng tên miền internet quốc gia Việt Nam “.vn”","B":"Thu nhập từ chuyển nhượng biển số xe trúng đấu giá theo quy định của pháp luật","C":"Thu nhập từ chuyển nhượng vàng miếng","D":"Tiền lương làm việc ban đêm, làm thêm giờ, tiền lương, tiền công trả cho những ngày không nghỉ phép theo quy định của pháp luật"},"t":"Thuế TNCN"},{"n":798,"q":"Theo Luật thuế TNCN năm 2025, biểu thuế luỹ tiến từng phần áp dụng đối với thu nhập tính thuế đối với thu nhập từ tiền lương, tiền công gồm bao nhiêu bậc:","c":{"
